<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asianish School</title>
<meta name="description" content="Кабінет азійських мов Asianish School: китайська, корейська, японська — картки, вправи, граматика, прогрес і рейтинг.">
<meta name="theme-color" content="#23483F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2323483F%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22%23C9A15D%22 font-family=%22serif%22%3E中%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Gowun+Batang:wght@400;700&family=Noto+Serif+JP:wght@600&display=swap">
<style>
/* Layout: jade header band with a gold seal; milk "ledger" paper below; cards only for things you can open or press. */
:root{
  --green:#23483F; --gold:#C9A15D; --milk:#F8F5EF; --ink:#2C2C2C;
  --bg:#F8F5EF; --surface:#FFFDF9; --surface2:#F0EBE1; --fg:#2C2C2C; --muted:#66706B; --line:#E4DCCD;
  --band:#23483F; --band-fg:#F8F5EF; --band-muted:#BFD0C9;
  --accent:#23483F; --accent-fg:#F8F5EF; --accent-soft:#E2ECE8;
  --gold-ink:#94702F; --gold-soft:#F4EAD6;
  --ok:#2F7A57; --ok-soft:#E1F0E7; --bad:#A4473A; --bad-soft:#F7E3DF;
  --silver:#9AA09D; --bronze:#B07A4E;
  --shadow:0 1px 2px rgba(35,72,63,.06),0 10px 28px rgba(35,72,63,.08);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --f-deco:"Noto Serif SC","Noto Sans SC","Songti SC","SimSun",serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111C19; --surface:#182723; --surface2:#20322D; --fg:#EFEAE0; --muted:#A1ABA5; --line:#2B403A;
  --band:#0D1714; --band-fg:#EFEAE0; --band-muted:#8FA49C;
  --accent:#C9A15D; --accent-fg:#15201D; --accent-soft:#2A3A2F;
  --gold-ink:#D9B878; --gold-soft:#332C1E;
  --ok:#72C397; --ok-soft:#1B3127; --bad:#E58D7F; --bad-soft:#3A2420;
  --silver:#BAC0BD; --bronze:#CF9763;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111C19; --surface:#182723; --surface2:#20322D; --fg:#EFEAE0; --muted:#A1ABA5; --line:#2B403A;
  --band:#0D1714; --band-fg:#EFEAE0; --band-muted:#8FA49C;
  --accent:#C9A15D; --accent-fg:#15201D; --accent-soft:#2A3A2F;
  --gold-ink:#D9B878; --gold-soft:#332C1E;
  --ok:#72C397; --ok-soft:#1B3127; --bad:#E58D7F; --bad-soft:#3A2420;
  --silver:#BAC0BD; --bronze:#CF9763;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,5vw,3.2rem)}
h2{font-size:1.75rem}
h3{font-size:1.3rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.han{font-family:var(--f-han)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.seal{width:34px;height:34px;display:grid;place-items:center;background:var(--gold);color:#23483F;border-radius:6px;font-family:var(--f-han);font-weight:700;font-size:20px;box-shadow:inset 0 0 0 2px rgba(35,72,63,.25)}
.wm{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.16em}
.wm b{color:var(--gold);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--band-muted);min-width:0;text-align:right}
.who strong{color:var(--band-fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.gold{background:var(--gold);color:#23483F}
.pill.soft{background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink)}

main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#22362F}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.iconbtn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--accent)}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn svg{width:20px;height:20px}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
.hero .sub{font-size:1.05rem;color:var(--muted);margin-top:6px}
.hero-stats{display:flex;gap:26px}
.hs b{display:block;font-family:var(--f-display);font-size:2.2rem;line-height:1;color:var(--accent)}
.hs span{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero-stats{gap:20px}}

/* class cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ccard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--gold);transform:translateY(-2px)}
.ccard h3{font-size:1.45rem}
.ccard .days{display:flex;gap:6px;flex-wrap:wrap}
.day{font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.ccard .meta{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.ccard .corner{position:absolute;top:16px;right:16px;font-family:var(--f-han);font-size:1.6rem;color:var(--gold);opacity:.55}
.ccard.add{border-style:dashed;box-shadow:none;background:transparent;align-items:flex-start;justify-content:center;color:var(--muted);min-height:150px}
.ccard.add b{color:var(--fg);font-size:1rem}

/* section head */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;row-gap:0;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.crumb{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px}
.tile b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.tile.key{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tile.key span{color:inherit;opacity:.8}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.two>*{min-width:0}

/* progress bars */
.prog{display:flex;flex-direction:column;gap:12px}
.pr .lab{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:5px}
.pr .lab>span:first-child{min-width:0;overflow-wrap:anywhere}
.two>*,.prog,.pr{min-width:0}
.pr .lab>span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .m{background:var(--accent)}
.track .l{background:var(--gold);opacity:.6}

/* notes */
.note{border-radius:var(--r-sm);padding:14px 16px;background:var(--gold-soft);color:var(--fg);font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--accent-soft)}
.note.bad{background:var(--bad-soft)}
.note b{font-weight:700}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--gold-soft)}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:44px}
textarea.input{min-height:110px;resize:vertical;font-family:var(--f-body)}
.input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}

/* register */
.reg{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start;padding-top:12px}
.reg .big{font-family:var(--f-han);font-size:clamp(4rem,12vw,7rem);color:var(--gold);line-height:1}
@media (max-width:800px){.reg{grid-template-columns:1fr;gap:24px}}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip .c{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}

/* flashcard */
.flashwrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
.flash{perspective:1400px;cursor:pointer;border:0;background:none;padding:0;text-align:center;width:100%}
.flash .inner{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.is-flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:340px;justify-content:center;position:relative}
.face.back{transform:rotateY(180deg);justify-content:flex-start;padding-top:52px}
@media (max-width:480px){.wm{font-size:1rem;letter-spacing:.08em}.seal{width:30px;height:30px;font-size:17px}.face .lbl{max-width:calc(100% - 80px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.face .lbl{position:absolute;top:16px;left:16px}
.face .stage{position:absolute;top:18px;right:18px;display:flex;gap:5px}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.stage i.on{background:var(--gold);border-color:var(--gold)}
.face .hanzi{font-family:var(--f-han);font-size:clamp(3.4rem,13vw,5.4rem);font-weight:500;line-height:1.1;color:var(--fg)}
.face .py{font-size:1.35rem;color:var(--gold-ink);font-weight:600;letter-spacing:.02em}
.face .tap{font-size:.78rem;color:var(--muted)}
.face .uk{font-family:var(--f-display);font-size:2rem;font-weight:600;margin-top:18px}
.exbox{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.exbox .zh{font-family:var(--f-han);font-size:1.3rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cloze{width:100%;text-align:left;background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cloze .zh{font-family:var(--f-han);font-size:1.2rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--gold);text-align:center;color:var(--gold-ink)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.cardbtns{grid-template-columns:1fr 1fr}.cardbtns .btn:last-child{grid-column:1/-1}}
.counter{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}

/* exercises */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.excard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.excard:hover{border-color:var(--gold)}
.bellwrap{position:relative;flex:none}
.bellwrap:empty{display:none}
.bellbtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:999px;border:1px solid rgba(201,161,93,.55);background:transparent;color:#E9D3A6;cursor:pointer;padding:0}
.bellbtn:hover,.bellbtn[aria-expanded="true"]{border-color:var(--gold);color:#fff}
.bellbtn svg{width:18px;height:18px}
.bellbtn .bdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#C9A15D;color:#23483F;font:700 .7rem/19px var(--f-ui);text-align:center;box-shadow:0 0 0 2px var(--band)}
.bellpop{position:absolute;right:0;top:calc(100% + 10px);width:min(400px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px rgba(20,40,35,.22);z-index:30;overflow:hidden;text-align:left}
.bellpop .bh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bellpop .bh b{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.bellpop .bl{overflow-y:auto;overscroll-behavior:contain;padding:6px}
.bellpop .bi{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:10px;cursor:pointer;color:inherit;font:inherit}
.bellpop .bi:hover{background:var(--surface2)}
.bellpop .bi .g{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--gold-soft);color:var(--gold-ink);font-family:var(--f-deco);font-weight:600;font-size:1.05rem}
.bellpop .bi.ok .g{background:var(--ok-soft);color:var(--ok)}
.bellpop .bi.warn .g{background:var(--bad-soft);color:var(--bad)}
.bellpop .bi.info .g{background:var(--accent-soft);color:var(--accent)}
.bellpop .bi .tx{min-width:0;display:flex;flex-direction:column;gap:1px;font-size:.9rem;line-height:1.35}
.bellpop .bi .tx .k{font-family:var(--f-ui);font-weight:700}
.bellpop .bi .tx .t{overflow-wrap:anywhere}
.bellpop .bi .tx .m{color:var(--muted);font-size:.8rem}
.bellpop .bi .w{font-size:.72rem;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bellpop .bi .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.bellpop .be{padding:30px 16px;text-align:center;color:var(--muted)}
.bellpop .be .han{display:block;font-size:2rem;color:var(--gold);margin-bottom:6px}
@media (max-width:560px){.bellpop{position:fixed;left:12px;right:12px;top:64px;width:auto;max-height:calc(100vh - 90px)}.bellbtn{width:34px;height:34px}}
.spgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.spgrid{grid-template-columns:1fr}}
.spcard{position:relative;overflow:hidden;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px 20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:var(--fg);min-height:230px;transition:border-color .15s,transform .15s}
.spcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.spcard .spg{font-family:var(--f-han);font-size:3.4rem;line-height:1;color:var(--gold-ink)}
.spcard .spbig{position:absolute;right:-10px;bottom:-26px;font-family:var(--f-han);font-size:9rem;line-height:1;opacity:.06;pointer-events:none}
.spcard h3{font-size:1.35rem;margin:0}
.spcard .spn{font-family:var(--f-han);color:var(--muted)}
.spcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;font-size:.88rem;color:var(--muted)}
.spcard.cur{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.excard.soon{cursor:default;opacity:.62}
.spsw{font-family:var(--f-han);background:transparent!important;border:1px solid rgba(201,161,93,.55)!important;color:#E9D3A6!important;white-space:nowrap}.spsw:hover{border-color:var(--gold)!important;color:#fff!important}

.gles h3{font-size:1.15rem;margin-bottom:10px;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.02em}
.gitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.gitem:hover{border-color:var(--gold)}
.gitem .f{font-family:var(--f-han);font-size:1.05rem;color:var(--gold-ink)}
.gitem b{font-size:1rem}
.gitem .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px}
.gpage{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px}
.gpage .gtext{line-height:1.7;max-width:65ch}
.gpage .gtext b{color:var(--accent)}
.formula{font-family:var(--f-han);font-size:1.2rem;background:var(--accent-soft);color:var(--fg);border-radius:var(--r-sm);padding:14px 18px;text-align:center;line-height:1.6}
.formula .plus{color:var(--gold-ink);margin:0 6px}
.gexamples{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.gtable{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.gtable td{white-space:normal}
.gtable td:first-child{font-family:var(--f-han)}
.mistake{display:grid;gap:6px;background:var(--surface2);border-radius:var(--r-sm);padding:12px 16px}
.mistake div{display:flex;gap:10px;align-items:baseline}
.mistake .zh{font-family:var(--f-han);font-size:1.1rem}
.mistake .x{color:var(--bad);font-weight:800}.mistake .v{color:var(--ok);font-weight:800}
.gq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.gq .qn{font-size:.75rem;font-weight:800;letter-spacing:.1em;color:var(--gold-ink);text-transform:uppercase}
.gq .qt{font-size:1rem;font-weight:600}
.gq .qt .han,.gq .qzh{font-family:var(--f-han);font-size:1.25rem;font-weight:500}
.gq .why{font-size:.88rem;color:var(--muted)}
.built{min-height:52px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{font-family:var(--f-han);font-size:1.15rem;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
.wchip[disabled]{opacity:.3;cursor:default}
.built .wchip{background:var(--gold-soft);border-color:var(--gold)}

/* word editor */
.wedit{display:flex;flex-direction:column;gap:12px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;grid-template-columns:110px 1fr 1fr auto;gap:8px;align-items:start}
.wrow .exs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wrow .exs>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.wrow .input{min-height:38px;padding:7px 9px;font-size:.9rem}
.wrow .h{font-family:var(--f-han);font-size:1.1rem}
@media (max-width:760px){.wrow{grid-template-columns:1fr 1fr}.wrow .h{grid-column:1/-1}.wrow .exs{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.markup{display:flex;flex-direction:column;gap:6px;line-height:1.5}
.markup code,.panel code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;background:var(--gold-soft);color:var(--gold-ink);padding:1px 6px;border-radius:5px;font-weight:700}
.gex{gap:10px}
.opts-edit{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts-edit legend{grid-column:1/-1;margin-bottom:4px}
.optrow{display:flex;align-items:center;gap:8px;min-width:0}
.optrow input[type=radio]{width:20px;height:20px;flex:none;accent-color:var(--green,#23483F)}
.optrow .input{flex:1;min-width:0}
@media (max-width:620px){.opts-edit{grid-template-columns:1fr}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.12em;background:var(--gold-soft);color:var(--gold-ink);padding:3px 8px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Figures: lining, equal-width digits everywhere (display serif defaults to old-style figures that bounce) */
h1,h2,h3,.num,.code,table td.n,table th.n{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.hs b,.tile b,.result .score,.pod .pts{font-family:var(--f-body);font-weight:700;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.tab.special{color:var(--gold-ink)}
.tab.special::before{content:"罐 ";font-family:var(--f-han)}
body.sp-ko .tab.special::before{content:"단어장 "}
body.sp-ja .tab.special::before{content:"缶 "}
.tab.special[aria-selected="true"]{color:var(--fg);background:var(--gold-soft);border-radius:10px 10px 0 0}
.wlist{display:flex;flex-direction:column;gap:8px}
.wl{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.wl .h{font-family:var(--f-han);font-size:1.45rem;line-height:1.2}
.wl .m{min-width:0;display:flex;flex-direction:column}
.wl .m .py{color:var(--gold-ink);font-size:.9rem}
.wl .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bankbar{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.dictbtn{align-self:flex-start;margin-top:4px}
.wl.dict .dex{font-size:.875rem;margin-top:2px}
.wl.dict .dex .han{font-size:1rem}
#bank-results,#dict-results{display:flex;flex-direction:column;gap:10px}
.cardextra{display:flex;justify-content:center}
@media (max-width:520px){.wl{grid-template-columns:auto 1fr}.wl .acts{grid-column:1/-1;justify-content:flex-start}}
/* ===== Typography system (Asianish brand)
   H1 Cormorant Garamond Medium 48–60 · H2 page title Cormorant Medium 36–44 · H3 section Manrope SemiBold 22–26
   subtitle Manrope Medium 17–20 · body Inter 15–17 · keywords & buttons Manrope SemiBold · meta Inter 12–13 · big numbers Manrope Medium 32–40 */
body{font-family:var(--f-body);font-size:16px;font-weight:400;line-height:1.6}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.4rem,4.6vw,3.75rem);line-height:1.05;letter-spacing:0}
h1.pt,.reg h1{font-size:clamp(2.1rem,3.8vw,2.75rem)}
h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:0;line-height:1.2}
h2{font-size:clamp(1.55rem,2.6vw,1.95rem)}
h3{font-size:clamp(1.35rem,2.1vw,1.6rem)}
.ccard h3{font-size:clamp(1.35rem,2.1vw,1.6rem)}
.hero .sub,.sub{font-family:var(--f-ui);font-weight:500;font-size:clamp(1.0625rem,1.6vw,1.25rem)}
b,strong{font-family:var(--f-ui);font-weight:600}
.han b,.hanzi b{font-family:inherit}
.sp-ko{--f-han:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-deco:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif}
.sp-ja{--f-han:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;--f-deco:"Noto Serif JP","Noto Sans JP","Hiragino Mincho ProN","Yu Mincho",serif}
.seal,.corner,.glyph,.spg,.spbig,.loading .han,.empty .han{font-family:var(--f-deco)!important;font-weight:600}
.btn,.tab,.chip,.pill,.opt,.seg button,.lvl,.link,.field label,.check,th,.code{font-family:var(--f-ui)}
.btn{font-weight:600;font-size:1rem}
.btn.sm{font-size:.875rem}
.tab{font-size:1rem}
.small,.hint,.crumb,.tile span,.hs span,.meta,.counter,.why,.ccard .meta{font-family:var(--f-body);font-weight:400;font-size:.8125rem}
.eyebrow{font-family:var(--f-body);font-size:.75rem;font-weight:600}
.note{font-size:.9375rem}
.input,select.input,textarea.input{font-family:var(--f-body);font-size:1rem}
.hs b,.tile b,.result .score,.pod .pts{font-family:var(--f-ui);font-weight:500;letter-spacing:-.02em;font-size:clamp(2rem,3vw,2.5rem);line-height:1}
.han,.hanzi,.zh,.opt.h,.wl .h,.glyph,.corner,.seal,.big{font-family:var(--f-han)}
@media (max-width:520px){h1{font-size:2.25rem}h1.pt,.reg h1{font-size:2rem}}
.deckrow{display:flex;flex-direction:column;gap:8px}
.deckrow+.deckrow{padding-top:12px;border-top:1px dashed var(--line)}
.deckrow .lbl{font-family:var(--f-body);font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:12px;min-width:0}
.hub{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(201,161,93,.6);color:var(--gold);text-decoration:none;font-family:var(--f-ui);font-weight:600;font-size:.875rem;white-space:nowrap;transition:background .15s,color .15s}
.hub:hover{background:var(--gold);color:#23483F}
.hub-short{display:none}
@media (max-width:560px){.hub-full{display:none}.hub-short{display:inline}.hub{padding:6px 10px}}
@media (max-width:560px){header.band .hdr-r{width:auto;flex-direction:row;align-items:center;flex-wrap:nowrap;gap:8px}.pyall .small{display:none}.pyall{padding:4px 8px}}
.foot{margin-top:56px;border-top:1px solid var(--line);background:var(--surface2)}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px))}
.foot-brand{font-family:var(--f-display);font-weight:500;font-size:1.25rem}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 20px}
.foot-links a{display:inline-flex;align-items:center;gap:7px;color:var(--fg);text-decoration:none;font-family:var(--f-ui);font-weight:600;font-size:.9375rem}
.foot-links a:hover{color:var(--gold-ink)}
.foot-links svg{color:var(--gold-ink)}
@media (max-width:560px){.wm{white-space:nowrap}.who>span>span{display:none}.who strong{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}}
@media (max-width:430px){.wm{font-size:.82rem;letter-spacing:.06em}.wm b{display:none}.who strong{max-width:26vw}.bar{gap:8px}}
.pyall:empty{display:none}
.langsw{display:inline-flex;align-items:center;padding:3px;border-radius:999px;border:1px solid var(--gold);background:rgba(255,255,255,.06);cursor:pointer;font:inherit;gap:2px;flex:none}
.langsw span{padding:4px 9px;border-radius:999px;font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--band-fg,#F8F5EF);opacity:.75}
.langsw span.on{background:var(--gold);color:#23483F;opacity:1}.langsw[hidden]{display:none}
@media (max-width:430px){.langsw span{padding:3px 6px;font-size:.7rem}.bar:has(.who:not(:empty)) .wm{display:none}.who strong{max-width:24vw}header.band .hdr-r{gap:6px}}
/* ---- phone layout: compact head so the lesson content starts on the first screen ---- */
@media (max-width:560px){
  .wrap{padding-inline:14px}
  .stuhead{gap:10px}.stuname .eyebrow{font-size:.64rem;letter-spacing:.08em;line-height:1.5}
  h1.pt{font-size:1.65rem;line-height:1.15;margin-top:2px}
  .stutools{gap:8px}.stutools .seg{align-self:stretch;width:100%}
  .seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 6px;min-height:40px;font-size:.92rem;white-space:nowrap}
  .seg button .han{margin-right:0}
  .pomo{padding:6px 8px 8px 10px;gap:6px;border-radius:14px}.pomo-h{font-size:1.2rem}.pomo-t{font-size:1.12rem}.pomo-m{min-width:60px}.pomo .iconbtn{width:30px;height:30px}.pomo-p{padding:3px 4px;font-size:.75rem}
  .freebar{padding:8px 12px;gap:10px}.freebar .fb-t .small{display:none}.fb-ic{width:38px;height:32px}
  .hwnudge{padding:9px 12px;font-size:.92rem}
  .tabs{flex-wrap:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .tab{padding:10px 11px;font-size:.95rem}
  .stack{gap:16px}
  .hero-stats{display:grid!important;grid-template-columns:1fr 1fr;gap:12px 16px;width:100%}
  .tstrip{gap:8px 10px;padding:10px 14px!important}.tstrip .eyebrow{width:100%}.tstrip .tmedals{flex-wrap:wrap;gap:6px;padding:2px}
  .tstrip .medal-b.sm{width:32px;height:32px}.tstrip .medal-b.sm .han{font-size:.9rem}
}

@media (max-width:350px){.hdr-r .hub{display:none}}
@media (max-width:520px){.seg:has(> button:nth-child(4)){flex-wrap:wrap;border-radius:18px}.seg:has(> button:nth-child(4)) > button{flex:1 1 calc(50% - 4px)}}
.schoolbar{background:#1A3630;color:var(--gold);font-family:var(--f-ui);font-weight:600;font-size:.8125rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px 0;padding-top:calc(6px + env(safe-area-inset-top,0px))}
@media (max-width:560px){.logo-plate .logo-img{height:28px}.logo-plate{padding:4px 8px}}
/* ---- awards */
.medal-b{--c1:#E8C887;--c2:#B07A4E;position:relative;display:grid;place-items:center;width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8 0 18%,transparent 40%),conic-gradient(from 210deg,var(--c1),var(--c2),var(--c1),var(--c2),var(--c1));box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c2),0 6px 14px rgba(0,0,0,.12)}
.medal-b .han{font-size:1.65rem;font-weight:500;color:#2C2C2C;text-shadow:0 1px 0 #fff6;position:relative}
.medal-b::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(44,44,44,.25)}
.medal-b.bronze{--c1:#E2B48A;--c2:#A86A3E}
.medal-b.silver{--c1:#F1F2F0;--c2:#9AA09D}
.medal-b.gold{--c1:#F4DC9A;--c2:#C9A15D}
.medal-b.jade{--c1:#9FD6BE;--c2:#2F7A57}
.hwcard{display:flex;flex-direction:column;gap:12px}.hwcard.todo,.hwcard.redo{border-color:var(--gold)}
.hwhead{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hwhead:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.phg{display:flex;flex-wrap:wrap;gap:8px}.phg:empty{display:none}
.ph{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);flex:none}
.ph a{display:block;width:100%;height:100%}.ph img:not([src]){visibility:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.pend{outline:2px dashed var(--accent);outline-offset:-2px}
.ph.gone::after{content:"фото недоступне";position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted);padding:6px;pointer-events:none}
.phx{z-index:1;position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:26px;padding:0;cursor:pointer}
.vlist{display:flex;flex-direction:column;gap:6px}.vlist:empty{display:none}
.vrow{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:6px 40px 6px 10px;max-width:460px}
.vrow audio{height:36px;flex:1;min-width:0}.vrow.pend{outline:2px dashed var(--accent);outline-offset:-2px}.vrow .phx{top:50%;transform:translateY(-50%)}
.vrow:not(:has(.phx)){padding-right:10px}.vrow.gone audio{opacity:.4}
.recon{background:var(--bad,#b4552f)!important;color:#fff!important;border-color:transparent!important}
.phadd{cursor:pointer;position:relative}.phadd:focus-within{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.ph{width:84px;height:84px}}
.hwtext{white-space:normal;line-height:1.6;overflow-wrap:anywhere;background:var(--surface-2,rgba(201,161,93,.08));border-radius:10px;padding:12px 14px}
.hwtext a{color:var(--gold-ink);text-decoration-thickness:1px}
.hwtasks{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.hwtask{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:var(--fg);text-align:left;cursor:pointer;width:100%}

  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

  function watch(t){
    if (cache[t]) return cache[t];
    const c = cache[t] = {rows: new Map(), ls: new Set(), ready: false, error: null, timer: 0};
    c.ch = sb.channel("tbl-" + t).on("postgres_changes", {event: "*", schema: "public", table: t}, async p => {
      try {
        if (p.eventType === "DELETE"){ const id = p.old?.id; if (id != null) c.rows.delete(id); }
        else { const id = p.new?.id; if (id == null) return; const row = await fetchRow(t, id); if (row) c.rows.set(row.id, row.data); else c.rows.delete(id); }

    }).subscribe();
    (async () => {
      try {
        for (let from = 0; ; from += 1000){
          const {data, error} = await sb.from(t).select("id,data").order("id").range(from, from + 999);
          if (error) throw err(error);
          data.forEach(r => c.rows.set(r.id, r.data));

  const docSnap = (id, d) => ({id, exists: d !== undefined, data: () => clone(d)});

    collection(t){

        onSnapshot(cb, fail){

          c.ls.add(l); if (c.ready) l.fire(); else if (c.error && fail) fail(c.error);
          return () => c.ls.delete(l);

        async get(){ const {data, error} = await sb.from(t).select("id,data"); if (error) throw err(error); return {docs: data.map(r => docSnap(r.id, r.data))}; }
      };

      const [t, id] = split(path);

        async update(part){

        async delete(){
          const {error} = await sb.from(t).delete().eq("id", id);

          const c = cache[t]; if (c){ c.rows.delete(id); if (c.ready) emit(c); }

        onSnapshot(cb, fail){
          const c = watch(t), l = {fail, fire: () => cb(docSnap(id, c.rows.get(id)))};

  // ---------- ШІ-помічник: серверна функція "ai" (ключ — лише на сервері) ----------
  async function imgToB64(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return {mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1]};
    } finally { URL.revokeObjectURL(url); }
  }

    const downloads = {

  let mode = "in", busy = false, msg = "", msgOk = false;
  function loginView(){
    const google = `<button type="button" class="btn gbtn" id="lg-google" ${busy ? "disabled" : ""}><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Увійти через Google</button>`;
    const title = {in: "Вхід", up: "Реєстрація", reset: "Відновлення пароля", newpass: "Новий пароль"}[mode];

      : `<div class="field"><label for="lg-email">Пошта</label><input class="input" id="lg-email" type="email" autocomplete="email" required placeholder="name@gmail.com"></div>
         ${mode !== "reset" ? `<div class="field"><label for="lg-pass">Пароль</label><input class="input" id="lg-pass" type="password" minlength="6" autocomplete="${mode === "up" ? "new-password" : "current-password"}" required placeholder="щонайменше 6 символів"></div>` : ""}
         <button class="btn primary" type="submit" ${busy ? "disabled" : ""}>${mode === "in" ? "Увійти" : mode === "up" ? "Створити акаунт" : "Надіслати посилання"}</button>`;
    const links = mode === "in" ? `<button type="button" class="link" data-lg="up">Немає акаунта? Зареєструватися</button><button type="button" class="link" data-lg="reset">Забули пароль?</button>`

    $("#app").innerHTML = `<div class="reg">

  const UA = {
    "Invalid login credentials": "Неправильна пошта або пароль.",

    "Email not confirmed": "Пошту ще не підтверджено. Перевірте лист у скриньці.",
    "Password should be at least 6 characters.": "Пароль має містити щонайменше 6 символів."
  };
  async function submit(e){
    e.preventDefault(); if (busy) return;
    const email = $("#lg-email")?.value.trim(), pass = $("#lg-pass")?.value || "";
    busy = true; msg = ""; loginView();
    let res;
    try {
      if (mode === "in") res = await sb.auth.signInWithPassword({email, password: pass});
      else if (mode === "up") res = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: SITE}});
      else if (mode === "reset") res = await sb.auth.resetPasswordForEmail(email, {redirectTo: SITE});
      else res = await sb.auth.updateUser({password: pass});
    } catch(x){ res = {error: x}; }
    busy = false;
    if (res.error){ msg = UA[res.error.message] || res.error.message; msgOk = false; loginView(); return; }
    if (mode === "reset"){ msg = "Якщо така пошта зареєстрована, на неї прийде лист із посиланням для нового пароля."; msgOk = true; loginView(); return; }
    if (mode === "newpass"){ location.href = SITE; return; }
    if (mode === "up" && !res.data?.session){ msg = "Акаунт створено. Підтвердьте пошту за посиланням у листі й увійдіть."; msgOk = true; mode = "in"; loginView(); return; }
    // сесію підхопить onAuthStateChange
  }

  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY"){ mode = "newpass"; msg = ""; loginView(); return; }
    if (event === "SIGNED_OUT"){ if (started) location.reload(); return; }
    if (session && !started && mode !== "newpass"){ started = true; setTimeout(() => startApp(session), 0); }
  });
  sb.auth.getSession().then(({data}) => {
    if (data?.session){ if (!started && mode !== "newpass"){ started = true; startApp(data.session); } }
    else if (!started) loginView();
  }).catch(() => loginView());

  // ---------- перенесення даних (лише адміністраторка) ----------
  const IMPORT_ORDER = ["settings", "teachers", "classes", "lessons", "grammar", "cvocab", "materials"];
  document.addEventListener("change", async e => {
    if (e.target.id !== "import-file") return;
    const f = e.target.files?.[0], out = $("#import-msg"); if (!f || !out) return;
    const say = (t, ok) => { out.hidden = false; out.className = "note " + (ok ? "info" : ""); out.innerHTML = `<span>${ok ? "✓" : "…"}</span><span>${esc(t)}</span>`; };
    try {
      const j = JSON.parse(await f.text()); const cols = j.collections || {}, merge = j.merge || {}, del = j.delete || {};
      const nUp = IMPORT_ORDER.reduce((a, c) => a + Object.keys(cols[c] || {}).length, 0);
      const nMerge = Object.values(merge).reduce((a, m) => a + Object.keys(m).length, 0);
      const nDel = Object.values(del).reduce((a, ids) => a + ids.length, 0);
      const total = nUp + nMerge + nDel; let done = 0;
      if (!total){ say("У файлі немає даних для перенесення.", false); return; }
      // 1) remove outdated records (e.g. old HSK5 lessons replaced by the textbook version)
      for (const [c, ids] of Object.entries(del)){
        for (let i = 0; i < ids.length; i += 50){
          const part = ids.slice(i, i + 50);
          const {error} = await sb.from(c).delete().in("id", part);
          if (error) throw new Error(`${c}: ${error.message}`);
          done += part.length; say(`Оновлюю… ${done} з ${total}`);
        }
      }
      // 1b) groups can name their teacher instead of an id: they go to the EXISTING teacher card with that name (no new teacher is created)
      const tnRows = Object.values(cols.classes || {}).filter(r => r && r.teacherName && !r.teacherId);
      if (tnRows.length){
        const {data: trs, error: et} = await sb.from("teachers").select("id,data");
        if (et) throw new Error("teachers: " + et.message);
        const norm = n => String(n || "").toLowerCase().replace(/[’'ʼ`]/g, "").replace(/ё/g, "е").split(/\s+/).filter(Boolean).sort().join(" ");
        const missing = new Set();
        for (const r of tnRows){
          let hits = (trs || []).filter(t => norm(t.data?.name) === norm(r.teacherName));
          if (!hits.length){ const want = norm(r.teacherName).split(" "); const part = (trs || []).filter(t => { const have = norm(t.data?.name).split(" "); return want.every(w => have.includes(w)) || (have.length && have.every(w => want.includes(w))); }); if (part.length === 1) hits = part; }
          const pick = hits.find(t => t.data?.uid) || hits.sort((x, y) => (x.data?.order || 0) - (y.data?.order || 0))[0];
          if (pick){ r.teacherId = pick.id; delete r.teacherName; } else missing.add(r.teacherName);
        }
        if (missing.size){ say("Не знайдено картку викладача: " + [...missing].join(", ") + ". Створіть її кнопкою «+ Викладач» (ім'я точно як у файлі) і завантажте файл ще раз. Нічого не змінено.", false); e.target.value = ""; return; }
      }
      // 2) full records (new or replaced)
      for (const c of IMPORT_ORDER){
        const rows = Object.entries(cols[c] || {}).map(([id, data]) => ({id, data}));
        for (let i = 0; i < rows.length; i += 25){
          const {error} = await sb.from(c).upsert(rows.slice(i, i + 25), {onConflict: "id"});
          if (error) throw new Error(`${c}: ${error.message}`);
          done += Math.min(25, rows.length - i); say(`Оновлюю… ${done} з ${total}`);
        }
      }
      // 3) add / replace fields in existing records without touching anything else
      for (const [c, recs] of Object.entries(merge)){
        const ids = Object.keys(recs);
        for (let i = 0; i < ids.length; i += 25){
          const part = ids.slice(i, i + 25);
          const {data: cur, error: e1} = await sb.from(c).select("id,data").in("id", part);
          if (e1) throw new Error(`${c}: ${e1.message}`);
          const have = new Map((cur || []).map(r => [r.id, r.data]));
          const rows = part.filter(id => have.has(id)).map(id => ({id, data: {...have.get(id), ...recs[id]}}));
          if (rows.length){ const {error} = await sb.from(c).upsert(rows, {onConflict: "id"}); if (error) throw new Error(`${c}: ${error.message}`); }
          done += part.length; say(`Оновлюю… ${done} з ${total}`);
        }
      }
      say(`Готово: оновлено ${total} записів. Оновіть сторінку.`, true);
    } catch(x){ say("Не вдалося перенести: " + x.message + ". Перевірте, що ви увійшли як адміністраторка.", false); }
    e.target.value = "";
  });
})();

  if (S.isTeacher) db.collection("progress").onSnapshot(q => { S.progs = {}; q.docs.forEach(d => S.progs[d.id] = d.data()); if (S.phase === "ready" && !S.pedit && !S.medit && S.view.tab === "prog") render(); }, () => {});

      if (st === "checked" && f) add({id: "ok:" + h.id + ":" + f.at, t: f.at, g: "✓", tone: "ok", k: "ДЗ перевірено", title: h.title, meta: f.mark ? ["Оцінка:", " " + f.mark] : null, act: "hw:" + h.id});

// =====================================================================
// PROGRESS — learning progress on the teacher's own lessons («Лексика з уроків»).
// Shown only in the student's own cabinet and to staff; not part of the ranking.
// =====================================================================
const PROG_ST = {m: ["Вивчено", "var(--ok)"], l: ["Вчить", "var(--gold)"], n: ["Ще не відкрито", "var(--line)"]};
function wordStatus(st, wid){
  const p = st?.words?.[wid]; if (!p) return "n";
  if (p.s >= MASTER) return "m";
  return "l";
}
function progData(st, cls){
  const d = today(), lessons = cvOf(cls?.id).map(cvLesson);
  let T = {total: 0, m: 0, l: 0, n: 0, ok: 0, bad: 0, due: 0};
  const hard = [];
  const rows = lessons.map(l => {
    const r = {l, total: 0, m: 0, l2: 0, n: 0, ok: 0, bad: 0, due: 0, words: []};
    for (const w of l.words || []){
      if (!w || !w.id) continue;
      const s = wordStatus(st, w.id), p = st?.words?.[w.id] || {};
      r.total++; r[s === "l" ? "l2" : s]++; r.ok += p.ok || 0; r.bad += p.bad || 0;
      if (p.due && p.due <= d && s !== "n" && p.s < 6) r.due++;
      r.words.push({w, s, p});
      if ((p.bad || 0) >= 2 && (p.bad || 0) > (p.ok || 0) && s !== "m") hard.push({w, p, lt: l.title});
    }
    r.pct = r.total ? Math.round(100 * r.m / r.total) : 0;
    r.acc = r.ok + r.bad ? Math.round(100 * r.ok / (r.ok + r.bad)) : null;
    T.total += r.total; T.m += r.m; T.l += r.l2; T.n += r.n; T.ok += r.ok; T.bad += r.bad; T.due += r.due;
    return r;
  });
  T.pct = T.total ? Math.round(100 * T.m / T.total) : 0;
  T.acc = T.ok + T.bad ? Math.round(100 * T.ok / (T.ok + T.bad)) : null;
  hard.sort((a, b) => (b.p.bad - b.p.ok) - (a.p.bad - a.p.ok));
  // activity over the last 4 weeks (any learning action)
  const days = []; for (let k = 27; k >= 0; k--){ const dd = addDays(d, -k); days.push({d: dd, a: st?.log?.[dd]?.a || 0}); }
  const active = days.filter(x => x.a > 0).length;
  const lastSeen = Object.keys(st?.log || {}).filter(k => st.log[k]?.a).sort().pop() || "";
  return {rows, T, hard: hard.slice(0, 10), days, active, lastSeen};
}
function progBar(m, l, n, big){
  const t = m + l + n || 1, seg = (v, c) => v ? `<i style="width:${100 * v / t}%;background:${c}"></i>` : "";
  return `<div class="pbar ${big ? "big" : ""}" role="img" aria-label="Вивчено ${m}, вчить ${l}, не відкрито ${n}">${seg(m, PROG_ST.m[1])}${seg(l, PROG_ST.l[1])}${seg(n, PROG_ST.n[1])}</div>`;
}
const progTile = (v, label, sub) => `<div class="ptile"><span class="v num">${v}</span><span class="small">${label}</span>${sub ? `<span class="small muted">${sub}</span>` : ""}</div>`;

    ${progTile(T.due, "повторити зараз", "за інтервальним повторенням")}

  </div>`;
  const legend = `<div class="plegend">${Object.values(PROG_ST).map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>`;
  const act = `<div class="panel"><div class="spread"><b>Активність за 4 тижні</b><span class="small muted">${P.active} ${plural(P.active, "день", "дні", "днів")} із заняттями${P.lastSeen ? " · останній раз " + fmtDate(P.lastSeen) : ""}</span></div>

  const lessons = P.rows.map(r => `<details class="plesson"><summary>

      <div class="pwords">${r.words.map(x => `<span class="pw ${x.s}" title="${esc(x.w.uk || "")}${x.p.ok || x.p.bad ? ` · правильно ${x.p.ok || 0}, помилок ${x.p.bad || 0}` : ""}"><span class="zh">${esc(x.w.h)}</span><small>${esc(x.w.uk || "")}</small></span>`).join("")}</div>
      ${forStaff ? "" : `<div class="row"><button class="btn sm primary" data-act="deckTab" data-arg="cv:${esc(r.l.id)}">Картки</button><button class="btn sm" data-act="exSrc" data-arg="cv:${esc(r.l.id)}">Вправа</button></div>`}
    </details>`).join("");
  const hard = P.hard.length ? `<div class="panel"><b>Складні слова</b><p class="small muted">Слова з занять, у яких ${forStaff ? "учень найчастіше помиляється" : "ви найчастіше помиляєтеся"}.</p>

  return `${head}${tiles}<div class="panel"><div class="spread"><b>Загалом</b>${legend}</div>${progBar(T.m, T.l, T.n, true)}</div>

// =====================================================================
// SKILLS PROGRESS — teacher's own assessment of each student (listening, speaking, reading, writing…).
// Stored in progress/{studentId}. Database rules: staff read & write every doc; a student can read
// only the doc with her own id; nobody else can read it.
// =====================================================================
const SKILLS_DEF = [
  {id:"listen", han:"听", name:"Аудіювання"}, {id:"speak", han:"说", name:"Говоріння"},
  {id:"read",   han:"读", name:"Читання"},    {id:"write", han:"写", name:"Письмо"},
  {id:"hanzi",  han:"字", name:"Ієрогліфи"},  {id:"tones", han:"音", name:"Вимова й тони"},
  {id:"gram",   han:"语", name:"Граматика"},  {id:"vocab", han:"词", name:"Лексика"}
];
const SK_LEVELS = [[0, "не оцінено"], [1, "старт"], [3, "базово"], [5, "впевнено"], [7, "добре"], [9, "відмінно"]];
const skLabel = v => { let t = SK_LEVELS[0][1]; for (const [k, n] of SK_LEVELS) if (v >= k) t = n; return t; };
const skColor = v => v >= 7 ? "var(--ok)" : v >= 4 ? "var(--gold)" : v > 0 ? "var(--bad)" : "var(--line)";
const testKey = cid => "test-" + cid;
function progOf(sid){ if (S.testAs && sid === S.uid) return S.progs?.[testKey(S.testAs.classId)]; return sid === S.uid && !S.isTeacher ? S.myProg : S.progs?.[sid]; }
function skillsOf(pr){ return Array.isArray(pr?.skills) && pr.skills.length ? pr.skills : SKILLS_DEF.map(s => ({...s, v: 0, note: ""})); }

function radarSvg(skills, prev){
  const n = skills.length; if (n < 3) return "";
  const R = 92, cx = 130, cy = 120, pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n, r = R * v / 10; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = k => skills.map((_, i) => pt(i, k).join(",")).join(" ");
  const poly = vals => vals.map((v, i) => pt(i, v).join(",")).join(" ");
  const labels = skills.map((s, i) => { const [x, y] = pt(i, 12.2); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="rl">${esc(s.han || s.name.slice(0, 1))}</text>`; }).join("");
  const prevVals = prev ? skills.map(s => Number(prev[s.id] ?? 0)) : null;
  return `<svg viewBox="0 0 260 240" class="radar" role="img" aria-label="Діаграма навичок">
    ${[2, 4, 6, 8, 10].map(k => `<polygon points="${ring(k)}" class="rg"/>`).join("")}
    ${skills.map((_, i) => { const [x, y] = pt(i, 10); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="rg"/>`; }).join("")}
    ${prevVals ? `<polygon points="${poly(prevVals)}" class="rp"/>` : ""}
    <polygon points="${poly(skills.map(s => Number(s.v) || 0))}" class="rc"/>
    ${labels}</svg>`;
}
function sparkSvg(vals){
  if (vals.length < 2) return "";
  const w = 90, h = 26, step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - (h - 4) * v / 10).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

// ---- read-only view (student sees her own; staff see it above the editor button)

  const avg = rated.length ? (rated.reduce((a, s) => a + Number(s.v), 0) / rated.length) : 0;
  const goals = Array.isArray(pr?.goals) ? pr.goals : [];
  const by = pr?.updatedBy && S.teachers ? Object.values(S.teachers).find(t => t.uid === pr.updatedBy)?.name : "";
  if (!pr || !rated.length){
    return `<div class="panel skempty"><span class="han" style="font-size:2.4rem;color:var(--gold-ink)">进</span><b>${forStaff ? "Учня ще не оцінено" : "Викладач ще не оцінив ваші навички"}</b>
      <span class="small muted">${forStaff ? "Відкрийте редактор і позначте рівень аудіювання, говоріння, читання, письма та інших навичок — учень побачить це у своєму кабінеті." : "Після кількох занять тут з'явиться оцінка аудіювання, говоріння, читання, письма й інших навичок від викладача, його коментарі та цілі."}</span>
      ${forStaff ? `<button class="btn primary" data-act="peOpen" data-arg="${esc(sid)}">Оцінити навички</button>` : ""}</div>`;
  }
  const rows = skills.map(s => { const v = Number(s.v) || 0, series = hist.map(h => Number(h.v?.[s.id] ?? 0)).filter((_, i, a) => a.length);
    const d = prev && prev[s.id] != null ? v - Number(prev[s.id]) : 0;
    return `<div class="skrow"><span class="skh">${esc(s.han || "")}</span><div class="skmain"><div class="spread"><b>${esc(s.name)}</b><span class="small"><b class="num">${v}</b>/10 · ${skLabel(v)}${d ? ` <span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"}${Math.abs(d)}</span>` : ""}</span></div>
      <div class="skbar"><i style="width:${v * 10}%;background:${skColor(v)}"></i></div>${s.note ? `<div class="small muted">${esc(s.note)}</div>` : ""}</div>${sparkSvg(series)}</div>`; }).join("");
  return `<div class="two skwrap"><div class="panel" style="display:flex;flex-direction:column;align-items:center;gap:6px">
      ${radarSvg(skills, prev)}<div class="plegend"><span><i style="background:var(--accent)"></i>зараз</span>${prev ? `<span><i style="background:var(--gold)"></i>попередня оцінка</span>` : ""}</div>
      <div class="small muted" style="text-align:center">Середній рівень <b class="num">${avg.toFixed(1)}</b>/10${pr.updatedAt ? ` · оновлено ${fmtDate(dstr(new Date(pr.updatedAt)))}` : ""}${by ? ` · ${esc(by)}` : ""}</div>
      ${forStaff ? `<button class="btn sm primary" data-act="peOpen" data-arg="${esc(sid)}">Редагувати оцінку</button>` : ""}</div>
    <div class="panel skills">${rows}</div></div>
    ${pr.comment ? `<div class="panel fbk"><span class="eyebrow">Відгук викладача</span><p>${esc(pr.comment)}</p></div>` : ""}
    ${goals.length ? `<div class="panel"><b>Над чим працюємо</b><ul class="goals">${goals.map(g => `<li class="${g.done ? "done" : ""}"><span>${g.done ? "✓" : "○"}</span>${esc(g.t)}</li>`).join("")}</ul></div>` : ""}
    ${hist.length > 1 ? `<details class="panel"><summary><b>Історія оцінок</b> <span class="small muted">· ${hist.length} ${plural(hist.length, "запис", "записи", "записів")}</span></summary>
      <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Дата</th>${skills.map(s => `<th class="n" title="${esc(s.name)}">${esc(s.han || s.name)}</th>`).join("")}</tr></thead><tbody>${hist.slice().reverse().map(h => `<tr><td>${fmtDate(h.d)}</td>${skills.map(s => `<td class="n">${h.v?.[s.id] ?? "—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>` : ""}`;
}

async function peSave(){
  const e = S.pedit; if (!e || e.busy) return;
  const old = S.progs?.[e.sid] || {}, d = today();
  const skills = e.skills.map(s => ({id: s.id, han: String(s.han || "").slice(0, 2), name: String(s.name).slice(0, 40), v: Math.max(0, Math.min(10, Math.round(Number(s.v) || 0))), note: String(s.note || "").trim().slice(0, 300)}));
  const hist = (Array.isArray(old.hist) ? old.hist : []).filter(h => h.d !== d);
  hist.push({d, v: Object.fromEntries(skills.map(s => [s.id, s.v]))});
  const doc = {...old, skills, comment: String(e.comment || "").trim().slice(0, 1500), goals: e.goals.filter(g => String(g.t || "").trim()).slice(0, 20).map(g => ({t: String(g.t).slice(0, 160), done: !!g.done})),
    hist: hist.slice(-30), updatedAt: Date.now(), updatedBy: S.uid || ""};
  e.busy = true; render();
  try { await S.db.doc("progress/" + e.sid).set(doc); (S.progs = S.progs || {})[e.sid] = doc; S.pedit = null; toast("Оцінку збережено — учень уже бачить її"); }
  catch(err){ e.busy = false; toast("Не вдалося зберегти. Перевірте доступ викладача."); }
  render();
}
async function peCopySet(){
  const e = S.pedit, st = S.students[e.sid]; if (!e || !st) return;
  const others = Object.entries(S.students).filter(([id, x]) => id !== e.sid && x.classId === st.classId);
  let n = 0;
  for (const [id] of others){
    const pr = S.progs?.[id] || {}, cur = skillsOf(pr);
    const skills = e.skills.map(s => { const c = cur.find(x => x.id === s.id); return {id: s.id, han: s.han, name: s.name, v: c ? Number(c.v) || 0 : 0, note: c?.note || ""}; });
    try { await S.db.doc("progress/" + id).set({...pr, skills, updatedAt: pr.updatedAt || Date.now(), updatedBy: pr.updatedBy || S.uid || ""}); n++; } catch(_){}
  }
  toast(n ? `Набір навичок застосовано до ${n} ${plural(n, "учня", "учнів", "учнів")} (їхні оцінки збережено)` : "Не вдалося застосувати");
}

function classOverview(c){
  const entries = Object.entries(S.students).filter(([, st]) => st.classId === c.id);
  const ls = availLessons(null, c), total = wordsOf(ls).length;
  let m = 0, due = 0, act = 0;
  entries.forEach(([, st]) => { const s = statsOf(st, ls); m += s.mastered; due += s.due; if (st.log?.[today()]?.a) act++; });
  const invite = `<div class="note"><span>🔑</span><span>${c.kind === "individual"
    ? `Щоб <b>${esc(c.name)}</b> отримав доступ, надішліть йому посилання на платформу та код <span class="code">${esc(c.code)}</span>. Під час першого входу він створить профіль і одразу потрапить до свого кабінету.`
    : `Надішліть студентам посилання на платформу та код групи <span class="code">${esc(c.code)}</span>. Під час першого входу кожен створює профіль, і прогрес зберігається окремо для кожного.`}</span></div>`;
  return `
    <div class="tiles">
      <div class="tile key"><b>${entries.length}</b><span>${c.kind === "individual" ? "профіль учня" : "студентів у групі"}</span></div>

      <div class="tile"><b>${total}</b><span>слів у доступі</span></div>
      <div class="tile"><b>${availGrammar(null, c).length}</b><span>тем граматики</span></div>
      <div class="tile"><b>${m}</b><span>опановано разом</span></div>
      <div class="tile"><b>${due}</b><span>чекають повторення</span></div>
      <div class="tile"><b>${act}</b><span>вчилися сьогодні</span></div>

    ${entries.length ? invite : ""}`;
}

function classLessons(c){

const blankEx = () => ({zh: "", py: "", uk: ""});
const blankWord = () => ({id: rid("w"), h: "", p: "", uk: "", ex: [blankEx(), blankEx(), blankEx()]});
function normWord(w){ const ex = exList(w).map(x => ({zh: x.zh || "", py: x.py || "", uk: x.uk || ""})); while (ex.length < 3) ex.push(blankEx()); return {id: w.id || rid("w"), h: w.h || "", p: w.p || "", uk: w.uk || "", ex: ex.slice(0, 3)}; }
function openEditor(id){
  const l = id ? S.lessons[id] : null;
  const hsk = l ? l.hsk : (S.view.name === "class" ? (S.classes[S.view.id]?.course || HSK[0]) : HSK[0]);
  const order = l ? l.order : Math.max(0, ...Object.values(S.lessons).filter(x => x.hsk === hsk).map(x => x.order || 0)) + 1;

function parseBulk(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const f = line.split(/\s*[|\t]\s*/);
    return {...blankWord(), h: f[0] || "", p: f[1] || "", uk: f[2] || ""};
  }).filter(w => w.h);
}
const needsFill = w => w.h && (!w.p || !w.uk || w.ex.filter(x => x.zh).length < 3);
function mergeWords(list){
  const e = S.edit; e.words = e.words.filter(w => w.h || w.p || w.uk);
  for (const raw of list){
    const n = normWord(raw); const ex = e.words.find(w => w.h === n.h);
    if (ex){
      for (const k of ["p","uk"]) if (!ex[k] && n[k]) ex[k] = n[k];
      const have = ex.ex.filter(x => x.zh), add = n.ex.filter(x => x.zh && !have.some(h => h.zh === x.zh));
      ex.ex = [...have, ...add].slice(0, 3); while (ex.ex.length < 3) ex.ex.push(blankEx());
    } else e.words.push({...n, id: rid("w")});
  }
  if (!e.words.length) e.words.push(blankWord());

// Theory markup: one block per line prefix; lines without a prefix continue the previous text.
const GPFX = {T: "text", H: "h", F: "formula", E: "examples", TIP: "tip", M: "mistake", TAB: "table", R: "row"};
function blocksToText(blocks){
  const out = [];
  for (const b of blocks || []){
    if (b.type === "text") out.push("T: " + (b.text || ""));
    else if (b.type === "h") out.push("H: " + (b.text || ""));
    else if (b.type === "formula") out.push("F: " + (b.text || ""));
    else if (b.type === "tip") out.push("TIP: " + (b.text || ""));
    else if (b.type === "examples") out.push((b.items || []).map(x => `E: ${x.zh || ""} | ${x.py || ""} | ${x.uk || ""}`).join("\n"));
    else if (b.type === "mistake") out.push(`M: ${b.wrong || ""} | ${b.right || ""} | ${b.why || ""}`);
    else if (b.type === "table") out.push(["TAB: " + (b.head || []).join(" | "), ...(b.rows || []).map(r => "R: " + r.join(" | "))].join("\n"));
  }
  return out.join("\n\n");
}
function textToBlocks(t){
  const blocks = []; let last = null;
  const cells = s => s.split("|").map(x => x.trim());
  for (const raw of String(t || "").split(/\r?\n/)){
    const line = raw.trimEnd();
    if (!line.trim()){ last = null; continue; }
    const m = line.match(/^(TIP|TAB|T|H|F|E|M|R)\s*:\s?(.*)$/i);
    if (!m){ if (last && ["text","tip"].includes(last.type)) last.text += "\n" + line.trim(); else blocks.push(last = {type: "text", text: line.trim()}); continue; }
    const kind = GPFX[m[1].toUpperCase()], v = m[2].trim();
    if (kind === "examples"){
      const [zh, py, uk] = cells(v);
      if (last && last.type === "examples") last.items.push({zh, py: py || "", uk: uk || ""});
      else blocks.push(last = {type: "examples", items: [{zh, py: py || "", uk: uk || ""}]});
    } else if (kind === "row"){
      if (last && last.type === "table") last.rows.push(cells(v));
      else blocks.push(last = {type: "table", head: [], rows: [cells(v)]});
    } else if (kind === "table") blocks.push(last = {type: "table", head: cells(v), rows: []});
    else if (kind === "mistake"){ const [wrong, right, why] = cells(v); blocks.push(last = {type: "mistake", wrong, right: right || "", why: why || ""}); }
    else blocks.push(last = {type: kind, text: v});
  }
  return blocks.filter(b => b.type !== "examples" || b.items.some(x => x.zh));
}

function gedBuild(){
  const e = S.gedit, tr = s => String(s || "").trim(), errs = [];
  const ex = e.ex.map((q, i) => {
    if (q.type === "order"){
      const words = tr(q.words).split(/\s+/).filter(Boolean);
      if (words.length < 2){ errs.push(`вправа ${i + 1}: потрібно щонайменше два слова`); return null; }
      const out = {type: "order", words, a: tr(q.a) || words.join(""), uk: tr(q.uk), why: tr(q.why)};
      const alt = tr(q.alt).split(/\s*;\s*/).filter(Boolean); if (alt.length) out.alt = alt;
      if (tr(q.q)) out.q = tr(q.q);
      return out;
    }
    const filled = q.opts.map((o, k) => ({o: tr(o), k})).filter(x => x.o);
    const a = filled.findIndex(x => x.k === q.a);
    if (!tr(q.q)) errs.push(`вправа ${i + 1}: немає питання`);
    else if (filled.length < 2) errs.push(`вправа ${i + 1}: потрібно щонайменше два варіанти`);
    else if (a < 0) errs.push(`вправа ${i + 1}: позначте правильний варіант`);
    const out = {type: "choice", q: tr(q.q), opts: filled.map(x => x.o), a: Math.max(0, a), why: tr(q.why)};
    if (tr(q.zh)) out.zh = tr(q.zh);
    return out;
  }).filter(Boolean);
  if (!tr(e.title)) errs.unshift("вкажіть назву теми");
  const blocks = textToBlocks(e.theory);
  if (!blocks.length) errs.push("додайте пояснення");
  return {errs, body: {hsk: e.hsk, order: Number(e.order) || 1, lesson: tr(e.lesson), title: tr(e.title), pattern: tr(e.pattern), summary: tr(e.summary), hidden: !!e.hidden, blocks, ex, updatedAt: Date.now(), updatedBy: S.uid || ""}};
}
async function gedSave(){
  const e = S.gedit, {errs, body} = gedBuild();
  if (errs.length){ e.msg = "Перевірте: " + errs.join("; ") + "."; render(); return; }
  const id = e.id || rid("G");
  e.busy = "save"; render();
  try { await S.db.doc("grammar/" + id).set(body); toast(e.id ? "Тему збережено" : "Тему створено"); S.view = e.back || {name: "library"}; S.libMode = "grammar"; S.gedit = null; render(); }
  catch(err){ e.busy = ""; e.msg = "Не вдалося зберегти: " + (err.code === "invalid_argument" ? "немає прав на редагування (потрібна роль Editor) або тема завелика." : "спробуйте ще раз."); render(); }
}
async function gedAI(){
  const e = S.gedit;
  if (!e.title.trim() && !e.theory.trim()){ toast("Спершу вкажіть назву й пояснення"); return; }
  e.busy = "ai"; e.msg = "ШІ складає вправи…"; render();
  try {
    const res = await S.sample.json(`Ти помічник викладачки ${LNAME()}ої для україномовних студентів, рівень ${lvName(e.hsk)}. Тема граматики: «${e.title}» (${e.pattern}).\nПояснення:\n${e.theory}\n\nСклади 4 вправи на цю тему: 3 типу choice і 1 типу order. Використовуй лише лексику рівня ${lvName(e.hsk)} і нижче. Відповідай лише JSON-масивом. choice: {"type":"choice","q":"питання українською або ${LNAME()}е речення з пропуском ＿＿","opts":["4 варіанти"],"a":індекс правильного з 0,"why":"коротке пояснення українською"}. order: {"type":"order","words":["слова речення в правильному порядку"],"a":"речення з розділовими знаками","uk":"переклад","why":"пояснення"}.`, {cache: false});
    if (!Array.isArray(res)) throw {code: "invalid_json"};
    const add = res.filter(q => q && (q.type === "order" ? Array.isArray(q.words) : Array.isArray(q.opts))).map(normGEx);
    e.ex = e.ex.filter(q => q.type === "order" ? q.words.trim() : q.q.trim() || q.opts.some(o => o.trim())).concat(add);
    e.msg = `Додано ${add.length} ${plural(add.length,"вправу","вправи","вправ")}. Перевірте їх перед збереженням.`;
  } catch(err){ e.msg = aiErr(err); }
  e.busy = ""; render();
}

  const hskBars = ctx.levels.map(h => { const ls = ctx.lessons.filter(l => l.hsk === h); const s = statsOf(S.me, ls); return bar(`<b>${lvName(h)}</b>`, `${s.total ? Math.round(100 * s.mastered / s.total) : 0}% · ${s.mastered}/${s.total}`, s.mastered, s.learning, s.total); }).join("");
  const wrong = (S.me.wrong || []).map(id => allWords().find(w => w.id === id)).filter(Boolean).slice(0, 12);
  const cta = st.due
    ? {t: `${st.due} ${plural(st.due,"слово чекає","слова чекають","слів чекають")} на повторення`, b: "Повторити", d: "due"}
    : lv.fresh ? {t: `${lv.fresh} нових слів ${lvName(ctx.level)} чекають на вас`, b: "Вчити нові", d: "new"}
    : {t: "На сьогодні все повторено", b: "Переглянути картки", d: "all"};
  return `
    <div class="tiles">
      <div class="tile key"><b>${st.mastered}</b><span>опановано слів</span></div>
      <div class="tile"><b>${st.due}</b><span>повторити сьогодні</span></div>
      <div class="tile"><b>${st.learning}</b><span>вивчаються зараз</span></div>
      <div class="tile"><b>${st.streak}</b><span>${plural(st.streak,"день","дні","днів")} поспіль</span></div>
      <div class="tile"><b>${place ? place : "—"}</b><span>місце в рейтингу</span></div>
      <div class="tile"><b>${st.acc == null ? "—" : st.acc + "%"}</b><span>правильних відповідей</span></div>
      <div class="tile"><b>${st.exDone}</b><span>вправ виконано</span></div>
      <div class="tile"><b>${st.points}</b><span>балів</span></div>
      <button class="tile tilebtn" data-act="tab" data-arg="ach"><b>${Object.keys(S.me.ach || {}).length}<small class="muted"> / ${ACH.length}</small></b><span>нагород · відкрити →</span></button>
    </div>
    <div class="panel spread" style="background:var(--accent);border-color:var(--accent);color:var(--accent-fg)">
      <div><h3>${cta.t}</h3>
      <p class="small" style="opacity:.85">Слово опановане, коли ви згадали його у ${MASTER} різні дні з інтервалами 1 → 2 → 4 дні.</p></div>
      <button class="btn gold" data-act="startDeck" data-arg="${cta.d}">${cta.b}</button>
    </div>
    <div class="two">
      <div class="panel stack" style="gap:14px"><div class="sh" style="margin:0"><h3>Прогрес за уроками</h3><span class="small muted"><span style="color:var(--accent)">■</span> опановано <span style="color:var(--gold)">■</span> вчите</span></div>${levelBar(ctx, "vocab")}<div class="prog">${lessonBars}</div></div>
      <div class="panel stack" style="gap:18px"><div><div class="sh"><h3>Рівні HSK</h3></div><div class="prog">${hskBars}</div></div>
        <div><div class="sh"><h3>Слова з помилками</h3>${wrong.length ? `<button class="link" data-act="startEx" data-arg="mistakes">Тренувати</button>` : ""}</div>
        ${wrong.length ? `<div class="chips">${wrong.map(w => `<span class="chip han" style="cursor:default">${esc(w.h)}</span>`).join("")}</div>` : `<p class="small muted">Поки помилок немає.</p>`}</div></div>
    </div>`;
}

  const studs = tStuds(t.id), n = studs.length; if (n < 2) return null;
  const days = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate(), elapsed = m === curMonth() ? Number(today().slice(8, 10)) : days;
  const needDays = Math.max(1, Math.min(6, Math.round(elapsed / 4)));
  let pts = 0, act = 0, com = 0;
  for (const [id, st] of studs){
    let a = 0; for (const [d, v] of Object.entries(st.log || {})) if (monthOf(d) === m){ pts += v.p || 0; if (v.a) a++; }
    if (a >= needDays) act++;
    if (monthlyOf(S.progs?.[id]).some(x => x.m === m)) com++;
  }
  const content = matCount(t, m) + tCv(t.id).filter(x => monthOf(x.date) === m).length;
  const parts = {pts: Math.round(pts / n), act: Math.round(100 * act / n), care: Math.round(50 * com / n), content: Math.min(10, content) * 5};
  return {...parts, n, score: parts.pts + parts.act + parts.care + parts.content};
}
function tomBoard(m){ return teachersSorted().map(t => ({t, r: tMonthScore(t, m)})).filter(x => x.r && x.r.score > 0).sort((a, b) => b.r.score - a.r.score); }
function tomWinners(k){ return monthList(k + 1).slice(1).map(m => ({m, w: tomBoard(m)[0] || null})); }
function tMetrics(t){
  const studs = tStuds(t.id), cs = classesOf(t.id), d = today(), cm = curMonth(), pm = prevMonth();
  const v = {n: studs.length, mastered: 0, exDone: 0, gram: 0, days: 0, maxStreak: 0, monthWords: 0, mats: matCount(t), comments: 0, ratings: 0};
  const cv = tCv(t.id); v.cv = cv.length; v.cvWords = cv.reduce((a, x) => a + (x.words || []).length, 0);
  let ok = 0, tot = 0, wk = 0, wk2 = 0, debt = 0; const mw = {};
  for (const [id, st] of studs){
    v.mastered += masteredAll(st); v.exDone += st.exDone || 0; v.gram += gramDone(st);
    ok += st.exOk || 0; tot += st.exTotal || 0;
    v.maxStreak = Math.max(v.maxStreak, st.bestStreak || 0, streak(st));
    let a7 = 0; for (const [k, x] of Object.entries(st.log || {})){ if (x?.a){ v.days++; if (k > addDays(d, -7)) a7++; } if (x?.m) mw[monthOf(k)] = (mw[monthOf(k)] || 0) + x.m; }
    if (a7 >= 3) wk++; if (a7 >= 2) wk2++;
    if (statsOf(st, availLessons(st, classOf(st))).due > 20) debt++;
    const pr = S.progs?.[id]; v.comments += monthlyOf(pr).length; v.ratings += Array.isArray(pr?.hist) ? pr.hist.length : 0;
  }
  v.monthWords = Math.max(0, ...Object.values(mw));
  v.acc = tot >= 300 ? Math.round(100 * ok / tot) : 0;
  v.weekRate = studs.length >= 2 ? Math.round(100 * wk / studs.length) : 0;
  v.allWeek = studs.length >= 3 && wk2 === studs.length ? 1 : 0;
  v.noDebt = studs.length >= 3 && !debt ? 1 : 0;
  const young = studs.filter(([, st]) => isYoung(classOf(st)));
  v.careAll = young.length && young.every(([id]) => monthlyOf(S.progs?.[id]).some(x => x.m === pm || x.m === cm)) ? 1 : 0;
  v.uni = cs.some(c => c.kind === "individual") && cs.some(c => c.kind !== "individual") ? 1 : 0;
  v.young = cs.filter(c => c.age === "kid" || c.age === "teen").length;
  v.levels = new Set(cs.map(c => c.course).filter(Boolean)).size;
  v.hsk5 = cs.some(c => lvIdx(c.course) >= lvIdx("HSK5")) ? 1 : 0;
  const ids = new Set(studs.map(x => x[0])), pod = schoolPodiums(); v.podium = 0; v.first = 0;
  for (const top of Object.values(pod)) top.forEach((id, i) => { if (ids.has(id)){ v.podium++; if (!i) v.first++; } });
  v.tom = tomWinners(12).filter(x => x.w && x.w.t.id === t.id).length;
  return v;
}

// homework award values for the signed-in student (her tasks, answers and the teacher's checks)
function hwAchValues(){
  const v = {hwChecked: 0, hwOnTime: 0, hwRun: 0, hwEarly: 0, hwClean: 0, hwFixed: 0, hwTasks: 0, hwPerfect: 0};
  if (!S.uid || staffUI() || S.testAs || !S.hw) return v;
  const td = today(), mine = hwAll().filter(h => hwForMe(h)).sort((a, b) => String(a.due || a.date).localeCompare(String(b.due || b.date)));
  let run = 0;
  for (const h of mine){
    const f = hwFb(h.id, S.uid), sb = hwSub(h.id, S.uid);
    if (hwState(h, S.uid) !== "checked"){ if (h.due && h.due < td) run = 0; continue; }
    v.hwChecked++;
    const onTime = !h.due || (sb?.date && sb.date <= h.due);
    if (onTime){ v.hwOnTime++; run++; v.hwRun = Math.max(v.hwRun, run); } else run = 0;
    if (h.due && sb?.date && sb.date < h.due) v.hwEarly++;
    if (f?.redos) v.hwFixed++; else v.hwClean++;
    const ts = hwTasks(h);
    if (ts.length){ const rs = ts.map(t => hwTaskRes(h, t, S.uid)); if (rs.every(r => r && r.done)){ v.hwTasks++; if (ts.length >= 2 && rs.every(r => r.perfect)) v.hwPerfect++; } }

}

у телефонує Девід?","o":["Учительці Ван","Мамі","Другові"],"a":0},{"q":"Де зараз учителька Ван?","o":["У лікарні","У школі","Удома"],"a":0},{"q":"Коли вона повернеться?","o":["О 15:00","О 13:00","Завтра"],"a":0}],"en":{"topic":"Telephone","uk":"A phone call","s":[{"uk":"David: Hello, good afternoon! Excuse me, is Teacher Wang there?"},{"uk":"Teacher Wang's daughter: She isn't here, she's gone to the hospital."},{"uk":"David: When will she be back?"},{"uk":"Teacher Wang's daughter: At three in the afternoon. Who is this?"},{"uk":"David: I'm her student, my name is David."},{"uk":"Teacher Wang's daughter: OK, goodbye!"},{"uk":"David: Thank you, goodbye!"}],"q":[{"q":"Who is David calling?","o":["Teacher Wang","His mum","A friend"]},{"q":"Where is Teacher Wang now?","o":["At the hospital","At school","At home"]},{"q":"When will she be back?","o":["At 15:00","At 13:00","Tomorrow"]}]}},{"id":"T1-08","hsk":"HSK1","topic":"Навчання","zh":"学汉语","py":"xué Hàn yǔ","uk":"Вивчаю китайську","s":[{"zh":"我叫安娜，我是乌克兰人。","py":"wǒ jiào Ān nà wǒ shì Wū kè lán rén","uk":"Мене звати Анна, я українка."},{"zh":"我在基辅学习汉语。","py":"wǒ zài Jī fǔ xué xí Hàn yǔ","uk":"Я вивчаю китайську в Києві."},{"zh":"我的汉语老师是中国人。","py":"wǒ de Hàn yǔ lǎo shī shì Zhōng guó rén","uk":"Моя вчителька китайської — китаянка."},{"zh":"她很好，我们都很喜欢她。","py":"tā hěn hǎo wǒ men dōu hěn xǐ huan tā","uk":"Вона дуже хороша, ми всі її любимо."},{"zh":"我会写一百个汉字。","py":"wǒ huì xiě yì bǎi gè Hàn zì","uk":"Я вмію писати сто ієрогліфів."},{"zh":"明年我想去中国。","py":"míng nián wǒ xiǎng qù Zhōng guó","uk":"Наступного року я хочу поїхати до Китаю."},{"zh":"我想看看北京，认识很多中国朋友。","py":"wǒ xiǎng kàn kan Běi jīng rèn shi hěn duō Zhōng guó péng you","uk":"Я хочу побачити Пекін і познайомитися з багатьма китайськими друзями."}],"q":[{"q":"Звідки Анна?","o":["З України","З Китаю","З Пекіна"],"a":0},{"q":"Скільки ієрогліфів вона вміє писати?","o":["100","10","1000"],"a":0},{"q":"Що вона хоче зробити наступного року?","o":["Поїхати до Китаю","Купити комп'ютер","Стати вчителькою"],"a":0}],"en":{"topic":"Studies","uk":"Learning Chinese","s":[{"uk":"My name is Anna, I'm Ukrainian."},{"uk":"I'm learning Chinese in Kyiv."},{"uk":"My Chinese teacher is Chinese."},{"uk":"She's very good, we all love her."},{"uk":"I can write a hundred characters."},{"uk":"Next year I want to go to China."},{"uk":"I want to see Beijing and make lots of Chinese friends."}],"q":[{"q":"Where is Anna from?","o":["From Ukraine","From China","From Beijing"]},{"q":"How many characters can she write?"},{"q":"What does she want to do next year?","o":["Go to China","Buy a computer","Become a teacher"]}]}},{"id":"T2-01","hsk":"HSK2","topic":"Свято","zh":"我的生日","py":"wǒ de shēng rì","uk":"Мій день народження","s":[{"zh":"今天是我的生日，我十八岁了。","py":"jīn tiān shì wǒ de shēng rì wǒ shí bā suì le","uk":"Сьогодні мій день народження, мені виповнилося вісімнадцять."},{"zh":"早上，妈妈给我做了面条。","py":"zǎo shang mā ma gěi wǒ zuò le miàn tiáo","uk":"Зранку мама приготувала мені локшину."},{"zh":"她说，生日吃面条，身体会很好。","py":"tā shuō shēng rì chī miàn tiáo shēn tǐ huì hěn hǎo","uk":"Вона каже: якщо на день народження їсти локшину, будеш здоровим."},{"zh":"下午，朋友们来我家，送给我一块手表。","py":"xià wǔ péng you men lái wǒ jiā sòng gěi wǒ yí kuài shǒu biǎo","uk":"По обіді до мене прийшли друзі й подарували годинник."},{"zh":"这块手表是红色的，非常漂亮。","py":"zhè kuài shǒu biǎo shì hóng sè de fēi cháng piào liang","uk":"Годинник червоний і дуже гарний."},{"zh":"晚上，我们一起去唱歌、跳舞。","py":"wǎn shang wǒ men yì qǐ qù chàng gē tiào wǔ","uk":"Увечері ми разом пішли співати й танцювати."},{"zh":"我们玩得很快乐。","py":"wǒ men wán de hěn kuài lè","uk":"Ми чудово розважилися."},{"zh":"这是我最高兴的一天。","py":"zhè shì wǒ zuì gāo xìng de yì tiān","uk":"Це був мій найщасливіший день."}],"q":[{"q":"Скільки мені виповнилося?","o":["18","17","20"],"a":0},{"q":"Що мама приготувала зранку?","o":["Локшину","Рис","Торт"],"a":0},{"q":"Що подарували друзі?","o":["Годинник","Книжку","Квіти"],"a":0}],"en":{"topic":"Celebration","uk":"My birthday","s"
