<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asianish Chinese</title>
<meta name="description" content="Кабінет китайської мови Asianish School: картки, вправи, граматика, прогрес і рейтинг.">
<meta name="theme-color" content="#23483F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2323483F%22/%3E%3Ctext x=%2232%22 y=%2245%22 font-size=%2236%22 text-anchor=%22middle%22 fill=%22%23C9A15D%22 font-family=%22serif%22%3E中%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: jade header band with a gold seal; milk "ledger" paper below; cards only for things you can open or press. */
:root{
  --green:#23483F; --gold:#C9A15D; --milk:#F8F5EF; --ink:#2C2C2C;
  --bg:#F8F5EF; --surface:#FFFDF9; --surface2:#F0EBE1; --fg:#2C2C2C; --muted:#66706B; --line:#E4DCCD;
  --band:#23483F; --band-fg:#F8F5EF; --band-muted:#BFD0C9;
  --accent:#23483F; --accent-fg:#F8F5EF; --accent-soft:#E2ECE8;
  --gold-ink:#94702F; --gold-soft:#F4EAD6;
  --ok:#2F7A57; --ok-soft:#E1F0E7; --bad:#A4473A; --bad-soft:#F7E3DF;
  --silver:#9AA09D; --bronze:#B07A4E;
  --shadow:0 1px 2px rgba(35,72,63,.06),0 10px 28px rgba(35,72,63,.08);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111C19; --surface:#182723; --surface2:#20322D; --fg:#EFEAE0; --muted:#A1ABA5; --line:#2B403A;
  --band:#0D1714; --band-fg:#EFEAE0; --band-muted:#8FA49C;
  --accent:#C9A15D; --accent-fg:#15201D; --accent-soft:#2A3A2F;
  --gold-ink:#D9B878; --gold-soft:#332C1E;
  --ok:#72C397; --ok-soft:#1B3127; --bad:#E58D7F; --bad-soft:#3A2420;
  --silver:#BAC0BD; --bronze:#CF9763;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111C19; --surface:#182723; --surface2:#20322D; --fg:#EFEAE0; --muted:#A1ABA5; --line:#2B403A;
  --band:#0D1714; --band-fg:#EFEAE0; --band-muted:#8FA49C;
  --accent:#C9A15D; --accent-fg:#15201D; --accent-soft:#2A3A2F;
  --gold-ink:#D9B878; --gold-soft:#332C1E;
  --ok:#72C397; --ok-soft:#1B3127; --bad:#E58D7F; --bad-soft:#3A2420;
  --silver:#BAC0BD; --bronze:#CF9763;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,5vw,3.2rem)}
h2{font-size:1.75rem}
h3{font-size:1.3rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.han{font-family:var(--f-han)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.seal{width:34px;height:34px;display:grid;place-items:center;background:var(--gold);color:#23483F;border-radius:6px;font-family:var(--f-han);font-weight:700;font-size:20px;box-shadow:inset 0 0 0 2px rgba(35,72,63,.25)}
.wm{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.16em}
.wm b{color:var(--gold);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--band-muted);min-width:0;text-align:right}
.who strong{color:var(--band-fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.gold{background:var(--gold);color:#23483F}
.pill.soft{background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--gold-soft);color:var(--gold-ink)}

main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#22362F}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.iconbtn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--accent)}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn svg{width:20px;height:20px}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
.hero .sub{font-size:1.05rem;color:var(--muted);margin-top:6px}
.hero-stats{display:flex;gap:26px}
.hs b{display:block;font-family:var(--f-display);font-size:2.2rem;line-height:1;color:var(--accent)}
.hs span{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero-stats{gap:20px}}

/* class cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ccard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--gold);transform:translateY(-2px)}
.ccard h3{font-size:1.45rem}
.ccard .days{display:flex;gap:6px;flex-wrap:wrap}
.day{font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.ccard .meta{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.ccard .corner{position:absolute;top:16px;right:16px;font-family:var(--f-han);font-size:1.6rem;color:var(--gold);opacity:.55}
.ccard.add{border-style:dashed;box-shadow:none;background:transparent;align-items:flex-start;justify-content:center;color:var(--muted);min-height:150px}
.ccard.add b{color:var(--fg);font-size:1rem}

/* section head */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.crumb{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px}
.tile b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.tile.key{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tile.key span{color:inherit;opacity:.8}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.two>*{min-width:0}

/* progress bars */
.prog{display:flex;flex-direction:column;gap:12px}
.pr .lab{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:5px}
.pr .lab>span:first-child{min-width:0;overflow-wrap:anywhere}
.two>*,.prog,.pr{min-width:0}
.pr .lab>span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .m{background:var(--accent)}
.track .l{background:var(--gold);opacity:.6}

/* notes */
.note{border-radius:var(--r-sm);padding:14px 16px;background:var(--gold-soft);color:var(--fg);font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--accent-soft)}
.note.bad{background:var(--bad-soft)}
.note b{font-weight:700}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--gold-soft)}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.88rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:44px}
textarea.input{min-height:110px;resize:vertical;font-family:var(--f-body)}
.input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green)}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}

/* register */
.reg{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start;padding-top:12px}
.reg .big{font-family:var(--f-han);font-size:clamp(4rem,12vw,7rem);color:var(--gold);line-height:1}
@media (max-width:800px){.reg{grid-template-columns:1fr;gap:24px}}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip .c{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}

/* flashcard */
.flashwrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%}
.flash{perspective:1400px;cursor:pointer;border:0;background:none;padding:0;text-align:center;width:100%}
.flash .inner{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.is-flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:340px;justify-content:center;position:relative}
.face.back{transform:rotateY(180deg);justify-content:flex-start;padding-top:52px}
@media (max-width:480px){.wm{font-size:1rem;letter-spacing:.08em}.seal{width:30px;height:30px;font-size:17px}.face .lbl{max-width:calc(100% - 80px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.face .lbl{position:absolute;top:16px;left:16px}
.face .stage{position:absolute;top:18px;right:18px;display:flex;gap:5px}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.stage i.on{background:var(--gold);border-color:var(--gold)}
.face .hanzi{font-family:var(--f-han);font-size:clamp(3.4rem,13vw,5.4rem);font-weight:500;line-height:1.1;color:var(--fg)}
.face .py{font-size:1.35rem;color:var(--gold-ink);font-weight:600;letter-spacing:.02em}
.face .tap{font-size:.78rem;color:var(--muted)}
.face .uk{font-family:var(--f-display);font-size:2rem;font-weight:600;margin-top:18px}
.exbox{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.exbox .zh{font-family:var(--f-han);font-size:1.3rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cloze{width:100%;text-align:left;background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cloze .zh{font-family:var(--f-han);font-size:1.2rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--gold);text-align:center;color:var(--gold-ink)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.cardbtns{grid-template-columns:1fr 1fr}.cardbtns .btn:last-child{grid-column:1/-1}}
.counter{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}

/* exercises */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.excard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--fg)}
.excard:hover{border-color:var(--gold)}
.excard .glyph{font-family:var(--f-han);font-size:1.8rem;color:var(--gold-ink);line-height:1}
.excard b{font-size:1.02rem}
.excard[disabled]{opacity:.5;cursor:not-allowed}
.excat{display:flex;flex-direction:column;gap:12px}
.freebar{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);text-decoration:none}
.freebar:hover{border-color:var(--gold)}.fb-ic{display:grid;place-items:center;width:48px;height:40px;border-radius:10px;background:var(--surface2);flex:none}
.fb-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.fb-go{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--gold-ink);white-space:nowrap}
@media (max-width:560px){.fb-go{display:none}}
.hdr-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pomo{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:8px 10px 10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.pomo.run{border-color:var(--gold)}.pomo.ph-short,.pomo.ph-long{background:var(--accent-soft)}
.pomo-h{font-family:var(--f-han);font-size:1.5rem;color:var(--gold-ink);line-height:1}
.pomo-m{display:flex;flex-direction:column;min-width:74px}.pomo-t{font-size:1.35rem;font-weight:700;color:var(--accent);line-height:1.1}.pomo-s{color:var(--muted);white-space:nowrap}
.pomo .iconbtn{width:34px;height:34px;font-size:.85rem}
.pomo-p{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 6px;font:inherit;font-size:.8rem;color:var(--fg)}
.pomo-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);transition:width 1s linear}
@media (max-width:560px){.hdr-r{width:100%;flex-direction:column;align-items:stretch}.pomo{width:100%;flex:none}.pomo-m{flex:1}}
.pomo{flex:none}
.skwrap{align-items:stretch}
.radar{width:100%;max-width:300px}.radar .rg{fill:none;stroke:var(--line);stroke-width:1}.radar .rc{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:2}
.radar .rp{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 3}.radar .rl{font-family:var(--f-han);font-size:15px;fill:var(--gold-ink)}
.skills{display:flex;flex-direction:column;gap:14px}.skrow{display:flex;gap:12px;align-items:center}.skh{font-family:var(--f-han);font-size:1.5rem;color:var(--gold-ink);width:1.6em;text-align:center}
.skmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.skbar{height:9px;border-radius:999px;background:var(--surface2);overflow:hidden}.skbar i{display:block;height:100%;border-radius:999px}
.spark{width:90px;height:26px;flex:none}.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round}
.delta{font-weight:700;font-size:.8rem}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.fbk p{margin-top:6px;white-space:pre-wrap;line-height:1.6}
.goals{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}.goals li{display:flex;gap:10px;align-items:center}.goals li.done{color:var(--muted);text-decoration:line-through}
.goals.edit li{justify-content:space-between}.goals li>span{color:var(--ok);width:1.2em}
.skempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px}
.pe{display:flex;flex-direction:column;gap:18px}.perow{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.perow input[type=range]{width:100%;accent-color:var(--accent)}
.skdot{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:999px;border:2px solid var(--c);font-weight:700}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.ptile .v{font-family:var(--f-num,var(--f-ui));font-size:1.7rem;font-weight:600;color:var(--accent)}
.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface2);margin-top:8px}.pbar.big{height:16px}.pbar i{display:block;height:100%}
.plegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}.plegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.actgrid{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:12px}.actgrid span{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.actgrid .a1{background:color-mix(in srgb,var(--ok) 35%,transparent)}.actgrid .a2{background:color-mix(in srgb,var(--ok) 65%,transparent)}.actgrid .a3{background:var(--ok)}
.plesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.plesson summary{cursor:pointer;list-style:none}.plesson summary::-webkit-details-marker{display:none}
.plesson[open]{border-color:var(--gold)}.plesson[open] .pwords{margin:14px 0 10px}
.pl-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pl-pct{font-size:1.3rem;font-weight:700;color:var(--accent)}
.pwords{display:flex;flex-wrap:wrap;gap:8px}
.pw{display:inline-flex;flex-direction:column;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);max-width:200px}
.pw .zh{font-size:1.15rem}.pw small{color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw.m{background:var(--ok-soft);border-color:var(--ok)}.pw.l{background:var(--gold-soft);border-color:var(--gold)}.pw.hard{background:var(--bad-soft);border-color:var(--bad)}
.ptable td,.ptable th{white-space:nowrap}
.pcell{display:inline-block;min-width:46px;padding:3px 6px;border-radius:6px;background:linear-gradient(90deg,var(--ok-soft) var(--p),transparent var(--p));border:1px solid var(--line)}
.exsrc .seg button[disabled]{opacity:.45}
.opt.sopt{font-family:var(--f-han);font-size:1.1rem;font-weight:500;text-align:left;line-height:1.5}
.opt.missed{border-color:var(--gold);border-style:dashed}
.hints{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.hint{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px}
.hint .zh{font-size:1.15rem}
.hearts{color:var(--bad);font-size:1.4rem;letter-spacing:4px}
.doors{display:flex;gap:10px;font-size:1.5rem}.doors .cur{filter:drop-shadow(0 0 4px var(--gold))}
.duelbar{display:flex;gap:10px}.duelbar>span{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}.duelbar .on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.wchip.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.wchip.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}.wchip.on{background:var(--gold-soft);border-color:var(--gold)}
.ctxtext{font-size:1.3rem;line-height:2.1}
.ctxtext .ctxuk{display:block;font-size:.85rem;line-height:1.4;margin:-4px 0 6px}
.blankbtn{font-family:var(--f-han);font-size:1.2rem;min-width:3em;padding:0 8px;border:0;border-bottom:2px solid var(--gold);background:var(--gold-soft);border-radius:6px 6px 0 0;cursor:pointer;color:var(--fg)}
.blankbtn.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.blankbtn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.recall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);text-align:center}.rcard .zh{font-size:1.6rem}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.gbox{border:1px dashed var(--line);border-radius:var(--r);padding:12px;min-height:110px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface)}.gbox:hover{border-color:var(--gold)}
.airesp{display:flex;flex-direction:column;gap:10px}
.story{display:flex;flex-direction:column;gap:12px}.sline{display:flex;gap:10px;align-items:flex-start}.sline .zh{font-size:1.25rem;line-height:1.7}
.story mark{background:var(--gold-soft);color:inherit;border-radius:4px;padding:0 2px}
.simlog{display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.bub.npc{align-self:flex-start;border-top-left-radius:4px}.bub.me{align-self:flex-end;background:var(--accent-soft);border-top-right-radius:4px}
.bub .zh{font-size:1.15rem;line-height:1.6}.bub .fb{margin-top:6px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.quiz{max-width:620px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.qprompt{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.qprompt .hanzi{font-family:var(--f-han);font-size:clamp(2.8rem,10vw,4.2rem);font-weight:500;line-height:1.15}
.qprompt .sent{font-family:var(--f-han);font-size:1.5rem;line-height:1.6}
.qprompt .py{font-size:1.4rem;color:var(--gold-ink);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{padding:14px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:left;min-height:52px;color:var(--fg)}
.opt.h{font-family:var(--f-han);font-size:1.35rem;font-weight:500;text-align:center}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.qbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.opt.done{opacity:.45;background:var(--ok-soft);border-color:var(--ok)}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:30px 20px}
.result .score{font-family:var(--f-display);font-size:4rem;line-height:1;color:var(--accent)}

/* rank */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.pod{border-radius:var(--r);padding:16px 12px;text-align:center;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.pod .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:#fff}
.pod.p1{order:2;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);padding-top:26px}
.pod.p2{order:1}.pod.p3{order:3}
.p1 .medal{background:linear-gradient(135deg,#E2C383,#B98E44)}
.p2 .medal{background:linear-gradient(135deg,#D2D6D4,#8E9592)}
.p3 .medal{background:linear-gradient(135deg,#D7A479,#9C6A3F)}
.pod .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod .pts{font-family:var(--f-display);font-size:1.8rem;line-height:1}
.mk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:.8rem}
.mk.g{background:var(--gold);color:#23483F}.mk.s{background:var(--silver);color:#fff}.mk.b{background:var(--bronze);color:#fff}
.ptsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ptscard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.ptscard .ph{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:600;font-size:1.0625rem}
.ptscard .ph .han{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);font-size:1rem}
.ptscard ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ptscard li{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.ptscard li>span:last-child{display:flex;flex-direction:column;gap:2px}
.ptscard .pts{font-family:var(--f-ui);font-weight:700;font-size:1.05rem;color:var(--accent);background:var(--accent-soft);border-radius:8px;text-align:center;padding:3px 0;font-variant-numeric:lining-nums tabular-nums}
.mypts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mypts>div{background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column}
.mypts b{font-family:var(--f-ui);font-weight:500;font-size:1.6rem;line-height:1.1;color:var(--accent)}
.mypts span{font-size:.8125rem;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;font-size:.88rem}
.rules div{background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px}
.rules b{font-family:var(--f-display);font-size:1.4rem;color:var(--gold-ink);margin-right:4px}

/* editor */
.ed-table td{padding:6px;vertical-align:top;white-space:normal}
.ed-table .input{min-height:38px;padding:7px 9px;font-size:.9rem}
.ed-table .h{font-family:var(--f-han);font-size:1.05rem;width:90px}
.ed-table td:nth-child(2) .input{width:120px}
.ed-table td:nth-child(3) .input{width:150px}
.ed-table td:nth-child(4) .input{width:220px}
.ed-table td:nth-child(5) .input{width:200px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:40;background:rgba(17,28,25,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none!important}
.mbox{background:var(--bg);border-radius:var(--r);padding:24px;width:min(480px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty .han{font-size:2.6rem;color:var(--gold)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.loading .han{font-size:3rem;color:var(--gold);display:block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* mode switch + levels */
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button .han{margin-right:6px}
.levels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.levels .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:4px}
.lvl{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:800;letter-spacing:.04em;cursor:pointer;color:var(--fg);font-size:.85rem}
.lvl[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22362F}
.lvl small{font-weight:600;opacity:.7;margin-left:4px;letter-spacing:0}

/* examples on cards */
.exlist{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.exitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.exitem .zh{font-family:var(--f-han);font-size:1.15rem;line-height:1.45}
.exitem .py{font-size:.82rem;color:var(--gold-ink);grid-column:1}
.exitem .tr{font-size:.86rem;color:var(--muted);grid-column:1}
.exitem .iconbtn{grid-row:1/span 3;grid-column:2;width:34px;height:34px}
.exitem .iconbtn svg{width:16px;height:16px}

/* grammar */
.glist{display:flex;flex-direction:column;gap:22px}
.gles h3{font-size:1.15rem;margin-bottom:10px;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.02em}
.gitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gitem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.gitem:hover{border-color:var(--gold)}
.gitem .f{font-family:var(--f-han);font-size:1.05rem;color:var(--gold-ink)}
.gitem b{font-size:1rem}
.gitem .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:4px}
.gpage{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px}
.gpage .gtext{line-height:1.7;max-width:65ch}
.gpage .gtext b{color:var(--accent)}
.formula{font-family:var(--f-han);font-size:1.2rem;background:var(--accent-soft);color:var(--fg);border-radius:var(--r-sm);padding:14px 18px;text-align:center;line-height:1.6}
.formula .plus{color:var(--gold-ink);margin:0 6px}
.gexamples{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.gtable{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.gtable td{white-space:normal}
.gtable td:first-child{font-family:var(--f-han)}
.mistake{display:grid;gap:6px;background:var(--surface2);border-radius:var(--r-sm);padding:12px 16px}
.mistake div{display:flex;gap:10px;align-items:baseline}
.mistake .zh{font-family:var(--f-han);font-size:1.1rem}
.mistake .x{color:var(--bad);font-weight:800}.mistake .v{color:var(--ok);font-weight:800}
.gq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.gq .qn{font-size:.75rem;font-weight:800;letter-spacing:.1em;color:var(--gold-ink);text-transform:uppercase}
.gq .qt{font-size:1rem;font-weight:600}
.gq .qt .han,.gq .qzh{font-family:var(--f-han);font-size:1.25rem;font-weight:500}
.gq .why{font-size:.88rem;color:var(--muted)}
.built{min-height:52px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{font-family:var(--f-han);font-size:1.15rem;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
.wchip[disabled]{opacity:.3;cursor:default}
.built .wchip{background:var(--gold-soft);border-color:var(--gold)}

/* word editor */
.wedit{display:flex;flex-direction:column;gap:12px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;grid-template-columns:110px 1fr 1fr auto;gap:8px;align-items:start}
.wrow .exs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wrow .exs>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.wrow .input{min-height:38px;padding:7px 9px;font-size:.9rem}
.wrow .h{font-family:var(--f-han);font-size:1.1rem}
@media (max-width:760px){.wrow{grid-template-columns:1fr 1fr}.wrow .h{grid-column:1/-1}.wrow .exs{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.markup{display:flex;flex-direction:column;gap:6px;line-height:1.5}
.markup code,.panel code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82em;background:var(--gold-soft);color:var(--gold-ink);padding:1px 6px;border-radius:5px;font-weight:700}
.gex{gap:10px}
.opts-edit{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts-edit legend{grid-column:1/-1;margin-bottom:4px}
.optrow{display:flex;align-items:center;gap:8px;min-width:0}
.optrow input[type=radio]{width:20px;height:20px;flex:none;accent-color:var(--green,#23483F)}
.optrow .input{flex:1;min-width:0}
@media (max-width:620px){.opts-edit{grid-template-columns:1fr}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.12em;background:var(--gold-soft);color:var(--gold-ink);padding:3px 8px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Figures: lining, equal-width digits everywhere (display serif defaults to old-style figures that bounce) */
h1,h2,h3,.num,.code,table td.n,table th.n{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.hs b,.tile b,.result .score,.pod .pts{font-family:var(--f-body);font-weight:700;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.tab.special{color:var(--gold-ink)}
.tab.special::before{content:"罐 ";font-family:var(--f-han)}
.tab.special[aria-selected="true"]{color:var(--fg);background:var(--gold-soft);border-radius:10px 10px 0 0}
.wlist{display:flex;flex-direction:column;gap:8px}
.wl{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.wl .h{font-family:var(--f-han);font-size:1.45rem;line-height:1.2}
.wl .m{min-width:0;display:flex;flex-direction:column}
.wl .m .py{color:var(--gold-ink);font-size:.9rem}
.wl .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bankbar{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.dictbtn{align-self:flex-start;margin-top:4px}
.wl.dict .dex{font-size:.875rem;margin-top:2px}
.wl.dict .dex .han{font-size:1rem}
#bank-results,#dict-results{display:flex;flex-direction:column;gap:10px}
.cardextra{display:flex;justify-content:center}
@media (max-width:520px){.wl{grid-template-columns:auto 1fr}.wl .acts{grid-column:1/-1;justify-content:flex-start}}
/* ===== Typography system (Asianish brand)
   H1 Cormorant Garamond Medium 48–60 · H2 page title Cormorant Medium 36–44 · H3 section Manrope SemiBold 22–26
   subtitle Manrope Medium 17–20 · body Inter 15–17 · keywords & buttons Manrope SemiBold · meta Inter 12–13 · big numbers Manrope Medium 32–40 */
body{font-family:var(--f-body);font-size:16px;font-weight:400;line-height:1.6}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.4rem,4.6vw,3.75rem);line-height:1.05;letter-spacing:0}
h1.pt,.reg h1{font-size:clamp(2.1rem,3.8vw,2.75rem)}
h2,h3{font-family:var(--f-ui);font-weight:600;letter-spacing:-.01em;line-height:1.25}
h2{font-size:clamp(1.3rem,2.2vw,1.625rem)}
h3{font-size:clamp(1.2rem,1.9vw,1.375rem)}
.ccard h3{font-size:clamp(1.2rem,1.9vw,1.375rem)}
.hero .sub,.sub{font-family:var(--f-ui);font-weight:500;font-size:clamp(1.0625rem,1.6vw,1.25rem)}
b,strong{font-family:var(--f-ui);font-weight:600}
.han b,.hanzi b{font-family:inherit}
.btn,.tab,.chip,.pill,.opt,.seg button,.lvl,.link,.field label,.check,th,.code{font-family:var(--f-ui)}
.btn{font-weight:600;font-size:1rem}
.btn.sm{font-size:.875rem}
.tab{font-size:1rem}
.small,.hint,.crumb,.tile span,.hs span,.meta,.counter,.why,.ccard .meta{font-family:var(--f-body);font-weight:400;font-size:.8125rem}
.eyebrow{font-family:var(--f-body);font-size:.75rem;font-weight:600}
.note{font-size:.9375rem}
.input,select.input,textarea.input{font-family:var(--f-body);font-size:1rem}
.hs b,.tile b,.result .score,.pod .pts{font-family:var(--f-ui);font-weight:500;letter-spacing:-.02em;font-size:clamp(2rem,3vw,2.5rem);line-height:1}
.han,.hanzi,.zh,.opt.h,.wl .h,.glyph,.corner,.seal,.big{font-family:var(--f-han)}
@media (max-width:520px){h1{font-size:2.25rem}h1.pt,.reg h1{font-size:2rem}}
.deckrow{display:flex;flex-direction:column;gap:8px}
.deckrow+.deckrow{padding-top:12px;border-top:1px dashed var(--line)}
.deckrow .lbl{font-family:var(--f-body);font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:12px;min-width:0}
.hub{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(201,161,93,.6);color:var(--gold);text-decoration:none;font-family:var(--f-ui);font-weight:600;font-size:.875rem;white-space:nowrap;transition:background .15s,color .15s}
.hub:hover{background:var(--gold);color:#23483F}
.hub-short{display:none}
@media (max-width:560px){.hub-full{display:none}.hub-short{display:inline}.hub{padding:6px 10px}}
.foot{margin-top:56px;border-top:1px solid var(--line);background:var(--surface2)}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px))}
.foot-brand{font-family:var(--f-display);font-weight:500;font-size:1.25rem}
.foot-links{display:flex;flex-wrap:wrap;gap:8px 20px}
.foot-links a{display:inline-flex;align-items:center;gap:7px;color:var(--fg);text-decoration:none;font-family:var(--f-ui);font-weight:600;font-size:.9375rem}
.foot-links a:hover{color:var(--gold-ink)}
.foot-links svg{color:var(--gold-ink)}
@media (max-width:560px){.wm{white-space:nowrap}.who>span>span{display:none}.who strong{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}}
@media (max-width:430px){.wm{display:none}}

.logo-plate{display:inline-flex;align-items:center;background:#F8F5EF;border-radius:10px;padding:5px 10px;box-shadow:inset 0 0 0 1px rgba(201,161,93,.45);padding:4px 10px}
.logo-plate .logo-img{height:42px}
.foot-logo{height:46px}
.schoolbar{background:#1A3630;color:var(--gold);font-family:var(--f-ui);font-weight:600;font-size:.8125rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px 0;padding-top:calc(6px + env(safe-area-inset-top,0px))}
@media (max-width:560px){.logo-plate .logo-img{height:28px}.logo-plate{padding:4px 8px}}
/* ---- awards */
.medal-b{--c1:#E8C887;--c2:#B07A4E;position:relative;display:grid;place-items:center;width:58px;height:58px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8 0 18%,transparent 40%),conic-gradient(from 210deg,var(--c1),var(--c2),var(--c1),var(--c2),var(--c1));box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c2),0 6px 14px rgba(0,0,0,.12)}
.medal-b .han{font-size:1.65rem;font-weight:500;color:#2C2C2C;text-shadow:0 1px 0 #fff6;position:relative}
.medal-b::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(44,44,44,.25)}
.medal-b.bronze{--c1:#E2B48A;--c2:#A86A3E}
.medal-b.silver{--c1:#F1F2F0;--c2:#9AA09D}
.medal-b.gold{--c1:#F4DC9A;--c2:#C9A15D}
.medal-b.jade{--c1:#9FD6BE;--c2:#2F7A57}
.medal-b.jade .han{color:#0F2A22}
.medal-b.locked{--c1:var(--surface2);--c2:var(--line);filter:grayscale(1);opacity:.75}
.medal-b.locked .han{color:var(--muted)}
.medal-b.xl{width:120px;height:120px;margin:6px auto}
.medal-b.xl .han{font-size:3.4rem}
.achhead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start;background:linear-gradient(135deg,var(--gold-soft),var(--surface));border:1px solid var(--gold);border-radius:var(--r);padding:20px}
.achhead>div{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.achbar{display:block;height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;width:100%}
.achbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:inherit}
.achbar.big{height:10px;max-width:520px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ach{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.ach.open{border-color:var(--gold);background:linear-gradient(180deg,var(--surface),var(--gold-soft))}
.ach.open.jade{border-color:var(--ok)}
.ach.locked .ach-t b{color:var(--muted)}
.ach-t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ach-zh{font-size:.9rem;color:var(--gold-ink)}
.ach-zh.big{font-size:1.6rem;letter-spacing:.08em}
.ach-date{color:var(--ok);font-weight:600}
.cat-h{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);font-size:1rem;vertical-align:middle;margin-right:4px}
.tilebtn{text-align:left;cursor:pointer;font:inherit;color:inherit;border:1px solid var(--gold)!important;background:var(--gold-soft)!important}
.tilebtn small{font-size:1rem}
.achbox{text-align:center;position:relative;overflow:hidden;max-width:420px;align-items:center}
.achbox h2{font-family:var(--f-display);font-weight:500;font-size:2.2rem}
.achbox .medal-b{animation:medalIn .9s cubic-bezier(.2,1.4,.4,1) both}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:fall 2.6s ease-in forwards}
@keyframes medalIn{0%{transform:scale(.2) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(520px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.achbox .medal-b,.confetti i{animation:none}.confetti{display:none}}
.mat{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.mat-ic{font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;background:var(--gold-soft);border-radius:10px}
.mat-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.mat-t a{color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
.mat-t a:hover{color:var(--gold-ink)}
.mat .acts{display:flex;gap:6px;align-items:center}
@media (max-width:520px){.mat{grid-template-columns:auto 1fr}.mat .acts{grid-column:1/-1}}
.matfolders{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mfold{display:inline-flex;align-items:center;gap:8px;flex:none;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-ui);font-weight:600;font-size:.9375rem;color:var(--fg);cursor:pointer}
.mfold .c{font-weight:500;color:var(--muted);font-size:.8125rem}
.mfold[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mfold[aria-selected="true"] .c{color:var(--accent-fg);opacity:.75}
.mf-ic{font-size:1.1rem}
.mo{display:flex;flex-direction:column;gap:12px}
.molist{display:flex;flex-direction:column;gap:10px}
.moitem{border-left:3px solid var(--gold);padding:8px 12px;background:color-mix(in srgb,var(--gold) 7%,transparent);border-radius:0 10px 10px 0}
.moitem p{margin:6px 0 0;white-space:pre-wrap;line-height:1.55}
.moitem.new{border-left-color:var(--accent)}
.gsw{align-self:flex-start}
.dles{display:flex;flex-direction:column;gap:14px}
.dl{display:flex;flex-direction:column;gap:12px}
.dl h3{margin:2px 0 0;font-size:1.05rem}
.dtopics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.dtopic{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);color:inherit;cursor:pointer;font:inherit}
.dtopic:hover{border-color:var(--gold)}
.dtopic .f{font-family:var(--f-han,inherit);color:var(--gold-ink);font-size:.9rem}
.exbar{display:flex;align-items:center;gap:12px}
.exprog{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.exprog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .25s}
.dq{gap:12px}
.dmiss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}
.stuhead{display:flex;gap:16px 24px;align-items:flex-start;justify-content:space-between}
.stuname{min-width:0;flex:1 1 280px}

<script>
// =====================================================================
// ASIANISH — підключення до бази (Supabase) і вхід.
// Тут лише публічні адреса й ключ: дані захищають правила доступу в базі.
// =====================================================================
(() => {
  const SB_URL = "https://nrqhfgudrxsojqgqcpnc.supabase.co";
  const SB_KEY = "sb_publishable_BDb_uIFhH_AdfrXZuGK6sw_AmrrDgK_";
  const SITE = location.origin + location.pathname.replace(/index\.html$/, "");
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let readyResolve; window.ASIANISH_READY = new Promise(r => readyResolve = r);
  if (!window.supabase || !window.supabase.createClient){
    $("#app").innerHTML = `<div class="loading"><span class="han">网</span>Не вдалося завантажити платформу. Перевірте інтернет і оновіть сторінку.</div>`;
    return;
  }
  const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce"}});
  window.ASIANISH_SB = sb;

  // ---------- маленька «база документів» поверх таблиць Supabase ----------
  const TABLES = new Set(["settings","teachers","classes","lessons","grammar","cvocab","students","progress","staff","materials"]);
  const err = (e, code) => Object.assign(new Error(e?.message || String(e)), {code: code || e?.code || "error", cause: e});
  const split = path => { const i = path.indexOf("/"); const t = path.slice(0, i), id = path.slice(i + 1); if (!TABLES.has(t) || !id) throw err("bad path " + path, "invalid"); return [t, id]; };
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const cache = {};
  function emit(c){ if (c.timer) return; c.timer = setTimeout(() => { c.timer = 0; c.ls.forEach(l => l.fire()); }, 0); }
  async function fetchRow(t, id){
    const {data, error} = await sb.from(t).select("id,data").eq("id", id).maybeSingle();
    if (error) throw err(error); return data;
  }
  function watch(t){
    if (cache[t]) return cache[t];
    const c = cache[t] = {rows: new Map(), ls: new Set(), ready: false, error: null, timer: 0};
    c.ch = sb.channel("tbl-" + t).on("postgres_changes", {event: "*", schema: "public", table: t}, async p => {
      try {
        if (p.eventType === "DELETE"){ const id = p.old?.id; if (id != null) c.rows.delete(id); }
        else { const id = p.new?.id; if (id == null) return; const row = await fetchRow(t, id); if (row) c.rows.set(row.id, row.data); else c.rows.delete(id); }
        if (c.ready) emit(c);
      } catch(e){}
    }).subscribe();
    (async () => {
      try {
        for (let from = 0; ; from += 1000){
          const {data, error} = await sb.from(t).select("id,data").order("id").range(from, from + 999);
          if (error) throw err(error);
          data.forEach(r => c.rows.set(r.id, r.data));
          if (data.length < 1000) break;
        }
        c.ready = true; emit(c);
      } catch(e){ c.error = e; c.ls.forEach(l => l.fail && l.fail(e)); }
    })();
    return c;
  }
  const docSnap = (id, d) => ({id, exists: d !== undefined, data: () => clone(d)});
  const db = {
    collection(t){
      if (!TABLES.has(t)) throw err("bad collection " + t, "invalid");
      return {
        onSnapshot(cb, fail){
          const c = watch(t), l = {fail, fire: () => cb({docs: [...c.rows].map(([id, d]) => docSnap(id, d)), size: c.rows.size})};
          c.ls.add(l); if (c.ready) l.fire(); else if (c.error && fail) fail(c.error);
          return () => c.ls.delete(l);
        },
        async get(){ const {data, error} = await sb.from(t).select("id,data"); if (error) throw err(error); return {docs: data.map(r => docSnap(r.id, r.data))}; }
      };
    },
    doc(path){
      const [t, id] = split(path);
      return {
        id,
        async get(){ const r = await fetchRow(t, id); return docSnap(id, r ? r.data : undefined); },
        async set(body){
          const data = clone(body) || {};
          const {error} = await sb.from(t).upsert({id, data}, {onConflict: "id"});
          if (error) throw err(error, error.code === "42501" ? "permission_denied" : undefined);
          const c = cache[t]; if (c){ c.rows.set(id, data); if (c.ready) emit(c); }
        },
        async update(part){
          const r = await fetchRow(t, id); if (!r) throw err("not found", "not_found");
          await this.set({...r.data, ...clone(part)});
        },
        async delete(){
          const {error} = await sb.from(t).delete().eq("id", id);
          if (error) throw err(error);
          const c = cache[t]; if (c){ c.rows.delete(id); if (c.ready) emit(c); }
        },
        onSnapshot(cb, fail){
          const c = watch(t), l = {fail, fire: () => cb(docSnap(id, c.rows.get(id)))};
          c.ls.add(l); if (c.ready) l.fire(); else if (c.error && fail) fail(c.error);
          return () => c.ls.delete(l);
        }
      };
    }
  };


  // ---------- ролі викладачів (керує адміністраторка) ----------
  window.ASIANISH_FIND = async email => {
    const {data, error} = await sb.from("staff").select("id").eq("data->>email", String(email).toLowerCase()).limit(1);
    if (error) throw err(error); return data?.[0]?.id || "";
  };
  window.ASIANISH_ROLE = async (uid, role) => {
    const {data: cur} = await sb.from("roles").select("role").eq("user_id", uid).maybeSingle();
    if (cur?.role === "admin") return;
    const {error} = role ? await sb.from("roles").upsert({user_id: uid, role}, {onConflict: "user_id"}) : await sb.from("roles").delete().eq("user_id", uid);
    if (error) throw err(error);
  };
  window.ASIANISH_IMPORT_HTML = () => `<div class="form panel" style="max-width:640px">
      <h2>Перенесення даних</h2>
      <p class="small muted">Оберіть файл, який підготував ШІ: уроки, граматика, групи, викладачі або нові вправи. Файли з доповненнями (наприклад, вправи на граматику) лише додають нове і нічого не перезаписують.</p>
      <input class="input" type="file" id="import-file" accept=".json,application/json">
      <div id="import-msg" class="note" hidden role="status"></div>
    </div>`;


  // ---------- ШІ-помічник: серверна функція "ai" (ключ — лише на сервері) ----------
  async function imgToB64(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return {mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1]};
    } finally { URL.revokeObjectURL(url); }
  }
  const sample = {
    async json(prompt, opts = {}){
      let images = [];
      try { images = await Promise.all((opts.images || []).slice(0, 3).map(imgToB64)); } catch(e){ throw {code: "image_rejected"}; }
      const {data, error} = await sb.functions.invoke("ai", {body: {prompt, images, quick: opts.modelTier === "quick"}});
      if (error){
        let st = error.context?.status, body = null;
        try { body = await error.context?.json(); } catch(e){}
        if (st === 429 || body?.error === "rate_limited") throw {code: "rate_limited"};
        if (body?.error === "no_key" || st === 404) throw {code: "not_granted"};
        throw {code: "error", detail: body};
      }
      if (data?.error === "invalid_json") throw {code: "invalid_json"};
      if (data?.error) throw {code: data.error === "rate_limited" ? "rate_limited" : "error"};
      return data?.result;
    }
  };

  // ---------- вхід ----------
  let ME = null;
  async function startApp(session){
    const u = session.user;
    let role = "student";
    try { const {data} = await sb.from("roles").select("role").eq("user_id", u.id).maybeSingle(); if (data?.role) role = data.role; } catch(e){}
    ME = {id: u.id, email: u.email || "", name: u.user_metadata?.full_name || u.user_metadata?.name || "", role};
    window.ASIANISH_ME = ME;
    const user = {
      isOwner: async () => role === "admin",
      canEdit: async () => role === "admin" || role === "teacher",
      id: async () => u.id,
      async profiles(ids){
        const out = {};
        try {
          const {data} = await sb.from("staff").select("id,data").in("id", ids);
          (data || []).forEach(r => out[r.id] = {name: r.data?.name || r.data?.email || ""});
        } catch(e){}
        return out;
      }
    };
    const downloads = {
      async save({filename, data, mimeType}){
        const blob = data instanceof Blob ? data : new Blob([data], {type: mimeType || (/\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : "text/plain;charset=utf-8")});
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename || "file";
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      }
    };
    window.asianishRuntime = {use: async name => name === "db" ? db : name === "user" ? user : name === "downloads" ? downloads : name === "sample" ? sample : null};
    showAccount();
    window.ASIANISH_STARTED = true;
    readyResolve();
  }
  function showAccount(){
    const nav = $(".foot-links"); if (!nav || $("#acct")) return;
    const span = document.createElement("span"); span.id = "acct"; span.className = "acct";
    span.innerHTML = `<span class="small">${esc(ME.email)}</span><button type="button" class="link" id="logout">Вийти</button>`;
    nav.appendChild(span);
    $("#logout").addEventListener("click", async () => { try { await sb.auth.signOut(); } catch(e){} location.href = SITE; });
  }

  let mode = "in", busy = false, msg = "", msgOk = false;
  function loginView(){
    const google = `<button type="button" class="btn gbtn" id="lg-google" ${busy ? "disabled" : ""}><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Увійти через Google</button>`;
    const title = {in: "Вхід", up: "Реєстрація", reset: "Відновлення пароля", newpass: "Новий пароль"}[mode];
    const form = mode === "newpass"
      ? `<div class="field"><label for="lg-pass">Новий пароль</label><input class="input" id="lg-pass" type="password" minlength="6" autocomplete="new-password" required></div>
         <button class="btn primary" type="submit" ${busy ? "disabled" : ""}>Зберегти пароль</button>`
      : `<div class="field"><label for="lg-email">Пошта</label><input class="input" id="lg-email" type="email" autocomplete="email" required placeholder="name@gmail.com"></div>
         ${mode !== "reset" ? `<div class="field"><label for="lg-pass">Пароль</label><input class="input" id="lg-pass" type="password" minlength="6" autocomplete="${mode === "up" ? "new-password" : "current-password"}" required placeholder="щонайменше 6 символів"></div>` : ""}
         <button class="btn primary" type="submit" ${busy ? "disabled" : ""}>${mode === "in" ? "Увійти" : mode === "up" ? "Створити акаунт" : "Надіслати посилання"}</button>`;
    const links = mode === "in" ? `<button type="button" class="link" data-lg="up">Немає акаунта? Зареєструватися</button><button type="button" class="link" data-lg="reset">Забули пароль?</button>`
      : mode === "newpass" ? "" : `<button type="button" class="link" data-lg="in">← Повернутися до входу</button>`;
    $("#app").innerHTML = `<div class="reg">
      <div class="stack">
        <div class="big">你好</div>
        <div><div class="eyebrow">Asianish School</div><h1>Кабінет<br>китайської мови</h1></div>
        <p class="muted" style="max-width:44ch">Увійдіть через Google або пошту. Прогрес зберігається у вашому акаунті й доступний з будь-якого пристрою.</p>
      </div>
      <div class="form panel">
        <h2 style="margin:0">${title}</h2>
        ${mode === "in" || mode === "up" ? google + `<div class="or"><span>або</span></div>` : ""}
        <form class="form" id="lg-form" style="gap:12px">${form}</form>
        ${msg ? `<div class="note ${msgOk ? "info" : ""}" role="status"><span>${msgOk ? "✓" : "!"}</span><span>${esc(msg)}</span></div>` : ""}
        <div class="row" style="justify-content:space-between">${links}</div>
      </div>
    </div>`;
    $("#lg-google")?.addEventListener("click", google_);
    $("#lg-form").addEventListener("submit", submit);
    document.querySelectorAll("[data-lg]").forEach(b => b.addEventListener("click", () => { mode = b.dataset.lg; msg = ""; loginView(); }));
  }
  async function google_(){
    busy = true; loginView();
    const {error} = await sb.auth.signInWithOAuth({provider: "google", options: {redirectTo: SITE}});
    if (error){ busy = false; msg = "Не вдалося відкрити вхід через Google: " + error.message; msgOk = false; loginView(); }
    else setTimeout(() => { if (busy){ busy = false; loginView(); } }, 6000);
  }
  const UA = {
    "Invalid login credentials": "Неправильна пошта або пароль.",
    "User already registered": "Акаунт із цією поштою вже існує. Увійдіть або відновіть пароль.",
    "Email not confirmed": "Пошту ще не підтверджено. Перевірте лист у скриньці.",
    "Password should be at least 6 characters.": "Пароль має містити щонайменше 6 символів."
  };
  async function submit(e){
    e.preventDefault(); if (busy) return;
    const email = $("#lg-email")?.value.trim(), pass = $("#lg-pass")?.value || "";
    busy = true; msg = ""; loginView();
    let res;
    try {
      if (mode === "in") res = await sb.auth.signInWithPassword({email, password: pass});
      else if (mode === "up") res = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: SITE}});
      else if (mode === "reset") res = await sb.auth.resetPasswordForEmail(email, {redirectTo: SITE});
      else res = await sb.auth.updateUser({password: pass});
    } catch(x){ res = {error: x}; }
    busy = false;
    if (res.error){ msg = UA[res.error.message] || res.error.message; msgOk = false; loginView(); return; }
    if (mode === "reset"){ msg = "Якщо така пошта зареєстрована, на неї прийде лист із посиланням для нового пароля."; msgOk = true; loginView(); return; }
    if (mode === "newpass"){ location.href = SITE; return; }
    if (mode === "up" && !res.data?.session){ msg = "Акаунт створено. Підтвердьте пошту за посиланням у листі й увійдіть."; msgOk = true; mode = "in"; loginView(); return; }
    // сесію підхопить onAuthStateChange
  }

  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY"){ mode = "newpass"; msg = ""; loginView(); return; }
    if (event === "SIGNED_OUT"){ if (started) location.reload(); return; }
    if (session && !started && mode !== "newpass"){ started = true; setTimeout(() => startApp(session), 0); }
  });
  sb.auth.getSession().then(({data}) => {
    if (data?.session){ if (!started && mode !== "newpass"){ started = true; startApp(data.session); } }
    else if (!started) loginView();
  }).catch(() => loginView());

  // ---------- перенесення даних (лише адміністраторка) ----------
  const IMPORT_ORDER = ["settings", "teachers", "classes", "lessons", "grammar", "cvocab", "materials"];
  document.addEventListener("change", async e => {
    if (e.target.id !== "import-file") return;
    const f = e.target.files?.[0], out = $("#import-msg"); if (!f || !out) return;
    const say = (t, ok) => { out.hidden = false; out.className = "note " + (ok ? "info" : ""); out.innerHTML = `<span>${ok ? "✓" : "…"}</span><span>${esc(t)}</span>`; };
    try {
      const j = JSON.parse(await f.text()); const cols = j.collections || {};
      if (j.merge){
        // add fields (e.g. new grammar exercises) to existing records without touching anything else
        let done = 0; const total = Object.values(j.merge).reduce((a, m) => a + Object.keys(m).length, 0);
        for (const [c, recs] of Object.entries(j.merge)){
          const ids = Object.keys(recs);
          for (let i = 0; i < ids.length; i += 25){
            const part = ids.slice(i, i + 25);
            const {data: cur, error: e1} = await sb.from(c).select("id,data").in("id", part);
            if (e1) throw new Error(`${c}: ${e1.message}`);
            const have = new Map((cur || []).map(r => [r.id, r.data]));
            const rows = part.filter(id => have.has(id)).map(id => ({id, data: {...have.get(id), ...recs[id]}}));
            if (rows.length){ const {error} = await sb.from(c).upsert(rows, {onConflict: "id"}); if (error) throw new Error(`${c}: ${error.message}`); }
            done += part.length; say(`Додаю… ${done} з ${total}`);
          }
        }
        say(`Готово: оновлено ${total} записів (усе інше не змінено). Оновіть сторінку.`, true);
        e.target.value = ""; return;
      }
      let done = 0; const total = IMPORT_ORDER.reduce((a, c) => a + Object.keys(cols[c] || {}).length, 0);
      if (!total){ say("У файлі немає даних для перенесення.", false); return; }
      for (const c of IMPORT_ORDER){
        const rows = Object.entries(cols[c] || {}).map(([id, data]) => ({id, data}));
        for (let i = 0; i < rows.length; i += 25){
          const {error} = await sb.from(c).upsert(rows.slice(i, i + 25), {onConflict: "id"});
          if (error) throw new Error(`${c}: ${error.message}`);
          done += Math.min(25, rows.length - i); say(`Переношу… ${done} з ${total}`);
        }
      }
      say(`Готово: перенесено ${total} записів. Оновіть сторінку.`, true);
    } catch(x){ say("Не вдалося перенести: " + x.message + ". Перевірте, що ви увійшли як адміністраторка.", false); }
    e.target.value = "";
  });
})();

</script>
<script>
(() => {
"use strict";
// ---------- constants
const INT = [0, 1, 2, 4, 8, 16, 30];   // days to the next review after reaching stage N
const MASTER = 3;                        // stage at which a word counts as mastered
const HSK = ["HSK1","HSK2","HSK3","HSK4","HSK5","HSK6"];
// Points system — same for everyone. src: k = картки, e = вправи, g = граматика, b = бонуси
const PTS = {know: 2, again: 1, master: 10, correct: 2, perfect: 5, gram: 2, gramDone: 10, daily: 5};
const DAILY_GOAL = 10, PERFECT_MIN = 5;
const EX_TYPES = [
  {id:"pairs",   glyph:"配", name:"Пари",              desc:"З'єднайте ієрогліф із перекладом."},
  {id:"fill",    glyph:"填", name:"Заповніть пропуск", desc:"Оберіть слово, якого бракує в реченні."},
  {id:"quiz",    glyph:"选", name:"Тест: 4 варіанти",   desc:"Ієрогліф → правильний переклад."},
  {id:"listen",  glyph:"听", name:"Аудіювання",        desc:"Прослухайте й оберіть ієрогліф."},
  {id:"pinyin",  glyph:"拼", name:"Піньїнь та ієрогліфи", desc:"Зіставте запис піньїнем з ієрогліфом."},
  {id:"mistakes",glyph:"错", name:"Мої помилки",       desc:"Слова, у яких ви помилялися."}
];
const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// ---------- state
const S = {
  phase: "loading", db: null, user: null, sample: null, downloads: null,
  uid: null, isTeacher: false, role: "student", store: null, staff: {}, names: {}, gedit: null,
  settings: {}, classes: {}, lessons: {}, grammar: {}, students: {},
  loaded: {classes:false, lessons:false, settings:false, students:false, grammar:false, teachers:false, cvocab:false}, teachers: {}, cvocab: {}, materials: {}, matF: {who: "all", hsk: "", type: "", q: "", sort: "new"}, matNew: {type: ""}, assets: null, matUsage: null, bankQ: "", dict: {q: "", busy: false, res: [], err: ""},
  progs: {}, myProg: null, pedit: null, medit: null,
  me: null, view: {name:"home"}, mode: "vocab", level: null,
  cards: null, ex: null, edit: null, modal: null, gram: null, gmode: "rules", gdrill: null, gdrillBack: false,
  rank: {period:"all", scope:"all"}, libMode: "vocab"
};

// ---------- utils
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const code6 = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
const dstr = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dstr(d); };
const MONTHS = ["січ","лют","бер","квіт","трав","черв","лип","серп","вер","жовт","лист","груд"];
const fmtDate = s => { if (!s) return "—"; const d = new Date(s + "T12:00:00"); return d.getDate() + " " + MONTHS[d.getMonth()]; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; };
const lvIdx = h => Math.max(0, HSK.indexOf(h));
const lvName = h => String(h || "").replace("HSK", "HSK ");
const stripP = s => String(s || "").replace(/[\s，。！？、,.!?；;：:“”"'（）()…—-]/g, "");
function lsGet(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3400); }

// Pick the most natural Mandarin voice available on this device (neural/online voices first, old robotic desktop voices last).
let zhVoice = null;
function voiceScore(v){
  const n = (v.name || "") + " " + (v.voiceURI || ""), l = String(v.lang || "").replace("_", "-");
  if (!/^zh|^cmn/i.test(l) && !/普通话|國語|国语|Mandarin/i.test(n)) return -1;
  if (/HK|yue|Cantonese|粤|粵|Sin-?ji/i.test(l + " " + n)) return -1;
  let sc = /zh-CN|cmn-CN|cmn-Hans/i.test(l) ? 30 : /zh-TW|cmn-TW/i.test(l) ? 12 : 18;
  if (/Natural|Neural/i.test(n)) sc += 100;
  if (/Online/i.test(n)) sc += 40;
  if (/Xiaoxiao|Xiaoyi|Yunxi|Yunjian|Xiaochen|Xiaohan|Xiaomo/i.test(n)) sc += 25;
  if (/Google/i.test(n)) sc += 70;
  if (/Premium/i.test(n)) sc += 60; else if (/Enhanced|优化|增强/i.test(n)) sc += 45;
  if (/Tingting|Ting-Ting|Meijia|Mei-Jia|Lili|Yu-?shu|Lilian|Tian-?Tian/i.test(n)) sc += 30;
  if (/Huihui|Kangkang|Yaoyao|eSpeak|espeak/i.test(n)) sc -= 40;
  return Math.max(0, sc);
}
function pickZhVoice(){
  try { const vs = speechSynthesis.getVoices() || []; let best = null, bs = -1;
    for (const v of vs){ const sc = voiceScore(v); if (sc > bs){ bs = sc; best = v; } }
    if (best) zhVoice = best; } catch(e){}
}
function speak(text){
  try {
    if (!("speechSynthesis" in window)) throw 0;
    if (!zhVoice) pickZhVoice();
    const u = new SpeechSynthesisUtterance(text); u.lang = zhVoice?.lang || "zh-CN";
    u.rate = /Natural|Neural|Online|Google/i.test(zhVoice?.name || "") ? .9 : .82;
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){ toast("Озвучення недоступне в цьому браузері"); }
}
try { pickZhVoice(); speechSynthesis.addEventListener("voiceschanged", pickZhVoice); } catch(e){}
const speakBtn = (t, label) => `<button class="iconbtn" data-act="speak" data-say="${esc(t)}" aria-label="${label || "Озвучити"}">${ICON_SPEAK}</button>`;

// ---------- data helpers
const lessonsSorted = () => Object.values(S.lessons).sort((a, b) => lvIdx(a.hsk) - lvIdx(b.hsk) || (a.order || 0) - (b.order || 0));
const grammarSorted = () => Object.values(S.grammar).sort((a, b) => lvIdx(a.hsk) - lvIdx(b.hsk) || (a.order || 0) - (b.order || 0));
const classesSorted = () => Object.values(S.classes).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(b.name, "uk"));
const classOf = st => st && st.classId ? S.classes[st.classId] : null;
const courseOf = (st, cls) => cls?.course || (HSK.includes(st?.level) ? st.level : "HSK1");
const levelsUpTo = course => HSK.slice(0, lvIdx(course) + 1);
function availLessons(st, cls){
  const top = lvIdx(courseOf(st, cls));
  return lessonsSorted().filter(l => !l.hidden && lvIdx(l.hsk) <= top && !(cls?.closed || []).includes(l.id));
}
function availGrammar(st, cls){
  const top = lvIdx(courseOf(st, cls));
  return grammarSorted().filter(g => !g.hidden && lvIdx(g.hsk) <= top);
}
function exList(w){
  if (Array.isArray(w.ex)) return w.ex.filter(x => x && x.zh);
  if (typeof w.ex === "string" && w.ex) return [{zh: w.ex, py: "", uk: w.exuk || ""}];
  return [];
}
function wordsOf(lessons){ const out = []; for (const l of lessons) for (const w of (l.words || [])) if (w && w.id && w.h) out.push({...w, lid: l.id, lt: l.title, hsk: l.hsk}); return out; }
const allWords = () => wordsOf(lessonsSorted());
// "Лексика з уроків": words a teacher adds after a class session, visible only to that group / student
const cvOf = classId => classId ? Object.values(S.cvocab).filter(d => d.classId === classId).sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) || (b.updatedAt || 0) - (a.updatedAt || 0)) : [];
const cvLesson = d => ({id: d.id, title: d.title || "Заняття", hsk: "", words: d.words || [], cv: true, date: d.date || ""});
// "Банка слів": a student's own list. Own words (id "own…") never earn points or count as mastered.
const isOwn = id => String(id).startsWith("own");
const bankOwn = () => (S.me?.bankOwn || []).map(w => ({...w, lid: "own", lt: w.src === "dict" ? "Зі словника" : "Моє слово", hsk: "", own: true}));
function bankWords(){ if (!S.me) return []; return [...(S.me.bank || []).map(wordById).filter(Boolean), ...bankOwn()]; }

const dispName = st => (st.useAlias && st.alias ? st.alias : st.name) || "Студент";
const masteredAll = st => Object.entries(st.words || {}).filter(([id, w]) => w.s >= MASTER && !isOwn(id)).length;
function streak(st){ const log = st.log || {}; let d = today(); if (!log[d]?.a) d = addDays(d, -1); let n = 0; while (log[d]?.a){ n++; d = addDays(d, -1); } return n; }
function statsOf(st, lessons){
  const d = today(), ws = wordsOf(lessons); let mastered = 0, due = 0, learning = 0;
  for (const w of ws){ const p = st.words?.[w.id]; if (!p) continue; if (p.s >= MASTER) mastered++; else learning++; if (p.due <= d && p.s < 6) due++; }
  const acc = st.exTotal ? Math.round(100 * (st.exOk || 0) / st.exTotal) : null;
  return {total: ws.length, mastered, due, learning, fresh: ws.length - mastered - learning, acc, exDone: st.exDone || 0, streak: streak(st), points: st.points || 0};
}
function periodStart(p){
  const t = new Date();
  if (p === "month") return dstr(new Date(t.getFullYear(), t.getMonth(), 1));
  if (p === "week"){ const m = new Date(t); m.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return dstr(m); }
  return null;
}
function rankRow(st, p){
  if (p === "all") return {pts: st.points || 0, m: masteredAll(st), c: st.cor || 0};
  const from = periodStart(p); let pts = 0, m = 0, c = 0;
  for (const [k, v] of Object.entries(st.log || {})) if (k >= from){ pts += v.p || 0; m += v.m || 0; c += v.c || 0; }
  return {pts, m, c};
}

    .filter(([, st]) => !classId || st.classId === classId)
    .map(([id, st]) => ({id, name: dispName(st), cls: st.classId, ...rankRow(st, p), streak: streak(st)}))
    .filter(r => r.pts > 0)
    .sort((a, b) => b.pts - a.pts || b.m - a.m || a.name.localeCompare(b.name, "uk"));
}

function ensureDay(me){ if (!me.dk || me.dk.d !== today()) me.dk = {d: today(), k: []}; }
function onceToday(me, key){ ensureDay(me); if (me.dk.k.includes(key)) return false; me.dk.k.push(key); return true; }
function logAdd(me, f, n){
  me.log = me.log || {}; const d = today(); const e = me.log[d] = me.log[d] || {}; e[f] = (e[f] || 0) + n;
  const keys = Object.keys(me.log); if (keys.length > 400) keys.sort().slice(0, keys.length - 400).forEach(k => delete me.log[k]);
}
function addPoints(me, n, src){ me.points = (me.points || 0) + n; logAdd(me, "p", n); if (src) logAdd(me, "p" + src, n); }
// Daily goal: the 10th learning action of the day gives a one-time bonus.
function dailyCheck(me){

}
