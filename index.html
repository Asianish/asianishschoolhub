<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"><\/script>');</script>
<script>
// =====================================================================
// ASIANISH — підключення до бази (Supabase) і вхід.
// Тут лише публічні адреса й ключ: дані захищають правила доступу в базі.
// =====================================================================
(() => {
  const SB_URL = "https://nrqhfgudrxsojqgqcpnc.supabase.co";
  const SB_KEY = "sb_publishable_BDb_uIFhH_AdfrXZuGK6sw_AmrrDgK_";
  const SITE = location.origin + location.pathname.replace(/index\.html$/, "");
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let readyResolve; window.ASIANISH_READY = new Promise(r => readyResolve = r);
  if (!window.supabase || !window.supabase.createClient){
    $("#app").innerHTML = `<div class="loading"><span class="han">网</span>Не вдалося завантажити платформу. Перевірте інтернет і оновіть сторінку.</div>`;
    return;
  }
  const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce"}});
  window.ASIANISH_SB = sb;
  // ---------- фото й голосові домашніх завдань: приватне сховище "hw" (хто що бачить — вирішують правила в базі) ----------
  window.ASIANISH_PHOTO = {
    async up(path, blob){ const {error} = await sb.storage.from("hw").upload(path, blob, {contentType: String(blob.type || "image/jpeg").split(";")[0], upsert: false}); if (error) throw Object.assign(new Error(error.message), {code: /bucket/i.test(error.message || "") ? "no_bucket" : /mime|type/i.test(error.message || "") ? "no_type" : "error"}); return path; },
    async urls(paths){ if (!paths.length) return {}; const {data, error} = await sb.storage.from("hw").createSignedUrls(paths, 3600); if (error) throw new Error(error.message); const o = {}; (data || []).forEach(x => { if (x && x.path && x.signedUrl) o[x.path] = x.signedUrl; }); return o; },
    async rm(paths){ if (!paths.length) return; const {error} = await sb.storage.from("hw").remove(paths); if (error) throw new Error(error.message); }
  };

  // ---------- маленька «база документів» поверх таблиць Supabase ----------
  const TABLES = new Set(["settings","teachers","classes","lessons","grammar","cvocab","students","progress","staff","materials","homework","hwsub","hwfb"]);
  const err = (e, code) => Object.assign(new Error(e?.message || String(e)), {code: code || e?.code || "error", cause: e});
  const split = path => { const i = path.indexOf("/"); const t = path.slice(0, i), id = path.slice(i + 1); if (!TABLES.has(t) || !id) throw err("bad path " + path, "invalid"); return [t, id]; };
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const cache = {};
  function emit(c){ if (c.timer) return; c.timer = setTimeout(() => { c.timer = 0; c.ls.forEach(l => l.fire()); }, 0); }
  async function fetchRow(t, id){
    const {data, error} = await sb.from(t).select("id,data").eq("id", id).maybeSingle();
    if (error) throw err(error); return data;
  }
  function watch(t){
    if (cache[t]) return cache[t];
    const c = cache[t] = {rows: new Map(), ls: new Set(), ready: false, error: null, timer: 0};
    c.ch = sb.channel("tbl-" + t).on("postgres_changes", {event: "*", schema: "public", table: t}, async p => {
      try {
        if (p.eventType === "DELETE"){ const id = p.old?.id; if (id != null) c.rows.delete(id); }
        else { const id = p.new?.id; if (id == null) return; const row = await fetchRow(t, id); if (row) c.rows.set(row.id, row.data); else c.rows.delete(id); }
        if (c.ready) emit(c);
      } catch(e){}
    }).subscribe();
    (async () => {
      try {
        for (let from = 0; ; from += 1000){
          const {data, error} = await sb.from(t).select("id,data").order("id").range(from, from + 999);
          if (error) throw err(error);
          data.forEach(r => c.rows.set(r.id, r.data));
          if (data.length < 1000) break;
        }
        c.ready = true; emit(c);
      } catch(e){ c.error = e; c.ls.forEach(l => l.fail && l.fail(e)); }
    })();
    return c;
  }
  const docSnap = (id, d) => ({id, exists: d !== undefined, data: () => clone(d)});
  const db = {
    collection(t){
      if (!TABLES.has(t)) throw err("bad collection " + t, "invalid");
      return {
        onSnapshot(cb, fail){
          const c = watch(t), l = {fail, fire: () => cb({docs: [...c.rows].map(([id, d]) => docSnap(id, d)), size: c.rows.size})};
          c.ls.add(l); if (c.ready) l.fire(); else if (c.error && fail) fail(c.error);
          return () => c.ls.delete(l);
        },
        async get(){ const {data, error} = await sb.from(t).select("id,data"); if (error) throw err(error); return {docs: data.map(r => docSnap(r.id, r.data))}; }
      };
    },
    doc(path){
      const [t, id] = split(path);
      return {
        id,
        async get(){ const r = await fetchRow(t, id); return docSnap(id, r ? r.data : undefined); },
        async set(body){
          const data = clone(body) || {};
          const {error} = await sb.from(t).upsert({id, data}, {onConflict: "id"});
          if (error) throw err(error, error.code === "42501" ? "permission_denied" : undefined);
          const c = cache[t]; if (c){ c.rows.set(id, data); if (c.ready) emit(c); }
        },
        async update(part){
          const r = await fetchRow(t, id); if (!r) throw err("not found", "not_found");
          await this.set({...r.data, ...clone(part)});
        },
        async delete(){
          const {error} = await sb.from(t).delete().eq("id", id);
          if (error) throw err(error);
          const c = cache[t]; if (c){ c.rows.delete(id); if (c.ready) emit(c); }
        },
        onSnapshot(cb, fail){
          const c = watch(t), l = {fail, fire: () => cb(docSnap(id, c.rows.get(id)))};
          c.ls.add(l); if (c.ready) l.fire(); else if (c.error && fail) fail(c.error);
          return () => c.ls.delete(l);
        }
      };
    }
  };


  // ---------- ролі викладачів (керує адміністраторка) ----------
  window.ASIANISH_FIND = async email => {
    const {data, error} = await sb.from("staff").select("id").eq("data->>email", String(email).toLowerCase()).limit(1);
    if (error) throw err(error); return data?.[0]?.id || "";
  };
  window.ASIANISH_ROLE = async (uid, role) => {
    const {data: cur} = await sb.from("roles").select("role").eq("user_id", uid).maybeSingle();
    if (cur?.role === "admin") return;
    const {error} = role ? await sb.from("roles").upsert({user_id: uid, role}, {onConflict: "user_id"}) : await sb.from("roles").delete().eq("user_id", uid);
    if (error) throw err(error);
  };
  window.ASIANISH_IMPORT_HTML = () => `<div class="form panel" style="max-width:640px">
      <h2>Перенесення даних</h2>
      <p class="small muted">Оберіть файл оновлення: уроки, граматика, групи, викладачі або нові вправи. Файли з доповненнями (наприклад, вправи на граматику) лише додають нове і нічого не перезаписують.</p>
      <input class="input" type="file" id="import-file" accept=".json,application/json">
      <div id="import-msg" class="note" hidden role="status"></div>
    </div>`;


  // ---------- ШІ-помічник: серверна функція "ai" (ключ — лише на сервері) ----------
  async function imgToB64(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return {mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1]};
    } finally { URL.revokeObjectURL(url); }
  }
  const sample = {
    async json(prompt, opts = {}){
      let images = [];
      try { images = await Promise.all((opts.images || []).slice(0, 3).map(imgToB64)); } catch(e){ throw {code: "image_rejected"}; }
      const {data, error} = await sb.functions.invoke("ai", {body: {prompt, images, quick: opts.modelTier === "quick"}});
      if (error){
        let st = error.context?.status, body = null;
        try { body = await error.context?.json(); } catch(e){}
        if (st === 429 || body?.error === "rate_limited") throw {code: "rate_limited"};
        if (body?.error === "no_key" || st === 404) throw {code: "not_granted"};
        throw {code: "error", detail: body};
      }
      if (data?.error === "invalid_json") throw {code: "invalid_json"};
      if (data?.error) throw {code: data.error === "rate_limited" ? "rate_limited" : "error"};
      return data?.result;
    }
  };

  // ---------- вхід ----------
  let ME = null;
  async function startApp(session){
    const u = session.user;
    let role = "student";
    try { const {data} = await sb.from("roles").select("role").eq("user_id", u.id).maybeSingle(); if (data?.role) role = data.role; } catch(e){}
    ME = {id: u.id, email: u.email || "", name: u.user_metadata?.full_name || u.user_metadata?.name || "", role};
    window.ASIANISH_ME = ME;
    const user = {
      isOwner: async () => role === "admin",
      canEdit: async () => role === "admin" || role === "teacher",
      id: async () => u.id,
      async profiles(ids){
        const out = {};
        try {
          const {data} = await sb.from("staff").select("id,data").in("id", ids);
          (data || []).forEach(r => out[r.id] = {name: r.data?.name || r.data?.email || ""});
        } catch(e){}
        return out;
      }
    };
    const downloads = {
      async save({filename, data, mimeType}){
        const blob = data instanceof Blob ? data : new Blob([data], {type: mimeType || (/\.csv$/i.test(filename) ? "text/csv;charset=utf-8" : "text/plain;charset=utf-8")});
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename || "file";
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      }
    };
    window.asianishRuntime = {use: async name => name === "db" ? db : name === "user" ? user : name === "downloads" ? downloads : name === "sample" ? sample : null};
    showAccount();
    window.ASIANISH_STARTED = true;
    readyResolve();
  }
  function showAccount(){
    const nav = $(".foot-links"); if (!nav || $("#acct")) return;
    const span = document.createElement("span"); span.id = "acct"; span.className = "acct";
    span.innerHTML = `<span class="small">${esc(ME.email)}</span><button type="button" class="link" id="logout">Вийти</button>`;
    nav.appendChild(span);
    $("#logout").addEventListener("click", async () => { try { await sb.auth.signOut(); } catch(e){} location.href = SITE; });
  }

  let mode = "in", busy = false, msg = "", msgOk = false;
  function loginView(){
    const google = `<button type="button" class="btn gbtn" id="lg-google" ${busy ? "disabled" : ""}><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Увійти через Google</button>`;
    const title = {in: "Вхід", up: "Реєстрація", reset: "Відновлення пароля", newpass: "Новий пароль"}[mode];
    const form = mode === "newpass"
      ? `<div class="field"><label for="lg-pass">Новий пароль</label><input class="input" id="lg-pass" type="password" minlength="6" autocomplete="new-password" required></div>
         <button class="btn primary" type="submit" ${busy ? "disabled" : ""}>Зберегти пароль</button>`
      : `<div class="field"><label for="lg-email">Пошта</label><input class="input" id="lg-email" type="email" autocomplete="email" required placeholder="name@gmail.com"></div>
         ${mode !== "reset" ? `<div class="field"><label for="lg-pass">Пароль</label><input class="input" id="lg-pass" type="password" minlength="6" autocomplete="${mode === "up" ? "new-password" : "current-password"}" required placeholder="щонайменше 6 символів"></div>` : ""}
         <button class="btn primary" type="submit" ${busy ? "disabled" : ""}>${mode === "in" ? "Увійти" : mode === "up" ? "Створити акаунт" : "Надіслати посилання"}</button>`;
    const links = mode === "in" ? `<button type="button" class="link" data-lg="up">Немає акаунта? Зареєструватися</button><button type="button" class="link" data-lg="reset">Забули пароль?</button>`
      : mode === "newpass" ? "" : `<button type="button" class="link" data-lg="in">← Повернутися до входу</button>`;
    $("#app").innerHTML = `<div class="reg">
      <div class="stack">
        <div class="big">你好</div>
        <div><div class="eyebrow">Asianish School</div><h1 data-en="Chinese|learning space">Кабінет<br>китайської мови</h1></div>
        <p class="muted" style="max-width:44ch">Увійдіть через Google або пошту. Прогрес зберігається у вашому акаунті й доступний з будь-якого пристрою.</p>
      </div>
      <div class="form panel">
        <h2 style="margin:0">${title}</h2>
        ${mode === "in" || mode === "up" ? google + `<div class="or"><span>або</span></div>` : ""}
        <form class="form" id="lg-form" style="gap:12px">${form}</form>
        ${msg ? `<div class="note ${msgOk ? "info" : ""}" role="status"><span>${msgOk ? "✓" : "!"}</span><span>${esc(msg)}</span></div>` : ""}
        <div class="row" style="justify-content:space-between">${links}</div>
      </div>
    </div>`;
    $("#lg-google")?.addEventListener("click", google_);
    $("#lg-form").addEventListener("submit", submit);
    document.querySelectorAll("[data-lg]").forEach(b => b.addEventListener("click", () => { mode = b.dataset.lg; msg = ""; loginView(); }));
  }
  async function google_(){
    busy = true; loginView();
    const {error} = await sb.auth.signInWithOAuth({provider: "google", options: {redirectTo: SITE}});
    if (error){ busy = false; msg = "Не вдалося відкрити вхід через Google: " + error.message; msgOk = false; loginView(); }
    else setTimeout(() => { if (busy){ busy = false; loginView(); } }, 6000);
  }
  const UA = {
    "Invalid login credentials": "Неправильна пошта або пароль.",
    "User already registered": "Акаунт із цією поштою вже існує. Увійдіть або відновіть пароль.",
    "Email not confirmed": "Пошту ще не підтверджено. Перевірте лист у скриньці.",
    "Password should be at least 6 characters.": "Пароль має містити щонайменше 6 символів."
  };
  async function submit(e){
    e.preventDefault(); if (busy) return;
    const email = $("#lg-email")?.value.trim(), pass = $("#lg-pass")?.value || "";
    busy = true; msg = ""; loginView();
    let res;
    try {
      if (mode === "in") res = await sb.auth.signInWithPassword({email, password: pass});
      else if (mode === "up") res = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: SITE}});
      else if (mode === "reset") res = await sb.auth.resetPasswordForEmail(email, {redirectTo: SITE});
      else res = await sb.auth.updateUser({password: pass});
    } catch(x){ res = {error: x}; }
    busy = false;
    if (res.error){ msg = UA[res.error.message] || res.error.message; msgOk = false; loginView(); return; }
    if (mode === "reset"){ msg = "Якщо така пошта зареєстрована, на неї прийде лист із посиланням для нового пароля."; msgOk = true; loginView(); return; }
    if (mode === "newpass"){ location.href = SITE; return; }
    if (mode === "up" && !res.data?.session){ msg = "Акаунт створено. Підтвердьте пошту за посиланням у листі й увійдіть."; msgOk = true; mode = "in"; loginView(); return; }
    // сесію підхопить onAuthStateChange
  }

  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY"){ mode = "newpass"; msg = ""; loginView(); return; }
    if (event === "SIGNED_OUT"){ if (started) location.reload(); return; }
    if (session && !started && mode !== "newpass"){ started = true; setTimeout(() => startApp(session), 0); }
  });
  sb.auth.getSession().then(({data}) => {
    if (data?.session){ if (!started && mode !== "newpass"){ started = true; startApp(data.session); } }
    else if (!started) loginView();
  }).catch(() => loginView());

  // ---------- перенесення даних (лише адміністраторка) ----------
  const IMPORT_ORDER = ["settings", "teachers", "classes", "lessons", "grammar", "cvocab", "materials"];
  document.addEventListener("change", async e => {
    if (e.target.id !== "import-file") return;
    const f = e.target.files?.[0], out = $("#import-msg"); if (!f || !out) return;
    const say = (t, ok) => { out.hidden = false; out.className = "note " + (ok ? "info" : ""); out.innerHTML = `<span>${ok ? "✓" : "…"}</span><span>${esc(t)}</span>`; };
    try {
      const j = JSON.parse(await f.text()); const cols = j.collections || {}, merge = j.merge || {}, del = j.delete || {};
      const nUp = IMPORT_ORDER.reduce((a, c) => a + Object.keys(cols[c] || {}).length, 0);
      const nMerge = Object.values(merge).reduce((a, m) => a + Object.keys(m).length, 0);
      const nDel = Object.values(del).reduce((a, ids) => a + ids.length, 0);
      const total = nUp + nMerge + nDel; let done = 0;
      if (!total){ say("У файлі немає даних для перенесення.", false); return; }
      // 1) remove outdated records (e.g. old HSK5 lessons replaced by the textbook version)
      for (const [c, ids] of Object.entries(del)){
        for (let i = 0; i < ids.length; i += 50){
          const part = ids.slice(i, i + 50);
          const {error} = await sb.from(c).delete().in("id", part);
          if (error) throw new Error(`${c}: ${error.message}`);
          done += part.length; say(`Оновлюю… ${done} з ${total}`);
        }
      }
      // 1b) groups can name their teacher instead of an id: they go to the EXISTING teacher card with that name (no new teacher is created)
      const tnRows = Object.values(cols.classes || {}).filter(r => r && r.teacherName && !r.teacherId);
      if (tnRows.length){
        const {data: trs, error: et} = await sb.from("teachers").select("id,data");
        if (et) throw new Error("teachers: " + et.message);
        const norm = n => String(n || "").toLowerCase().replace(/[’'ʼ`]/g, "").replace(/ё/g, "е").split(/\s+/).filter(Boolean).sort().join(" ");
        const missing = new Set();
        for (const r of tnRows){
          let hits = (trs || []).filter(t => norm(t.data?.name) === norm(r.teacherName));
          if (!hits.length){ const want = norm(r.teacherName).split(" "); const part = (trs || []).filter(t => { const have = norm(t.data?.name).split(" "); return want.every(w => have.includes(w)) || (have.length && have.every(w => want.includes(w))); }); if (part.length === 1) hits = part; }
          const pick = hits.find(t => t.data?.uid) || hits.sort((x, y) => (x.data?.order || 0) - (y.data?.order || 0))[0];
          if (pick){ r.teacherId = pick.id; delete r.teacherName; } else missing.add(r.teacherName);
        }
        if (missing.size){ say("Не знайдено картку викладача: " + [...missing].join(", ") + ". Створіть її кнопкою «+ Викладач» (ім'я точно як у файлі) і завантажте файл ще раз. Нічого не змінено.", false); e.target.value = ""; return; }
      }
      // 2) full records (new or replaced)
      for (const c of IMPORT_ORDER){
        const rows = Object.entries(cols[c] || {}).map(([id, data]) => ({id, data}));
        for (let i = 0; i < rows.length; i += 25){
          const {error} = await sb.from(c).upsert(rows.slice(i, i + 25), {onConflict: "id"});
          if (error) throw new Error(`${c}: ${error.message}`);
          done += Math.min(25, rows.length - i); say(`Оновлюю… ${done} з ${total}`);
        }
      }
      // 3) add / replace fields in existing records without touching anything else
      for (const [c, recs] of Object.entries(merge)){
        const ids = Object.keys(recs);
        for (let i = 0; i < ids.length; i += 25){
          const part = ids.slice(i, i + 25);
          const {data: cur, error: e1} = await sb.from(c).select("id,data").in("id", part);
          if (e1) throw new Error(`${c}: ${e1.message}`);
          const have = new Map((cur || []).map(r => [r.id, r.data]));
          const rows = part.filter(id => have.has(id)).map(id => ({id, data: {...have.get(id), ...recs[id]}}));
          if (rows.length){ const {error} = await sb.from(c).upsert(rows, {onConflict: "id"}); if (error) throw new Error(`${c}: ${error.message}`); }
          done += part.length; say(`Оновлюю… ${done} з ${total}`);
        }
      }
      say(`Готово: оновлено ${total} записів. Оновіть сторінку.`, true);
    } catch(x){ say("Не вдалося перенести: " + x.message + ". Перевірте, що ви увійшли як адміністраторка.", false); }
    e.target.value = "";
  });
})();

// =====================================================================
// PROGRESS — learning progress on the teacher's own lessons («Лексика з уроків»).
// Shown only in the student's own cabinet and to staff; not part of the ranking.
// =====================================================================
const PROG_ST = {m: ["Вивчено", "var(--ok)"], l: ["Вчить", "var(--gold)"], n: ["Ще не відкрито", "var(--line)"]};
function wordStatus(st, wid){
  const p = st?.words?.[wid]; if (!p) return "n";
  if (p.s >= MASTER) return "m";
  return "l";
}
function progData(st, cls){
  const d = today(), lessons = cvOf(cls?.id).map(cvLesson);
  let T = {total: 0, m: 0, l: 0, n: 0, ok: 0, bad: 0, due: 0};
  const hard = [];
  const rows = lessons.map(l => {
    const r = {l, total: 0, m: 0, l2: 0, n: 0, ok: 0, bad: 0, due: 0, words: []};
    for (const w of l.words || []){
      if (!w || !w.id) continue;
      const s = wordStatus(st, w.id), p = st?.words?.[w.id] || {};
      r.total++; r[s === "l" ? "l2" : s]++; r.ok += p.ok || 0; r.bad += p.bad || 0;
      if (p.due && p.due <= d && s !== "n" && p.s < 6) r.due++;
      r.words.push({w, s, p});
      if ((p.bad || 0) >= 2 && (p.bad || 0) > (p.ok || 0) && s !== "m") hard.push({w, p, lt: l.title});
    }
    r.pct = r.total ? Math.round(100 * r.m / r.total) : 0;
    r.acc = r.ok + r.bad ? Math.round(100 * r.ok / (r.ok + r.bad)) : null;
    T.total += r.total; T.m += r.m; T.l += r.l2; T.n += r.n; T.ok += r.ok; T.bad += r.bad; T.due += r.due;
    return r;
  });
  T.pct = T.total ? Math.round(100 * T.m / T.total) : 0;
  T.acc = T.ok + T.bad ? Math.round(100 * T.ok / (T.ok + T.bad)) : null;
  hard.sort((a, b) => (b.p.bad - b.p.ok) - (a.p.bad - a.p.ok));
  // activity over the last 4 weeks (any learning action)
  const days = []; for (let k = 27; k >= 0; k--){ const dd = addDays(d, -k); days.push({d: dd, a: st?.log?.[dd]?.a || 0}); }
  const active = days.filter(x => x.a > 0).length;
  const lastSeen = Object.keys(st?.log || {}).filter(k => st.log[k]?.a).sort().pop() || "";
  return {rows, T, hard: hard.slice(0, 10), days, active, lastSeen};
}
function progBar(m, l, n, big){
  const t = m + l + n || 1, seg = (v, c) => v ? `<i style="width:${100 * v / t}%;background:${c}"></i>` : "";
  return `<div class="pbar ${big ? "big" : ""}" role="img" aria-label="Вивчено ${m}, вчить ${l}, не відкрито ${n}">${seg(m, PROG_ST.m[1])}${seg(l, PROG_ST.l[1])}${seg(n, PROG_ST.n[1])}</div>`;
}
const progTile = (v, label, sub) => `<div class="ptile"><span class="v num">${v}</span><span class="small">${label}</span>${sub ? `<span class="small muted">${sub}</span>` : ""}</div>`;
function progressView(st, cls, forStaff){
  if (!cls) return emptyBox("进", "Прогрес з'явиться після вступу до групи", "Тут буде видно, як ви засвоюєте слова з занять із викладачем.");
  const P = progData(st, cls), T = P.T, who = forStaff ? (st?.name || "Учень") : "ви";
  const head = `<div class="spread"><div><div class="eyebrow">Прогрес навчання</div><h2>${forStaff ? esc(st?.name || "Учень") : "Мій прогрес на заняттях"}</h2>
      <p class="small muted" style="max-width:60ch">${forStaff ? "Слова, які ви додаєте після занять у «Лексику з уроків»." : "Слова, які викладач додає після ваших занять у «Лексику з уроків»."} ${forStaff ? "Цей розділ бачать лише викладачі та сам учень — у рейтингу його немає." : "Цей розділ бачите лише ви й ваш викладач — він не впливає на рейтинг."}</p></div>
      ${!forStaff && P.rows.length ? `<div class="row"><button class="btn primary" data-act="deckTab" data-arg="cv">Повторити слова з занять</button><button class="btn" data-act="exSrc" data-arg="cv">Вправа</button></div>` : ""}</div>`;
  if (!P.rows.length) return head + emptyBox("课", "Слів із занять ще немає", forStaff ? "Додайте лексику заняття у вкладці «Лексика з уроків» — прогрес почне рахуватися автоматично." : "Щойно викладач додасть слова з вашого заняття, тут з'явиться прогрес.");
  const tiles = `<div class="ptiles">
    ${progTile(T.pct + "%", "слів із занять вивчено", `${T.m} з ${T.total}`)}
    ${progTile(P.rows.length, plural(P.rows.length, "заняття", "заняття", "занять"), "з лексикою")}
    ${progTile(T.l, "у процесі", "вже бачено, ще не вивчено")}
    ${progTile(T.n, "ще не відкрито", T.n ? "чекають на перше повторення" : "усе вже переглянуто")}
    ${progTile(T.due, "повторити зараз", "за інтервальним повторенням")}
    ${progTile(T.acc == null ? "—" : T.acc + "%", "точність", "у картках і вправах")}
  </div>`;
  const legend = `<div class="plegend">${Object.values(PROG_ST).map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>`;
  const act = `<div class="panel"><div class="spread"><b>Активність за 4 тижні</b><span class="small muted">${P.active} ${plural(P.active, "день", "дні", "днів")} із заняттями${P.lastSeen ? " · останній раз " + fmtDate(P.lastSeen) : ""}</span></div>
    <div class="actgrid">${P.days.map(x => `<span title="${fmtDate(x.d)}: ${x.a} дій" class="a${x.a === 0 ? 0 : x.a < 10 ? 1 : x.a < 30 ? 2 : 3}"></span>`).join("")}</div></div>`;
  const lessons = P.rows.map(r => `<details class="plesson"><summary>
      <div class="pl-h"><div><b>${esc(r.l.title)}</b><div class="small muted">${r.l.date ? fmtDate(r.l.date) + " · " : ""}${r.total} ${plural(r.total, "слово", "слова", "слів")}${r.acc != null ? " · точність " + r.acc + "%" : ""}${r.due ? ` · <span style="color:var(--gold-ink)">повторити: ${r.due}</span>` : ""}</div></div><span class="pl-pct num">${r.pct}%</span></div>
      ${progBar(r.m, r.l2, r.n)}</summary>
      <div class="pwords">${r.words.map(x => `<span class="pw ${x.s}" title="${esc(x.w.uk || "")}${x.p.ok || x.p.bad ? ` · правильно ${x.p.ok || 0}, помилок ${x.p.bad || 0}` : ""}"><span class="zh">${esc(x.w.h)}</span><small>${esc(x.w.uk || "")}</small></span>`).join("")}</div>
      ${forStaff ? "" : `<div class="row"><button class="btn sm primary" data-act="deckTab" data-arg="cv:${esc(r.l.id)}">Картки</button><button class="btn sm" data-act="exSrc" data-arg="cv:${esc(r.l.id)}">Вправа</button></div>`}
    </details>`).join("");
  const hard = P.hard.length ? `<div class="panel"><b>Складні слова</b><p class="small muted">Слова з занять, у яких ${forStaff ? "учень найчастіше помиляється" : "ви найчастіше помиляєтеся"}.</p>
    <div class="pwords">${P.hard.map(x => `<span class="pw hard" title="${esc(x.lt)}"><span class="zh">${esc(x.w.h)}</span><small>${esc(x.w.uk || "")} · помилок ${x.p.bad}</small></span>`).join("")}</div></div>` : "";
  return `${head}${tiles}<div class="panel"><div class="spread"><b>Загалом</b>${legend}</div>${progBar(T.m, T.l, T.n, true)}</div>
    <div class="two">${act}${hard || `<div class="panel"><b>Складні слова</b><p class="small muted">Поки що немає — так тримати!</p></div>`}</div>
    <section class="stack" style="gap:10px"><div class="sh"><h2>По заняттях</h2><span class="small muted">Натисніть на заняття, щоб побачити кожне слово</span></div>${lessons}</section>`;
}

  }
  if (!studs.length) return emptyBox("学", "Поки немає учнів", "Прогрес з'явиться, коли учні зареєструються з кодом цієї групи.");
  const lessons = cvOf(c.id).map(cvLesson).slice(0, 8);
  if (!lessons.length) return emptyBox("课", "Ще немає лексики з занять", "Додайте слова заняття у вкладці «Лексика з уроків» — і тут з'явиться прогрес кожного учня.");

      <td class="n"><b>${P.T.pct}%</b><div style="min-width:90px">${progBar(P.T.m, P.T.l, P.T.n)}</div></td><td class="n">${P.T.acc == null ? "—" : P.T.acc + "%"}</td><td class="n">${P.T.due}</td><td class="n">${P.active}</td>
      ${lessons.map(l => cell(P.rows.find(r => r.l.id === l.id)?.pct || 0)).join("")}</tr>`; }).join("");
  return `<div><div class="eyebrow">Прогрес навчання</div><h2>Як група засвоює лексику ваших занять</h2><p class="small muted" style="max-width:62ch">Відсоток — частка слів заняття, які учень уже вивчив (повторив до стабільного запам'ятовування). Натисніть на ім'я, щоб побачити деталі. Учні бачать лише власний прогрес; рейтинг — окремо.</p></div>
    <div class="tablewrap"><table class="ptable"><thead><tr><th>Учень</th><th class="n">Вивчено</th><th class="n">Точність</th><th class="n">Повторити</th><th class="n">Днів за 4 тижні</th>${lessons.map(l => `<th class="n" title="${esc(l.title)}">${esc(l.date ? fmtDate(l.date) : l.title).slice(0, 14)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// =====================================================================
// SKILLS PROGRESS — teacher's own assessment of each student (listening, speaking, reading, writing…).
// Stored in progress/{studentId}. Database rules: staff read & write every doc; a student can read
// only the doc with her own id; nobody else can read it.
// =====================================================================
const SKILLS_DEF = [
  {id:"listen", han:"听", name:"Аудіювання"}, {id:"speak", han:"说", name:"Говоріння"},
  {id:"read",   han:"读", name:"Читання"},    {id:"write", han:"写", name:"Письмо"},
  {id:"hanzi",  han:"字", name:"Ієрогліфи"},  {id:"tones", han:"音", name:"Вимова й тони"},
  {id:"gram",   han:"语", name:"Граматика"},  {id:"vocab", han:"词", name:"Лексика"}
];
const SK_LEVELS = [[0, "не оцінено"], [1, "старт"], [3, "базово"], [5, "впевнено"], [7, "добре"], [9, "відмінно"]];
const skLabel = v => { let t = SK_LEVELS[0][1]; for (const [k, n] of SK_LEVELS) if (v >= k) t = n; return t; };
const skColor = v => v >= 7 ? "var(--ok)" : v >= 4 ? "var(--gold)" : v > 0 ? "var(--bad)" : "var(--line)";
const testKey = cid => "test-" + cid;
function progOf(sid){ if (S.testAs && sid === S.uid) return S.progs?.[testKey(S.testAs.classId)]; return sid === S.uid && !S.isTeacher ? S.myProg : S.progs?.[sid]; }
function skillsOf(pr){ return Array.isArray(pr?.skills) && pr.skills.length ? pr.skills : SKILLS_DEF.map(s => ({...s, v: 0, note: ""})); }

function radarSvg(skills, prev){
  const n = skills.length; if (n < 3) return "";
  const R = 92, cx = 130, cy = 120, pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n, r = R * v / 10; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = k => skills.map((_, i) => pt(i, k).join(",")).join(" ");
  const poly = vals => vals.map((v, i) => pt(i, v).join(",")).join(" ");
  const labels = skills.map((s, i) => { const [x, y] = pt(i, 12.2); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="rl">${esc(s.han || s.name.slice(0, 1))}</text>`; }).join("");
  const prevVals = prev ? skills.map(s => Number(prev[s.id] ?? 0)) : null;
  return `<svg viewBox="0 0 260 240" class="radar" role="img" aria-label="Діаграма навичок">
    ${[2, 4, 6, 8, 10].map(k => `<polygon points="${ring(k)}" class="rg"/>`).join("")}
    ${skills.map((_, i) => { const [x, y] = pt(i, 10); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="rg"/>`; }).join("")}
    ${prevVals ? `<polygon points="${poly(prevVals)}" class="rp"/>` : ""}
    <polygon points="${poly(skills.map(s => Number(s.v) || 0))}" class="rc"/>
    ${labels}</svg>`;
}
function sparkSvg(vals){
  if (vals.length < 2) return "";
  const w = 90, h = 26, step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - (h - 4) * v / 10).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

// ---- read-only view (student sees her own; staff see it above the editor button)
function skillsView(sid, st, forStaff){
  const pr = progOf(sid), skills = skillsOf(pr), hist = Array.isArray(pr?.hist) ? pr.hist : [];
  const prev = hist.length >= 2 ? hist[hist.length - 2].v : null;
  const rated = skills.filter(s => Number(s.v) > 0);
  const avg = rated.length ? (rated.reduce((a, s) => a + Number(s.v), 0) / rated.length) : 0;
  const goals = Array.isArray(pr?.goals) ? pr.goals : [];
  const by = pr?.updatedBy && S.teachers ? Object.values(S.teachers).find(t => t.uid === pr.updatedBy)?.name : "";
  if (!pr || !rated.length){
    return `<div class="panel skempty"><span class="han" style="font-size:2.4rem;color:var(--gold-ink)">进</span><b>${forStaff ? "Учня ще не оцінено" : "Викладач ще не оцінив ваші навички"}</b>
      <span class="small muted">${forStaff ? "Відкрийте редактор і позначте рівень аудіювання, говоріння, читання, письма та інших навичок — учень побачить це у своєму кабінеті." : "Після кількох занять тут з'явиться оцінка аудіювання, говоріння, читання, письма й інших навичок від викладача, його коментарі та цілі."}</span>
      ${forStaff ? `<button class="btn primary" data-act="peOpen" data-arg="${esc(sid)}">Оцінити навички</button>` : ""}</div>`;
  }
  const rows = skills.map(s => { const v = Number(s.v) || 0, series = hist.map(h => Number(h.v?.[s.id] ?? 0)).filter((_, i, a) => a.length);
    const d = prev && prev[s.id] != null ? v - Number(prev[s.id]) : 0;
    return `<div class="skrow"><span class="skh">${esc(s.han || "")}</span><div class="skmain"><div class="spread"><b>${esc(s.name)}</b><span class="small"><b class="num">${v}</b>/10 · ${skLabel(v)}${d ? ` <span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"}${Math.abs(d)}</span>` : ""}</span></div>
      <div class="skbar"><i style="width:${v * 10}%;background:${skColor(v)}"></i></div>${s.note ? `<div class="small muted">${esc(s.note)}</div>` : ""}</div>${sparkSvg(series)}</div>`; }).join("");
  return `<div class="two skwrap"><div class="panel" style="display:flex;flex-direction:column;align-items:center;gap:6px">
      ${radarSvg(skills, prev)}<div class="plegend"><span><i style="background:var(--accent)"></i>зараз</span>${prev ? `<span><i style="background:var(--gold)"></i>попередня оцінка</span>` : ""}</div>
      <div class="small muted" style="text-align:center">Середній рівень <b class="num">${avg.toFixed(1)}</b>/10${pr.updatedAt ? ` · оновлено ${fmtDate(dstr(new Date(pr.updatedAt)))}` : ""}${by ? ` · ${esc(by)}` : ""}</div>
      ${forStaff ? `<button class="btn sm primary" data-act="peOpen" data-arg="${esc(sid)}">Редагувати оцінку</button>` : ""}</div>
    <div class="panel skills">${rows}</div></div>
    ${pr.comment ? `<div class="panel fbk"><span class="eyebrow">Відгук викладача</span><p>${esc(pr.comment)}</p></div>` : ""}
    ${goals.length ? `<div class="panel"><b>Над чим працюємо</b><ul class="goals">${goals.map(g => `<li class="${g.done ? "done" : ""}"><span>${g.done ? "✓" : "○"}</span>${esc(g.t)}</li>`).join("")}</ul></div>` : ""}
    ${hist.length > 1 ? `<details class="panel"><summary><b>Історія оцінок</b> <span class="small muted">· ${hist.length} ${plural(hist.length, "запис", "записи", "записів")}</span></summary>
      <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Дата</th>${skills.map(s => `<th class="n" title="${esc(s.name)}">${esc(s.han || s.name)}</th>`).join("")}</tr></thead><tbody>${hist.slice().reverse().map(h => `<tr><td>${fmtDate(h.d)}</td>${skills.map(s => `<td class="n">${h.v?.[s.id] ?? "—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>` : ""}`;
}

}

      <div class="row"><input class="input" style="flex:1;min-width:200px" data-pe="newSkill" data-xenter="peAddSkill" value="${esc(e.newSkill)}" placeholder="Нова навичка, напр. «Каліграфія» або «Діалоги»" maxlength="40"><button class="btn sm" data-act="peAddSkill">+ Додати навичку</button>${SKILLS_DEF.filter(d => !e.skills.some(s => s.id === d.id)).map(d => `<button class="chip" data-act="peAddDef" data-arg="${d.id}">+ ${d.name}</button>`).join("")}</div></div>
    <div class="panel form"><label for="pe-c"><b>Відгук викладача</b></label><textarea class="input" id="pe-c" rows="4" data-pe="comment" maxlength="1500" placeholder="Загальне враження, успіхи, поради…">${esc(e.comment)}</textarea></div>

    <div class="row"><button class="btn primary" data-act="peSave" ${e.busy ? "disabled" : ""}>${e.busy ? "Зберігаю…" : "Зберегти оцінку"}</button><button class="btn ghost" data-act="peClose">Скасувати</button>
      ${st.classId && Object.values(S.students).filter(x => x.classId === st.classId).length > 1 ? `<button class="btn ghost" data-act="peCopySet">Застосувати цей набір навичок до всієї групи</button>` : ""}</div>
  </div>`;

async function peSave(){
  const e = S.pedit; if (!e || e.busy) return;
  const old = S.progs?.[e.sid] || {}, d = today();
  const skills = e.skills.map(s => ({id: s.id, han: String(s.han || "").slice(0, 2), name: String(s.name).slice(0, 40), v: Math.max(0, Math.min(10, Math.round(Number(s.v) || 0))), note: String(s.note || "").trim().slice(0, 300)}));
  const hist = (Array.isArray(old.hist) ? old.hist : []).filter(h => h.d !== d);
  hist.push({d, v: Object.fromEntries(skills.map(s => [s.id, s.v]))});
  const doc = {...old, skills, comment: String(e.comment || "").trim().slice(0, 1500), goals: e.goals.filter(g => String(g.t || "").trim()).slice(0, 20).map(g => ({t: String(g.t).slice(0, 160), done: !!g.done})),
    hist: hist.slice(-30), updatedAt: Date.now(), updatedBy: S.uid || ""};
  e.busy = true; render();
  try { await S.db.doc("progress/" + e.sid).set(doc); (S.progs = S.progs || {})[e.sid] = doc; S.pedit = null; toast("Оцінку збережено — учень уже бачить її"); }
  catch(err){ e.busy = false; toast("Не вдалося зберегти. Перевірте доступ викладача."); }
  render();
}
async function peCopySet(){
  const e = S.pedit, st = S.students[e.sid]; if (!e || !st) return;
  const others = Object.entries(S.students).filter(([id, x]) => id !== e.sid && x.classId === st.classId);
  let n = 0;
  for (const [id] of others){
    const pr = S.progs?.[id] || {}, cur = skillsOf(pr);
    const skills = e.skills.map(s => { const c = cur.find(x => x.id === s.id); return {id: s.id, han: s.han, name: s.name, v: c ? Number(c.v) || 0 : 0, note: c?.note || ""}; });
    try { await S.db.doc("progress/" + id).set({...pr, skills, updatedAt: pr.updatedAt || Date.now(), updatedBy: pr.updatedBy || S.uid || ""}); n++; } catch(_){}
  }
  toast(n ? `Набір навичок застосовано до ${n} ${plural(n, "учня", "учнів", "учнів")} (їхні оцінки збережено)` : "Не вдалося застосувати");
}

// ---- age categories & monthly comments (kids 7–11, teens 12–16)
const AGES = {kid: "Дитина (7–11)", teen: "Підліток (12–16)", adult: "Дорослий"};
const AGES_GROUP = {teen: "Підлітки (12–16)", adult: "Дорослі"};
function ageOpts(kind, cur){
  const set = kind === "individual" ? AGES : AGES_GROUP;
  const v = set[cur] ? cur : "adult";
  return Object.entries(set).map(([k, n]) => `<option value="${k}" ${k === v ? "selected" : ""}>${n}</option>`).join("");
}
function ageBadge(c){ const a = c?.age; if (a !== "kid" && a !== "teen") return ""; return c.kind === "individual" ? (a === "kid" ? "Дитина" : "Підліток") : "Підлітки"; }
const isYoung = c => !!c && (c.age === "teen" || (c.age === "kid" && c.kind === "individual"));
const MONTHS_FULL = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const curMonth = () => today().slice(0, 7);
const monthName = m => { const [y, mm] = String(m).split("-"); return `${MONTHS_FULL[Number(mm) - 1] || m} ${y}`; };
function monthList(n){ const d = new Date(); const out = []; for (let k = 0; k < n; k++){ const x = new Date(d.getFullYear(), d.getMonth() - k, 1); out.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`); } return out; }
const monthlyOf = pr => (Array.isArray(pr?.monthly) ? pr.monthly : []).filter(x => x && x.m && String(x.text || "").trim()).sort((a, b) => b.m.localeCompare(a.m));
function moOpen(sid, m){
  const pr = S.progs?.[sid] || {}; m = m || curMonth();
  const ex = monthlyOf(pr).find(x => x.m === m);
  S.medit = {sid, m, text: ex?.text || "", busy: false};
}
function monthlyStaff(sid){
  const pr = S.progs?.[sid], list = monthlyOf(pr);
  const e = S.medit && S.medit.sid === sid ? S.medit : null;
  const editor = e ? `<div class="form" style="gap:10px">
      <div class="field" style="max-width:260px"><label for="mo-m">Місяць</label><select class="input" id="mo-m" data-chg="momonth">${monthList(12).map(m => `<option value="${m}" ${m === e.m ? "selected" : ""}>${monthName(m)}${list.some(x => x.m === m) ? " ✓" : ""}</option>`).join("")}</select></div>
      <textarea class="input" rows="6" data-mo="text" maxlength="3000" placeholder="Як минув місяць: що вдалося, над чим працювали, зацікавленість, домашні завдання, поради батькам…">${esc(e.text)}</textarea>
      <div class="row"><button class="btn primary" data-act="moSave" ${e.busy ? "disabled" : ""}>${e.busy ? "Зберігаю…" : "Зберегти коментар"}</button><button class="btn ghost" data-act="moClose">Скасувати</button>
        ${list.some(x => x.m === e.m) ? `<button class="btn ghost" data-act="moDel">Видалити коментар за цей місяць</button>` : ""}</div></div>`
    : `<div class="row"><button class="btn sm primary" data-act="moOpen" data-arg="${esc(sid)}">${list.some(x => x.m === curMonth()) ? "Редагувати коментар за " : "Написати коментар за "}${monthName(curMonth()).toLowerCase()}</button></div>`;
  return `<div class="panel mo"><div class="spread"><div><span class="eyebrow">Щомісячні коментарі</span><p class="small muted" style="margin:4px 0 0;max-width:60ch">Раз на місяць напишіть, як іде навчання. Учень (і батьки) бачать ці коментарі у своєму кабінеті; іншим учням вони недоступні.</p></div></div>
    ${editor}
    ${list.length ? `<div class="molist">${list.map(x => `<article class="moitem"><div class="spread"><b>${monthName(x.m)}</b>${e ? "" : `<button class="link small" data-act="moEdit" data-arg="${esc(sid)}|${esc(x.m)}">редагувати</button>`}</div><p>${esc(x.text)}</p></article>`).join("")}</div>` : `<span class="small muted">Коментарів ще немає.</span>`}</div>`;
}
function monthlyStudent(){
  const list = monthlyOf(progOf(S.uid));
  return `<section class="panel mo"><span class="eyebrow">Щомісячний відгук викладача</span>
    ${list.length ? `<div class="molist">${list.map((x, i) => `<article class="moitem ${i === 0 ? "new" : ""}"><b>${monthName(x.m)}</b><p>${esc(x.text)}</p></article>`).join("")}</div>`
      : `<p class="small muted" style="margin:6px 0 0">Щомісяця викладач писатиме тут, як просувається навчання: успіхи, над чим працюємо, поради. Перший коментар з'явиться наприкінці місяця.</p>`}</section>`;
}
async function moSave(del){
  const e = S.medit; if (!e || e.busy) return;
  const old = S.progs?.[e.sid] || {};
  let monthly = (Array.isArray(old.monthly) ? old.monthly : []).filter(x => x && x.m !== e.m);
  const text = String(e.text || "").trim().slice(0, 3000);
  if (!del){ if (!text){ toast("Напишіть коментар"); return; } monthly.push({m: e.m, text, at: Date.now(), by: S.uid || ""}); }
  monthly = monthly.sort((a, b) => a.m.localeCompare(b.m)).slice(-36);
  const doc = {...old, monthly};
  e.busy = true; render();
  try { await S.db.doc("progress/" + e.sid).set(doc); (S.progs = S.progs || {})[e.sid] = doc; S.medit = null; toast(del ? "Коментар видалено" : "Коментар збережено — учень уже бачить його"); }
  catch(err){ e.busy = false; toast("Не вдалося зберегти. Перевірте доступ викладача."); }
  render();
}

function classSkills(c){
  if (S.pedit && (S.students[S.pedit.sid]?.classId === c.id || S.pedit.sid === testKey(c.id))) return peView();
  let studs = Object.entries(S.students).filter(([, st]) => st.classId === c.id).sort((a, b) => String(a[1].name).localeCompare(b[1].name, "uk"));
  const demo = !studs.length;
  if (demo) studs = [[testKey(c.id), {name: "🧪 Тестовий учень"}]];
  const sel = S.view.stu && studs.some(([id]) => id === S.view.stu) ? S.view.stu : studs.length === 1 ? studs[0][0] : "";
  if (sel){
    const st = S.students[sel] || studs.find(([id]) => id === sel)?.[1] || {};
    return `${studs.length > 1 ? `<button class="link" data-act="progStu" data-arg="">← Усі учні групи</button>` : ""}
      ${demo ? `<div class="note info"><span>🧪</span><span>До ${c.kind === "individual" ? "цього учня ще ніхто не приєднався" : "групи ще ніхто не приєднався"}, тож тут тестовий учень: спробуйте поставити оцінку й написати коментар, а потім натисніть «Подивитися як студент». Коли приєднається справжній учень, тестовий зникне.</span></div>` : ""}
      <div class="spread"><div><div class="eyebrow">Прогрес навчання</div><h2>${esc(st.name || "Учень")}</h2><p class="small muted">Ваша оцінка навичок. Бачать лише викладачі та сам учень — у рейтинг не входить.</p></div></div>
      ${isYoung(c) ? monthlyStaff(sel) : ""}
      ${skillsView(sel, st, true)}
      ${demo ? "" : `<details class="panel"><summary><b>Слова з ваших занять</b> <span class="small muted">· рахується автоматично з карток і вправ</span></summary><div class="stack" style="margin-top:12px">${progressView(st, c, true)}</div></details>`}`;
  }
  const allSk = [...new Map(studs.flatMap(([id]) => skillsOf(S.progs?.[id])).map(s => [s.id, s])).values()].slice(0, 10);
  const rows = studs.map(([id, st]) => { const pr = S.progs?.[id], sk = skillsOf(pr);
    return `<tr><td><button class="link" data-act="progStu" data-arg="${esc(id)}"><b>${esc(st.name || "—")}</b></button><div class="small muted">${pr?.updatedAt ? "оцінено " + fmtDate(dstr(new Date(pr.updatedAt))) : "ще не оцінено"}</div></td>
      ${isYoung(c) ? `<td class="n">${monthlyOf(pr).some(x => x.m === curMonth()) ? `<span class="skdot" style="--c:var(--ok)">✓</span>` : `<button class="link small" data-act="progStu" data-arg="${esc(id)}">написати</button>`}</td>` : ""}
      ${allSk.map(s => { const x = sk.find(y => y.id === s.id), v = x ? Number(x.v) || 0 : null; return `<td class="n">${v == null ? "—" : v ? `<span class="skdot" style="--c:${skColor(v)}">${v}</span>` : `<span class="small muted">·</span>`}</td>`; }).join("")}
      <td><button class="btn sm" data-act="peOpen" data-arg="${esc(id)}">Оцінити</button></td></tr>`; }).join("");
  return `<div><div class="eyebrow">Прогрес навчання</div><h2>Навички учнів</h2><p class="small muted" style="max-width:62ch">Ви самі оцінюєте аудіювання, говоріння, читання, письмо та інші навички кожного учня (0–10). Учень бачить лише власну оцінку, ваші коментарі й цілі. Натисніть на ім'я, щоб побачити деталі й історію.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Учень</th>${isYoung(c) ? `<th class="n">Коментар за ${MONTHS[new Date().getMonth()]}</th>` : ""}${allSk.map(s => `<th class="n" title="${esc(s.name)}">${esc(s.han || "")} ${esc(s.name)}</th>`).join("")}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  const tabs = tabsHtml([["overview","Огляд"],["prog","Прогрес"],["lessons","Лексика за рівнями"],["cvl","Лексика з уроків"],["cards","Картки"],["grammar","Граматика"],["ex","Вправи"],["texts","Тексти"],["hw","ДЗ"],["rank","Рейтинг"],["settings","Налаштування"]], tab);
  let body = "";
  if (tab === "overview") body = classOverview(c);
  else if (tab === "lessons") body = classLessons(c);
  else if (tab === "cvl") body = classCv(c);
  else if (tab === "cards") body = previewNote() + cardsView();
  else if (tab === "grammar") body = previewNote() + grammarView();
  else if (tab === "ex") body = previewNote() + exView();
  else if (tab === "prog") body = classSkills(c);
  else if (tab === "rank") body = rankView(true, c.id);

    ${tabs}
    <div class="stack">${body}</div>
  </div>`;
}
function previewNote(){ return `<div class="note info"><span>👁</span><span><b>Режим перегляду викладача.</b> Ви бачите те саме, що й студенти цієї групи. Ваші відповіді не зберігаються і не потрапляють у рейтинг.</span></div>`; }

function classOverview(c){
  const entries = Object.entries(S.students).filter(([, st]) => st.classId === c.id);
  const ls = availLessons(null, c), total = wordsOf(ls).length;
  let m = 0, due = 0, act = 0;
  entries.forEach(([, st]) => { const s = statsOf(st, ls); m += s.mastered; due += s.due; if (st.log?.[today()]?.a) act++; });
  const invite = `<div class="note"><span>🔑</span><span>${c.kind === "individual"
    ? `Щоб <b>${esc(c.name)}</b> отримав доступ, надішліть йому посилання на платформу та код <span class="code">${esc(c.code)}</span>. Під час першого входу він створить профіль і одразу потрапить до свого кабінету.`
    : `Надішліть студентам посилання на платформу та код групи <span class="code">${esc(c.code)}</span>. Під час першого входу кожен створює профіль, і прогрес зберігається окремо для кожного.`}</span></div>`;
  return `
    <div class="tiles">
      <div class="tile key"><b>${entries.length}</b><span>${c.kind === "individual" ? "профіль учня" : "студентів у групі"}</span></div>
      <div class="tile"><b>${ls.length}</b><span>відкритих уроків</span></div>
      <div class="tile"><b>${total}</b><span>слів у доступі</span></div>
      <div class="tile"><b>${availGrammar(null, c).length}</b><span>тем граматики</span></div>
      <div class="tile"><b>${m}</b><span>опановано разом</span></div>
      <div class="tile"><b>${due}</b><span>чекають повторення</span></div>
      <div class="tile"><b>${act}</b><span>вчилися сьогодні</span></div>
    </div>
    ${entries.length ? "" : invite}
    <section><div class="sh"><h2>Студенти</h2>${entries.length ? `<button class="btn sm" data-act="exportCsv" data-arg="${esc(c.id)}">Експорт результатів (CSV)</button>` : ""}</div>${studentTable(entries, S.role === "admin" ? "" : c.teacherId)}</section>
    ${entries.length ? invite : ""}`;
}

const canAddLevelLessons = () => S.role === "admin";

  return `<div class="spread"><p class="muted" style="max-width:62ch">Лексика з ваших занять. ${solo ? "Ці слова бачить лише цей учень" : "Ці слова бачать лише студенти цієї групи"} у розділі «Лексика з уроків» і можуть вчити їх картками та вправами.</p>

      : emptyBox("课", "Ще немає слів із занять", "Після заняття натисніть «+ Слова з заняття» й додайте нову лексику: вручну, списком або з фото.", `<button class="btn primary" data-act="editCv" data-arg="">+ Слова з заняття</button>`)}`;

function classLessons(c){
  const course = c.course || "HSK1", levels = levelsUpTo(course);
  const secs = levels.map(h => {
    const ls = lessonsSorted().filter(l => l.hsk === h);
    if (!ls.length) return `<section><div class="sh"><h3>${lvName(h)}</h3></div>${emptyBox("课", "Уроків " + lvName(h) + " ще немає", "Додайте їх у бібліотеці.")}</section>`;
    const rows = ls.map(l => {
      const closed = (c.closed || []).includes(l.id);
      const solo = c.kind === "individual";
      const state = l.hidden ? `<span class="pill soft">Приховано для всіх</span>` : closed ? `<span class="pill warn">Закрито для ${solo ? "учня" : "групи"}</span>` : `<span class="pill ok">Відкрито</span>`;
      return `<tr><td><b>${esc(l.title)}</b></td><td class="n">${(l.words || []).length}</td><td>${state}</td>
        <td style="text-align:right"><button class="btn sm" data-act="toggleClassLesson" data-arg="${esc(l.id)}" ${l.hidden ? "disabled" : ""}>${closed ? (solo ? "Відкрити учню" : "Відкрити групі") : (solo ? "Закрити учню" : "Закрити групі")}</button>
        <button class="btn sm ghost" data-act="editLesson" data-arg="${esc(l.id)}">Редагувати</button></td></tr>`;
    }).join("");
    return `<section><div class="sh"><h3>${lvName(h)}</h3><span class="small muted">${wordsOf(ls).length} слів</span></div><div class="tablewrap"><table><thead><tr><th>Урок</th><th class="n">Слів</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join("");
  return `<div class="spread"><p class="muted" style="max-width:60ch">${c.kind === "individual" ? "Курс учня" : "Курс групи"}: <b>${lvName(course)}</b>. ${c.kind === "individual" ? "Учень бачить" : "Студенти бачать"} уроки всіх рівнів до ${lvName(course)} включно й можуть перемикатися між ними, щоб повторювати слова. Вищі рівні не показуються.</p>${canAddLevelLessons() ? `<button class="btn primary sm" data-act="editLesson" data-arg="">+ Новий урок</button>` : ""}</div>
    ${canAddLevelLessons() ? "" : `<div class="note info"><span>ℹ️</span><span>Уроки рівнів HSK — спільна програма школи, нові уроки тут додає адміністратор. Слова зі своїх занять додавайте на вкладці <button class="link" data-act="tab" data-arg="cvl">«Лексика з уроків»</button>.</span></div>`}${secs}`;
}

function parseBulk(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const f = line.split(/\s*[|\t]\s*/);
    return {...blankWord(), h: f[0] || "", p: f[1] || "", uk: f[2] || ""};
  }).filter(w => w.h);
}
const needsFill = w => w.h && (!w.p || !w.uk || w.ex.filter(x => x.zh).length < 3);
function mergeWords(list){
  const e = S.edit; e.words = e.words.filter(w => w.h || w.p || w.uk);
  for (const raw of list){
    const n = normWord(raw); const ex = e.words.find(w => w.h === n.h);
    if (ex){
      for (const k of ["p","uk"]) if (!ex[k] && n[k]) ex[k] = n[k];
      const have = ex.ex.filter(x => x.zh), add = n.ex.filter(x => x.zh && !have.some(h => h.zh === x.zh));
      ex.ex = [...have, ...add].slice(0, 3); while (ex.ex.length < 3) ex.ex.push(blankEx());
    } else e.words.push({...n, id: rid("w")});
  }
  if (!e.words.length) e.words.push(blankWord());
}
const AI_SHAPE = 'Відповідай лише JSON-масивом об\'єктів {"h":"ієрогліфи","p":"піньїнь з тоновими знаками","uk":"короткий український переклад","ex":[{"zh":"речення","py":"піньїнь речення","uk":"переклад"}, ... рівно 3 речення]}. Кожне речення має містити h точно в такому написанні, бути коротким і відповідати рівню.';
const aiWord = x => ({h: String(x.h || ""), p: String(x.p || ""), uk: String(x.uk || ""), ex: Array.isArray(x.ex) ? x.ex.slice(0, 3).map(y => ({zh: String(y?.zh || ""), py: String(y?.py || ""), uk: String(y?.uk || "")})) : []});

function aiErr(err){

// ---------- grammar editor
// Theory markup: one block per line prefix; lines without a prefix continue the previous text.
const GPFX = {T: "text", H: "h", F: "formula", E: "examples", TIP: "tip", M: "mistake", TAB: "table", R: "row"};
function blocksToText(blocks){
  const out = [];
  for (const b of blocks || []){
    if (b.type === "text") out.push("T: " + (b.text || ""));
    else if (b.type === "h") out.push("H: " + (b.text || ""));
    else if (b.type === "formula") out.push("F: " + (b.text || ""));
    else if (b.type === "tip") out.push("TIP: " + (b.text || ""));
    else if (b.type === "examples") out.push((b.items || []).map(x => `E: ${x.zh || ""} | ${x.py || ""} | ${x.uk || ""}`).join("\n"));
    else if (b.type === "mistake") out.push(`M: ${b.wrong || ""} | ${b.right || ""} | ${b.why || ""}`);
    else if (b.type === "table") out.push(["TAB: " + (b.head || []).join(" | "), ...(b.rows || []).map(r => "R: " + r.join(" | "))].join("\n"));
  }
  return out.join("\n\n");
}
function textToBlocks(t){
  const blocks = []; let last = null;
  const cells = s => s.split("|").map(x => x.trim());
  for (const raw of String(t || "").split(/\r?\n/)){
    const line = raw.trimEnd();
    if (!line.trim()){ last = null; continue; }
    const m = line.match(/^(TIP|TAB|T|H|F|E|M|R)\s*:\s?(.*)$/i);
    if (!m){ if (last && ["text","tip"].includes(last.type)) last.text += "\n" + line.trim(); else blocks.push(last = {type: "text", text: line.trim()}); continue; }
    const kind = GPFX[m[1].toUpperCase()], v = m[2].trim();
    if (kind === "examples"){
      const [zh, py, uk] = cells(v);
      if (last && last.type === "examples") last.items.push({zh, py: py || "", uk: uk || ""});
      else blocks.push(last = {type: "examples", items: [{zh, py: py || "", uk: uk || ""}]});
    } else if (kind === "row"){
      if (last && last.type === "table") last.rows.push(cells(v));
      else blocks.push(last = {type: "table", head: [], rows: [cells(v)]});
    } else if (kind === "table") blocks.push(last = {type: "table", head: cells(v), rows: []});
    else if (kind === "mistake"){ const [wrong, right, why] = cells(v); blocks.push(last = {type: "mistake", wrong, right: right || "", why: why || ""}); }
    else blocks.push(last = {type: kind, text: v});
  }
  return blocks.filter(b => b.type !== "examples" || b.items.some(x => x.zh));
}
const blankChoice = () => ({type: "choice", q: "", zh: "", opts: ["", "", "", ""], a: 0, why: ""});
const blankOrder = () => ({type: "order", q: "", uk: "", words: "", a: "", alt: "", why: ""});
function normGEx(q){
  if (q.type === "order") return {type: "order", q: q.q || "", uk: q.uk || "", words: (q.words || []).join(" "), a: q.a || "", alt: (q.alt || []).join("; "), why: q.why || ""};
  const opts = (q.opts || []).slice(); while (opts.length < 4) opts.push("");
  return {type: "choice", q: q.q || "", zh: q.zh || "", opts, a: Number(q.a) || 0, why: q.why || ""};
}

function gedBuild(){
  const e = S.gedit, tr = s => String(s || "").trim(), errs = [];
  const ex = e.ex.map((q, i) => {
    if (q.type === "order"){
      const words = tr(q.words).split(/\s+/).filter(Boolean);
      if (words.length < 2){ errs.push(`вправа ${i + 1}: потрібно щонайменше два слова`); return null; }
      const out = {type: "order", words, a: tr(q.a) || words.join(""), uk: tr(q.uk), why: tr(q.why)};
      const alt = tr(q.alt).split(/\s*;\s*/).filter(Boolean); if (alt.length) out.alt = alt;
      if (tr(q.q)) out.q = tr(q.q);
      return out;
    }
    const filled = q.opts.map((o, k) => ({o: tr(o), k})).filter(x => x.o);
    const a = filled.findIndex(x => x.k === q.a);
    if (!tr(q.q)) errs.push(`вправа ${i + 1}: немає питання`);
    else if (filled.length < 2) errs.push(`вправа ${i + 1}: потрібно щонайменше два варіанти`);
    else if (a < 0) errs.push(`вправа ${i + 1}: позначте правильний варіант`);
    const out = {type: "choice", q: tr(q.q), opts: filled.map(x => x.o), a: Math.max(0, a), why: tr(q.why)};
    if (tr(q.zh)) out.zh = tr(q.zh);
    return out;
  }).filter(Boolean);
  if (!tr(e.title)) errs.unshift("вкажіть назву теми");
  const blocks = textToBlocks(e.theory);
  if (!blocks.length) errs.push("додайте пояснення");
  return {errs, body: {hsk: e.hsk, order: Number(e.order) || 1, lesson: tr(e.lesson), title: tr(e.title), pattern: tr(e.pattern), summary: tr(e.summary), hidden: !!e.hidden, blocks, ex, updatedAt: Date.now(), updatedBy: S.uid || ""}};
}
async function gedSave(){
  const e = S.gedit, {errs, body} = gedBuild();
  if (errs.length){ e.msg = "Перевірте: " + errs.join("; ") + "."; render(); return; }
  const id = e.id || rid("G");
  e.busy = "save"; render();
  try { await S.db.doc("grammar/" + id).set(body); toast(e.id ? "Тему збережено" : "Тему створено"); S.view = e.back || {name: "library"}; S.libMode = "grammar"; S.gedit = null; render(); }
  catch(err){ e.busy = ""; e.msg = "Не вдалося зберегти: " + (err.code === "invalid_argument" ? "немає прав на редагування (потрібна роль Editor) або тема завелика." : "спробуйте ще раз."); render(); }
}
async function gedAI(){
  const e = S.gedit;
  if (!e.title.trim() && !e.theory.trim()){ toast("Спершу вкажіть назву й пояснення"); return; }
  e.busy = "ai"; e.msg = "ШІ складає вправи…"; render();
  try {
    const res = await S.sample.json(`Ти помічник викладачки китайської для україномовних студентів, рівень ${lvName(e.hsk)}. Тема граматики: «${e.title}» (${e.pattern}).\nПояснення:\n${e.theory}\n\nСклади 4 вправи на цю тему: 3 типу choice і 1 типу order. Використовуй лише лексику рівня ${lvName(e.hsk)} і нижче. Відповідай лише JSON-масивом. choice: {"type":"choice","q":"питання українською або китайське речення з пропуском ＿＿","opts":["4 варіанти"],"a":індекс правильного з 0,"why":"коротке пояснення українською"}. order: {"type":"order","words":["слова речення в правильному порядку"],"a":"речення з розділовими знаками","uk":"переклад","why":"пояснення"}.`, {cache: false});
    if (!Array.isArray(res)) throw {code: "invalid_json"};
    const add = res.filter(q => q && (q.type === "order" ? Array.isArray(q.words) : Array.isArray(q.opts))).map(normGEx);
    e.ex = e.ex.filter(q => q.type === "order" ? q.words.trim() : q.q.trim() || q.opts.some(o => o.trim())).concat(add);
    e.msg = `Додано ${add.length} ${plural(add.length,"вправу","вправи","вправ")}. Перевірте їх перед збереженням.`;
  } catch(err){ e.msg = aiErr(err); }
  e.busy = ""; render();
}

function dashView(){
  const ctx = currentCtx();
  if (!ctx.lessons.length) return emptyBox("课", "Уроки ще не відкрито", "Щойно викладачка додасть урок для вашої групи, він з'явиться тут автоматично.");
  const st = statsOf(S.me, ctx.lessons), place = myPlace();
  const lv = statsOf(S.me, ctx.lvLessons);
  const lessonBars = ctx.lvLessons.map(l => { const s = statsOf(S.me, [l]); return bar(`<b>${esc(l.title)}</b>${l.sub ? ` <span class="muted">${esc(l.sub)}</span>` : ""}`, `${s.mastered}/${s.total}`, s.mastered, s.learning, s.total); }).join("") || `<p class="small muted">Для ${lvName(ctx.level)} уроків поки немає.</p>`;
  const hskBars = ctx.levels.map(h => { const ls = ctx.lessons.filter(l => l.hsk === h); const s = statsOf(S.me, ls); return bar(`<b>${lvName(h)}</b>`, `${s.total ? Math.round(100 * s.mastered / s.total) : 0}% · ${s.mastered}/${s.total}`, s.mastered, s.learning, s.total); }).join("");
  const wrong = (S.me.wrong || []).map(id => allWords().find(w => w.id === id)).filter(Boolean).slice(0, 12);
  const cta = st.due
    ? {t: `${st.due} ${plural(st.due,"слово чекає","слова чекають","слів чекають")} на повторення`, b: "Повторити", d: "due"}
    : lv.fresh ? {t: `${lv.fresh} нових слів ${lvName(ctx.level)} чекають на вас`, b: "Вчити нові", d: "new"}
    : {t: "На сьогодні все повторено", b: "Переглянути картки", d: "all"};
  return `
    <div class="tiles">
      <div class="tile key"><b>${st.mastered}</b><span>опановано слів</span></div>
      <div class="tile"><b>${st.due}</b><span>повторити сьогодні</span></div>
      <div class="tile"><b>${st.learning}</b><span>вивчаються зараз</span></div>
      <div class="tile"><b>${st.streak}</b><span>${plural(st.streak,"день","дні","днів")} поспіль</span></div>
      <div class="tile"><b>${place ? place : "—"}</b><span>місце в рейтингу</span></div>
      <div class="tile"><b>${st.acc == null ? "—" : st.acc + "%"}</b><span>правильних відповідей</span></div>
      <div class="tile"><b>${st.exDone}</b><span>вправ виконано</span></div>
      <div class="tile"><b>${st.points}</b><span>балів</span></div>
      <button class="tile tilebtn" data-act="tab" data-arg="ach"><b>${Object.keys(S.me.ach || {}).length}<small class="muted"> / ${ACH.length}</small></b><span>нагород · відкрити →</span></button>
    </div>
    <div class="panel spread" style="background:var(--accent);border-color:var(--accent);color:var(--accent-fg)">
      <div><h3>${cta.t}</h3>
      <p class="small" style="opacity:.85">Слово опановане, коли ви згадали його у ${MASTER} різні дні з інтервалами 1 → 2 → 4 дні.</p></div>
      <button class="btn gold" data-act="startDeck" data-arg="${cta.d}">${cta.b}</button>
    </div>
    <div class="two">
      <div class="panel stack" style="gap:14px"><div class="sh" style="margin:0"><h3>Прогрес за уроками</h3><span class="small muted"><span style="color:var(--accent)">■</span> опановано <span style="color:var(--gold)">■</span> вчите</span></div>${levelBar(ctx, "vocab")}<div class="prog">${lessonBars}</div></div>
      <div class="panel stack" style="gap:18px"><div><div class="sh"><h3>Рівні HSK</h3></div><div class="prog">${hskBars}</div></div>
        <div><div class="sh"><h3>Слова з помилками</h3>${wrong.length ? `<button class="link" data-act="startEx" data-arg="mistakes">Тренувати</button>` : ""}</div>

    </div>`;
}

const ACH = buildAch();
function achValues(me){
  const v = {
    mastered: masteredAll(me), streak: Math.max(me.bestStreak || 0, streak(me)), cor: me.cor || 0, exDone: me.exDone || 0,
    gram: Object.values(me.gram || {}).filter(g => g.full || (g.n && g.best === g.n)).length,
    perfect: me.perfectN || 0, goalDays: Object.values(me.log || {}).filter(x => (x.a || 0) >= DAILY_GOAL).length,
    points: me.points || 0, bankAdded: me.bankAdded || 0, bankLearned: me.bankLearned || 0
  };
  if (me === S.me){ Object.assign(v, hwAchValues()); if (S.uid && !S.testAs){ const b = bestWins(S.uid); v.bestN = b.n; v.bestFirst = b.first; } }
  for (const h of HSK.slice(0, 6)){
    const ws = wordsOf(lessonsSorted().filter(l => l.hsk === h && !l.hidden));
    const m = ws.filter(w => (me.words?.[w.id]?.s || 0) >= MASTER).length;
    v["lv:" + h] = ws.length ? Math.floor(100 * m / ws.length) : 0; v["lvn:" + h] = ws.length;
  }
  for (const k of Object.keys(me.flags || {})) v["f:" + k] = me.flags[k] ? 1 : 0;
  return v;
}
// Called after every learning action (from saveMe). Records new unlocks and queues the celebration.
function noteFlags(me){
  const d = new Date(), hr = d.getHours(), day = d.getDay(), lg = me.log?.[today()] || {};
  me.flags = me.flags || {};
  if (!(lg.a > 0)) return;
  if (hr >= 23 || hr < 4) me.flags.owl = 1;
  if (hr >= 4 && hr < 7) me.flags.bird = 1;
  if (day === 0 || day === 6) me.flags.weekend = 1;
  if ((lg.pk || 0) > 0 && (lg.pe || 0) > 0 && (lg.pg || 0) > 0) me.flags.three = 1;
  if ((lg.p || 0) >= 88) me.flags.eight = 1;
  me.bestStreak = Math.max(me.bestStreak || 0, streak(me));
}
function checkAch(){
  const me = S.me; if (!me || staffUI()) return 0;
  noteFlags(me);
  me.ach = me.ach || {};
  const v = achValues(me), fresh = [];
  for (const a of ACH){
    if (me.ach[a.id]) continue;
    if (a.cat === "levels" && !v["lvn:" + a.metric.slice(3)]) continue;
    if ((v[a.metric] || 0) >= a.need){ me.ach[a.id] = today(); fresh.push(a.id); }
  }
  if (fresh.length){
    S.achQueue = [...(S.achQueue || []), ...fresh];
    if (!S.modal || S.modal.kind === "ach") setTimeout(showNextAch, 450);
  }
  return fresh.length;
}
function showNextAch(){
  const q = S.achQueue || []; if (!q.length){ if (S.modal?.kind === "ach"){ S.modal = null; renderModal(); render(); } return; }
  if (S.modal && S.modal.kind !== "ach") return;
  const id = q.shift(), a = ACH.find(x => x.id === id); if (!a) return showNextAch();
  S.modal = {kind: "ach", a, left: q.length}; renderModal(); playAch(a.tier);
}

}

// homework award values for the signed-in student (her tasks, answers and the teacher's checks)
function hwAchValues(){
  const v = {hwChecked: 0, hwOnTime: 0, hwRun: 0, hwEarly: 0, hwClean: 0, hwFixed: 0, hwTasks: 0, hwPerfect: 0};
  if (!S.uid || staffUI() || S.testAs || !S.hw) return v;
  const td = today(), mine = hwAll().filter(h => hwForMe(h)).sort((a, b) => String(a.due || a.date).localeCompare(String(b.due || b.date)));
  let run = 0;
  for (const h of mine){
    const f = hwFb(h.id, S.uid), sb = hwSub(h.id, S.uid);
    if (hwState(h, S.uid) !== "checked"){ if (h.due && h.due < td) run = 0; continue; }
    v.hwChecked++;
    const onTime = !h.due || (sb?.date && sb.date <= h.due);
    if (onTime){ v.hwOnTime++; run++; v.hwRun = Math.max(v.hwRun, run); } else run = 0;
    if (h.due && sb?.date && sb.date < h.due) v.hwEarly++;
    if (f?.redos) v.hwFixed++; else v.hwClean++;
    const ts = hwTasks(h);
    if (ts.length){ const rs = ts.map(t => hwTaskRes(h, t, S.uid)); if (rs.every(r => r && r.done)){ v.hwTasks++; if (ts.length >= 2 && rs.every(r => r.perfect)) v.hwPerfect++; } }
  }
  return v;
}

function hwTaskBuilder(e){

  const gram = grammarSorted().filter(g => !g.hidden && (!lv.length || lv.some(x => lvIdx(g.hsk) <= lvIdx(x))));
  const cvs = cls.flatMap(id => cvOf(id).map(d => ({d, c: S.classes[id]})));
  const k = e.addKind || "text";

      <optgroup label="Лексика за рівнями (уроки HSK)">${lessons.map(l => `<option value="${esc(l.id)}">${esc(l.hsk)} · ${esc(l.title || l.id)}</option>`).join("")}</optgroup>

    : k === "ex" ? `<div class="field"><label for="hwk-type">Вправа</label><select class="input" id="hwk-type">${hwGames().map(g => `<option value="${g.id}">${g.glyph} ${esc(g.name)}</option>`).join("")}</select></div>${srcSel}`
    : k === "text" ? `<div class="field"><label for="hwk-g">Текст</label><select class="input" id="hwk-g">${txs.map(x => `<option value="${esc(x.id)}">${esc(x.hsk)} · ${esc(x.zh)} — ${esc(x.uk)}</option>`).join("")}</select></div>`
    : `<div class="field"><label for="hwk-g">Тема граматики</label><select class="input" id="hwk-g">${gram.map(g => `<option value="${esc(g.id)}">${esc(g.hsk)} · ${esc(g.title)}</option>`).join("")}</select></div>`;
  return `<fieldset class="field hwset"><legend>Завдання на платформі (необов'язково)</legend>
    <span class="hint">Учень відкриває кожне одним натиском, а ви бачите результат: скільки слів повторено, скільки правильних відповідей.</span>
    ${e.tasks.length ? `<div class="hwtasks" style="margin:8px 0">${e.tasks.map((t, i) => `<span class="hwtask static"><span class="han tg" aria-hidden="true">${hwTaskGlyph(t)}</span><span class="tl">${esc(hwTaskLabel(t))}</span><button class="link small" type="button" data-act="hwTaskDel" data-arg="${i}" aria-label="Прибрати">✕</button></span>`).join("")}</div>` : ""}
    <div class="small" style="margin-top:6px"><b>Що додати:</b></div>
    <div class="hwkinds" role="group" aria-label="Що додати">${Object.entries(HW_KINDS).map(([v, n]) => `<button type="button" class="chip ${v === k ? "on" : ""}" aria-pressed="${v === k}" data-act="hwKind" data-arg="${v}"><span class="han">${HW_KIND_GLYPH[v]}</span> ${HW_KIND_SHORT[v]}</button>`).join("")}</div>
    <input type="hidden" id="hwk-kind" value="${k}">

у телефонує Девід?","o":["Учительці Ван","Мамі","Другові"],"a":0},{"q":"Де зараз учителька Ван?","o":["У лікарні","У школі","Удома"],"a":0},{"q":"Коли вона повернеться?","o":["О 15:00","О 13:00","Завтра"],"a":0}],"en":{"topic":"Telephone","uk":"A phone call","s":[{"uk":"David: Hello, good afternoon! Excuse me, is Teacher Wang there?"},{"uk":"Teacher Wang's daughter: She isn't here, she's gone to the hospital."},{"uk":"David: When will she be back?"},{"uk":"Teacher Wang's daughter: At three in the afternoon. Who is this?"},{"uk":"David: I'm her student, my name is David."},{"uk":"Teacher Wang's daughter: OK, goodbye!"},{"uk":"David: Thank you, goodbye!"}],"q":[{"q":"Who is David calling?","o":["Teacher Wang","His mum","A friend"]},{"q":"Where is Teacher Wang now?","o":["At the hospital","At school","At home"]},{"q":"When will she be back?","o":["At 15:00","At 13:00","Tomorrow"]}]}},{"id":"T1-08","hsk":"HSK1","topic":"Навчання","zh":"学汉语","py":"xué Hàn yǔ","uk":"Вивчаю китайську","s":[{"zh":"我叫安娜，我是乌克兰人。","py":"wǒ jiào Ān nà wǒ shì Wū kè lán rén","uk":"Мене звати Анна, я українка."},{"zh":"我在基辅学习汉语。","py":"wǒ zài Jī fǔ xué xí Hàn yǔ","uk":"Я вивчаю китайську в Києві."},{"zh":"我的汉语老师是中国人。","py":"wǒ de Hàn yǔ lǎo shī shì Zhōng guó rén","uk":"Моя вчителька китайської — китаянка."},{"zh":"她很好，我们都很喜欢她。","py":"tā hěn hǎo wǒ men dōu hěn xǐ huan tā","uk":"Вона дуже хороша, ми всі її любимо."},{"zh":"我会写一百个汉字。","py":"wǒ huì xiě yì bǎi gè Hàn zì","uk":"Я вмію писати сто ієрогліфів."},{"zh":"明年我想去中国。","py":"míng nián wǒ xiǎng qù Zhōng guó","uk":"Наступного року я хочу поїхати до Китаю."},{"zh":"我想看看北京，认识很多中国朋友。","py":"wǒ xiǎng kàn kan Běi jīng rèn shi hěn duō Zhōng guó péng you","uk":"Я хочу побачити Пекін і познайомитися з багатьма китайськими друзями."}],"q":[{"q":"Звідки Анна?","o":["З України","З Китаю","З Пекіна"],"a":0},{"q":"Скільки ієрогліфів вона вміє писати?","o":["100","10","1000"],"a":0},{"q":"Що вона хоче зробити наступного року?","o":["Поїхати до Китаю","Купити комп'ютер","Стати вчителькою"],"a":0}],"en":{"topic":"Studies","uk":"Learning Chinese","s":[{"uk":"My name is Anna, I'm Ukrainian."},{"uk":"I'm learning Chinese in Kyiv."},{"uk":"My Chinese teacher is Chinese."},{"uk":"She's very good, we all love her."},{"uk":"I can write a hundred characters."},{"uk":"Next year I want to go to China."},{"uk":"I want to see Beijing and make lots of Chinese friends."}],"q":[{"q":"Where is Anna from?","o":["From Ukraine","From China","From Beijing"]},{"q":"How many characters can she write?"},{"q":"What does she want to do next year?","o":["Go to China","Buy a computer","Become a teacher"]}]}},{"id":"T2-01","hsk":"HSK2","topic":"Свято","zh":"我的生日","py":"wǒ de shēng rì","uk":"Мій день народження","s":[{"zh":"今天是我的生日，我十八岁了。","py":"jīn tiān shì wǒ de shēng rì wǒ shí bā suì le","uk":"Сьогодні мій день народження, мені виповнилося вісімнадцять."},{"zh":"早上，妈妈给我做了面条。","py":"zǎo shang mā ma gěi wǒ zuò le miàn tiáo","uk":"Зранку мама приготувала мені локшину."},{"zh":"她说，生日吃面条，身体会很好。","py":"tā shuō shēng rì chī miàn tiáo shēn tǐ huì hěn hǎo","uk":"Вона каже: якщо на день народження їсти локшину, будеш здоровим."},{"zh":"下午，朋友们来我家，送给我一块手表。","py":"xià wǔ péng you men lái wǒ jiā sòng gěi wǒ yí kuài shǒu biǎo","uk":"По обіді до мене прийшли друзі й подарували годинник."},{"zh":"这块手表是红色的，非常漂亮。","py":"zhè kuài shǒu biǎo shì hóng sè de fēi cháng piào liang","uk":"Годинник червоний і дуже гарний."},{"zh":"晚上，我们一起去唱歌、跳舞。","py":"wǎn shang wǒ men yì qǐ qù chàng gē tiào wǔ","uk":"Увечері ми разом пішли співати й танцювати."},{"zh":"我们玩得很快乐。","py":"wǒ men wán de hěn kuài lè","uk":"Ми чудово розважилися."},{"zh":"这是我最高兴的一天。","py":"zhè shì wǒ zuì gāo xìng de yì tiān","uk":"Це був мій найщасливіший день."}],"q":[{"q":"Скільки мені виповнилося?","o":["18","17","20"],"a":0},{"q":"Що мама приготувала зранку?","o":["Локшину","Рис","Торт"],"a":0},{"q":"Що подарували друзі?","o":["Годинник","Книжку","Квіти"],"a":0}],"en":{"topic":"Celebration","uk":"My birthday","s" ,"uk":"О третій десять Сяо Лі нарешті прийшов."},{"zh":"他说：“路上车太多了。”","py":"tā shuō lù shang chē tài duō le","uk":"Він сказав: «На дорозі було забагато машин»."},{"zh":"电影已经开始了，但是我们还是很高兴。","py":"diàn yǐng yǐ jīng kāi shǐ le dàn shì wǒ men hái shi hěn gāo xìng","uk":"Фільм уже почався, але ми все одно були раді."}],"q":[{"q":"О котрій починався фільм?","o":["О 15:00","О 14:30","О 15:10"],"a":0},{"q":"Скільки я вже чекав, коли подзвонив Сяо Лі?","o":["Пів години","Годину","10 хвилин"],"a":0},{"q":"Чому Сяо Лі запізнився?","o":["На дорозі було багато машин","Він проспав","Він забув про кіно"],"a":0}],"en":{"topic":"Friends","uk":"Waiting for a friend","s":[{"uk":"Today Xiao Li and I were going to the cinema."},{"uk":"The film started at three, and I arrived at half past two."},{"uk":"I waited half an hour, but Xiao Li still didn't come."},{"uk":"I called him, and he said: \"Sorry, I'm on my way, I'll be there soon!\""},{"uk":"At ten past three Xiao Li finally arrived."},{"uk":"He said: \"There were too many cars on the road.\""},{"uk":"The film had already started, but we were still happy."}],"q":[{"q":"What time did the film start?","o":["At 15:00","At 14:30","At 15:10"]},{"q":"How long had I been waiting when I called Xiao Li?","o":["Half an hour","An hour","10 minutes"]},{"q":"Why was Xiao Li late?","o":["There were a lot of cars on the road","He overslept","He forgot about the film"]}]}},{"id":"T2-08","hsk":"HSK2","topic":"Школа","zh":"我的汉语老师","py":"wǒ de Hàn yǔ lǎo shī","uk":"Моя вчителька китайської","s":[{"zh":"我的汉语老师姓张，她是北京人。","py":"wǒ de Hàn yǔ lǎo shī xìng Zhāng tā shì Běi jīng rén","uk":"Мою вчительку китайської звати пані Чжан, вона з Пекіна."},{"zh":"张老师三十多岁，非常漂亮。","py":"Zhāng lǎo shī sān shí duō suì fēi cháng piào liang","uk":"Учительці Чжан за тридцять, вона дуже гарна."},{"zh":"她上课的时候常常笑，我们都很喜欢她。","py":"tā shàng kè de shí hou cháng cháng xiào wǒ men dōu hěn xǐ huan tā","uk":"На уроках вона часто усміхається, і ми всі її дуже любимо."},{"zh":"她给我们准备了很多有意
