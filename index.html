// ---------- boot
async function boot(){
  const c = window.asianishRuntime;
  if (!c || typeof c.use !== "function"){ S.phase = "offline"; render(); return; }
  const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
  S.db = db; S.user = user;
  // Role comes only from the platform's access settings (Share menu), never from names or browser storage.
  if (user){
    try {
      const [own, ed, id] = await Promise.all([user.isOwner(), user.canEdit(), user.id()]);
      S.role = own ? "admin" : ed ? "teacher" : "student"; S.isTeacher = !!(own || ed); S.uid = id || null;
    } catch(e){}
  }
  c.use("sample").then(s => { S.sample = s; if (S.view.name === "edit") render(); });
  c.use("downloads").then(d => { S.downloads = d; });
  if (!db){ S.phase = "offline"; render(); return; }
  const fail = e => { if (e && e.code === "revoked"){ S.phase = "offline"; render(); } };
  db.doc("settings/main").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; S.loaded.settings = true; onData(); }, fail);
  db.collection("cvocab").onSnapshot(q => { S.cvocab = {}; q.docs.forEach(d => S.cvocab[d.id] = {...d.data(), id: d.id}); S.loaded.cvocab = true; onData(); }, fail);
  db.collection("teachers").onSnapshot(q => { S.teachers = {}; q.docs.forEach(d => S.teachers[d.id] = {...d.data(), id: d.id}); S.loaded.teachers = true; onData(); }, fail);
  db.collection("classes").onSnapshot(q => { S.classes = {}; q.docs.forEach(d => S.classes[d.id] = {...d.data(), id: d.id}); S.loaded.classes = true; onData(); }, fail);
  db.collection("lessons").onSnapshot(q => { S.lessons = {}; q.docs.forEach(d => S.lessons[d.id] = {...d.data(), id: d.id}); S.loaded.lessons = true; onData(); }, fail);
  db.collection("grammar").onSnapshot(q => { S.grammar = {}; q.docs.forEach(d => S.grammar[d.id] = {...d.data(), id: d.id}); S.loaded.grammar = true; onData(); }, fail);
  db.collection("students").onSnapshot(q => { S.students = {}; q.docs.forEach(d => S.students[d.id] = d.data()); S.loaded.students = true; syncMe(); onData(); }, fail);
  // Skills progress: staff read every student's doc; a student can read only her own (database rules enforce this).
  if (S.isTeacher) db.collection("progress").onSnapshot(q => { S.progs = {}; q.docs.forEach(d => S.progs[d.id] = d.data()); if (S.phase === "ready" && !S.pedit && !S.medit && S.view.tab === "prog") render(); }, () => {});
  else if (S.uid) db.doc("progress/" + S.uid).onSnapshot(sn => { S.myProg = sn.exists ? sn.data() : null; if (S.phase === "ready" && S.view.tab === "prog") render(); }, () => {});
  if (S.isTeacher){
    db.collection("materials").onSnapshot(q => { S.materials = {}; q.docs.forEach(d => S.materials[d.id] = {...d.data(), id: d.id}); }, fail);
    db.collection("staff").onSnapshot(q => { S.staff = {}; q.docs.forEach(d => S.staff[d.id] = d.data()); if (S.phase === "ready" && S.view.name === "settings") renderTeam(); }, fail);
  }
  registerStaff();
}

  if (/wordwall|quizlet|kahoot|learningapps|bamboozle|quizizz|blooket|baamboozle/.test(h)) return "game";
  if (/soundcloud|spotify|podcast/.test(h)) return "audio";
  if (/\.pdf($|\?)/i.test(url) || /docs\.google\.com\/document/.test(url)) return "print";
  if (/\.(png|jpe?g|webp|gif)($|\?)/i.test(url) || /pinterest/.test(h)) return "img";
  return "";
}

// =====================================================================
// PROGRESS — learning progress on the teacher's own lessons («Лексика з уроків»).
// Shown only in the student's own cabinet and to staff; not part of the ranking.
// =====================================================================
const PROG_ST = {m: ["Вивчено", "var(--ok)"], l: ["Вчить", "var(--gold)"], n: ["Ще не відкрито", "var(--line)"]};
function wordStatus(st, wid){
  const p = st?.words?.[wid]; if (!p) return "n";
  if (p.s >= MASTER) return "m";
  return "l";
}
function progData(st, cls){
  const d = today(), lessons = cvOf(cls?.id).map(cvLesson);
  let T = {total: 0, m: 0, l: 0, n: 0, ok: 0, bad: 0, due: 0};
  const hard = [];
  const rows = lessons.map(l => {
    const r = {l, total: 0, m: 0, l2: 0, n: 0, ok: 0, bad: 0, due: 0, words: []};
    for (const w of l.words || []){
      if (!w || !w.id) continue;
      const s = wordStatus(st, w.id), p = st?.words?.[w.id] || {};
      r.total++; r[s === "l" ? "l2" : s]++; r.ok += p.ok || 0; r.bad += p.bad || 0;
      if (p.due && p.due <= d && s !== "n" && p.s < 6) r.due++;
      r.words.push({w, s, p});
      if ((p.bad || 0) >= 2 && (p.bad || 0) > (p.ok || 0) && s !== "m") hard.push({w, p, lt: l.title});
    }
    r.pct = r.total ? Math.round(100 * r.m / r.total) : 0;
    r.acc = r.ok + r.bad ? Math.round(100 * r.ok / (r.ok + r.bad)) : null;
    T.total += r.total; T.m += r.m; T.l += r.l2; T.n += r.n; T.ok += r.ok; T.bad += r.bad; T.due += r.due;
    return r;
  });
  T.pct = T.total ? Math.round(100 * T.m / T.total) : 0;
  T.acc = T.ok + T.bad ? Math.round(100 * T.ok / (T.ok + T.bad)) : null;
  hard.sort((a, b) => (b.p.bad - b.p.ok) - (a.p.bad - a.p.ok));
  // activity over the last 4 weeks (any learning action)
  const days = []; for (let k = 27; k >= 0; k--){ const dd = addDays(d, -k); days.push({d: dd, a: st?.log?.[dd]?.a || 0}); }
  const active = days.filter(x => x.a > 0).length;
  const lastSeen = Object.keys(st?.log || {}).filter(k => st.log[k]?.a).sort().pop() || "";
  return {rows, T, hard: hard.slice(0, 10), days, active, lastSeen};
}
function progBar(m, l, n, big){
  const t = m + l + n || 1, seg = (v, c) => v ? `<i style="width:${100 * v / t}%;background:${c}"></i>` : "";
  return `<div class="pbar ${big ? "big" : ""}" role="img" aria-label="Вивчено ${m}, вчить ${l}, не відкрито ${n}">${seg(m, PROG_ST.m[1])}${seg(l, PROG_ST.l[1])}${seg(n, PROG_ST.n[1])}</div>`;
}
const progTile = (v, label, sub) => `<div class="ptile"><span class="v num">${v}</span><span class="small">${label}</span>${sub ? `<span class="small muted">${sub}</span>` : ""}</div>`;
function progressView(st, cls, forStaff){

    </details>`).join("");
  const hard = P.hard.length ? `<div class="panel"><b>Складні слова</b><p class="small muted">Слова з занять, у яких ${forStaff ? "учень найчастіше помиляється" : "ви найчастіше помиляєтеся"}.</p>
    <div class="pwords">${P.hard.map(x => `<span class="pw hard" title="${esc(x.lt)}"><span class="zh">${esc(x.w.h)}</span><small>${esc(x.w.uk || "")} · помилок ${x.p.bad}</small></span>`).join("")}</div></div>` : "";
  return `${head}${tiles}<div class="panel"><div class="spread"><b>Загалом</b>${legend}</div>${progBar(T.m, T.l, T.n, true)}</div>
    <div class="two">${act}${hard || `<div class="panel"><b>Складні слова</b><p class="small muted">Поки що немає — так тримати!</p></div>`}</div>
    <section class="stack" style="gap:10px"><div class="sh"><h2>По заняттях</h2><span class="small muted">Натисніть на заняття, щоб побачити кожне слово</span></div>${lessons}</section>`;
}

// Stored in progress/{studentId}. Database rules: staff read & write every doc; a student can read
// only the doc with her own id; nobody else can read it.
// =====================================================================
const SKILLS_DEF = [
  {id:"listen", han:"听", name:"Аудіювання"}, {id:"speak", han:"说", name:"Говоріння"},
  {id:"read",   han:"读", name:"Читання"},    {id:"write", han:"写", name:"Письмо"},
  {id:"hanzi",  han:"字", name:"Ієрогліфи"},  {id:"tones", han:"音", name:"Вимова й тони"},
  {id:"gram",   han:"语", name:"Граматика"},  {id:"vocab", han:"词", name:"Лексика"}
];
const SK_LEVELS = [[0, "не оцінено"], [1, "старт"], [3, "базово"], [5, "впевнено"], [7, "добре"], [9, "відмінно"]];
const skLabel = v => { let t = SK_LEVELS[0][1]; for (const [k, n] of SK_LEVELS) if (v >= k) t = n; return t; };
const skColor = v => v >= 7 ? "var(--ok)" : v >= 4 ? "var(--gold)" : v > 0 ? "var(--bad)" : "var(--line)";
const testKey = cid => "test-" + cid;
function progOf(sid){ if (S.testAs && sid === S.uid) return S.progs?.[testKey(S.testAs.classId)]; return sid === S.uid && !S.isTeacher ? S.myProg : S.progs?.[sid]; }
function skillsOf(pr){ return Array.isArray(pr?.skills) && pr.skills.length ? pr.skills : SKILLS_DEF.map(s => ({...s, v: 0, note: ""})); }

function radarSvg(skills, prev){
  const n = skills.length; if (n < 3) return "";
  const R = 92, cx = 130, cy = 120, pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n, r = R * v / 10; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = k => skills.map((_, i) => pt(i, k).join(",")).join(" ");
  const poly = vals => vals.map((v, i) => pt(i, v).join(",")).join(" ");
  const labels = skills.map((s, i) => { const [x, y] = pt(i, 12.2); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="rl">${esc(s.han || s.name.slice(0, 1))}</text>`; }).join("");
  const prevVals = prev ? skills.map(s => Number(prev[s.id] ?? 0)) : null;
  return `<svg viewBox="0 0 260 240" class="radar" role="img" aria-label="Діаграма навичок">
    ${[2, 4, 6, 8, 10].map(k => `<polygon points="${ring(k)}" class="rg"/>`).join("")}
    ${skills.map((_, i) => { const [x, y] = pt(i, 10); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="rg"/>`; }).join("")}
    ${prevVals ? `<polygon points="${poly(prevVals)}" class="rp"/>` : ""}
    <polygon points="${poly(skills.map(s => Number(s.v) || 0))}" class="rc"/>
    ${labels}</svg>`;
}
function sparkSvg(vals){
  if (vals.length < 2) return "";
  const w = 90, h = 26, step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - (h - 4) * v / 10).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

async function peSave(){
  const e = S.pedit; if (!e || e.busy) return;
  const old = S.progs?.[e.sid] || {}, d = today();
  const skills = e.skills.map(s => ({id: s.id, han: String(s.han || "").slice(0, 2), name: String(s.name).slice(0, 40), v: Math.max(0, Math.min(10, Math.round(Number(s.v) || 0))), note: String(s.note || "").trim().slice(0, 300)}));
  const hist = (Array.isArray(old.hist) ? old.hist : []).filter(h => h.d !== d);
  hist.push({d, v: Object.fromEntries(skills.map(s => [s.id, s.v]))});
  const doc = {...old, skills, comment: String(e.comment || "").trim().slice(0, 1500), goals: e.goals.filter(g => String(g.t || "").trim()).slice(0, 20).map(g => ({t: String(g.t).slice(0, 160), done: !!g.done})),
    hist: hist.slice(-30), updatedAt: Date.now(), updatedBy: S.uid || ""};
  e.busy = true; render();
  try { await S.db.doc("progress/" + e.sid).set(doc); (S.progs = S.progs || {})[e.sid] = doc; S.pedit = null; toast("Оцінку збережено — учень уже бачить її"); }
  catch(err){ e.busy = false; toast("Не вдалося зберегти. Перевірте доступ викладача."); }
  render();
}
async function peCopySet(){
  const e = S.pedit, st = S.students[e.sid]; if (!e || !st) return;
  const others = Object.entries(S.students).filter(([id, x]) => id !== e.sid && x.classId === st.classId);
  let n = 0;
  for (const [id] of others){
    const pr = S.progs?.[id] || {}, cur = skillsOf(pr);
    const skills = e.skills.map(s => { const c = cur.find(x => x.id === s.id); return {id: s.id, han: s.han, name: s.name, v: c ? Number(c.v) || 0 : 0, note: c?.note || ""}; });
    try { await S.db.doc("progress/" + id).set({...pr, skills, updatedAt: pr.updatedAt || Date.now(), updatedBy: pr.updatedBy || S.uid || ""}); n++; } catch(_){}
  }
  toast(n ? `Набір навичок застосовано до ${n} ${plural(n, "учня", "учнів", "учнів")} (їхні оцінки збережено)` : "Не вдалося застосувати");
}

function parseBulk(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const f = line.split(/\s*[|\t]\s*/);
    return {...blankWord(), h: f[0] || "", p: f[1] || "", uk: f[2] || ""};
  }).filter(w => w.h);
}
const needsFill = w => w.h && (!w.p || !w.uk || w.ex.filter(x => x.zh).length < 3);
function mergeWords(list){
  const e = S.edit; e.words = e.words.filter(w => w.h || w.p || w.uk);
  for (const raw of list){
    const n = normWord(raw); const ex = e.words.find(w => w.h === n.h);
    if (ex){
      for (const k of ["p","uk"]) if (!ex[k] && n[k]) ex[k] = n[k];
      const have = ex.ex.filter(x => x.zh), add = n.ex.filter(x => x.zh && !have.some(h => h.zh === x.zh));
      ex.ex = [...have, ...add].slice(0, 3); while (ex.ex.length < 3) ex.ex.push(blankEx());
    } else e.words.push({...n, id: rid("w")});
  }
  if (!e.words.length) e.words.push(blankWord());
}
const AI_SHAPE = 'Відповідай лише JSON-масивом об\'єктів {"h":"ієрогліфи","p":"піньїнь з тоновими знаками","uk":"короткий український переклад","ex":[{"zh":"речення","py":"піньїнь речення","uk":"переклад"}, ... рівно 3 речення]}. Кожне речення має містити h точно в такому написанні, бути коротким і відповідати рівню.';

// ---------- grammar editor
// Theory markup: one block per line prefix; lines without a prefix continue the previous text.
const GPFX = {T: "text", H: "h", F: "formula", E: "examples", TIP: "tip", M: "mistake", TAB: "table", R: "row"};
function blocksToText(blocks){
  const out = [];
  for (const b of blocks || []){
    if (b.type === "text") out.push("T: " + (b.text || ""));
    else if (b.type === "h") out.push("H: " + (b.text || ""));
    else if (b.type === "formula") out.push("F: " + (b.text || ""));
    else if (b.type === "tip") out.push("TIP: " + (b.text || ""));
    else if (b.type === "examples") out.push((b.items || []).map(x => `E: ${x.zh || ""} | ${x.py || ""} | ${x.uk || ""}`).join("\n"));
    else if (b.type === "mistake") out.push(`M: ${b.wrong || ""} | ${b.right || ""} | ${b.why || ""}`);
    else if (b.type === "table") out.push(["TAB: " + (b.head || []).join(" | "), ...(b.rows || []).map(r => "R: " + r.join(" | "))].join("\n"));
  }
  return out.join("\n\n");
}
function textToBlocks(t){
  const blocks = []; let last = null;
  const cells = s => s.split("|").map(x => x.trim());
  for (const raw of String(t || "").split(/\r?\n/)){
    const line = raw.trimEnd();
    if (!line.trim()){ last = null; continue; }
    const m = line.match(/^(TIP|TAB|T|H|F|E|M|R)\s*:\s?(.*)$/i);
    if (!m){ if (last && ["text","tip"].includes(last.type)) last.text += "\n" + line.trim(); else blocks.push(last = {type: "text", text: line.trim()}); continue; }
    const kind = GPFX[m[1].toUpperCase()], v = m[2].trim();
    if (kind === "examples"){
      const [zh, py, uk] = cells(v);
      if (last && last.type === "examples") last.items.push({zh, py: py || "", uk: uk || ""});
      else blocks.push(last = {type: "examples", items: [{zh, py: py || "", uk: uk || ""}]});
    } else if (kind === "row"){
      if (last && last.type === "table") last.rows.push(cells(v));
      else blocks.push(last = {type: "table", head: [], rows: [cells(v)]});
    } else if (kind === "table") blocks.push(last = {type: "table", head: cells(v), rows: []});
    else if (kind === "mistake"){ const [wrong, right, why] = cells(v); blocks.push(last = {type: "mistake", wrong, right: right || "", why: why || ""}); }
    else blocks.push(last = {type: kind, text: v});
  }
  return blocks.filter(b => b.type !== "examples" || b.items.some(x => x.zh));
}
const blankChoice = () => ({type: "choice", q: "", zh: "", opts: ["", "", "", ""], a: 0, why: ""});
const blankOrder = () => ({type: "order", q: "", uk: "", words: "", a: "", alt: "", why: ""});
function normGEx(q){
  if (q.type === "order") return {type: "order", q: q.q || "", uk: q.uk || "", words: (q.words || []).join(" "), a: q.a || "", alt: (q.alt || []).join("; "), why: q.why || ""};
  const opts = (q.opts || []).slice(); while (opts.length < 4) opts.push("");
  return {type: "choice", q: q.q || "", zh: q.zh || "", opts, a: Number(q.a) || 0, why: q.why || ""};
}

function gedBuild(){
  const e = S.gedit, tr = s => String(s || "").trim(), errs = [];
  const ex = e.ex.map((q, i) => {
    if (q.type === "order"){
      const words = tr(q.words).split(/\s+/).filter(Boolean);
      if (words.length < 2){ errs.push(`вправа ${i + 1}: потрібно щонайменше два слова`); return null; }
      const out = {type: "order", words, a: tr(q.a) || words.join(""), uk: tr(q.uk), why: tr(q.why)};
      const alt = tr(q.alt).split(/\s*;\s*/).filter(Boolean); if (alt.length) out.alt = alt;
      if (tr(q.q)) out.q = tr(q.q);
      return out;
    }
    const filled = q.opts.map((o, k) => ({o: tr(o), k})).filter(x => x.o);
    const a = filled.findIndex(x => x.k === q.a);
    if (!tr(q.q)) errs.push(`вправа ${i + 1}: немає питання`);
    else if (filled.length < 2) errs.push(`вправа ${i + 1}: потрібно щонайменше два варіанти`);
    else if (a < 0) errs.push(`вправа ${i + 1}: позначте правильний варіант`);
    const out = {type: "choice", q: tr(q.q), opts: filled.map(x => x.o), a: Math.max(0, a), why: tr(q.why)};
    if (tr(q.zh)) out.zh = tr(q.zh);
    return out;
  }).filter(Boolean);
  if (!tr(e.title)) errs.unshift("вкажіть назву теми");
  const blocks = textToBlocks(e.theory);
  if (!blocks.length) errs.push("додайте пояснення");
  return {errs, body: {hsk: e.hsk, order: Number(e.order) || 1, lesson: tr(e.lesson), title: tr(e.title), pattern: tr(e.pattern), summary: tr(e.summary), hidden: !!e.hidden, blocks, ex, updatedAt: Date.now(), updatedBy: S.uid || ""}};
}
async function gedSave(){
  const e = S.gedit, {errs, body} = gedBuild();
  if (errs.length){ e.msg = "Перевірте: " + errs.join("; ") + "."; render(); return; }
  const id = e.id || rid("G");
  e.busy = "save"; render();
  try { await S.db.doc("grammar/" + id).set(body); toast(e.id ? "Тему збережено" : "Тему створено"); S.view = e.back || {name: "library"}; S.libMode = "grammar"; S.gedit = null; render(); }

}

function teamHtml(){
  const rows = Object.entries(S.staff).filter(([, r]) => r.role === "admin" || r.role === "teacher").sort((a, b) => (a[1].role === "admin" ? -1 : 0) - (b[1].role === "admin" ? -1 : 0) || String(b[1].lastSeen).localeCompare(String(a[1].lastSeen)));
  const table = rows.length ? `<div class="tablewrap"><table><thead><tr><th>Учасник</th><th>Роль</th><th>Перший вхід</th><th>Останній вхід</th>${S.role === "admin" ? "<th></th>" : ""}</tr></thead><tbody>${rows.map(([id, r]) => `<tr>
      <td><b>${nameSpan(id, "Учасник без імені")}</b>${id === S.uid ? ` <span class="pill soft">це ви</span>` : ""}</td>
      <td><span class="pill ${r.role === "admin" ? "gold" : "ok"}">${ROLE_UK[r.role] || "—"}</span></td>
      <td>${fmtDate(r.firstSeen)}</td><td>${fmtDate(r.lastSeen)}</td>
      ${S.role === "admin" ? `<td style="text-align:right">${id !== S.uid ? `<button class="btn sm ghost" data-act="dropStaff" data-arg="${esc(id)}">Прибрати з журналу</button>` : ""}</td>` : ""}</tr>`).join("")}</tbody></table></div>`
    : `<p class="small muted">Ще ніхто, крім вас, не відкривав платформу з правами викладача.</p>`;
  const how = S.role === "admin" ? `
      <h3>Як призначити викладача</h3>
      <ol class="small steps">
        <li>Викладачка один раз входить на сайт (через Google або пошту). Вона побачить екран реєстрації студента — нічого заповнювати не треба.</li>
        <li>У кабінеті адміністратора відкрийте картку викладача (або натисніть <b>«+ Викладач»</b>) і впишіть пошту, з якою вона увійшла.</li>
        <li>Натисніть «Зберегти» — їй автоматично надаються права викладача. Після оновлення сторінки вона бачить свій кабінет.</li>
      </ol>
      <p class="small">Щоб забрати доступ, видаліть картку викладача або змініть у ній пошту.</p>`
    : `<p class="small">Права викладача надала адміністраторка. Змінити або забрати їх може лише вона.</p>`;
  return `<div class="spread"><h2>Команда й доступи</h2><span class="pill gold">Ви: ${ROLE_UK[S.role]}</span></div>
    <p class="small">Роль зберігається в базі й перевіряється сервером під час кожного збереження: якщо в людини немає ролі викладача, база відхилить зміну уроку, навіть якщо хтось підробить сторінку.</p>
    <div class="tablewrap"><table><thead><tr><th>Роль</th><th>Як призначається</th><th>Що може</th></tr></thead><tbody>
      <tr><td><b>Адміністратор</b></td><td>Призначається один раз у базі</td><td>Усе, що викладач, плюс призначає й прибирає викладачів</td></tr>
      <tr><td><b>Викладач</b></td><td>Адміністраторка вписує пошту в картку викладача</td><td>Уроки, слова, переклади, приклади, граматика й вправи, групи, статистика, експорт</td></tr>
      <tr><td><b>Студент</b></td><td>Реєструється сам із кодом групи</td><td>Навчається, записує лише власний прогрес, бачить рейтинг</td></tr>
    </tbody></table></div>
    ${how}
    <h3>Журнал команди</h3>
    <p class="small muted">Хто відкривав платформу з правами викладача або адміністратора. Бачать лише адміністратор і викладачі; студентам ця таблиця недоступна.</p>
    ${table}
    <p class="small muted">Рейтинг бачать лише учні цієї платформи, тобто ваші учні. Учні інших викладачів його не бачать.</p>`;
}

function studentView(){
  const c = classOf(S.me);
  const storeNote = S.store === "test" ? `<div class="note info" style="border:1px solid var(--gold)"><span>🧪</span><span><b>Режим студента (тест).</b> Ви бачите кабінет так, як його бачить студент ${S.classes[S.testAs.classId]?.kind === "individual" ? "" : "групи "}«${esc(S.classes[S.testAs.classId]?.name || "")}». Усе працює, але нічого не зберігається і не потрапляє в рейтинг. <button class="link" data-act="exitTest">Вийти</button></span></div>`
    : S.store === "local" ? `<div class="note"><span>📱</span><span><b>Прогрес зберігається лише на цьому пристрої</b> і не потрапляє в рейтинг. Попросіть викладачку надати вам доступ до платформи з роллю <b>Contributor</b>, і після оновлення сторінки профіль синхронізується.</span></div>` : "";
  let inner;
  if (S.mode === "grammar") inner = grammarView();
  else {
    const tab = S.view.tab || "dash"; let body = "";
    if (tab === "dash") body = dashView();
    else if (tab === "cards") body = cardsView();
    else if (tab === "ex") body = exView();
    else if (tab === "prog") body = mySkillsTab();
    else if (tab === "rank") body = rankView(false, S.me.classId);
    else if (tab === "profile") body = profileView();
    else if (tab === "cv") body = cvStudentView();
    else if (tab === "bank") body = bankView();
    else if (tab === "ach") body = achView();
    inner = tabsHtml([["dash","Кабінет"],["prog","Прогрес"],["cards","Картки"],["ex","Вправи"],["cv","Лексика з уроків"],["bank","Банка слів"],["ach","Нагороди"],["rank","Рейтинг"],["profile","Профіль"]], tab) + `<div class="stack">${body}</div>`;
  }
  return `<div class="stack">
    <div class="stuhead"><div class="stuname"><div class="eyebrow">${c ? esc(c.name) + (c.schedule ? " · " + esc(c.schedule) : "") : "Без групи"}${S.teachers[c?.teacherId] ? " · викладач " + esc(S.teachers[c.teacherId].name) : ""}</div><h1 class="pt">${esc(S.me.name)}</h1></div><div class="stutools">${pomoHtml()}${modeSwitch(S.mode)}</div></div>
    ${ytUrl() ? `<a class="freebar" href="${esc(ytUrl())}" target="_blank" rel="noopener noreferrer" title="Відкриється YouTube у новому вікні">
      <span class="fb-ic" aria-hidden="true"><svg viewBox="0 0 28 20" width="30" height="22"><rect width="28" height="20" rx="5" fill="#E62117"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg></span>
      <span class="fb-t"><b>Безкоштовні уроки</b><span class="small muted">Відеоуроки Asianish School на YouTube — китайська, корейська, японська</span></span>
      <span class="fb-go">Відкрити <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></span></a>` : ""}
    ${storeNote}
    ${inner}
  </div>`;
}

function dashView(){
  const ctx = currentCtx();
  if (!ctx.lessons.length) return emptyBox("课", "Уроки ще не відкрито", "Щойно викладачка додасть урок для вашої групи, він з'явиться тут автоматично.");
  const st = statsOf(S.me, ctx.lessons), place = myPlace();
  const lv = statsOf(S.me, ctx.lvLessons);
  const lessonBars = ctx.lvLessons.map(l => { const s = statsOf(S.me, [l]); return bar(`<b>${esc(l.title)}</b>${l.sub ? ` <span class="muted">${esc(l.sub)}</span>` : ""}`, `${s.mastered}/${s.total}`, s.mastered, s.learning, s.total); }).join("") || `<p class="small muted">Для ${lvName(ctx.level)} уроків поки немає.</p>`;
  const hskBars = ctx.levels.map(h => { const ls = ctx.lessons.filter(l => l.hsk === h); const s = statsOf(S.me, ls); return bar(`<b>${lvName(h)}</b>`, `${s.total ? Math.round(100 * s.mastered / s.total) : 0}% · ${s.mastered}/${s.total}`, s.mastered, s.learning, s.total); }).join("");
  const wrong = (S.me.wrong || []).map(id => allWords().find(w => w.id === id)).filter(Boolean).slice(0, 12);
  const cta = st.due
    ? {t: `${st.due} ${plural(st.due,"слово чекає","слова чекають","слів чекають")} на повторення`, b: "Повторити", d: "due"}
    : lv.fresh ? {t: `${lv.fresh} нових слів ${lvName(ctx.level)} чекають на вас`, b: "Вчити нові", d: "new"}
    : {t: "На сьогодні все повторено", b: "Переглянути картки", d: "all"};
  return `
    <div class="tiles">
      <div class="tile key"><b>${st.mastered}</b><span>опановано слів</span></div>
      <div class="tile"><b>${st.due}</b><span>повторити сьогодні</span></div>
      <div class="tile"><b>${st.learning}</b><span>вивчаються зараз</span></div>
      <div class="tile"><b>${st.streak}</b><span>${plural(st.streak,"день","дні","днів")} поспіль</span></div>
      <div class="tile"><b>${place ? place : "—"}</b><span>місце в рейтингу</span></div>
      <div class="tile"><b>${st.acc == null ? "—" : st.acc + "%"}</b><span>правильних відповідей</span></div>
      <div class="tile"><b>${st.exDone}</b><span>вправ виконано</span></div>
      <div class="tile"><b>${st.points}</b><span>балів</span></div>
      <button class="tile tilebtn" data-act="tab" data-arg="ach"><b>${Object.keys(S.me.ach || {}).length}<small class="muted"> / ${ACH.length}</small></b><span>нагород · відкрити →</span></button>
    </div>
    <div class="panel spread" style="background:var(--accent);border-color:var(--accent);color:var(--accent-fg)">
      <div><h3>${cta.t}</h3>
      <p class="small" style="opacity:.85">Слово опановане, коли ви згадали його у ${MASTER} різні дні з інтервалами 1 → 2 → 4 дні.</p></div>
      <button class="btn gold" data-act="startDeck" data-arg="${cta.d}">${cta.b}</button>
    </div>
    <div class="two">
      <div class="panel stack" style="gap:14px"><div class="sh" style="margin:0"><h3>Прогрес за уроками</h3><span class="small muted"><span style="color:var(--accent)">■</span> опановано <span style="color:var(--gold)">■</span> вчите</span></div>${levelBar(ctx, "vocab")}<div class="prog">${lessonBars}</div></div>
      <div class="panel stack" style="gap:18px"><div><div class="sh"><h3>Рівні HSK</h3></div><div class="prog">${hskBars}</div></div>
        <div><div class="sh"><h3>Слова з помилками</h3>${wrong.length ? `<button class="link" data-act="startEx" data-arg="mistakes">Тренувати</button>` : ""}</div>
        ${wrong.length ? `<div class="chips">${wrong.map(w => `<span class="chip han" style="cursor:default">${esc(w.h)}</span>`).join("")}</div>` : `<p class="small muted">Поки помилок немає.</p>`}</div></div>
    </div>`;
}

function pluck(ac, midi, t, vol){

function deckWords(deck, ctx){
  const prog = ctx.me?.words || {}, d = today();
  const lvAll = wordsOf(ctx.lvLessons), every = [...wordsOf(ctx.lessons), ...wordsOf(ctx.cv)];
  const rank = w => { const p = prog[w.id]; if (p && p.due <= d) return 0; if (!p) return 1; return 2; };
  let list;
  if (deck === "due") list = every.filter(w => prog[w.id] && prog[w.id].due <= d && prog[w.id].s < 6);
  else if (deck === "new") list = lvAll.filter(w => !prog[w.id]);
  else if (deck === "all") list = lvAll.slice();
  else if (deck === "cv") list = wordsOf(ctx.cv);
  else if (deck.startsWith("cv:")) list = wordsOf(ctx.cv.filter(l => l.id === deck.slice(3)));
  else if (deck === "bank") list = bankWords();
  else list = every.filter(w => w.lid === deck);
  return shuffle(list).sort((a, b) => rank(a) - rank(b)).map(w => w.id);
}
function startDeck(deck){
  const ctx = currentCtx();
  S.cards = {key: ctx.key, deck, queue: deckWords(deck, ctx), i: 0, flipped: false, pick: null, opts: null, clozeZh: "", requeued: [], done: 0};
  prepCard();
}
function prepCard(){
  const c = S.cards; c.flipped = false; c.pick = null; c.opts = null; c.clozeZh = "";
  const w = wordById(c.queue[c.i]); if (!w) return;
  const ex = shuffle(exList(w)).find(x => x.zh.includes(w.h));
  if (ex){
    const pool = shuffle(allWords().filter(x => x.h !== w.h && !ex.zh.includes(x.h))).map(x => x.h);
    c.opts = shuffle([w.h, ...[...new Set(pool)].slice(0, 2)]); c.clozeZh = ex.zh; c.clozeUk = ex.uk;
  }
}
function wordById(id){
  for (const l of Object.values(S.lessons)) for (const w of (l.words || [])) if (w.id === id) return {...w, lid: l.id, lt: l.title, hsk: l.hsk};
  for (const d of Object.values(S.cvocab)) for (const w of (d.words || [])) if (w.id === id) return {...w, lid: d.id, lt: d.title || "Заняття", hsk: "", cv: true};
  if (isOwn(id)) return bankOwn().find(w => w.id === id) || null;
  return null;
}

function cardAct(kind){
  const ctx = currentCtx(), c = S.cards; if (!c) return;
  const wid = c.queue[c.i];
  if (wid && kind !== "next" && !ctx.preview){
    const me = S.me, d = today(); ensureDay(me); me.words = me.words || {};
    let w = me.words[wid], pts = 0, msg = "";
    if (kind === "know"){
      if (!w || (w.s === 0 && !w.ok)){
        w = me.words[wid] = {...(w || {}), s: 1, due: addDays(d, INT[1]), last: d, ok: 1, bad: w?.bad || 0};
        if (onceToday(me, "k:" + wid)) pts = PTS.know; msg = `Нове слово: крок 1 з ${MASTER}`;
      }
      else if (w.last === d && w.s > 0 && !me.dk.k.includes("r:" + wid)){ msg = "Це слово сьогодні вже зараховано"; }
      else if (w.due > d){ msg = "Ще рано: повторення " + fmtDate(w.due); }
      else {
        w.s = Math.min(w.s + 1, 6); w.last = d; w.ok = (w.ok || 0) + 1; w.due = addDays(d, INT[w.s]);
        if (onceToday(me, "k:" + wid)) pts = PTS.know;
        if (w.s >= MASTER && !w.m){ w.m = 1; logAdd(me, "m", 1); msg = "Слово опановано!"; if (!isOwn(wid)){ addPoints(me, PTS.master, "b"); msg += ` +${PTS.master} бонус`; } }
        else msg = w.s < MASTER ? `Крок ${w.s} з ${MASTER}` : "Повторено, наступний раз " + fmtDate(w.due);
      }
    } else {
      if (!w) w = me.words[wid] = {s: 0, due: d, last: "", ok: 0, bad: 0};
      w.s = Math.max(0, w.s - 1); w.due = d; w.last = d; w.bad = (w.bad || 0) + 1; addWrong(me, wid);
      if (onceToday(me, "r:" + wid)) pts = PTS.again;
      msg = "Повернемося до цього слова ще раз";
    }
    logAdd(me, "a", 1);
    if (wordById(wid)?.cv){ me.flags = me.flags || {}; me.flags.cv = 1; }
    if (isOwn(wid)) pts = 0;
    if (pts){ addPoints(me, pts, "k"); msg += ` · +${pts}`; }
    dailyCheck(me);
    saveMe(); toast(msg);
  }
  if (kind === "again" && wid && !c.requeued.includes(wid)){ c.queue.push(wid); c.requeued.push(wid); }
  if (kind !== "next") c.done++;
  c.i++; prepCard(); render();
}

// ---- word pools
function exPool(ctx, src){
  const every = wordsOf(ctx.lessons), lvAll = wordsOf(ctx.lvLessons), cvAll = wordsOf(ctx.cv), bank = ctx.preview ? [] : bankWords();
  return src === "every" ? every : src === "level" ? lvAll : src === "cv" ? cvAll : src === "bank" ? bank
    : src.startsWith("cv:") ? wordsOf(ctx.cv.filter(l => "cv:" + l.id === src)) : every.filter(w => w.lid === src);
}
const srcGroup = src => src === "bank" ? "bank" : src === "cv" || String(src).startsWith("cv:") ? "cv" : "lv";
function exSrcLabel(ctx, src){
  if (src === "level") return "увесь " + lvName(ctx.level); if (src === "every") return "усі доступні рівні"; if (src === "bank") return "банка слів";
  if (src === "cv") return "лексика з усіх занять"; if (src.startsWith("cv:")) return ctx.cv.find(l => "cv:" + l.id === src)?.title || "заняття";
  return S.lessons[src]?.title || "урок";
}
const exLevel = ctx => lvName(srcGroup(S.ex?.src || "level") === "lv" ? ctx.level : ctx.course);

// ---- text helpers for the new games
const tonelessPy = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/u:|v/g, "u").replace(/[^a-z]/g, "");
const coreH = h => String(h || "").replace(/（.*?）|\(.*?\)/g, "");
let SEGD = null, SEGK = "";
function segDict(){
  const key = Object.keys(S.lessons).length + ":" + Object.keys(S.cvocab).length;
  if (SEGD && SEGK === key) return SEGD;
  SEGD = new Set(); SEGK = key;
  for (const w of [...allWords(), ...wordsOf(Object.values(S.cvocab).map(cvLesson))]){ const h = coreH(w.h); if (h.length > 1 && h.length <= 6) SEGD.add(h); }
  return SEGD;
}
const PUNCT = /[\s，。！？、,.!?；;：:“”"'（）()…—\-《》·]/;
function segment(s, keep){
  const D = segDict(), t = String(s || ""), out = []; let i = 0;
  while (i < t.length){
    if (PUNCT.test(t[i])){ i++; continue; }
    let m = 1;
    for (const k of keep || []) if (k && t.startsWith(k, i) && k.length > m) m = k.length;
    for (let L = Math.min(6, t.length - i); L > m; L--) if (D.has(t.substr(i, L))){ m = L; break; }
    if (/[A-Za-z0-9]/.test(t[i])){ let j = i; while (j < t.length && /[A-Za-z0-9]/.test(t[j])) j++; m = Math.max(m, j - i); }
    out.push(t.substr(i, m)); i += m;
  }
  let guard = 0;
  while (out.length > 9 && guard++ < 20){ const k = out.findIndex((x, j) => j < out.length - 1 && x.length === 1 && out[j + 1].length === 1 && !(keep || []).includes(x)); if (k < 0) break; out.splice(k, 2, out[k] + out[k + 1]); }
  return out;
}
const exWith = w => exList(w).filter(x => x.zh.includes(coreH(w.h)));
function soundAlike(w, pool){
  const t = tonelessPy(w.p); const c = pool.filter(x => x.p && x.h !== w.h && x.id !== w.id && !/[（(]/.test(x.h));
  const score = x => { const u = tonelessPy(x.p); if (u === t) return 3; if (u.slice(0, 2) === t.slice(0, 2) && x.h.length === w.h.length) return 2; if (x.h.length === w.h.length) return 1; return 0; };
  let best = 0; for (const x of c) best = Math.max(best, score(x));
  const cand = c.filter(x => score(x) === best); return cand.length ? cand[Math.floor(Math.random() * cand.length)] : null;
}

// ---- question generators
function distract(w, pool, field, k){ const seen = new Set([w[field]]); const out = []; for (const x of shuffle(pool)){ if (!x[field] || seen.has(x[field])) continue; seen.add(x[field]); out.push(x[field]); if (out.length >= k) break; } return out; }
const mkOpts = (right, wrongs) => shuffle([{v: right, ok: true}, ...wrongs.map(v => ({v, ok: false}))]);
function makeQ(t, w, pool){
  if (t === "pinyin" && !w.p) t = "quiz";
  if (t === "fill"){
    const ex = shuffle(exList(w)).find(x => x.zh.includes(w.h));
    if (ex) return {wid: w.id, show: "fill", sent: ex.zh.replace(w.h, "＿"), hint: ex.uk, opts: mkOpts(w.h, distract(w, pool.filter(x => !ex.zh.includes(x.h)), "h", 3)), hanOpts: true};
    t = "quiz";
  }
  if (t === "quiz") return {wid: w.id, show: "han", han: w.h, opts: mkOpts(w.uk, distract(w, pool, "uk", 3))};
  if (t === "listen") return {wid: w.id, show: "listen", han: w.h, say: w.h, opts: mkOpts(w.h, distract(w, pool, "h", 3)), hanOpts: true, auto: true};
  if (t === "pinyin") return Math.random() < .5
    ? {wid: w.id, show: "py", py: w.p, opts: mkOpts(w.h, distract(w, pool, "h", 3)), hanOpts: true}
    : {wid: w.id, show: "han2py", han: w.h, opts: mkOpts(w.p, distract(w, pool, "p", 3))};
  return genQ(t, w, pool);
}
function genQ(t, w, pool){
  const h = coreH(w.h);
  if (t === "usage"){
    const ex = shuffle(exWith(w))[0]; if (!ex) return null;
    const others = shuffle(pool.filter(x => coreH(x.h) !== h && !ex.zh.includes(coreH(x.h)))).map(x => ({x, e: exWith(x).find(e => !e.zh.includes(h))})).filter(o => o.e).slice(0, 3);
    if (others.length < 2) return null;
    const wrong = others.map(o => o.e.zh.replace(coreH(o.x.h), h));
    return {wid: w.id, show: "usage", han: w.h, uk: w.uk, opts: mkOpts(ex.zh, wrong), sentOpts: true, after: ex.uk};
  }
  if (t === "adet"){
    const ex = shuffle(exWith(w))[0]; if (!ex) return null;
    const d = shuffle(pool.filter(x => coreH(x.h) !== h && !ex.zh.includes(coreH(x.h)))).map(x => x.h);
    const wrongs = [...new Set(d)].slice(0, 3); if (wrongs.length < 2) return null;
    return {wid: w.id, show: "adet", say: ex.zh, auto: true, opts: mkOpts(w.h, wrongs), hanOpts: true, after: ex.zh + " — " + ex.uk};
  }
  if (t === "sound"){
    if (!w.p) return null; const d = soundAlike(w, [...pool, ...allWords()]); if (!d) return null;
    return {wid: w.id, show: "sound", say: w.h, auto: true, opts: mkOpts(`${w.p} · ${w.h}`, [`${d.p} · ${d.h}`])};
  }
  if (t === "clue"){
    const exs = shuffle(exWith(w)); if (!exs.length) return null;
    const hints = [];
    if (exs[0].uk) hints.push({t: "Ситуація", v: exs[0].uk});
    const e2 = exs[1] || exs[0]; hints.push({t: "Приклад", v: e2.zh.replace(h, "＿"), han: true});
    hints.push({t: "Значення", v: w.uk});
    const wrongs = [...new Set(shuffle(pool.filter(x => coreH(x.h) !== h)).map(x => x.h))].slice(0, 5); if (wrongs.length < 3) return null;
    return {wid: w.id, kind: "clue", hints, opts: mkOpts(w.h, wrongs), hanOpts: true};
  }
  if (t === "arch" || t === "lrec"){
    const ex = shuffle(exWith(w)).map(e => ({e, ch: segment(e.zh, [h])})).find(o => o.ch.length >= 3 && o.ch.length <= 9); if (!ex) return null;
    return {wid: w.id, kind: "build", chunks: ex.ch, bank: shuffle(ex.ch.map((_, k) => k)), ans: ex.e.zh, uk: ex.e.uk, py: ex.e.py, say: t === "lrec" ? ex.e.zh : null, auto: t === "lrec", hideUk: t === "lrec"};
  }
  if (t === "fix"){
    const ex = shuffle(exWith(w))[0]; if (!ex) return null;
    const d = shuffle(pool.filter(x => coreH(x.h) !== h && !ex.zh.includes(coreH(x.h)) && x.uk !== w.uk))[0]; if (!d) return null;
    const k = ex.zh.indexOf(h), dh = coreH(d.h);
    const left = segment(ex.zh.slice(0, k)), right = segment(ex.zh.slice(k + h.length));
    const chunks = [...left, dh, ...right]; if (chunks.length < 3) return null;
    const wrongs = [...new Set([dh, ...shuffle(pool.filter(x => coreH(x.h) !== h && coreH(x.h) !== dh)).map(x => coreH(x.h))])].slice(0, 3);
    return {wid: w.id, kind: "fix", chunks, bad: left.length, opts: mkOpts(h, wrongs), hanOpts: true, uk: ex.uk, ans: ex.zh};
  }
  if (t === "dict") return {wid: w.id, kind: "type", say: w.h, auto: true, h, p: w.p, uk: w.uk};
  return null;
}
function mixQ(types, words, pool, tries){
  for (let n = 0; n < (tries || 8); n++){
    const w = words[Math.floor(Math.random() * words.length)], t = types[Math.floor(Math.random() * types.length)];
    const q = makeQ(t, w, pool); if (q && (!q.opts || q.opts.length >= 2)) return q;
  }
  const w = words[Math.floor(Math.random() * words.length)]; return makeQ("quiz", w, pool);
}

// ---- menu
function exMenu(ctx){
  const e = S.ex; const src = (e && e.key === ctx.key && e.src) || "level";
  const lvAll = wordsOf(ctx.lvLessons), every = wordsOf(ctx.lessons), cvAll = wordsOf(ctx.cv), bank = ctx.preview ? [] : bankWords();
  const grp = srcGroup(src), pool = exPool(ctx, src);
  const wrongN = ctx.preview ? 0 : (S.me.wrong || []).filter(id => [...every, ...cvAll, ...bank].some(w => w.id === id)).length;
  const segBtn = (g, han, label, n, dis) => `<button aria-pressed="${grp === g}" data-act="exGroup" data-arg="${g}" ${dis ? "disabled" : ""}><span class="han">${han}</span>${label} <span class="num" style="opacity:.7">${n}</span></button>`;
  let sub = "";
  if (grp === "lv") sub = `<div class="field" style="min-width:240px"><label for="ex-src">Які слова</label><select class="input" id="ex-src" data-chg="exsrc">
      <option value="level" ${src === "level" ? "selected" : ""}>Увесь ${lvName(ctx.level)} (${lvAll.length})</option><option value="every" ${src === "every" ? "selected" : ""}>Усі доступні рівні (${every.length})</option>
      ${ctx.lvLessons.map(l => `<option value="${esc(l.id)}" ${src === l.id ? "selected" : ""}>${esc(l.title)} (${(l.words || []).length})</option>`).join("")}</select></div>`;
  else if (grp === "cv") sub = cvAll.length ? `<div class="field" style="min-width:240px"><label for="ex-src">Заняття</label><select class="input" id="ex-src" data-chg="exsrc">
      <option value="cv" ${src === "cv" ? "selected" : ""}>Усі заняття (${cvAll.length})</option>${ctx.cv.map(l => `<option value="cv:${esc(l.id)}" ${src === "cv:" + l.id ? "selected" : ""}>${esc(l.title)}${l.date ? " · " + esc(l.date) : ""} (${l.words.length})</option>`).join("")}</select></div>`
      : `<p class="small muted" style="max-width:52ch">${ctx.preview ? "Для цієї групи ще немає лексики з занять. Додайте її у вкладці «Лексика з уроків»." : "Викладач ще не додав слова з ваших занять. Щойно додасть — вони з'являться тут."}</p>`;
  else sub = `<p class="small muted" style="max-width:52ch">Ваші власні слова. Слова, додані зі словника, бали в рейтинг не приносять.</p>`;
  const few = pool.length < 4;
  const cats = EX_CATS.map(c => {
    const gs = GAMES.filter(g => g.cat === c.id && (!g.ai || S.sample)); if (!gs.length) return "";
    return `<section class="excat"><div class="sh"><h2><span class="han" style="color:var(--gold-ink);margin-right:8px">${c.han}</span>${c.name}</h2><span class="small muted">${c.note}</span></div>
      <div class="exgrid">${gs.map(t => { const dis = (t.id === "mistakes" ? !wrongN && !ctx.preview : few && !["mistakes","duel"].includes(t.id)) || (t.ai && !S.sample);
        return `<button class="excard" data-act="startEx" data-arg="${t.id}" ${dis ? "disabled" : ""}><span class="glyph">${t.glyph}</span><b>${t.name}</b><span class="small muted">${t.desc}${t.id === "mistakes" && !ctx.preview ? ` Зараз: ${wrongN}.` : ""}</span>${t.ai ? `<span class="pill gold" style="align-self:flex-start">ШІ</span>` : ""}</button>`; }).join("")}</div></section>`;
  }).join("");
  return `${grp === "lv" ? levelBar(ctx, "vocab") : ""}
    <div class="panel exsrc"><div class="stack" style="gap:12px">
      <div><div class="eyebrow">Звідки беремо слова</div>
      <div class="seg" role="group" aria-label="Джерело слів" style="margin-top:8px;flex-wrap:wrap">${segBtn("lv", "级", "Лексика за рівнями", lvAll.length)}${segBtn("cv", "课", "Лексика з уроків", cvAll.length)}${ctx.preview ? "" : segBtn("bank", "库", "Банка слів", bank.length)}</div></div>
      <div class="spread" style="align-items:flex-end">${sub}<p class="small muted" style="max-width:46ch">Зараз: <b>${esc(exSrcLabel(ctx, src))}</b> · ${pool.length} ${plural(pool.length, "слово", "слова", "слів")}. ${ctx.preview ? "Режим викладача: відповіді не зберігаються й не впливають на рейтинг." : `Правильна відповідь +${PTS.correct} (кожне слово в кожній вправі — раз на день), уся вправа без помилок від ${PERFECT_MIN} питань: +${PTS.perfect}.`}</p></div>
      ${few && pool.length ? `<div class="note info"><span>ℹ️</span><span>Для більшості вправ потрібно щонайменше 4 слова. Оберіть ширший набір.</span></div>` : ""}
      
    </div></div>${cats}`;
}

function exView(){
  const ctx = currentCtx(); const every = wordsOf(ctx.lessons), cvAll = wordsOf(ctx.cv), bank = ctx.preview ? [] : bankWords();
  if (!every.length && !cvAll.length && !bank.length) return emptyBox("练", "Вправ поки немає", ctx.preview ? "Додайте урок для цього курсу." : "Вони з'являться разом із першим уроком.");
  const e = S.ex;
  if (!e || e.key !== ctx.key || !e.running) return exMenu(ctx);
  if (e.finished) return exResult(ctx, e);
  const back = `<button class="link" data-act="exQuit">← Усі вправи</button>`;
  const title = `<span class="eyebrow">${esc(gameOf(e.type).name)}</span>`;
  if (e.type === "pairs"){
    const top = `<div class="spread">${back}<span class="small muted num">${e.matched.length} з ${e.left.length}</span></div><div class="qbar"><i style="width:${100 * e.matched.length / e.left.length}%"></i></div>`;
    const L = e.left.map(id => { const w = wordById(id); const done = e.matched.includes(id); return `<button class="opt h ${done ? "done" : ""} ${e.sel === id ? "sel" : ""}" data-act="pairL" data-arg="${esc(id)}" ${done ? "disabled" : ""}>${esc(w?.h)}</button>`; }).join("");
    const R = e.right.map(id => { const w = wordById(id); const done = e.matched.includes(id); return `<button class="opt ${done ? "done" : ""} ${e.flash === "R" + id ? "wrong" : ""}" data-act="pairR" data-arg="${esc(id)}" ${done ? "disabled" : ""}>${esc(w?.uk)}</button>`; }).join("");

async function aiPrep(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.type !== "rewrite") return; const w = e.items[e.i];
  e.busy = true; e.err = ""; render();
  try {
    const r = await aiCall(`Ти допомагаєш україномовному студенту вчити китайську (рівень ${exLevel(ctx)}). Цільове слово: «${w.h}» (${w.p || ""} — ${w.uk}).
Склади одне коротке природне китайське речення рівня ${exLevel(ctx)}, зміст якого можна передати з цим словом, але сам НЕ вживай слово «${coreH(w.h)}» — використай синонім, інший вираз або опис. Відповідай лише JSON: {"zh":"речення","py":"піньїнь із тонами","uk":"переклад українською"}.`);
    if (S.ex !== e) return;
    if (!r || !AI_STR(r.zh)) throw {code: "invalid_json"};
    e.sent = {zh: AI_STR(r.zh).slice(0, 120), py: AI_STR(r.py).slice(0, 240), uk: AI_STR(r.uk).slice(0, 240)};
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}
async function aiCheck(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.busy || e.res) return;
  const inp = AI_STR(e.input); if (!inp){ toast("Спочатку напишіть відповідь"); return; }
  if (!/[㐀-鿿]/.test(inp)){ toast("Напишіть відповідь ієрогліфами"); return; }
  const lvl = exLevel(ctx), w = e.items ? e.items[e.i] : null;
  const fmt = `Відповідай лише JSON: {"ok":true або false,"fix":"виправлений або покращений варіант китайською (якщо відповідь бездоганна — повтори її)","py":"піньїнь цього варіанта з тонами","uk":"переклад цього варіанта українською","comment":"1–2 короткі речення українською: що вдалося і що виправити, доброзичливо"}`;
  let prompt = "", local = null;
  if (e.type === "wia"){
    if (!inp.includes(coreH(w.h))){ toast("У реченні має бути слово " + coreH(w.h)); return; }
    prompt = `Ти доброзичливий викладач китайської для україномовних студентів (рівень ${lvl}). Студент склав речення зі словом «${w.h}» (${w.p || ""} — ${w.uk}): «${inp}». Перевір, чи правильно й природно вжито слово, граматику та порядок слів. ok = true, якщо слово вжито правильно й серйозних помилок немає. ${fmt}`;
  } else if (e.type === "tr"){
    if (stripP(inp) === stripP(e.sent.zh)) local = {ok: true, fix: e.sent.zh, py: e.sent.py, comment: "Точно як в еталоні!"};
    else prompt = `Ти викладач китайської для україномовних студентів (рівень ${lvl}). Студент перекладав китайською речення «${e.sent.uk}». Еталонний переклад: «${e.sent.zh}». Переклад студента: «${inp}». Інші правильні формулювання теж зараховуй. Перевір зміст, граматику й написання ієрогліфів. ${fmt}`;
  } else if (e.type === "desc"){
    if (inp.includes(coreH(w.h))){ toast("Не можна називати саме слово — опишіть його іншими словами"); return; }
    prompt = `Гра «Опиши, не називаючи». Студент (рівень ${lvl}) описав китайською загадане слово: «${inp}». Спершу чесно спробуй вгадати слово лише за описом. Потім порівняй із загаданим: «${w.h}» (${w.uk}). ok = true, якщо опис справді вказує на це слово (близький синонім теж рахується). Відповідай лише JSON: {"guess":"твоя здогадка ієрогліфами","ok":true або false,"fix":"виправлений варіант опису китайською, якщо були мовні помилки, інакше повтори опис","py":"піньїнь","uk":"переклад опису українською","comment":"1–2 речення українською"}`;
  } else if (e.type === "rewrite"){
    if (!inp.includes(coreH(w.h))){ toast("Використайте слово " + coreH(w.h)); return; }
    prompt = `Ти викладач китайської (рівень ${lvl}). Вихідне речення: «${e.sent.zh}» (${e.sent.uk}). Студент мав переписати його, використавши слово «${w.h}» (${w.uk}) і не змінивши змісту. Варіант студента: «${inp}». ok = true, якщо зміст збережено, слово вжито правильно і серйозних помилок немає. ${fmt}`;
  } else if (e.type === "essay"){
    prompt = `Ти доброзичливий викладач китайської для україномовних студентів (рівень ${lvl}). Студент написав короткий текст на тему «${e.topic}», де мав ужити слова: ${e.words.map(x => x.h + " (" + x.uk + ")").join(", ")}. Текст: «${inp}».
Оціни: чи вжито слова правильно, граматику, зв'язність. Відповідай лише JSON: {"ok":true якщо текст загалом вдалий,"score":оцінка від 0 до 10,"fix":"виправлена версія тексту китайською","py":"","uk":"переклад виправленої версії українською","comment":"2–3 речення українською: що вдалося, які помилки, порада"}`;
  }
  e.busy = true; e.err = ""; render();
  try {
    const r = local || await aiCall(prompt);
    if (S.ex !== e) return;
    if (!r || typeof r !== "object") throw {code: "invalid_json"};
    e.res = {ok: !!r.ok, fix: AI_STR(r.fix).slice(0, 600), py: AI_STR(r.py).slice(0, 800), uk: AI_STR(r.uk).slice(0, 800), comment: AI_STR(r.comment).slice(0, 500), guess: AI_STR(r.guess).slice(0, 20),
      score: r.score != null && !isNaN(Number(r.score)) ? Math.max(0, Math.min(10, Math.round(Number(r.score)))) : null, ref: e.type === "tr" && !local ? e.sent.zh : ""};
    e.total++; if (e.res.ok) e.ok++;
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}

const SIM_TURNS = 6;
async function simTurn(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.busy) return;
  const sc = SIMS.find(s => s.id === e.scen), mine = e.log.filter(l => l.me).length, last = mine >= SIM_TURNS;
  const words = e.words.map(w => coreH(w.h) + " (" + w.uk + ")").join(", ");
  const hist = e.log.map(l => (l.me ? "Студент: " : "Ти: ") + l.zh).join("\n") || "(діалог ще не почався — почни його першою реплікою)";
  e.busy = true; e.err = ""; render();
  try {
    const r = await aiCall(`Ти — співрозмовник у рольовій грі для україномовного студента, який вивчає китайську (рівень ${exLevel(ctx)}). Сценарій: ${sc.setup} Твоя роль: ${sc.npc}.
Слова, які варто природно вживати в діалозі: ${words}.
Діалог досі:
${hist}
${mine ? "Оціни останню репліку студента (зміст, граматика, доречність) і" : ""} ${last ? "заверши діалог однією доброзичливою реплікою від своєї ролі. Дай короткий підсумок українською (2–3 речення: що вдалося, 1–2 поради). opts — порожній масив, end = true." : "продовж діалог однією короткою реплікою від своєї ролі (1–2 речення, лексика рівня " + exLevel(ctx) + "). Потім запропонуй студентові 3 варіанти відповіді китайською: один найдоречніший, два — граматично правильні, але менш вдалі за змістом чи ввічливістю (у випадковому порядку). end = false."}
Відповідай лише JSON: {"feedback":"${mine ? "1 речення українською про останню репліку студента" : ""}","fix":"${mine ? "виправлена версія репліки студента китайською, або порожньо, якщо помилок немає" : ""}","npc":{"zh":"твоя репліка","py":"піньїнь із тонами","uk":"переклад українською"},"opts":[{"zh":"…","py":"…","uk":"…"}],"summary":"${last ? "підсумок" : ""}","end":${last}}`);
    if (S.ex !== e) return;
    if (!r || !AI_STR(r.npc?.zh)) throw {code: "invalid_json"};
    const lastMe = [...e.log].reverse().find(l => l.me);
    if (lastMe && mine){ lastMe.fb = AI_STR(r.feedback).slice(0, 300); lastMe.fix = AI_STR(r.fix).slice(0, 160); }
    e.log.push({zh: AI_STR(r.npc.zh).slice(0, 200), py: AI_STR(r.npc.py).slice(0, 400), uk: AI_STR(r.npc.uk).slice(0, 400)});
    e.opts = last ? [] : (Array.isArray(r.opts) ? r.opts : []).filter(o => o && AI_STR(o.zh)).slice(0, 3).map(o => ({zh: AI_STR(o.zh).slice(0, 160), py: AI_STR(o.py).slice(0, 320), uk: AI_STR(o.uk).slice(0, 320)}));
    if (last || r.end === true){ e.end = true; e.summary = AI_STR(r.summary).slice(0, 600); }
    speak(e.log[e.log.length - 1].zh);
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}

// ---- start / record / finish
function startEx(type){
  const ctx = currentCtx(); const src = S.ex && S.ex.key === ctx.key ? S.ex.src : "level";
  const every = wordsOf(ctx.lessons), cvAll = wordsOf(ctx.cv), bank = ctx.preview ? [] : bankWords();
  const pool = exPool(ctx, src);
  const wide = [...every, ...cvAll];
  const distPool = pool.length >= 8 ? pool : wide.length >= 4 ? [...pool, ...wide] : allWords();
  let words = pool.filter(w => w.uk && (type !== "pinyin" || w.p));
  if (type === "mistakes") words = ctx.preview ? words : [...wide, ...bank].filter(w => (S.me.wrong || []).includes(w.id));
  if (!words.length && type !== "duel"){ toast("Для цієї вправи поки немає слів"); return; }
  if (gameOf(type).ai && !S.sample){ toast("Ця вправа працює, коли дозволено звертатися до ШІ"); return; }
  clearInterval(S.exTimer);
  const base = {key: ctx.key, src, type, running: true, finished: false, ok: 0, total: 0, pts: 0, i: 0, pick: null, done: false};
  const e = S.ex = base;
  const fail = msg => { toast(msg || "Замало слів із прикладами для цієї вправи — оберіть ширший набір"); S.ex = {key: ctx.key, src, running: false}; render(); };
  if (type === "pairs"){
    const ws = shuffle(words).slice(0, 6); e.left = ws.map(w => w.id); e.right = shuffle(ws).map(w => w.id); e.matched = []; e.sel = null;
  } else if (type === "ctx"){
    const picks = shuffle(words).map(w => ({w, ex: shuffle(exWith(w))[0]})).filter(o => o.ex);
    const uniq = []; for (const o of picks){ if (uniq.some(u => coreH(u.w.h) === coreH(o.w.h) || u.ex.zh.includes(coreH(o.w.h)) || o.ex.zh.includes(coreH(u.w.h)))) continue; uniq.push(o); if (uniq.length >= 5) break; }
    if (uniq.length < 3) return fail();
    e.paras = uniq.map(o => { const h = coreH(o.w.h), k = o.ex.zh.indexOf(h); return {wid: o.w.id, before: o.ex.zh.slice(0, k), after: o.ex.zh.slice(k + h.length), uk: o.ex.uk}; });
    const extra = shuffle(distPool.filter(x => !uniq.some(u => coreH(u.w.h) === coreH(x.h))))[0];
    e.chipW = {}; for (const o of uniq) e.chipW[o.w.id] = o.w; if (extra) e.chipW[extra.id] = extra;
    e.chips = shuffle(Object.keys(e.chipW)); e.fill = {}; e.showUk = false;
  } else if (type === "recall"){
    const ws = shuffle(words).filter((w, i, a) => a.findIndex(x => x.h === w.h) === i).slice(0, 6); if (ws.length < 4) return fail();
    const others = shuffle(distPool.filter(x => !ws.some(w => w.h === x.h))).filter((w, i, a) => a.findIndex(x => x.h === w.h) === i).slice(0, ws.length);
    e.shown = ws.map(w => w.id); e.cands = shuffle([...ws, ...others].map(w => w.id)); e.sel = []; e.phase = "show"; e.left = 12;

function grammarPage(g, libPreview){
  if (!g) return "";
  const st = S.gram; const exs = g.ex || [];
  const answered = Object.keys(st.ans).length, okN = Object.values(st.ans).filter(a => a.ok).length;
  const qs = exs.map((q, i) => {
    const a = st.ans[i];
    if (q.type === "order"){
      const picked = st.order[i] || [];
      const built = picked.map(k => `<button class="wchip" data-act="gOrderUndo" data-arg="${i}:${k}" ${a ? "disabled" : ""}>${esc(q.words[k])}</button>`).join("");
      const bank = (st.bank[i] || []).map(k => `<button class="wchip" data-act="gOrderPick" data-arg="${i}:${k}" ${picked.includes(k) || a ? "disabled" : ""}>${esc(q.words[k])}</button>`).join("");
      return `<div class="gq"><span class="qn">Вправа ${i + 1} · Складіть речення</span>${q.q ? `<span class="qt">${rich(q.q)}</span>` : ""}${q.uk ? `<span class="muted">«${esc(q.uk)}»</span>` : ""}
        <div class="built" aria-label="Ваше речення">${built || `<span class="small muted">Натискайте слова нижче по порядку</span>`}</div>
        <div class="chips">${bank}</div>
        ${a ? `<span class="pill ${a.ok ? "ok" : "bad"}" style="align-self:flex-start">${a.ok ? "Правильно" : "Правильно так: " + esc(q.a)}</span>${q.why ? `<span class="why">${rich(q.why)}</span>` : ""}`
          : `<div class="row"><button class="btn sm primary" data-act="gOrderCheck" data-arg="${i}" ${picked.length !== q.words.length ? "disabled" : ""}>Перевірити</button><button class="btn sm ghost" data-act="gOrderReset" data-arg="${i}">Скинути</button></div>`}</div>`;
    }
    const ord = (st.perm && st.perm[i]) || (q.opts || []).map((_, k) => k);
    const opts = ord.map(k => { const o = q.opts[k]; const cls = !a ? "" : k === q.a ? "right" : k === a.pick ? "wrong" : ""; return `<button class="opt ${/^[一-鿿]/.test(o) ? "h" : ""} ${cls}" data-act="gPick" data-arg="${i}:${k}" ${a ? "disabled" : ""}>${esc(o)}</button>`; }).join("");
    return `<div class="gq"><span class="qn">Вправа ${i + 1}</span><span class="qt">${rich(q.q)}</span>${q.zh ? `<span class="qzh">${esc(q.zh)}</span>` : ""}<div class="opts">${opts}</div>
      ${a ? `<span class="pill ${a.ok ? "ok" : "bad"}" style="align-self:flex-start">${a.ok ? "Правильно" : "Неправильно"}</span>${q.why ? `<span class="why">${rich(q.why)}</span>` : ""}` : ""}</div>`;
  }).join("");
  const done = exs.length && answered === exs.length;
  return `<div class="gpage">
    <div class="spread"><button class="link" data-act="closeGram">← Усі теми</button><span class="small muted">${esc(lvName(g.hsk))}${g.lesson ? " · " + esc(g.lesson) : ""}</span></div>
    <div><div class="eyebrow">Граматика</div><h1 class="pt">${esc(g.title)}</h1>${g.summary ? `<p class="muted" style="margin-top:8px;max-width:62ch">${esc(g.summary)}</p>` : ""}</div>
    ${(g.blocks || []).map(renderBlock).join("")}
    ${exs.length ? `<div class="sh" style="margin:12px 0 0"><h2>Вправи</h2><span class="small muted">${libPreview || currentCtx().preview ? "Перегляд: відповіді не зберігаються" : `Правильна відповідь +${PTS.gram} (раз на день) · уся тема без помилок уперше +${PTS.gramDone}`}</span></div>${qs}` : ""}
    ${done ? `<div class="panel result"><div class="score num">${okN}/${exs.length}</div><p class="muted">${okN === exs.length ? "Тему засвоєно!" : "Перечитайте пояснення й спробуйте ще раз."}</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="gRetry">Пройти вправи ще раз</button><button class="btn" data-act="closeGram">До тем</button></div></div>` : ""}
  </div>`;
}
function openGram(id){
  const g = S.grammar[id]; if (!g) return;
  const bank = {}, perm = {}; (g.ex || []).forEach((q, i) => { if (q.type === "order") bank[i] = shuffle(q.words.map((_, k) => k)); else perm[i] = shuffle((q.opts || []).map((_, k) => k)); });
  S.gram = {id, ans: {}, order: {}, bank, perm};
  render(); window.scrollTo(0, 0);
}
function gramRecord(i, ok){
  const g = S.grammar[S.gram.id]; const ctx = currentCtx();
  if (ctx.preview || staffUI()) return;
  const me = S.me; me.exTotal = (me.exTotal || 0) + 1; logAdd(me, "a", 1); dailyCheck(me);
  if (ok){ me.exOk = (me.exOk || 0) + 1; if (onceToday(me, "g:" + g.id + ":" + i)){ me.cor = (me.cor || 0) + 1; addPoints(me, PTS.gram, "g"); logAdd(me, "c", 1); toast("+" + PTS.gram + " бали"); } }
  const n = (g.ex || []).length, answered = Object.keys(S.gram.ans).length;
  if (answered === n){
    const okN = Object.values(S.gram.ans).filter(a => a.ok).length;
    me.gram = me.gram || {}; const prev = me.gram[g.id];
    me.gram[g.id] = {best: Math.max(okN, prev?.best || 0), n, last: today(), full: prev?.full || 0};
    if (okN === n && n > 0 && !prev?.full){ me.gram[g.id].full = 1; addPoints(me, PTS.gramDone, "b"); setTimeout(() => toast(`Тему пройдено на 100%! +${PTS.gramDone} бонус`), 700); }
    me.exDone = (me.exDone || 0) + 1;
  }
  saveMe();
}

function myPointsHtml(){
  if (!S.me) return "";
  const sum = from => { const t = {k: 0, e: 0, g: 0, b: 0, p: 0}; for (const [d, v] of Object.entries(S.me.log || {})) if (!from || d >= from) for (const k of Object.keys(t)) t[k] += (k === "p" ? v.p : v["p" + k]) || 0; return t; };
  const w = sum(periodStart("week")), td = sum(today());

function rankView(teacher, classId){

  testStudent(id){ const cid = id || S.view.id || classesOf(ctxTid())[0]?.id; if (!cid){ toast("Спершу створіть групу або учня"); return; } enterTest(cid); },
  exitTest(){ exitTest(); },
  dictSearch(){ dictSearch(); },
  dictAdd(i){
    const w = S.dict.res[Number(i)]; if (!w || !S.me) return; const me = S.me; me.bankOwn = me.bankOwn || [];
    if (me.bankOwn.some(x => x.h === w.h) || bankWords().some(x => x.h === w.h)){ toast("Це слово вже є в банці"); return; }
    if (me.bankOwn.length >= 300){ toast("У банці вже 300 власних слів"); return; }
    me.bankOwn.push({id: rid("own"), h: w.h, p: w.p, uk: w.uk, ex: w.ex, src: "dict"}); me.bankAdded = (me.bankAdded || 0) + 1; saveMe(); toast("Додано до банки слів"); render();
  },
  achNext(){ S.modal = null; if ((S.achQueue || []).length) showNextAch(); else { renderModal(); render(); } },
  achAll(){ S.modal = null; S.achQueue = []; renderModal(); S.mode = "vocab"; S.gram = null; S.view = {tab: "ach"}; render(); window.scrollTo(0, 0); },
  toggleSound(){ let on = true; try { on = localStorage.getItem("asianish.sound") !== "off"; localStorage.setItem("asianish.sound", on ? "off" : "on"); } catch(e){} if (!on) soundTick(); render(); },
  confirmYes(){ const run = S.modal?.run; S.modal = null; renderModal(); if (run) run(); },
  matFolder(v){ S.matF.hsk = v; S.matF.type = ""; render(); },
  matType(v){ S.matF.type = v; render(); },
  matWho(w){ S.matF.who = w; render(); },
  matDel(id){
    const m = S.materials[id]; if (!m) return;
    S.modal = {kind: "confirm", title: "Видалити матеріал?", text: `Посилання «${m.title}» буде видалено з матеріалів. Сам файл чи дошка (Miro, Canva, Drive) не зміняться.`, yes: "Видалити", run: async () => {
      try {
        await S.db.doc("materials/" + id).delete(); delete S.materials[id]; toast("Видалено"); render();
      } catch(e){ toast("Не вдалося видалити"); }
    }}; renderModal();
  },
  copyCode(id){ const c = S.classes[id]; if (c) copyText(c.code, `Код ${c.code} скопійовано`); },
  copyInvite(id){ const c = S.classes[id]; if (c) copyText(inviteText(c), "Повідомлення скопійовано — вставте його учню"); },
  copyAllCodes(){
    const admin = S.role === "admin", cs = admin ? classesSorted() : classesOf(myTeacherId());
    if (!cs.length){ toast("Ще немає груп і учнів"); return; }
    copyText(cs.map(c => "— " + c.name + " —\n" + inviteText(c)).join("\n\n"), "Усі повідомлення скопійовано");
  },
  async codesCsv(){
    const admin = S.role === "admin", cs = admin ? classesSorted() : classesOf(myTeacherId());
    const rows = [["Викладач","Група / учень","Формат","Рівень","Розклад","Код","Студентів","Повідомлення"]];
    cs.forEach(c => rows.push([S.teachers[c.teacherId]?.name || "", c.name, c.kind === "individual" ? "Індивідуально" : "Група", lvName(c.course || "HSK1"), c.schedule || "", c.code || "", Object.values(S.students).filter(st => st.classId === c.id).length, inviteText(c)]));
    const csv = "\ufeff" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
    try { await S.downloads.save({filename: `asianish-kody-${today()}.csv`, data: csv}); toast("Таблицю збережено"); } catch(e){ if (e.code !== "declined") toast("Не вдалося зберегти файл"); }
  },
  async exportCsv(cid){
    const c = S.classes[cid]; const rows = [["Студент","Псевдонім","Група","Опановано","Слів у доступі","Повторити","Вивчає","Теми граматики","Точність %","Вправ","Серія днів","Бали всього","Бали за тиждень","Бали за місяць","Остання активність"]];
    Object.values(S.students).filter(st => st.classId === cid).forEach(st => { const s = statsOf(st, availLessons(st, c)); rows.push([st.name, st.alias || "", c.name, s.mastered, s.total, s.due, s.learning, Object.keys(st.gram || {}).length, s.acc ?? "", s.exDone, s.streak, s.points, rankRow(st, "week").pts, rankRow(st, "month").pts, st.updatedAt ? dstr(new Date(st.updatedAt)) : ""]); });
    const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
    if (!S.downloads){ toast("Завантаження недоступне в цьому вікні"); return; }
    try { await S.downloads.save({filename: `asianish-${(c.name || "group").replace(/[^\p{L}\p{N}]+/gu, "-")}-${today()}.csv`, data: csv}); toast("Файл збережено"); }
    catch(e){ if (e.code !== "declined") toast("Не вдалося зберегти файл"); }
  }
};
const FORM = {
  async newClass(f){
    const fd = new FormData(f); const kind = S.modal?.type || "group";
    const id = (kind === "individual" ? "s-" : "g-") + Date.now().toString(36);
    const teacherId = S.modal?.tid || "";
    const ok = await dbSet("classes/" + id, {name: fd.get("name").trim(), kind, schedule: fd.get("schedule").trim(), course: fd.get("course"), age: fd.get("age") || "adult", code: code6(), closed: [], order: Date.now(), teacherId}, "Створено");
    if (ok){ S.modal = null; S.view = {name: "class", id, tab: "overview", tid: S.role === "admin" ? teacherId : undefined}; render(); }
  },
  async classSettings(f){
    const fd = new FormData(f), c = S.classes[S.view.id]; const {id: _, ...body} = c;
    const teacherId = S.role === "admin" ? (fd.get("teacherId") || "") : (c.teacherId || "");
    if (await dbSet("classes/" + c.id, {...body, name: fd.get("name").trim(), kind: fd.get("kind"), schedule: fd.get("schedule").trim(), course: fd.get("course"), age: (fd.get("kind") === "individual" ? AGES : AGES_GROUP)[fd.get("age")] ? fd.get("age") : "adult", teacherId}, "Збережено")){ if (S.role === "admin") S.view.tid = teacherId; render(); }
  },
  async settings(f){
    const fd = new FormData(f);
    if (await dbSet("settings/main", {...S.settings, school: fd.get("school").trim(), groupRanking: fd.get("groupRanking") === "on", youtube: (fd.get("youtube") || "").trim()}, "Налаштування збережено")) { S.view = {name: "home"}; render(); }
  },
  async myTeacher(f){
    const fd = new FormData(f), t = S.teachers[myTeacherId()]; if (!t) return; const {id: _, ...body} = t;
    if (await dbSet("teachers/" + t.id, {...body, name: fd.get("name").trim() || t.name, subject: fd.get("subject").trim()}, "Профіль збережено")) { S.view = {name: "home"}; render(); }
  },
  async teacher(f){
    const fd = new FormData(f), md = S.modal, old = md.id ? S.teachers[md.id] : null;
    const name = fd.get("name").trim(); if (!name){ toast("Вкажіть ім'я"); return; }
    const email = String(fd.get("email") || "").trim().toLowerCase();
    let uid = old?.uid || "";
    if (email !== String(old?.email || (old?.uid ? S.staff[old.uid]?.email || "" : "")).toLowerCase()) uid = "";
    if (email && !uid){ try { uid = await window.ASIANISH_FIND(email); } catch(e){ uid = ""; } }
    if (!email) uid = "";
    if (uid && Object.values(S.teachers).some(t => t.uid === uid && t.id !== md.id)){ toast("Цей акаунт уже прив'язано до іншого викладача"); return; }
    const id = md.id || "t-" + Date.now().toString(36);
    const body = {...(old ? (({id: _, ...b}) => b)(old) : {order: Date.now()}), name, subject: fd.get("subject").trim() || "Китайська мова", uid, email};
    if (await dbSet("teachers/" + id, body, md.id ? "Збережено" : "Викладача додано")){
      try { if (old?.uid && old.uid !== uid) await window.ASIANISH_ROLE(old.uid, null); if (uid) await window.ASIANISH_ROLE(uid, "teacher"); }
      catch(e){ toast("Картку збережено, але права не надано. Спробуйте ще раз."); }
      if (email && !uid) setTimeout(() => toast("Ця пошта ще не входила на сайт. Попросіть викладачку увійти один раз і знову натисніть «Зберегти»."), 1200);
      S.modal = null; renderModal(); S.view = {name: "teacher", tid: id}; render();
    }
  },
  async register(f){
    const fd = new FormData(f), err = $("#rg-err"), btn = $("#rg-btn");
    const name = fd.get("name").trim(); const code = fd.get("code").trim().toUpperCase();
    let classId = "";
    if (code){ const c = Object.values(S.classes).find(c => (c.code || "").toUpperCase() === code); if (!c){ err.textContent = "Такого коду немає. Перевірте його або залиште поле порожнім."; err.hidden = false; return; } classId = c.id; }
    if (!name){ err.textContent = "Вкажіть ім'я"; err.hidden = false; return; }
    const me = newProfile({name, alias: fd.get("alias").trim(), useAlias: fd.get("useAlias") === "on", classId, level: fd.get("level")});
    btn.disabled = true; btn.textContent = "Створюю…";
    if (S.uid){
      try { await S.db.doc("students/" + S.uid).set(me); S.me = me; S.store = "remote"; }
      catch(e){ S.me = me; S.store = "local"; lsSet(localKey(), me); }
    } else { S.me = me; S.store = "local"; lsSet(localKey(), me); }
    S.view = {tab: "dash"}; render(); window.scrollTo(0, 0);
  },
  async matAdd(f){
    const fd = new FormData(f), err = $("#mt-err");
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    let url = String(fd.get("url") || "").trim();
    if (url && !/^https?:\/\//i.test(url) && /^[\w-]+(\.[\w-]+)+/.test(url)) url = "https://" + url;
    if (!/^https?:\/\//i.test(url)) return fail("Вставте посилання, що починається з https://");
    const doc = {kind: "link", url, title: fd.get("title").trim() || hostOf(url) || "Посилання", hsk: fd.get("hsk"), type: fd.get("type") || guessType(url) || "other",
      lesson: fd.get("lesson").trim(), note: fd.get("note").trim(), teacherId: myTeacherId(), createdBy: S.uid || "", createdAt: Date.now()};
    const id = rid("M");
    try { await S.db.doc("materials/" + id).set(doc); S.materials[id] = {...doc, id}; S.matNew.type = ""; toast(`Додано в папку «${doc.hsk ? lvName(doc.hsk) : "Без рівня"}»`); render(); }
    catch(x){ fail("Не вдалося зберегти: немає прав (потрібна роль «Редактор»)."); }
  },
  bankOwn(f){
    if (!S.me) return; const fd = new FormData(f); const h = fd.get("h").trim(), uk = fd.get("uk").trim();
    if (!h || !uk){ toast("Вкажіть ієрогліфи й переклад"); return; }
    const me = S.me; me.bankOwn = me.bankOwn || [];
    if (me.bankOwn.length >= 300){ toast("У банці вже 300 власних слів"); return; }
    me.bankOwn.push({id: rid("own"), h, p: fd.get("p").trim(), uk}); me.bankAdded = (me.bankAdded || 0) + 1; saveMe(); toast("Слово додано до банки"); render();
  },
  profile(f){
    const fd = new FormData(f), err = $("#pf-err"); const code = fd.get("code").trim().toUpperCase();
    if (code){ const c = Object.values(S.classes).find(c => (c.code || "").toUpperCase() === code); if (!c){ err.textContent = "Такого коду немає."; err.hidden = false; return; } S.me.classId = c.id; S.cards = null; S.ex = null; S.level = null; }
    S.me.name = fd.get("name").trim() || S.me.name; S.me.alias = fd.get("alias").trim(); S.me.useAlias = fd.get("useAlias") === "on"; S.me.level = fd.get("level");
    saveMe(); toast("Профіль збережено"); render();
  }
};

// ---------- events
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset.arg, el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing && e.target.dataset?.xenter){ e.preventDefault(); const fn = ACT[e.target.dataset.xenter]; if (fn) fn(); return; }
  if (e.key === "Enter" && e.target.id === "bank-q"){ e.preventDefault(); clearTimeout(dictTimer); dictSearch(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".flash")){ e.preventDefault(); ACT.flip(); }
});
document.addEventListener("submit", e => { const f = e.target; const fn = FORM[f.dataset.form]; if (fn){ e.preventDefault(); fn(f); } });
function gedInput(el){
  const e = S.gedit; if (!e) return;
  const k = el.dataset.gf;
  if (el.dataset.gi != null){
    const q = e.ex[Number(el.dataset.gi)]; if (!q) return;
    if (el.dataset.go != null) q.opts[Number(el.dataset.go)] = el.value;
    else if (k === "a" && el.type === "radio"){ if (el.checked) q.a = Number(el.value); }
    else q[k] = el.value;
    return;
  }
  if (k === "hidden") e.hidden = el.checked;
  else if (k) e[k] = el.value;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.xin){ if (S.ex) S.ex[el.dataset.xin] = el.value; return; }
  if (el.dataset.mo){ if (S.medit) S.medit.text = el.value; return; }
  if (el.dataset.pe){ const pe = S.pedit; if (!pe) return; const f = el.dataset.pe, i = Number(el.dataset.i);
    if (f === "v"){ pe.skills[i].v = Number(el.value); const a = document.getElementById("pev-" + i), b = document.getElementById("pel-" + i); if (a) a.textContent = el.value; if (b) b.textContent = skLabel(Number(el.value)); }
    else if (f === "note") pe.skills[i].note = el.value; else pe[f] = el.value; return; }
  if (el.dataset.mt === "url"){ const t = guessType(el.value); const sel = $("#mt-type"); if (t && sel){ sel.value = t; S.matNew.type = t; } return; }
  if (el.dataset.mf){ S.matF[el.dataset.mf] = el.value; const q = el.dataset.mf === "q", pos = el.selectionStart; render(); if (q){ const n = document.querySelector('[data-mf="q"]'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} } } return; }
  if (el.id === "bank-q"){
    S.bankQ = el.value; bankUpdateResults();
    clearTimeout(dictTimer);
    if (S.bankQ.trim() !== S.dict.q){ if (S.dict.q && !S.bankQ.trim()){ S.dict = {q: "", busy: false, res: [], err: ""}; dictUpdate(); } else if (S.bankQ.trim()) { S.dict = {...S.dict, busy: true, q: S.bankQ.trim(), res: [], err: ""}; dictUpdate(); dictTimer = setTimeout(dictSearch, 800); } }
    return;
  }
  if (el.dataset.gf != null || el.dataset.go != null){ gedInput(el); return; }
  const k = el.dataset.ef; if (k == null || !S.edit) return;
  if (el.dataset.i != null){
    const w = S.edit.words[Number(el.dataset.i)];
    if (el.dataset.k != null){ const x = w.ex[Number(el.dataset.k)]; x[k === "xuk" ? "uk" : k] = el.value; }
    else w[k] = el.value;
  }
  else S.edit[k] = el.type === "checkbox" ? el.checked : el.value;
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.gf != null || el.dataset.go != null){ gedInput(el); if (el.dataset.gf === "hsk") render(); return; }
  if (el.dataset.ef === "hidden" && S.edit) S.edit.hidden = el.checked;
  if (el.dataset.ef === "hsk" && S.edit) S.edit.hsk = el.value;
  const c = el.dataset.chg; if (!c) return;
  if (c === "assign"){ const id = el.dataset.id; try { await S.db.doc("students/" + id).update({classId: el.value, assignAt: Date.now()}); toast("Групу змінено"); } catch(err){ toast("Не вдалося змінити групу"); } }
  else if (c === "cskind"){ const a = document.getElementById("cs-age"); if (a) a.innerHTML = ageOpts(el.value, a.value); }
  else if (c === "momonth"){ if (S.medit){ moOpen(S.medit.sid, el.value); render(); } }
  else if (c === "pomopreset"){ const p = pomoLoad(); p.preset = el.value; p.run = false; p.left = pomoLen(p.phase) * 60; p.end = 0; pomoSave(); const w = document.getElementById("pomo"); if (w) w.outerHTML = pomoHtml(); pomoTick(); }
  else if (c === "labcls"){ const prev = S.ex?.src || "level"; S.exlab = {cls: el.value}; S.ex = {key: currentCtx().key, src: srcGroup(prev) === "cv" ? "cv" : prev, running: false}; render(); }
  else if (c === "exsrc"){ const ctx = currentCtx(); S.ex = {key: ctx.key, src: el.value, running: false}; }
  else if (c === "rankscope"){ S.rank.scope = el.value; render(); }
  else if (c === "rankteacher"){ S.rank.tid = el.value; S.rank.scope = "all"; render(); }
  else if (c === "photo" && el.files && el.files[0]) aiPhoto(el.files[0]);
});

render();
window.ASIANISH_READY.then(boot).catch(() => { S.phase = "offline"; render(); });
})();
