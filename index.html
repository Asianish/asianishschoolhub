店和饭馆。","py":"yǐ qián wǒ men zhù zài chéng shì zhōng xīn fù jìn yǒu hěn duō shāng diàn hé fàn guǎn","uk":"Раніше ми жили в центрі міста, поруч було багато магазинів і ресторанів."},{"zh":"但是那里车太多，晚上也很难休息。","py":"dàn shì nà lǐ chē tài duō wǎn shang yě hěn nán xiū xi","uk":"Але там було забагато машин, і навіть увечері важко було відпочити."},{"zh":"现在的家在城市的南边，离公司比较远。","py":"xiàn zài de jiā zài chéng shì de nán biān lí gōng sī bǐ jiào yuǎn","uk":"Новий дім на півдні міста, досить далеко від роботи."},{"zh":"可是这里很安静，楼下还有一个大公园。","py":"kě shì zhè lǐ hěn ān jìng lóu xià hái yǒu yí gè dà gōng yuán","uk":"Зате тут дуже тихо, а біля будинку є великий парк."},{"zh":"每天早上，爷爷奶奶都去公园锻炼身体。","py":"měi tiān zǎo shang yé ye nǎi nai dōu qù gōng yuán duàn liàn shēn tǐ","uk":"Щоранку дідусь і бабуся ходять у парк займатися спортом."},{"zh":"我的房间也比以前大多了，我终于有了自己的书桌。","py":"wǒ de fáng jiān yě bǐ yǐ qián dà duō le wǒ zhōng yú yǒu le zì jǐ de shū zhuō","uk":"Моя кімната теж стала набагато більшою, і нарешті в мене є власний письмовий стіл."},{"zh":"虽然上班的路远了一些，但是我觉得搬家是一个好决定。","py":"suī rán shàng bān de lù yuǎn le yì xiē dàn shì wǒ jué de bān jiā shì yí gè hǎo jué dìng","uk":"Хоча дорога на роботу стала довшою, я вважаю, що переїзд — добре рішення."}],"q":[{"q":"Чому родина переїхала?","o":["У центрі було багато машин і важко відпочивати","Квартира була дорогою","Було далеко від школи"],"a":0},{"q":"Що є біля нового будинку?","o":["Великий парк","Ринок","Лікарня"],"a":0},{"q":"Що роблять дідусь і бабуся щоранку?","o":["Займаються спортом у парку","Ходять на ринок","Довго сплять"],"a":0}],"en":{"topic":"Home","uk":"Moving house","s":[{"uk":"Last month our family moved to a new place."},{"uk":"We used to live in the city centre, with lots of shops and restaurants nearby."},{"uk":"But there were too many cars there, and it was hard to relax even in the evening."},{"uk":"The new home is in the south of the city, quite far from work."},{"uk":"But it's very quiet here, and there's a big park next to the building."},{"uk":"Every morning Grandpa and Grandma go to the park to exercise."},{"uk":"My room is much bigger too, and at last I have a desk of my own."},{"uk":"Although the way to work is longer now, I think moving was a good decision."}],"q":[{"q":"Why did the family move?","o":["There were many cars in the centre and it was hard to relax","The flat was expensive","It was far from school"]},{"q":"What is there next to the new building?","o":["A big park","A market","A hospital"]},{"q":"What do Grandpa and Grandma do every morning?","o":["Exercise in the park","Go to the market","Sleep late"]}]}},{"id":"T3-02","hsk":"HSK3","topic":"Хобі","zh":"我的爱好","py":"wǒ de ài hào","uk":"Моє хобі","s":[{"zh":"我的爱好是画画。","py":"wǒ de ài hào shì huà huà","uk":"Моє хобі — малювання."},{"zh":"从小我就对画画很感兴趣。","py":"cóng xiǎo wǒ jiù duì huà huà hěn gǎn xìng qù","uk":"Я з дитинства дуже цікавлюся малюванням."},{"zh":"小时候，我常常在纸上画小猫、小狗和花。","py":"xiǎo shí hou wǒ cháng cháng zài zhǐ shang huà xiǎo māo xiǎo gǒu hé huā","uk":"Коли я був малим, то часто малював на папері котиків, песиків і квіти."},{"zh":"上大学以后，我开始跟一位老师学习中国画。","py":"shàng dà xué yǐ hòu wǒ kāi shǐ gēn yí wèi lǎo shī xué xí Zhōng guó huà","uk":"Коли вступив до університету, почав вивчати китайський живопис у вчителя."},{"zh":"画中国画不容易，需要很多时间和练习。","py":"huà Zhōng guó huà bù róng yì xū yào hěn duō shí jiān hé liàn xí","uk":"Малювати в китайському стилі нелегко: потрібно багато часу й практики."},{"zh":"我最喜欢画山和水，看着这些画，我的心会变得很安静。","py":"wǒ zuì xǐ huan huà shān hé shuǐ kàn zhe zhè xiē huà wǒ de xīn huì biàn de hěn ān jìng","uk":"Найбільше я люблю малювати гори й воду: коли дивлюся на ці картини, на душі стає спокійно."},{"zh":"上个星期，我的一张画在学校的比赛中得了第一名。","py":"shàng gè xīng qī wǒ de yì zhāng huà zài xué xiào de bǐ sài zhōng dé le dì yī míng","uk":"Минулого тижня моя картина посіла перше місце в університетському конкурсі."},{"zh":"我希望以后能一直画下去。","py":"wǒ xī wàng yǐ hòu néng yì zhí huà xià qu","uk":"Сподіваюся, що й надалі завжди малюватиму."}],"q":[{"q":"Яке хобі в автора?","o":["Малювання","Спів","Футбол"],"a":0},{"q":"Що він найбільше любить малювати?","o":["Гори й воду","Котів","Людей"],"a":0},{"q":"Що сталося минулого тижня?","o":["Його картина посіла перше місце","Він купив фарби","Він поїхав до Пекіна"],"a":0}],"en":{"topic":"Hobbies","uk":"My hobby","s":[{"uk":"My hobby is drawing."},{"uk":"I've been very interested in drawing since I was a child."},{"uk":"When I was little, I often drew cats, dogs and flowers on paper."},{"uk":"When I went to university, I started learning Chinese painting from a teacher."},{"uk":"Painting in the Chinese style isn't easy: it takes a lot of time and practice."},{"uk":"Most of all I like painting mountains and water: when I look at these pictures, I feel calm."},{"uk":"Last week my painting won first place in a university competition."},{"uk":"I hope I'll always keep painting."}],"q":[{"q":"What is the author's hobby?","o":["Drawing","Singing","Football"]},{"q":"What does he like painting most?","o":["Mountains and water","Cats","People"]},{"q":"What happened last week?","o":["His painting won first place","He bought paints","He went to Beijing"]}]}},{"id":"T3-03","hsk":"HSK3","topic":"Свята","zh":"春节","py":"Chūn Jié","uk":"Свято Весни","s":[{"zh":"春节是中国最重要的节日。","py":"Chūn Jié shì Zhōng guó zuì zhòng yào de jié rì","uk":"Свято Весни — найважливіше свято в Китаї."},{"zh":"春节以前，很多人会坐火车或者飞机回家，和家人在一起。","py":"Chūn Jié yǐ qián hěn duō rén huì zuò huǒ chē huò zhě fēi jī huí jiā hé jiā rén zài yì qǐ","uk":"Перед святом багато людей їдуть потягом або летять літаком додому, щоб побути з рідними."},{"zh":"春节的前一天晚上，一家人一起吃饭、聊天、看电视。","py":"Chūn Jié de qián yì tiān wǎn shang yì jiā rén yì qǐ chī fàn liáo tiān kàn diàn shì","uk":"Увечері напередодні свята вся родина разом вечеряє, спілкується й дивиться телевізор."},{"zh":"北方人一般会吃饺子。","py":"běi fāng rén yì bān huì chī jiǎo zi","uk":"На півночі Китаю зазвичай їдять пельмені цзяоцзи."},{"zh":"孩子们最高兴，因为大人会给他们红包，里面有钱。","py":"hái zi men zuì gāo xìng yīn wèi dà ren huì gěi tā men hóng bāo lǐ miàn yǒu qián","uk":"Найбільше радіють діти, бо дорослі дарують їм червоні конверти з грошима."},{"zh":"春节的时候，街上很多地方都是红色的。","py":"Chūn Jié de shí hou jiē shang hěn duō dì fang dōu shì hóng sè de","uk":"На свято багато чого на вулицях червоного кольору."},{"zh":"中国人觉得红色是一种快乐的颜色。","py":"Zhōng guó rén jué de hóng sè shì yì zhǒng kuài lè de yán sè","uk":"Китайці вважають червоний радісним кольором."},{"zh":"你们国家最重要的节日是什么？","py":"nǐ men guó jiā zuì zhòng yào de jié rì shì shén me","uk":"А яке найважливіше свято у вашій країні?"}],"q":[{"q":"Що родина робить увечері напередодні свята?","o":["Вечеряє разом, спілкується й дивиться телевізор","Іде на роботу","Купує квитки"],"a":0},{"q":"Чому діти радіють найбільше?","o":["Дорослі дарують їм червоні конверти з грошима","Не треба вчитися","Можна довго спати"],"a":0},{"q":"Яким кольором вважають червоний?","o":["Радісним","Сумним","Небезпечним"],"a":0}],"en":{"topic":"Holidays","uk":"The Spring Festival","s":[{"uk":"The Spring Festival is the most important holiday in China."},{"uk":"Before the holiday many people go home by train or plane to be with their families."},{"uk":"On the eve of the holiday the whole family has dinner together, talks and watches TV."},{"uk":"In the north of China people usually eat jiaozi dumplings."},{"uk":"Children are the happiest, because the adults give them red envelopes with money."},{"uk":"During the holiday many things in the streets are red."},{"uk":"Chinese people consider red a happy colour."},{"uk":"And what is the most important holiday in your country?"}],"q":[{"q":"What does the family do on the eve of the holiday?","o":["Has dinner together, talks and watches TV","Goes to work","Buys tickets"]},{"q":"Why are children the happiest?","o":["The adults give them red envelopes with money","They don't have to study","They can sleep late"]},{"q":"What kind of colour is red considered?","o":["Happy","Sad","Dangerous"]}]}},{"id":"T3-04","hsk":"HSK3","topic":"Робота","zh":"迟到了","py":"chí dào le","uk":"Запізнився","s":[{"zh":"今天早上我起床起晚了。","py":"jīn tiān zǎo shang wǒ qǐ chuáng qǐ wǎn le","uk":"Сьогодні вранці я проспав."},{"zh":"我一看手表，已经八点半了！","py":"wǒ yí kàn shǒu biǎo yǐ jīng bā diǎn bàn le","uk":"Глянув на годинник — а вже пів на дев'яту!"},{"zh":"九点公司有一个重要的会议。","py":"jiǔ diǎn gōng sī yǒu yí gè zhòng yào de huì yì","uk":"О дев'ятій на роботі мала бути важлива нарада."},{"zh":"我没有时间吃早饭，马上跑出了家门。","py":"wǒ méi yǒu shí jiān chī zǎo fàn mǎ shàng pǎo chū le jiā mén","uk":"У мене не було часу снідати, і я одразу вибіг із дому."},{"zh":"路上车特别多，公共汽车走得很慢。","py":"lù shang chē tè bié duō gōng gòng qì chē zǒu de hěn màn","uk":"На дорозі було дуже багато машин, автобус їхав повільно."},{"zh":"我决定下车，自己走过去。","py":"wǒ jué dìng xià chē zì jǐ zǒu guò qu","uk":"Я вирішив вийти з автобуса й піти пішки."},{"zh":"九点十分，我终于到了公司，可是会议已经开始了。","py":"jiǔ diǎn shí fēn wǒ zhōng yú dào le gōng sī kě shì huì yì yǐ jīng kāi shǐ le","uk":"О дев'ятій десять я нарешті дістався роботи, але нарада вже почалася."},{"zh":"经理没有生气，他只是说：“下次早一点出门。”","py":"jīng lǐ méi yǒu shēng qì tā zhǐ shì shuō xià cì zǎo yì diǎn chū mén","uk":"Керівник не розсердився, лише сказав: «Наступного разу виходь трохи раніше»."},{"zh":"从明天开始，我要早一点睡觉。","py":"cóng míng tiān kāi shǐ wǒ yào zǎo yì diǎn shuì jiào","uk":"Від завтра я лягатиму спати раніше."}],"q":[{"q":"О котрій я глянув на годинник?","o":["О 8:30","О 7:00","О 9:00"],"a":0},{"q":"Чому я вийшов з автобуса?","o":["Було багато машин, автобус їхав повільно","Автобус зламався","Я сів не на той автобус"],"a":0},{"q":"Що сказав керівник?","o":["Наступного разу виходь раніше","Ти звільнений","Нічого"],"a":0}],"en":{"topic":"Work","uk":"Running late","s":[{"uk":"This morning I overslept."},{"uk":"I looked at the clock — and it was already half past eight!"},{"uk":"There was an important meeting at work at nine."},{"uk":"I had no time for breakfast and ran straight out of the house."},{"uk":"There were a lot of cars on the road, and the bus was moving slowly."},{"uk":"I decided to get off the bus and walk."},{"uk":"At ten past nine I finally got to work, but the meeting had already started."},{"uk":"My boss didn't get angry, he just said: \"Next time leave a bit earlier.\""},{"uk":"From tomorrow I'll go to bed earlier."}],"q":[{"q":"What time was it when I looked at the clock?","o":["8:30","7:00","9:00"]},{"q":"Why did I get off the bus?","o":["There were a lot of cars and the bus was slow","The bus broke down","I got on the wrong bus"]},{"q":"What did the boss say?","o":["Next time leave earlier","You're fired","Nothing"]}]}},{"id":"T3-05","hsk":"HSK3","topic":"Навчання","zh":"在中国留学","py":"zài Zhōng guó liú xué","uk":"Навчання в Китаї","s":[{"zh":"我叫奥莲娜，去年九月我来到北京留学。","py":"wǒ jiào Ào lián nà qù nián jiǔ yuè wǒ lái dào Běi jīng liú xué","uk":"Мене звати Олена, торік у вересні я приїхала навчатися до Пекіна."},{"zh":"刚来的时候，我听不懂中国人说话，觉得很着急。","py":"gāng lái de shí hou wǒ tīng bu dǒng Zhōng guó rén shuō huà jué de hěn zháo jí","uk":"Коли я тільки приїхала, то не розуміла, що кажуть китайці, і дуже хвилювалася."},{"zh":"我认识了一个日本女孩，她叫美子，她对我非常好。","py":"wǒ rèn shi le yí gè Rì běn nǚ hái tā jiào Měi zǐ tā duì wǒ fēi cháng hǎo","uk":"Я познайомилася з японською дівчиною Мейцзи, вона дуже добре до мене ставиться."},{"zh":"我们常常一起去超市买东西，一起做饭。","py":"wǒ men cháng cháng yì qǐ qù chāo shì mǎi dōng xi yì qǐ zuò fàn","uk":"Ми часто разом ходимо до супермаркету й разом готуємо."},{"zh":"周末我们还会去爬山。","py":"zhōu mò wǒ men hái huì qù pá shān","uk":"На вихідних ми ще ходимо в гори."},{"zh":"现在我的汉语水平提高了很多，在商店里可以和中国人聊天了。","py":"xiàn zài wǒ de Hàn yǔ shuǐ píng tí gāo le hěn duō zài shāng diàn lǐ kě yǐ hé Zhōng guó rén liáo tiān le","uk":"Тепер моя китайська значно покращилася, і я вже можу поспілкуватися з китайцями в магазині."},{"zh":"我有时候会想家，但是我很高兴来到了中国。","py":"wǒ yǒu shí hou huì xiǎng jiā dàn shì wǒ hěn gāo xìng lái dào le Zhōng guó","uk":"Іноді я сумую за домом, але дуже рада, що приїхала let TEXTS = TEXTS_RAW;

const txSyl = py => String(py || "").split(" ").filter(Boolean);
const TX_WHO = /^([㐀-鿿]{1,8})：/;
function txRuby(zh, py){ const syl = txSyl(py); let k = 0; return [...zh].map(c => /[㐀-鿿]/.test(c) ? `<ruby>${c}<rt>${esc(syl[k++] || "")}</rt></ruby>` : esc(c)).join(""); }
function txLine(x){
  const m = x.zh.match(TX_WHO); if (!m) return txRuby(x.zh, x.py);
  const n = m[1].length, syl = txSyl(x.py);

}

}
let TXW = null, TXWK = "";
function txWordMap(){ const k = Object.keys(S.lessons).length; if (TXW && TXWK === k) return TXW; TXW = new Map(); TXWK = k;

  return TXW; }
function txWords(t){
  const M = txWordMap(), seen = new Set(), out = [];
  for (const x of t.s){ const run = x.zh.replace(TX_WHO, ""); let i = 0;
    while (i < run.length){ if (!/[㐀-鿿]/.test(run[i])){ i++; continue; }
      let L = Math.min(4, run.length - i); for (; L > 1; L--) if (M.has(run.substr(i, L))) break;
      const h = run.substr(i, L), w = M.get(h); if (w && !seen.has(h) && !(h.length === 1 && TX_STOP.includes(h))){ seen.add(h); out.push(w); } i += L; } }
  return out;
}

// ---------- sounds (generated in the browser with Web Audio — no files)
let AC = null;
function audio(){
  let on = true; try { on = localStorage.getItem("asianish.sound") !== "off"; } catch(e){}
  if (!on) return null;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; } catch(e){ return null; }
}
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
// Guzheng-like pluck (Karplus–Strong string)
function pluck(ac, midi, t, vol){
  const f = NOTE(midi), sr = ac.sampleRate, len = Math.floor(sr * 1.6), N = Math.max(2, Math.round(sr / f));
  const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0), ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  let idx = 0;
  for (let i = 0; i < len; i++){ const nx = (idx + 1) % N; const v = ring[idx]; d[i] = v; ring[idx] = 0.996 * 0.5 * (v + ring[nx]); idx = nx; }
  const src = ac.createBufferSource(), g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 4200; src.buffer = buf;
  g.gain.setValueAtTime(vol || .5, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.5);
  src.connect(lp).connect(g).connect(ac.destination); src.start(t);
}
// Temple gong: inharmonic partials with a slow swell and long tail
function gong(ac, t, vol){
  const base = 92, parts = [1, 1.47, 2.09, 2.56, 3.18, 4.07], out = ac.createGain();
  out.gain.setValueAtTime(.0001, t); out.gain.exponentialRampToValueAtTime(vol || .35, t + .06); out.gain.exponentialRampToValueAtTime(.001, t + 4.2);
  out.connect(ac.destination);
  parts.forEach((p, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.setValueAtTime(base * p * 1.01, t); o.frequency.exponentialRampToValueAtTime(base * p, t + 1.2); g.gain.value = 1 / (i + 1.4); o.connect(g).connect(out); o.start(t); o.stop(t + 4.3); });
}
// Wind chimes / small bells
function chime(ac, midi, t, vol){
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o2.type = "sine"; o.frequency.value = NOTE(midi); o2.frequency.value = NOTE(midi) * 2.76;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .12, t + .01); g.gain.exponentialRampToValueAtTime(.0005, t + 1.4);
  o.connect(g); o2.connect(g); g.connect(ac.destination); o.start(t); o2.start(t); o.stop(t + 1.5); o2.stop(t + 1.5);
}
// Firecrackers: short bright noise bursts
function crackers(ac, t, n){
  const sr = ac.sampleRate, len = Math.floor(sr * .05);
  for (let k = 0; k < n; k++){
    const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain();
    hp.type = "highpass"; hp.frequency.value = 1400; g.gain.value = .22 + Math.random() * .15; s.buffer = buf;
    s.connect(hp).connect(g).connect(ac.destination); s.start(t + k * .07 + Math.random() * .04);
  }
}
function playAch(tier){
  const ac = audio(); if (!ac) return; const t = ac.currentTime + .05;
  const penta = [67, 69, 72, 74, 76, 79, 81, 84];          // G A C D E G A C — pentatonic
  if (tier === "bronze"){ [72, 74, 76, 79].forEach((m, i) => pluck(ac, m, t + i * .11, .45)); chime(ac, 91, t + .5, .06); }
  else if (tier === "silver"){ penta.slice(0, 6).forEach((m, i) => pluck(ac, m, t + i * .09, .42)); [88, 91, 93].forEach((m, i) => chime(ac, m, t + .6 + i * .12, .07)); }
  else if (tier === "gold"){ gong(ac, t, .28); penta.forEach((m, i) => pluck(ac, m, t + .35 + i * .08, .4)); [91, 93, 96].forEach((m, i) => chime(ac, m, t + 1.05 + i * .1, .08)); }
  else {  // jade: gong, firecrackers and the opening of 茉莉花 «Жасмин» (Chinese folk song)
    gong(ac, t, .32); crackers(ac, t + .25, 9);
    const mel = [[76, 0], [76, .25], [79, .5], [81, .75], [84, 1], [84, 1.25], [81, 1.5], [79, 1.75], [79, 2.05], [81, 2.3], [79, 2.55]];
    mel.forEach(([m, d]) => pluck(ac, m, t + .9 + d, .45));
  }
}
// ---------- Pomodoro timer for students (kept in this browser only; survives page reloads)
const POMO_PRESETS = {"25/5": [25, 5, 15], "50/10": [50, 10, 20], "15/3": [15, 3, 10]};
const POMO_PH = {work: ["Фокус", "专"], short: ["Перерва", "休"], long: ["Довга перерва", "憩"]};
let POMO = null, POMO_TITLE = null;
function pomoLoad(){
  if (POMO) return POMO;
  const s = lsGet("asianish.pomo") || {};
  POMO = {preset: POMO_PRESETS[s.preset] ? s.preset : "25/5", phase: POMO_PH[s.phase] ? s.phase : "work", run: !!s.run, end: s.end || 0, left: s.left || 0, done: s.day === today() ? s.done || 0 : 0, day: today()};
  if (!POMO.left) POMO.left = pomoLen(POMO.phase) * 60;

}
const pomoSave = () => lsSet("asianish.pomo", POMO);
const pomoLen = ph => { const p = POMO_PRESETS[(POMO || {}).preset || "25/5"]; return ph === "work" ? p[0] : ph === "short" ? p[1] : p[2]; };
const pomoLeft = () => { const p = pomoLoad(); return Math.max(0, p.run ? Math.round((p.end - Date.now()) / 1000) : p.left); };
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function pomoHtml(){
  const p = pomoLoad(), left = pomoLeft(), tot = pomoLen(p.phase) * 60;
  return `<div class="pomo ph-${p.phase} ${p.run ? "run" : ""}" id="pomo" role="timer" aria-label="Таймер помодоро">
    <span class="pomo-h" aria-hidden="true">${POMO_PH[p.phase][1]}</span>
    <div class="pomo-m"><div class="pomo-t num" id="pomo-time">${mmss(left)}</div><div class="pomo-s small" id="pomo-ph">${POMO_PH[p.phase][0]} · 🍅 ${p.done}</div></div>
    <button class="iconbtn" data-act="pomoToggle" aria-label="${p.run ? "Пауза" : "Старт"}" title="${p.run ? "Пауза" : "Старт"}">${p.run ? "❚❚" : "▶"}</button>
    <button class="iconbtn" data-act="pomoReset" aria-label="Скинути" title="Скинути">↺</button>
    <button class="iconbtn" data-act="pomoSkip" aria-label="Наступний етап" title="Пропустити етап">⏭</button>
    <select class="pomo-p" data-chg="pomopreset" aria-label="Тривалість">${Object.keys(POMO_PRESETS).map(k => `<option value="${k}" ${k === p.preset ? "selected" : ""}>${k} хв</option>`).join("")}</select>
    <i class="pomo-bar" id="pomo-bar" style="width:${100 * (1 - left / tot)}%"></i></div>`;
}
function pomoNext(finished){
  const p = POMO;
  if (p.phase === "work"){ if (finished){ p.done++; p.day = today(); } p.phase = finished && p.done % 4 === 0 ? "long" : "short"; }
  else p.phase = "work";
  p.run = false; p.left = pomoLen(p.phase) * 60; p.end = 0; pomoSave();
}
function pomoTick(){
  const p = pomoLoad();
  if (p.run && Date.now() >= p.end){
    const wasWork = p.phase === "work"; pomoNext(true);
    const ac = audio(); if (ac){ const t = ac.currentTime + .05; if (wasWork){ gong(ac, t, .3); } else [79, 84, 88].forEach((m, i) => chime(ac, m, t + i * .18, .1)); }
    toast(wasWork ? "🍅 Помодоро завершено! Час відпочити." : "Перерва закінчилася — повертаймося до навчання!");
    const el = document.getElementById("pomo"); if (el) el.outerHTML = pomoHtml();
  }
  const left = pomoLeft(), tm = document.getElementById("pomo-time"), bar = document.getElementById("pomo-bar");
  if (tm) tm.textContent = mmss(left);
  if (bar) bar.style.width = (100 * (1 - left / (pomoLen(p.phase) * 60))) + "%";
  if (POMO_TITLE == null) POMO_TITLE = document.title;
  document.title = p.run ? `${mmss(left)} · ${POMO_PH[p.phase][0]}` : POMO_TITLE;
}

function deckWords(deck, ctx){
  const prog = ctx.me?.words || {}, d = today();
  const lvAll = wordsOf(ctx.lvLessons), every = [...wordsOf(ctx.lessons), ...wordsOf(ctx.cv)];
  const rank = w => { const p = prog[w.id]; if (p && p.due <= d) return 0; if (!p) return 1; return 2; };
  let list;
  if (deck === "due") list = every.filter(w => prog[w.id] && prog[w.id].due <= d && prog[w.id].s < 6);
  else if (deck === "new") list = lvAll.filter(w => !prog[w.id]);
  else if (deck === "all") list = lvAll.slice();
  else if (deck === "cv") list = wordsOf(ctx.cv);
  else if (deck.startsWith("cv:")) list = wordsOf(ctx.cv.filter(l => l.id === deck.slice(3)));
  else if (deck === "bank") list = bankWords();
  else list = every.filter(w => w.lid === deck);
  return shuffle(list).sort((a, b) => rank(a) - rank(b)).map(w => w.id);
}
function startDeck(deck){
  const ctx = currentCtx();
  S.cards = {key: ctx.key, deck, queue: deckWords(deck, ctx), i: 0, flipped: false, pick: null, opts: null, clozeZh: "", requeued: [], done: 0};
  prepCard();
}
function prepCard(){
  const c = S.cards; c.flipped = false; c.pick = null; c.opts = null; c.clozeZh = "";
  const w = wordById(c.queue[c.i]); if (!w) return;
  const ex = shuffle(exList(w)).find(x => x.zh.includes(w.h));
  if (ex){
    const pool = shuffle(allWords().filter(x => x.h !== w.h && !ex.zh.includes(x.h))).map(x => x.h);
    c.opts = shuffle([w.h, ...[...new Set(pool)].slice(0, 2)]); c.clozeZh = ex.zh; c.clozeUk = ex.uk;
  }
}
function wordById(id){
  for (const l of Object.values(S.lessons)) for (const w of (l.words || [])) if (w.id === id) return {...w, lid: l.id, lt: l.title, hsk: l.hsk};
  for (const d of Object.values(S.cvocab)) for (const w of (d.words || [])) if (w.id === id) return {...w, lid: d.id, lt: d.title || "Заняття", hsk: "", cv: true};
  if (isOwn(id)) return bankOwn().find(w => w.id === id) || null;
  return null;
}

function cardAct(kind){
  const ctx = currentCtx(), c = S.cards; if (!c) return;
  const wid = c.queue[c.i];
  if (wid && kind !== "next" && !ctx.preview){
    const me = S.me, d = today(); ensureDay(me); me.words = me.words || {};
    let w = me.words[wid], pts = 0, msg = "";
    if (kind === "know"){
      if (!w || (w.s === 0 && !w.ok)){
        w = me.words[wid] = {...(w || {}), s: 1, due: addDays(d, INT[1]), last: d, ok: 1, bad: w?.bad || 0};
        if (onceToday(me, "k:" + wid)) pts = PTS.know; msg = `Нове слово: крок 1 з ${MASTER}`;
      }
      else if (w.last === d && w.s > 0 && !me.dk.k.includes("r:" + wid)){ msg = "Це слово сьогодні вже зараховано"; }
      else if (w.due > d){ msg = "Ще рано: повторення " + fmtDate(w.due); }
      else {
        w.s = Math.min(w.s + 1, 6); w.last = d; w.ok = (w.ok || 0) + 1; w.due = addDays(d, INT[w.s]);
        if (onceToday(me, "k:" + wid)) pts = PTS.know;
        if (w.s >= MASTER && !w.m){ w.m = 1; logAdd(me, "m", 1); msg = "Слово опановано!"; if (!isOwn(wid)){ addPoints(me, PTS.master, "b"); msg += ` +${PTS.master} бонус`; } }
        else msg = w.s < MASTER ? `Крок ${w.s} з ${MASTER}` : "Повторено, наступний раз " + fmtDate(w.due);
      }
    } else {
      if (!w) w = me.words[wid] = {s: 0, due: d, last: "", ok: 0, bad: 0};
      w.s = Math.max(0, w.s - 1); w.due = d; w.last = d; w.bad = (w.bad || 0) + 1; addWrong(me, wid);
      if (onceToday(me, "r:" + wid)) pts = PTS.again;
      msg = "Повернемося до цього слова ще раз";
    }
    logAdd(me, "a", 1);
    if (wordById(wid)?.cv){ me.flags = me.flags || {}; me.flags.cv = 1; }
    if (isOwn(wid)) pts = 0;
    if (pts){ addPoints(me, pts, "k"); msg += ` · +${pts}`; }
    dailyCheck(me);
    saveMe(); toast(msg);
  }
  if (kind === "again" && wid && !c.requeued.includes(wid)){ c.queue.push(wid); c.requeued.push(wid); }
  if (kind !== "next") c.done++;
  c.i++; prepCard(); render();
}

const coreH = h => String(h || "").replace(/（.*?）|\(.*?\)/g, "");

        : `<div class="row"><input class="input" style="flex:1;min-width:200px;font-size:1.2rem" data-xin="typed" data-xenter="xType" value="${esc(e.typed || "")}" placeholder="汉字 або піньїнь" autocomplete="off" autocapitalize="off" aria-label="Ваша відповідь"><button class="btn primary" data-act="xType">Перевірити</button></div>`}</div>`;
  }
  return `<div class="quiz">${top}<div class="qprompt">${qPrompt(e, q, sayBtn)}</div><div class="opts">${optBtns(e, q)}</div>
    ${e.done ? `${q.after ? `<span class="small muted" style="text-align:center">${esc(q.after)}</span>` : ""}<div class="spread">${verdict(e.lastOk, q.opts.find(o => o.ok).v)}${next()}</div>` : ""}</div>`;
}
function optBtns(e, q){
  return q.opts.map((o, i) => { const cls = e.pick == null ? "" : o.ok ? "right" : i === e.pick ? "wrong" : ""; return `<button class="opt ${q.hanOpts ? "h" : ""} ${q.sentOpts ? "sopt" : ""} ${cls}" data-act="exPick" data-arg="${i}" ${e.pick != null ? "disabled" : ""}>${esc(o.v)}</button>`; }).join("");
}
function qPrompt(e, q, sayBtn){
  if (q.kind === "clue"){
    const shown = q.hints.slice(0, e.done ? q.hints.length : e.hint || 1);
    return `<span class="small muted">Вгадайте слово за підказками</span><div class="hints">${shown.map((h, k) => `<div class="hint"><span class="pill">${k + 1}. ${h.t}</span><span class="${h.han ? "zh" : ""}">${esc(h.v)}</span></div>`).join("")}</div>
      ${!e.done && (e.hint || 1) < q.hints.length ? `<button class="btn sm ghost" data-act="clueMore">Ще підказка</button>` : ""}`;
  }
  if (q.show === "han") return `<div class="hanzi">${esc(q.han)}</div>${speakBtn(q.han)}<span class="small muted">Оберіть переклад</span>`;
  if (q.show === "py") return `<div class="py pykeep" style="font-size:2rem">${esc(q.py)}</div><span class="small muted">Оберіть ієрогліф</span>`;
  if (q.show === "han2py") return `<div class="hanzi">${esc(q.han)}</div><span class="small muted">Оберіть правильний піньїнь</span>`;
  if (q.show === "listen") return `${sayBtn(q.say || q.han)}<span class="small muted">Прослухайте й оберіть ієрогліф</span>`;
  if (q.show === "fill") return `<div class="sent">${esc(q.sent).replace("＿", `<span class="blank">${e.pick != null ? esc(q.opts[e.pick].v) : "？"}</span>`)}</div><span class="muted">${esc(q.hint)}</span>`;
  if (q.show === "usage") return `<div class="hanzi">${esc(q.han)}</div><span class="muted">${esc(q.uk)}</span><span class="small muted">У якому реченні це слово вжито правильно?</span>`;
  if (q.show === "adet") return `${sayBtn(q.say)}<span class="small muted">Прослухайте речення. Яке з цих слів у ньому прозвучало?</span>`;
  if (q.show === "sound") return `${sayBtn(q.say)}<span class="small muted">Яке слово прозвучало?</span>`;
  return "";
}

function aiRes(r){
  return `<div class="panel airesp"><span class="pill ${r.ok ? "ok" : "bad"}" style="align-self:flex-start">${r.ok ? "Добре!" : "Є що виправити"}${r.score != null ? ` · ${r.score}/10` : ""}</span>
    ${r.guess ? `<div>ШІ думає, що це: <b class="zh">${esc(r.guess)}</b></div>` : ""}
    ${r.fix ? `<div><span class="small muted">Варіант:</span><div class="zh" style="font-size:1.2rem">${esc(r.fix)} ${speakBtn(r.fix)}</div>${r.py ? `<div class="small muted pyx">${esc(r.py)}</div>` : ""}${r.uk ? `<div class="small muted">«${esc(r.uk)}»</div>` : ""}</div>` : ""}
    ${r.ref ? `<div class="small muted">Еталон: <span class="zh">${esc(r.ref)}</span></div>` : ""}
    ${r.comment ? `<div>${esc(r.comment)}</div>` : ""}</div>`;
}
const AI_STR = x => String(x ?? "").trim();
async function aiCall(prompt){ if (!S.sample) throw {code: "nosample"}; return S.sample.json(prompt, {cache: false}); }
async function aiPrep(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.type !== "rewrite") return; const w = e.items[e.i];
  e.busy = true; e.err = ""; render();
  try {
    const r = await aiCall(`Ти допомагаєш україномовному студенту вчити китайську (рівень ${exLevel(ctx)}). Цільове слово: «${w.h}» (${w.p || ""} — ${w.uk}).
Склади одне коротке природне китайське речення рівня ${exLevel(ctx)}, зміст якого можна передати з цим словом, але сам НЕ вживай слово «${coreH(w.h)}» — використай синонім, інший вираз або опис. Відповідай лише JSON: {"zh":"речення","py":"піньїнь із тонами","uk":"переклад українською"}.`);
    if (S.ex !== e) return;
    if (!r || !AI_STR(r.zh)) throw {code: "invalid_json"};
    e.sent = {zh: AI_STR(r.zh).slice(0, 120), py: AI_STR(r.py).slice(0, 240), uk: AI_STR(r.uk).slice(0, 240)};
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}
async function aiCheck(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.busy || e.res) return;
  const inp = AI_STR(e.input); if (!inp){ toast("Спочатку напишіть відповідь"); return; }
  if (!/[㐀-鿿]/.test(inp)){ toast("Напишіть відповідь ієрогліфами"); return; }
  const lvl = exLevel(ctx), w = e.items ? e.items[e.i] : null;
  const fmt = `Відповідай лише JSON: {"ok":true або false,"fix":"виправлений або покращений варіант китайською (якщо відповідь бездоганна — повтори її)","py":"піньїнь цього варіанта з тонами","uk":"переклад цього варіанта українською","comment":"1–2 короткі речення українською: що вдалося і що виправити, доброзичливо"}`;
  let prompt = "", local = null;
  if (e.type === "wia"){
    if (!inp.includes(coreH(w.h))){ toast("У реченні має бути слово " + coreH(w.h)); return; }
    prompt = `Ти доброзичливий викладач китайської для україномовних студентів (рівень ${lvl}). Студент склав речення зі словом «${w.h}» (${w.p || ""} — ${w.uk}): «${inp}». Перевір, чи правильно й природно вжито слово, граматику та порядок слів. ok = true, якщо слово вжито правильно й серйозних помилок немає. ${fmt}`;
  } else if (e.type === "tr"){
    if (stripP(inp) === stripP(e.sent.zh)) local = {ok: true, fix: e.sent.zh, py: e.sent.py, comment: "Точно як в еталоні!"};
    else prompt = `Ти викладач китайської для україномовних студентів (рівень ${lvl}). Студент перекладав китайською речення «${e.sent.uk}». Еталонний переклад: «${e.sent.zh}». Переклад студента: «${inp}». Інші правильні формулювання теж зараховуй. Перевір зміст, граматику й написання ієрогліфів. ${fmt}`;
  } else if (e.type === "desc"){
    if (inp.includes(coreH(w.h))){ toast("Не можна називати саме слово — опишіть його іншими словами"); return; }
    prompt = `Гра «Опиши, не називаючи». Студент (рівень ${lvl}) описав китайською загадане слово: «${inp}». Спершу чесно спробуй вгадати слово лише за описом. Потім порівняй із загаданим: «${w.h}» (${w.uk}). ok = true, якщо опис справді вказує на це слово (близький синонім теж рахується). Відповідай лише JSON: {"guess":"твоя здогадка ієрогліфами","ok":true або false,"fix":"виправлений варіант опису китайською, якщо були мовні помилки, інакше повтори опис","py":"піньїнь","uk":"переклад опису українською","comment":"1–2 речення українською"}`;
  } else if (e.type === "rewrite"){
    if (!inp.includes(coreH(w.h))){ toast("Використайте слово " + coreH(w.h)); return; }
    prompt = `Ти викладач китайської (рівень ${lvl}). Вихідне речення: «${e.sent.zh}» (${e.sent.uk}). Студент мав переписати його, використавши слово «${w.h}» (${w.uk}) і не змінивши змісту. Варіант студента: «${inp}». ok = true, якщо зміст збережено, слово вжито правильно і серйозних помилок немає. ${fmt}`;
  } else if (e.type === "essay"){
    prompt = `Ти доброзичливий викладач китайської для україномовних студентів (рівень ${lvl}). Студент написав короткий текст на тему «${e.topic}», де мав ужити слова: ${e.words.map(x => x.h + " (" + x.uk + ")").join(", ")}. Текст: «${inp}».
Оціни: чи вжито слова правильно, граматику, зв'язність. Відповідай лише JSON: {"ok":true якщо текст загалом вдалий,"score":оцінка від 0 до 10,"fix":"виправлена версія тексту китайською","py":"","uk":"переклад виправленої версії українською","comment":"2–3 речення українською: що вдалося, які помилки, порада"}`;
  }
  e.busy = true; e.err = ""; render();
  try {
    const r = local || await aiCall(prompt);
    if (S.ex !== e) return;
    if (!r || typeof r !== "object") throw {code: "invalid_json"};
    e.res = {ok: !!r.ok, fix: AI_STR(r.fix).slice(0, 600), py: AI_STR(r.py).slice(0, 800), uk: AI_STR(r.uk).slice(0, 800), comment: AI_STR(r.comment).slice(0, 500), guess: AI_STR(r.guess).slice(0, 20),
      score: r.score != null && !isNaN(Number(r.score)) ? Math.max(0, Math.min(10, Math.round(Number(r.score)))) : null, ref: e.type === "tr" && !local ? e.sent.zh : ""};
    e.total++; if (e.res.ok) e.ok++;
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}

function exAnswer(ok){
  const e = S.ex, q = e.qs[e.i]; if (e.done) return; e.done = true; e.lastOk = ok;
  if (e.type === "duel"){ if (ok) e.score[e.i % 2]++; render(); return; }
  exRecord(q.wid, ok);
  if (e.type === "auction") e.coins += ok ? e.stake : -e.stake;
  if (e.type === "boss" && !ok) e.lives--;
  if (e.type === "escape"){ const r = e.rooms[e.room]; r.n++; if (ok) r.ok++; }
  render();
}
function exAdvance(){
  const e = S.ex;
  if (e.type === "boss" && e.lives <= 0) return exFinish();
  if (e.type === "auction" && e.coins <= 0) return exFinish();
  if (e.type === "escape"){
    const r = e.rooms[e.room];
    if (r.ok >= 3 || r.n >= 9){ r.open = r.ok >= 3; e.room++; if (e.room >= e.rooms.length) return exFinish(); e.roomIntro = true; }
    e.qs.push(mixQ(e.rooms[e.room].types, e.words, e.pool));
  } else if (e.i + 1 >= e.qs.length) return exFinish();
  e.i++; e.pick = null; e.done = false; e.built = []; e.fixTap = null; e.hint = 1; e.typed = ""; e.stake = null; e.showUk = false;
  const q = e.qs[e.i]; if (q.auto && !e.roomIntro && e.type !== "auction") speak(q.say || q.han);
  render();
}
function exRecord(wid, ok){

function gedInput(el){
  const e = S.gedit; if (!e) return;
  const k = el.dataset.gf;
  if (el.dataset.gi != null){
    const q = e.ex[Number(el.dataset.gi)]; if (!q) return;
    if (el.dataset.go != null) q.opts[Number(el.dataset.go)] = el.value;
    else if (k === "a" && el.type === "radio"){ if (el.checked) q.a = Number(el.value); }
    else q[k] = el.value;
    return;
  }
  if (k === "hidden") e.hidden = el.checked;
  else if (k) e[k] = el.value;
}

  if (el.dataset.mo){ if (S.medit) S.medit.text = el.value; return; }
  if (el.dataset.pe){ const pe = S.pedit; if (!pe) return; const f = el.dataset.pe, i = Number(el.dataset.i);

  if (el.dataset.mt === "url"){ const t = guessType(el.value); const sel = $("#mt-type"); if (t && sel){ sel.value = t; S.matNew.type = t; } return; }
  if (el.dataset.mf){ S.matF[el.dataset.mf] = el.value; const q = el.dataset.mf === "q", pos = el.selectionStart; render(); if (q){ const n = document.querySelector('[data-mf="q"]'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} } } return; }
  if (el.id === "bank-q"){
    S.bankQ = el.value; bankUpdateResults();
    clearTimeout(dictTimer);
    if (S.bankQ.trim() !== S.dict.q){ if (S.dict.q && !S.bankQ.trim()){ S.dict = {q: "", busy: false, res: [], err: ""}; dictUpdate(); } else if (S.bankQ.trim()) { S.dict = {...S.dict, busy: true, q: S.bankQ.trim(), res: [], err: ""}; dictUpdate(); dictTimer = setTimeout(dictSearch, 800); } }
    return;
  }
  if (el.dataset.gf != null || el.dataset.go != null){ gedInput(el); return; }
  const k = el.dataset.ef; if (k == null || !S.edit) return;
  if (el.dataset.i != null){
    const w = S.edit.words[Number(el.dataset.i)];
    if (el.dataset.k != null){ const x = w.ex[Number(el.dataset.k)]; x[k === "xuk" ? "uk" : k] = el.value; }

  const c = el.dataset.chg; if (!c) return;
  if (c === "assign"){ const id = el.dataset.id; try { await S.db.doc("students/" + id).update({classId: el.value, assignAt: Date.now()}); toast("Групу змінено"); } catch(err){ toast("Не вдалося змінити групу"); } }
  else if (c === "cskind"){ const a = document.getElementById("cs-age"); if (a) a.innerHTML = ageOpts(el.value, a.value); }
  else if (c === "momonth"){ if (S.medit){ moOpen(S.medit.sid, el.value); render(); } }
  else if (c === "pomopreset"){ const p = pomoLoad(); p.preset = el.value; p.run = false; p.left = pomoLen(p.phase) * 60; p.end = 0; pomoSave(); const w = document.getElementById("pomo"); if (w) w.outerHTML = pomoHtml(); pomoTick(); }
  else if (c === "labcls"){ const prev = S.ex?.src || "level"; S.exlab = {cls: el.value}; S.ex = {key: currentCtx().key, src: srcGroup(prev) === "cv" ? "cv" : prev, running: false}; render(); }
  else if (c === "exsrc"){ const ctx = currentCtx(); S.ex = {key: ctx.key, src: el.value, running: false}; }
  else if (c === "hwkind"){ const f = el.closest("form"); if (f && S.hwEdit){ S.hwEdit = hwRead(f); S.hwEdit.addKind = el.value; render(); } }
  else if (c === "hwcls"){ const f = el.closest("form"); if (f && S.hwEdit){ S.hwEdit = hwRead(f); render(); } }
  else if (c === "rankscope"){ S.rank.scope = el.value; render(); }
  else if (c === "rankteacher"){ S.rank.tid = el.value; S.rank.scope = "all"; render(); }
  else if (c === "photo" && el.files && el.files[0]) aiPhoto(el.files[0]);
});

render();
window.ASIANISH_READY.then(boot).catch(() => { S.phase = "offline"; render(); });
})();
</script>
