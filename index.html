,"uk":"О третій десять Сяо Лі нарешті прийшов."},{"zh":"他说：“路上车太多了。”","py":"tā shuō lù shang chē tài duō le","uk":"Він сказав: «На дорозі було забагато машин»."},{"zh":"电影已经开始了，但是我们还是很高兴。","py":"diàn yǐng yǐ jīng kāi shǐ le dàn shì wǒ men hái shi hěn gāo xìng","uk":"Фільм уже почався, але ми все одно були раді."}],"q":[{"q":"О котрій починався фільм?","o":["О 15:00","О 14:30","О 15:10"],"a":0},{"q":"Скільки я вже чекав, коли подзвонив Сяо Лі?","o":["Пів години","Годину","10 хвилин"],"a":0},{"q":"Чому Сяо Лі запізнився?","o":["На дорозі було багато машин","Він проспав","Він забув про кіно"],"a":0}],"en":{"topic":"Friends","uk":"Waiting for a friend","s":[{"uk":"Today Xiao Li and I were going to the cinema."},{"uk":"The film started at three, and I arrived at half past two."},{"uk":"I waited half an hour, but Xiao Li still didn't come."},{"uk":"I called him, and he said: \"Sorry, I'm on my way, I'll be there soon!\""},{"uk":"At ten past three Xiao Li finally arrived."},{"uk":"He said: \"There were too many cars on the road.\""},{"uk":"The film had already started, but we were still happy."}],"q":[{"q":"What time did the film start?","o":["At 15:00","At 14:30","At 15:10"]},{"q":"How long had I been waiting when I called Xiao Li?","o":["Half an hour","An hour","10 minutes"]},{"q":"Why was Xiao Li late?","o":["There were a lot of cars on the road","He overslept","He forgot about the film"]}]}},{"id":"T2-08","hsk":"HSK2","topic":"Школа","zh":"我的汉语老师","py":"wǒ de Hàn yǔ lǎo shī","uk":"Моя вчителька китайської","s":[{"zh":"我的汉语老师姓张，她是北京人。","py":"wǒ de Hàn yǔ lǎo shī xìng Zhāng tā shì Běi jīng rén","uk":"Мою вчительку китайської звати пані Чжан, вона з Пекіна."},{"zh":"张老师三十多岁，非常漂亮。","py":"Zhāng lǎo shī sān shí duō suì fēi cháng piào liang","uk":"Учительці Чжан за тридцять, вона дуже гарна."},{"zh":"她上课的时候常常笑，我们都很喜欢她。","py":"tā shàng kè de shí hou cháng cháng xiào wǒ men dōu hěn xǐ huan tā","uk":"На уроках вона часто усміхається, і ми всі її дуже любимо."},{"zh":"她给我们准备了很多有意 店和饭馆。","py":"yǐ qián wǒ men zhù zài chéng shì zhōng xīn fù jìn yǒu hěn duō shāng diàn hé fàn guǎn","uk":"Раніше ми жили в центрі міста, поруч було багато магазинів і ресторанів."},{"zh":"但是那里车太多，晚上也很难休息。","py":"dàn shì nà lǐ chē tài duō wǎn shang yě hěn nán xiū xi","uk":"Але там було забагато машин, і навіть увечері важко було відпочити."},{"zh":"现在的家在城市的南边，离公司比较远。","py":"xiàn zài de jiā zài chéng shì de nán biān lí gōng sī bǐ jiào yuǎn","uk":"Новий дім на півдні міста, досить далеко від роботи."},{"zh":"可是这里很安静，楼下还有一个大公园。","py":"kě shì zhè lǐ hěn ān jìng lóu xià hái yǒu yí gè dà gōng yuán","uk":"Зате тут дуже тихо, а біля будинку є великий парк."},{"zh":"每天早上，爷爷奶奶都去公园锻炼身体。","py":"měi tiān zǎo shang yé ye nǎi nai dōu qù gōng yuán duàn liàn shēn tǐ","uk":"Щоранку дідусь і бабуся ходять у парк займатися спортом."},{"zh":"我的房间也比以前大多了，我终于有了自己的书桌。","py":"wǒ de fáng jiān yě bǐ yǐ qián dà duō le wǒ zhōng yú yǒu le zì jǐ de shū zhuō","uk":"Моя кімната теж стала набагато більшою, і нарешті в мене є власний письмовий стіл."},{"zh":"虽然上班的路远了一些，但是我觉得搬家是一个好决定。","py":"suī rán shàng bān de lù yuǎn le yì xiē dàn shì wǒ jué de bān jiā shì yí gè hǎo jué dìng","uk":"Хоча дорога на роботу стала довшою, я вважаю, що переїзд — добре рішення."}],"q":[{"q":"Чому родина переїхала?","o":["У центрі було багато машин і важко відпочивати","Квартира була дорогою","Було далеко від школи"],"a":0},{"q":"Що є біля нового будинку?","o":["Великий парк","Ринок","Лікарня"],"a":0},{"q":"Що роблять дідусь і бабуся щоранку?","o":["Займаються спортом у парку","Ходять на ринок","Довго сплять"],"a":0}],"en":{"topic":"Home","uk":"Moving house","s":[{"uk":"Last month our family moved to a new place."},{"uk":"We used to live in the city centre, with lots of shops and restaurants nearby."},{"uk":"But there were too many cars there, and it was hard to relax even in the evening."},{"uk":"The new home is in the south of the city, quite far from work."},{"uk":"But it's very quiet here, and there's a big park next to the building."},{"uk":"Every morning Grandpa and Grandma go to the park to exercise."},{"uk":"My room is much bigger too, and at last I have a desk of my own."},{"uk":"Although the way to work is longer now, I think moving was a good decision."}],"q":[{"q":"Why did the family move?","o":["There were many cars in the centre and it was hard to relax","The flat was expensive","It was far from school"]},{"q":"What is there next to the new building?","o":["A big park","A market","A hospital"]},{"q":"What do Grandpa and Grandma do every morning?","o":["Exercise in the park","Go to the market","Sleep late"]}]}},{"id":"T3-02","hsk":"HSK3","topic":"Хобі","zh":"我的爱好","py":"wǒ de ài hào","uk":"Моє хобі","s":[{"zh":"我的爱好是画画。","py":"wǒ de ài hào shì huà huà","uk":"Моє хобі — малювання."},{"zh":"从小我就对画画很感兴趣。","py":"cóng xiǎo wǒ jiù duì huà huà hěn gǎn xìng qù","uk":"Я з дитинства дуже цікавлюся малюванням."},{"zh":"小时候，我常常在纸上画小猫、小狗和花。","py":"xiǎo shí hou wǒ cháng cháng zài zhǐ shang huà xiǎo māo xiǎo gǒu hé huā","uk":"Коли я був малим, то часто малював на папері котиків, песиків і квіти."},{"zh":"上大学以后，我开始跟一位老师学习中国画。","py":"shàng dà xué yǐ hòu wǒ kāi shǐ gēn yí wèi lǎo shī xué xí Zhōng guó huà","uk":"Коли вступив до університету, почав вивчати китайський живопис у вчителя."},{"zh":"画中国画不容易，需要很多时间和练习。","py":"huà Zhōng guó huà bù róng yì xū yào hěn duō shí jiān hé liàn xí","uk":"Малювати в китайському стилі нелегко: потрібно багато часу й практики."},{"zh":"我最喜欢画山和水，看着这些画，我的心会变得很安静。","py":"wǒ zuì xǐ huan huà shān hé shuǐ kàn zhe zhè xiē huà wǒ de xīn huì biàn de hěn ān jìng","uk":"Найбільше я люблю малювати гори й воду: коли дивлюся на ці картини, на душі стає спокійно."},{"zh":"上个星期，我的一张画在学校的比赛中得了第一名。","py":"shàng gè xīng qī wǒ de yì zhāng huà zài xué xiào de bǐ sài zhōng dé le dì yī míng","uk":"Минулого тижня моя картина посіла перше місце в університетському конкурсі."},{"zh":"我希望以后能一直画下去。","py":"wǒ xī wàng yǐ hòu néng yì zhí huà xià qu","uk":"Сподіваюся, що й надалі завжди малюватиму."}],"q":[{"q":"Яке хобі в автора?","o":["Малювання","Спів","Футбол"],"a":0},{"q":"Що він найбільше любить малювати?","o":["Гори й воду","Котів","Людей"],"a":0},{"q":"Що сталося минулого тижня?","o":["Його картина посіла перше місце","Він купив фарби","Він поїхав до Пекіна"],"a":0}],"en":{"topic":"Hobbies","uk":"My hobby","s":[{"uk":"My hobby is drawing."},{"uk":"I've been very interested in drawing since I was a child."},{"uk":"When I was little, I often drew cats, dogs and flowers on paper."},{"uk":"When I went to university, I started learning Chinese painting from a teacher."},{"uk":"Painting in the Chinese style isn't easy: it takes a lot of time and practice."},{"uk":"Most of all I like painting mountains and water: when I look at these pictures, I feel calm."},{"uk":"Last week my painting won first place in a university competition."},{"uk":"I hope I'll always keep painting."}],"q":[{"q":"What is the author's hobby?","o":["Drawing","Singing","Football"]},{"q":"What does he like painting most?","o":["Mountains and water","Cats","People"]},{"q":"What happened last week?","o":["His painting won first place","He bought paints","He went to Beijing"]}]}},{"id":"T3-03","hsk":"HSK3","topic":"Свята","zh":"春节","py":"Chūn Jié","uk":"Свято Весни","s":[{"zh":"春节是中国最重要的节日。","py":"Chūn Jié shì Zhōng guó zuì zhòng yào de jié rì","uk":"Свято Весни — найважливіше свято в Китаї."},{"zh":"春节以前，很多人会坐火车或者飞机回家，和家人在一起。","py":"Chūn Jié yǐ qián hěn duō rén huì zuò huǒ chē huò zhě fēi jī huí jiā hé jiā rén zài yì qǐ","uk":"Перед святом багато людей їдуть потягом або летять літаком додому, щоб побути з рідними."},{"zh":"春节的前一天晚上，一家人一起吃饭、聊天、看电视。","py":"Chūn Jié de qián yì tiān wǎn shang yì jiā rén yì qǐ chī fàn liáo tiān kàn diàn shì","uk":"Увечері напередодні свята вся родина разом вечеряє, спілкується й дивиться телевізор."},{"zh":"北方人一般会吃饺子。","py":"běi fāng rén yì bān huì chī jiǎo zi","uk":"На півночі Китаю зазвичай їдять пельмені цзяоцзи."},{"zh":"孩子们最高兴，因为大人会给他们红包，里面有钱。","py":"hái zi men zuì gāo xìng yīn wèi dà ren huì gěi tā men hóng bāo lǐ miàn yǒu qián","uk":"Найбільше радіють діти, бо дорослі дарують їм червоні конверти з грошима."},{"zh":"春节的时候，街上很多地方都是红色的。","py":"Chūn Jié de shí hou jiē shang hěn duō dì fang dōu shì hóng sè de","uk":"На свято багато чого на вулицях червоного кольору."},{"zh":"中国人觉得红色是一种快乐的颜色。","py":"Zhōng guó rén jué de hóng sè shì yì zhǒng kuài lè de yán sè","uk":"Китайці вважають червоний радісним кольором."},{"zh":"你们国家最重要的节日是什么？","py":"nǐ men guó jiā zuì zhòng yào de jié rì shì shén me","uk":"А яке найважливіше свято у вашій країні?"}],"q":[{"q":"Що родина робить увечері напередодні свята?","o":["Вечеряє разом, спілкується й дивиться телевізор","Іде на роботу","Купує квитки"],"a":0},{"q":"Чому діти радіють найбільше?","o":["Дорослі дарують їм червоні конверти з грошима","Не треба вчитися","Можна довго спати"],"a":0},{"q":"Яким кольором вважають червоний?","o":["Радісним","Сумним","Небезпечним"],"a":0}],"en":{"topic":"Holidays","uk":"The Spring Festival","s":[{"uk":"The Spring Festival is the most important holiday in China."},{"uk":"Before the holiday many people go home by train or plane to be with their families."},{"uk":"On the eve of the holiday the whole family has dinner together, talks and watches TV."},{"uk":"In the north of China people usually eat jiaozi dumplings."},{"uk":"Children are the happiest, because the adults give them red envelopes with money."},{"uk":"During the holiday many things in the streets are red."},{"uk":"Chinese people consider red a happy colour."},{"uk":"And what is the most important holiday in your country?"}],"q":[{"q":"What does the family do on the eve of the holiday?","o":["Has dinner together, talks and watches TV","Goes to work","Buys tickets"]},{"q":"Why are children the happiest?","o":["The adults give them red envelopes with money","They don't have to study","They can sleep late"]},{"q":"What kind of colour is red considered?","o":["Happy","Sad","Dangerous"]}]}},{"id":"T3-04","hsk":"HSK3","topic":"Робота","zh":"迟到了","py":"chí dào le","uk":"Запізнився","s":[{"zh":"今天早上我起床起晚了。","py":"jīn tiān zǎo shang wǒ qǐ chuáng qǐ wǎn le","uk":"Сьогодні вранці я проспав."},{"zh":"我一看手表，已经八点半了！","py":"wǒ yí kàn shǒu biǎo yǐ jīng bā diǎn bàn le","uk":"Глянув на годинник — а вже пів на дев'яту!"},{"zh":"九点公司有一个重要的会议。","py":"jiǔ diǎn gōng sī yǒu yí gè zhòng yào de huì yì","uk":"О дев'ятій на роботі мала бути важлива нарада."},{"zh":"我没有时间吃早饭，马上跑出了家门。","py":"wǒ méi yǒu shí jiān chī zǎo fàn mǎ shàng pǎo chū le jiā mén","uk":"У мене не було часу снідати, і я одразу вибіг із дому."},{"zh":"路上车特别多，公共汽车走得很慢。","py":"lù shang chē tè bié duō gōng gòng qì chē zǒu de hěn màn","uk":"На дорозі було дуже багато машин, автобус їхав повільно."},{"zh":"我决定下车，自己走过去。","py":"wǒ jué dìng xià chē zì jǐ zǒu guò qu","uk":"Я вирішив вийти з автобуса й піти пішки."},{"zh":"九点十分，我终于到了公司，可是会议已经开始了。","py":"jiǔ diǎn shí fēn wǒ zhōng yú dào le gōng sī kě shì huì yì yǐ jīng kāi shǐ le","uk":"О дев'ятій десять я нарешті дістався роботи, але нарада вже почалася."},{"zh":"经理没有生气，他只是说：“下次早一点出门。”","py":"jīng lǐ méi yǒu shēng qì tā zhǐ shì shuō xià cì zǎo yì diǎn chū mén","uk":"Керівник не розсердився, лише сказав: «Наступного разу виходь трохи раніше»."},{"zh":"从明天开始，我要早一点睡觉。","py":"cóng míng tiān kāi shǐ wǒ yào zǎo yì diǎn shuì jiào","uk":"Від завтра я лягатиму спати раніше."}],"q":[{"q":"О котрій я глянув на годинник?","o":["О 8:30","О 7:00","О 9:00"],"a":0},{"q":"Чому я вийшов з автобуса?","o":["Було багато машин, автобус їхав повільно","Автобус зламався","Я сів не на той автобус"],"a":0},{"q":"Що сказав керівник?","o":["Наступного разу виходь раніше","Ти звільнений","Нічого"],"a":0}],"en":{"topic":"Work","uk":"Running late","s":[{"uk":"This morning I overslept."},{"uk":"I looked at the clock — and it was already half past eight!"},{"uk":"There was an important meeting at work at nine."},{"uk":"I had no time for breakfast and ran straight out of the house."},{"uk":"There were a lot of cars on the road, and the bus was moving slowly."},{"uk":"I decided to get off the bus and walk."},{"uk":"At ten past nine I finally got to work, but the meeting had already started."},{"uk":"My boss didn't get angry, he just said: \"Next time leave a bit earlier.\""},{"uk":"From tomorrow I'll go to bed earlier."}],"q":[{"q":"What time was it when I looked at the clock?","o":["8:30","7:00","9:00"]},{"q":"Why did I get off the bus?","o":["There were a lot of cars and the bus was slow","The bus broke down","I got on the wrong bus"]},{"q":"What did the boss say?","o":["Next time leave earlier","You're fired","Nothing"]}]}},{"id":"T3-05","hsk":"HSK3","topic":"Навчання","zh":"在中国留学","py":"zài Zhōng guó liú xué","uk":"Навчання в Китаї","s":[{"zh":"我叫奥莲娜，去年九月我来到北京留学。","py":"wǒ jiào Ào lián nà qù nián jiǔ yuè wǒ lái dào Běi jīng liú xué","uk":"Мене звати Олена, торік у вересні я приїхала навчатися до Пекіна."},{"zh":"刚来的时候，我听不懂中国人说话，觉得很着急。","py":"gāng lái de shí hou wǒ tīng bu dǒng Zhōng guó rén shuō huà jué de hěn zháo jí","uk":"Коли я тільки приїхала, то не розуміла, що кажуть китайці, і дуже хвилювалася."},{"zh":"我认识了一个日本女孩，她叫美子，她对我非常好。","py":"wǒ rèn shi le yí gè Rì běn nǚ hái tā jiào Měi zǐ tā duì wǒ fēi cháng hǎo","uk":"Я познайомилася з японською дівчиною Мейцзи, вона дуже добре до мене ставиться."},{"zh":"我们常常一起去超市买东西，一起做饭。","py":"wǒ men cháng cháng yì qǐ qù chāo shì mǎi dōng xi yì qǐ zuò fàn","uk":"Ми часто разом ходимо до супермаркету й разом готуємо."},{"zh":"周末我们还会去爬山。","py":"zhōu mò wǒ men hái huì qù pá shān","uk":"На вихідних ми ще ходимо в гори."},{"zh":"现在我的汉语水平提高了很多，在商店里可以和中国人聊天了。","py":"xiàn zài wǒ de Hàn yǔ shuǐ píng tí gāo le hěn duō zài shāng diàn lǐ kě yǐ hé Zhōng guó rén liáo tiān le","uk":"Тепер моя китайська значно покращилася, і я вже можу поспілкуватися з китайцями в магазині."},{"zh":"我有时候会想家，但是我很高兴来到了中国。","py":"wǒ yǒu shí hou huì xiǎng jiā dàn shì wǒ hěn gāo xìng lái dào le Zhōng guó","uk":"Іноді я сумую за домом, але дуже рада, що приїхала  "K4-01", "hsk": "KO4", "topic": "Зовнішність і характер", "zh": "첫인상", "uk": "Перше враження", "s": [{"zh": "사람들은 흔히 외모를 보고 첫인상을 판단해요.", "uk": "Люди часто судять про перше враження з зовнішності.", "py": "Saramdeureun heunhi oemoreul bogo cheosinsangeul pandanhaeyo."}, {"zh": "저도 처음에는 우리 팀장님이 무섭다고 생각했어요.", "uk": "Я теж спочатку думала, що наш керівник суворий.", "py": "Jeodo cheoeumeneun uri timjangnimi museopdago saenggakaesseoyo."}, {"zh": "키가 크고 표정이 늘 진지했기 때문이에요.", "uk": "Бо він високий і завжди має серйозний вираз обличчя.", "py": "Kiga keugo pyojeongi neul jinjihaetgi ttaemunieyo."}, {"zh": "그런데 같이 일하다 보니 정이 많고 유머 감각도 있는 분이었어요.", "uk": "Але, попрацювавши разом, я зрозуміла: він сердечний і з почуттям гумору.", "py": "Geureonde gachi ilhada boni jeongi manko yumeo gamgakdo inneun bunieosseoyo."}, {"zh": "힘든 일이 있을 때마다 먼저 도와주시곤 했어요.", "uk": "Щоразу, як було важко, він першим приходив на допомогу.", "py": "Himdeun iri isseul ttaemada meonjeo dowajusigon haesseoyo."}, {"zh": "그 후로 저는 외모만 보고 사람을 판단하지 않으려고 해요.", "uk": "Відтоді намагаюся не судити людей лише з вигляду.", "py": "Geu huro jeoneun oemoman bogo sarameul pandanhaji aneuryeogo haeyo."}], "q": [{"q": "Що спочатку думала авторка про керівника?", "o": ["Що він суворий", "Що він веселий", "Що він лінивий"], "a": 0}, {"q": "Яким виявився керівник?", "o": ["Сердечним і з гумором", "Холодним", "Неуважним"], "a": 0}, {"q": "Який висновок зробила авторка?", "o": ["Не судити людей лише з вигляду", "Не довіряти керівникам", "Більше посміхатися"], "a": 0}], "lang": "ko", "py": "Cheosinsang", "en": {"topic": "Appearance and personality", "uk": "First impressions", "s": [{"uk": "People often judge first impressions by appearance."}, {"uk": "At first I also thought our team leader was strict."}, {"uk": "That's because he's tall and always has a serious expression."}, {"uk": "But after working together, I found he was warm-hearted and had a sense of humour."}, {"uk": "Whenever things were hard, he was the first to help."}, енше.", "py": "Jageun silcheonijiman deokbune sseuregiga mani jureosseoyo."}], "q": [{"q": "Скільки кави пила авторка на день?", "o": ["Два-три стаканчики", "Один", "П'ять"], "a": 0}, {"q": "Що вирішила робити авторка?", "o": ["Носити термокухоль", "Кинути пити каву", "Пити вдома"], "a": 0}, {"q": "Що дають деякі кав'ярні?", "o": ["Знижку з термокухлем", "Безкоштовне печиво", "Другу каву"], "a": 0}], "lang": "ko", "py": "Ilhoeyongpum jurigi", "en": {"topic": "Disposable items", "uk": "Using fewer disposables", "s": [{"uk": "Have you ever thought about how many disposable cups you use a day?"}, {"uk": "I love coffee, so I used to drink two or three cups a day."}, {"uk": "One day I saw a bin full of cups and was shocked."}, {"uk": "So I decided to carry a tumbler with me."}, {"uk": "Many cafés even give you a discount if you use a tumbler."}, {"uk": "It's a small step, but thanks to it there's much less rubbish."}], "q": [{"q": "How much coffee did the author drink a day?", "o": ["Two or three cups", "One", "Five"]}, {"q": "What did the author decide to do?", "o": ["Carry a tumbler", "Stop drinking coffee", "Drink at home"]}, {"q": "What do some cafés give?", "o": ["A discount with a tumbler", "Free biscuits", "A second coffee"]}]}}, {"id": "K4-04", "hsk": "KO4", "topic": "Сортування сміття", "zh": "쓰레기 분리배출", "uk": "Сортування сміття", "s": [{"zh": "한국에서는 쓰레기를 꼼꼼하게 분리해서 버려야 해요.", "uk": "У Кореї сміття треба ретельно сортувати.", "py": "Hangugeseoneun sseuregireul kkomkkomhage bullihaeseo beoryeoya haeyo."}, {"zh": "일반 쓰레기는 종량제 봉투에 담아서 버려요.", "uk": "Звичайне сміття викидають у спеціальних платних пакетах.", "py": "Ilban sseuregineun jongnyangje bongtue damaseo beoryeoyo."}, {"zh": "음식물 쓰레기는 따로 모아서 전용 통에 넣어요.", "uk": "Харчові відходи збирають окремо в спеціальний бак.", "py": "Eumsingmul sseuregineun ttaro moaseo jeonyong tonge neoeoyo."}, {"zh": "플라스틱과 캔, 종이는 깨끗이 씻거나 정리해서 버려요.", "uk": "Пластик, бляшанки й папір миють або складають, перш ніж викинути.", "py": "Peullase     const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain();
    hp.type = "highpass"; hp.frequency.value = 1400; g.gain.value = .22 + Math.random() * .15; s.buffer = buf;
    s.connect(hp).connect(g).connect(ac.destination); s.start(t + k * .07 + Math.random() * .04);
  }

function playAch(tier){
  const ac = audio(); if (!ac) return; const t = ac.currentTime + .05;
  const penta = [67, 69, 72, 74, 76, 79, 81, 84];          // G A C D E G A C — pentatonic
  if (tier === "bronze"){ [72, 74, 76, 79].forEach((m, i) => pluck(ac, m, t + i * .11, .45)); chime(ac, 91, t + .5, .06); }
  else if (tier === "silver"){ penta.slice(0, 6).forEach((m, i) => pluck(ac, m, t + i * .09, .42)); [88, 91, 93].forEach((m, i) => chime(ac, m, t + .6 + i * .12, .07)); }
  else if (tier === "gold"){ gong(ac, t, .28); penta.forEach((m, i) => pluck(ac, m, t + .35 + i * .08, .4)); [91, 93, 96].forEach((m, i) => chime(ac, m, t + 1.05 + i * .1, .08)); }
  else {  // jade: gong, firecrackers and the opening of 茉莉花 «Жасмин» (Chinese folk song)
    gong(ac, t, .32); crackers(ac, t + .25, 9);
    const mel = [[76, 0], [76, .25], [79, .5], [81, .75], [84, 1], [84, 1.25], [81, 1.5], [79, 1.75], [79, 2.05], [81, 2.3], [79, 2.55]];

  }
}
// ---------- Pomodoro timer for students (kept in this browser only; survives page reloads)
const POMO_PRESETS = {"25/5": [25, 5, 15], "50/10": [50, 10, 20], "15/3": [15, 3, 10]};
const POMO_PH = {work: ["Фокус", "专"], short: ["Перерва", "休"], long: ["Довга перерва", "憩"]};
let POMO = null, POMO_TITLE = null;
function pomoLoad(){
  if (POMO) return POMO;
  const s = lsGet("asianish.pomo") || {};
  POMO = {preset: POMO_PRESETS[s.preset] ? s.preset : "25/5", phase: POMO_PH[s.phase] ? s.phase : "work", run: !!s.run, end: s.end || 0, left: s.left || 0, done: s.day === today() ? s.done || 0 : 0, day: today()};
  if (!POMO.left) POMO.left = pomoLen(POMO.phase) * 60;
  return POMO;
}
const pomoSave = () => lsSet("asianish.pomo", POMO);
const pomoLen = ph => { const p = POMO_PRESETS[(POMO || {}).preset || "25/5"]; return ph === "work" ? p[0] : ph === "short" ? p[1] : p[2]; };
const pomoLeft = () => { const p = pomoLoad(); return Math.max(0, p.run ? Math.round((p.end - Date.now()) / 1000) : p.left); };
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function pomoHtml(){
  const p = pomoLoad(), left = pomoLeft(), tot = pomoLen(p.phase) * 60;
  return `<div class="pomo ph-${p.phase} ${p.run ? "run" : ""}" id="pomo" role="timer" aria-label="Таймер помодоро">
    <span class="pomo-h" aria-hidden="true">${POMO_PH[p.phase][1]}</span>
    <div class="pomo-m"><div class="pomo-t num" id="pomo-time">${mmss(left)}</div><div class="pomo-s small" id="pomo-ph">${POMO_PH[p.phase][0]} · 🍅 ${p.done}</div></div>
    <button class="iconbtn" data-act="pomoToggle" aria-label="${p.run ? "Пауза" : "Старт"}" title="${p.run ? "Пауза" : "Старт"}">${p.run ? "❚❚" : "▶"}</button>
    <button class="iconbtn" data-act="pomoReset" aria-label="Скинути" title="Скинути">↺</button>
    <button class="iconbtn" data-act="pomoSkip" aria-label="Наступний етап" title="Пропустити етап">⏭</button>
    <select class="pomo-p" data-chg="pomopreset" aria-label="Тривалість">${Object.keys(POMO_PRESETS).map(k => `<option value="${k}" ${k === p.preset ? "selected" : ""}>${k} хв</option>`).join("")}</select>
    <i class="pomo-bar" id="pomo-bar" style="width:${100 * (1 - left / tot)}%"></i></div>`;
}
function pomoNext(finished){
  const p = POMO;
  if (p.phase === "work"){ if (finished){ p.done++; p.day = today(); } p.phase = finished && p.done % 4 === 0 ? "long" : "short"; }
  else p.phase = "work";
  p.run = false; p.left = pomoLen(p.phase) * 60; p.end = 0; pomoSave();
}
function pomoTick(){
  const p = pomoLoad();
  if (p.run && Date.now() >= p.end){
    const wasWork = p.phase === "work"; pomoNext(true);
    const ac = audio(); if (ac){ const t = ac.currentTime + .05; if (wasWork){ gong(ac, t, .3); } else [79, 84, 88].forEach((m, i) => chime(ac, m, t + i * .18, .1)); }
    toast(wasWork ? "🍅 Помодоро завершено! Час відпочити." : "Перерва закінчилася — повертаймося до навчання!");
    const el = document.getElementById("pomo"); if (el) el.outerHTML = pomoHtml();
  }
  const left = pomoLeft(), tm = document.getElementById("pomo-time"), bar = document.getElementById("pomo-bar");
  if (tm) tm.textContent = mmss(left);
  if (bar) bar.style.width = (100 * (1 - left / (pomoLen(p.phase) * 60))) + "%";
  if (POMO_TITLE == null) POMO_TITLE = document.title;
  document.title = p.run ? `${mmss(left)} · ${POMO_PH[p.phase][0]}` : POMO_TITLE;
}

function deckWords(deck, ctx){
  const prog = ctx.me?.words || {}, d = today();
  const lvAll = wordsOf(ctx.lvLessons), every = [...wordsOf(ctx.lessons), ...wordsOf(ctx.cv)];
  const rank = w => { const p = prog[w.id]; if (p && p.due <= d) return 0; if (!p) return 1; return 2; };
  let list;
  if (deck === "due") list = every.filter(w => prog[w.id] && prog[w.id].due <= d && prog[w.id].s < 6);
  else if (deck === "new") list = lvAll.filter(w => !prog[w.id]);
  else if (deck === "all") list = lvAll.slice();
  else if (deck === "cv") list = wordsOf(ctx.cv);
  else if (deck.startsWith("cv:")) list = wordsOf(ctx.cv.filter(l => l.id === deck.slice(3)));
  else if (deck === "bank") list = bankWords();
  else list = every.filter(w => w.lid === deck);
  return shuffle(list).sort((a, b) => rank(a) - rank(b)).map(w => w.id);
}
function startDeck(deck){
  const ctx = currentCtx();
  S.cards = {key: ctx.key, deck, queue: deckWords(deck, ctx), i: 0, flipped: false, pick: null, opts: null, clozeZh: "", requeued: [], done: 0};
  prepCard();
}
function prepCard(){
  const c = S.cards; c.flipped = false; c.pick = null; c.opts = null; c.clozeZh = "";
  const w = wordById(c.queue[c.i]); if (!w) return;
  const ex = shuffle(exList(w)).find(x => x.zh.includes(w.h));
  if (ex){
    const pool = shuffle(allWords().filter(x => x.h !== w.h && !ex.zh.includes(x.h))).map(x => x.h);
    c.opts = shuffle([w.h, ...[...new Set(pool)].slice(0, 2)]); c.clozeZh = ex.zh; c.clozeUk = ex.uk;
  }
}
function wordById(id){
  for (const l of Object.values(S.lessons)) for (const w of (l.words || [])) if (w.id === id) return {...w, lid: l.id, lt: l.title, hsk: l.hsk};
  for (const d of Object.values(S.cvocab)) for (const w of (d.words || [])) if (w.id === id) return {...w, lid: d.id, lt: d.title || "Заняття", hsk: "", cv: true};
  if (isOwn(id)) return bankOwn().find(w => w.id === id) || null;
  return null;
}

function cardAct(kind){
  const ctx = currentCtx(), c = S.cards; if (!c) return;
  const wid = c.queue[c.i];
  if (wid && kind !== "next" && !ctx.preview){
    const me = S.me, d = today(); ensureDay(me); me.words = me.words || {};
    let w = me.words[wid], pts = 0, msg = "";
    if (kind === "know"){
      if (!w || (w.s === 0 && !w.ok)){
        w = me.words[wid] = {...(w || {}), s: 1, due: addDays(d, INT[1]), last: d, ok: 1, bad: w?.bad || 0};
        if (onceToday(me, "k:" + wid)) pts = PTS.know; msg = `Нове слово: крок 1 з ${MASTER}`;
      }
      else if (w.last === d && w.s > 0 && !me.dk.k.includes("r:" + wid)){ msg = "Це слово сьогодні вже зараховано"; }
      else if (w.due > d){ msg = "Ще рано: повторення " + fmtDate(w.due); }
      else {
        w.s = Math.min(w.s + 1, 6); w.last = d; w.ok = (w.ok || 0) + 1; w.due = addDays(d, INT[w.s]);
        if (onceToday(me, "k:" + wid)) pts = PTS.know;
        if (w.s >= MASTER && !w.m){ w.m = 1; logAdd(me, "m", 1); msg = "Слово опановано!"; if (!isOwn(wid)){ addPoints(me, PTS.master, "b"); msg += ` +${PTS.master} бонус`; } }
        else msg = w.s < MASTER ? `Крок ${w.s} з ${MASTER}` : "Повторено, наступний раз " + fmtDate(w.due);
      }
    } else {
      if (!w) w = me.words[wid] = {s: 0, due: d, last: "", ok: 0, bad: 0};
      w.s = Math.max(0, w.s - 1); w.due = d; w.last = d; w.bad = (w.bad || 0) + 1; addWrong(me, wid);
      if (onceToday(me, "r:" + wid)) pts = PTS.again;
      msg = "Повернемося до цього слова ще раз";
    }
    logAdd(me, "a", 1);
    if (wordById(wid)?.cv){ me.flags = me.flags || {}; me.flags.cv = 1; }
    if (isOwn(wid)) pts = 0;
    if (pts){ addPoints(me, pts, "k"); msg += ` · +${pts}`; }
    dailyCheck(me);
    saveMe(); toast(msg);
  }
  if (kind === "again" && wid && !c.requeued.includes(wid)){ c.queue.push(wid); c.requeued.push(wid); }
  if (kind !== "next") c.done++;
  c.i++; prepCard(); render();
}

const tonelessPy = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/u:|v/g, "u").replace(/[^a-z]/g, "");
const coreH = h => String(h || "").replace(/（.*?）|\(.*?\)/g, "");
let SEGD = null, SEGK = "";
function segDict(){
  const key = Object.keys(S.lessons).length + ":" + Object.keys(S.cvocab).length;
  if (SEGD && SEGK === key) return SEGD;
  SEGD = new Set(); SEGK = key;
  for (const w of [...allWords(), ...wordsOf(Object.values(S.cvocab).map(cvLesson))]){ const h = coreH(w.h); if (h.length > 1 && h.length <= 6) SEGD.add(h); }
  return SEGD;
}
const PUNCT = /[\s，。！？、,.!?；;：:“”"'（）()…—\-《》·]/;
function segment(s, keep){
  // Korean is written with spaces: each spaced word (with its particles and endings) is one piece
  if (LANG_CUR === "ko") return String(s || "").replace(/[.,!?。！？、…"“”]/g, " ").split(/\s+/).filter(Boolean);
  const D = segDict(), t = String(s || ""), out = []; let i = 0;
  while (i < t.length){
    if (PUNCT.test(t[i])){ i++; continue; }
    let m = 1;
    for (const k of keep || []) if (k && t.startsWith(k, i) && k.length > m) m = k.length;
    for (let L = Math.min(6, t.length - i); L > m; L--) if (D.has(t.substr(i, L))){ m = L; break; }
    if (/[A-Za-z0-9]/.test(t[i])){ let j = i; while (j < t.length && /[A-Za-z0-9]/.test(t[j])) j++; m = Math.max(m, j - i); }

}
const exWith = w => exList(w).filter(x => x.zh.includes(coreH(w.h)));
function soundAlike(w, pool){
  const t = tonelessPy(w.p); const c = pool.filter(x => x.p && x.h !== w.h && x.id !== w.id && !/[（(]/.test(x.h));
  const score = x => { const u = tonelessPy(x.p); if (u === t) return 3; if (u.slice(0, 2) === t.slice(0, 2) && x.h.length === w.h.length) return 2; if (x.h.length === w.h.length) return 1; return 0; };
  let best = 0; for (const x of c) best = Math.max(best, score(x));
  const cand = c.filter(x => score(x) === best); return cand.length ? cand[Math.floor(Math.random() * cand.length)] : null;
}

// ---- question generators
function distract(w, pool, field, k){ const seen = new Set([w[field]]); const out = []; for (const x of shuffle(pool)){ if (!x[field] || seen.has(x[field])) continue; seen.add(x[field]); out.push(x[field]); if (out.length >= k) break; } return out; }

    if (ex) return {wid: w.id, show: "fill", sent: ex.zh.replace(w.h, "＿"), hint: ex.uk, opts: mkOpts(w.h, distract(w, pool.filter(x => !ex.zh.includes(x.h)), "h", 3)), hanOpts: true};

  }

  if (t === "listen") return {wid: w.id, show: "listen", han: w.h, say: w.h, opts: mkOpts(w.h, distract(w, pool, "h", 3)), hanOpts: true, auto: true};
  if (t === "pinyin") return Math.random() < .5
    ? {wid: w.id, show: "py", py: w.p, opts: mkOpts(w.h, distract(w, pool, "h", 3)), hanOpts: true}

function genQ(t, w, pool){

    if (others.length < 2) return null;

  }
  if (t === "adet"){
    const ex = shuffle(exWith(w))[0]; if (!ex) return null;
    const d = shuffle(pool.filter(x => coreH(x.h) !== h && !ex.zh.includes(coreH(x.h)))).map(x => x.h);
    const wrongs = [...new Set(d)].slice(0, 3); if (wrongs.length < 2) return null;

    const wrongs = [...new Set(shuffle(pool.filter(x => coreH(x.h) !== h)).map(x => x.h))].slice(0, 5); if (wrongs.length < 3) return null;

function mixQ(types, words, pool, tries){

    const w = words[Math.floor(Math.random() * words.length)], t = types[Math.floor(Math.random() * types.length)];
    const q = makeQ(t, w, pool); if (q && (!q.opts || q.opts.length >= 2)) return q;

// ---- main view

const EX_NOPY_TYPES = new Set(["pinyin", "dict", "sound", "adet", "lrec"]), EX_NOPY_SHOW = new Set(["py", "han2py", "sound", "adet"]);
function exView(){

function exView0(){

    const R = e.right.map(id => { const w = wordById(id); const done = e.matched.includes(id); return `<button class="opt ${done ? "done" : ""} ${e.flash === "R" + id ? "wrong" : ""}" data-act="pairR" data-arg="${esc(id)}" ${done ? "disabled" : ""}>${esc(w?.uk)}</button>`; }).join("");

  }
  if (e.type === "ctx") return ctxGameView(e, back, title);

  if (e.type === "story") return storyView(e, back, title);
  if (e.type === "sim") return simView(e, back, title);

    <div class="two"><div class="field"><label for="d1">Гравець 1</label><input class="input" id="d1" data-xin="n1" value="${esc(e.n1)}" maxlength="20"></div><div class="field"><label for="d2">Гравець 2</label><input class="input" id="d2" data-xin="n2" value="${esc(e.n2)}" maxlength="20"></div></div>
    <p class="small muted">По черзі відповідайте на 12 завдань (по 6 кожному): переклад, аудіювання, пропуски, вживання в контексті. Результати двобою не потрапляють у рейтинг.</p><button class="btn primary" data-act="duelGo">Почати двобій</button></div>`;

function qView(e, back, title){

  if (e.type === "escape"){ const r = e.rooms[e.room]; meta = `${r.name} · ключів ${r.ok}/3`; bar = 100 * (e.room * 3 + r.ok) / 9; extra = `<span class="doors">${e.rooms.map((x, k) => `<span class="${x.open ? "open" : k === e.room ? "cur" : ""}">${x.open ? "🚪" : "🔒"}</span>`).join("")}</span>`; }
  if (e.type === "duel"){ const p = e.i % 2; extra = `<span class="duelbar"><span class="${p === 0 ? "on" : ""}">${esc(e.n1)} <b class="num">${e.score[0]}</b></span><span class="${p === 1 ? "on" : ""}">${esc(e.n2)} <b class="num">${e.score[1]}</b></span></span>`; meta = `Хід: ${esc(p ? e.n2 : e.n1)} · ${e.i + 1} з ${e.qs.length}`; }
  const top = `<div class="spread">${back}<span class="small muted num">${meta}</span></div><div class="qbar"><i style="width:${bar}%"></i></div>${title}${extra ? `<div class="row" style="justify-content:center">${extra}</div>` : ""}`;
  if (e.type === "escape" && e.roomIntro){ const r = e.rooms[e.room];
    return `<div class="quiz">${top}<div class="panel result"><span class="glyph" style="font-size:3rem">${r.han}</span><h2>${r.name}</h2><p class="muted">${r.text}</p><button class="btn primary" data-act="escEnter">Увійти</button></div></div>`; }
  const sayBtn = s => `<button class="iconbtn" style="width:76px;height:76px" data-act="speak" data-say="${esc(s)}" aria-label="Прослухати ще раз"><span style="transform:scale(1.6);display:grid">${ICON_SPEAK}</span></button>`;

    return `<div class="quiz">${top}<div class="qprompt">${qPrompt(e, q, sayBtn)}</div><div class="panel" style="text-align:center"><b>Скільки монет ставите на цю відповідь?</b><p class="small muted">Правильно — виграєте ставку, помилка — втрачаєте її.</p>
      <div class="row" style="justify-content:center">${[1, 2, 3].map(n => `<button class="btn ${n === 2 ? "primary" : ""}" data-act="aucStake" data-arg="${n}" ${n > e.coins ? "disabled" : ""}>🪙 ${n}</button>`).join("")}</div></div></div>`;

    const bank = q.bank.map(k => `<button class="wchip" data-act="xbPick" data-arg="${k}" ${(e.built || []).includes(k) || e.done ? "disabled" : ""}>${esc(q.chunks[k])}</button>`).join("");
    return `<div class="quiz">${top}<div class="qprompt">${q.say ? sayBtn(q.say) : ""}<span class="muted">${q.hideUk && !e.done ? "Прослухайте й складіть речення" : "«" + esc(q.uk) + "»"}</span>${q.hideUk && !e.done ? `<button class="link small" data-act="xbHint">Показати переклад</button>` : ""}${e.showUk && q.hideUk && !e.done ? `<span class="small muted">«${esc(q.uk)}»</span>` : ""}</div>
      <div class="built" aria-label="Ваше речення">${built || `<span class="small muted">Натискайте частини нижче по порядку</span>`}</div><div class="chips">${bank}</div>
      ${e.done ? `<div class="spread">${verdict(e.lastOk, q.ans)}${next()}</div>${q.py ? `<span class="small muted pyx">${esc(q.py)}</span>` : ""}`
        : `<div class="row"><button class="btn primary" data-act="xbCheck" ${(e.built || []).length !== q.chunks.length ? "disabled" : ""}>Перевірити</button><button class="btn ghost" data-act="xbReset">Скинути</button></div>`}</div>`;
  }
  if (q.kind === "fix"){
    const sent = q.chunks.map((c, k) => { const cls = e.fixTap == null ? "" : k === q.bad ? "right" : k === e.fixTap ? "wrong" : ""; return `<button class="wchip ${cls}" data-act="fixTap" data-arg="${k}" ${e.fixTap != null ? "disabled" : ""}>${esc(c)}</button>`; }).join("");
    const opts = e.fixTap == null ? "" : `<p class="small muted" style="text-align:center">${e.fixTap === q.bad ? "Так, помилка тут." : "Помилка була в слові, позначеному зеленим."} Чим його замінити?</p><div class="opts">${optBtns(e, q)}</div>`;

}
function optBtns(e, q){

// ---- Context Detective

      : `<div class="row"><button class="btn primary" data-act="ctxCheck" ${full ? "" : "disabled"}>Перевірити</button><button class="btn ghost" data-act="ctxUk">${e.showUk ? "Сховати переклад" : "Показати переклад"}</button></div>`}</div>`;

// ---- Vocabulary Recall

    <div class="recall pick">${e.cands.map(id => { const w = wordById(id); const shown = e.shown.includes(id), on = sel.has(id); const cls = !e.done ? (on ? "sel" : "") : shown && on ? "right" : on ? "wrong" : shown ? "missed" : "";

// ---- Semantic Groups

  return `<div class="quiz"><div class="spread">${back}<span class="small muted">Залишилося ${left.length}</span></div>${title}
    <p class="small muted">Оберіть слово, потім групу, до якої воно належить.</p>
    <div class="chips" style="justify-content:center">${left.map(id => `<button class="wchip ${e.sel === id ? "on" : ""}" data-act="grpWord" data-arg="${esc(id)}" ${e.done ? "disabled" : ""}>${esc(wordById(id)?.h)}</button>`).join("") || `<span class="small muted">Усі слова розкладено</span>`}</div>
    <div class="groups">${e.groups.map((g, gi) => `<div class="gbox" data-act="grpPut" data-arg="${gi}" role="button" tabindex="0"><b>${esc(g.title)}</b><div class="chips">${e.items.filter(id => e.place[id] === gi).map(id => { const ok = g.ids.includes(id); return `<button class="wchip ${e.done ? (ok ? "right" : "wrong") : ""}" data-act="grpBack" data-arg="${esc(id)}" ${e.done ? "disabled" : ""}>${esc(wordById(id)?.h)}</button>`; }).join("")}</div></div>`).join("")}</div>
    ${e.done ? `<div class="spread"><span class="pill ${e.ok === e.total ? "ok" : "bad"}">Правильно: ${e.ok} з ${e.total}</span><button class="btn primary" data-act="exFinishBtn">Завершити</button></div>`
      : `<button class="btn primary" data-act="grpCheck" ${left.length ? "disabled" : ""}>Перевірити</button>`}</div>`;
}

// ---- AI: writing tasks (Word in Action, Translation Lab, Describe Without Saying, Sentence Transformation, Mini Essay)
function aiWriteView(e, back, title){
  const note = `<p class="small muted">${EX_AI_NOTE}</p>`;
  const err = e.err ? `<div class="note" style="border:1px solid var(--bad)"><span>⚠️</span><span>${esc(e.err)}</span></div>` : "";
  if (e.type === "essay"){
    const used = e.words.filter(w => (e.input || "").includes(coreH(w.h)));
    return `<div class="quiz">${`<div class="spread">${back}<span class="small muted">Вжито ${used.length} з ${e.words.length}</span></div>`}${title}
      <h2>Напишіть короткий текст (4–8 речень)</h2><p class="muted">Тема: <b>${esc(e.topic)}</b>. Вживіть усі слова:</p>
      <div class="chips">${e.words.map(w => `<span class="wchip ${used.includes(w) ? "on" : ""}" title="${esc(w.uk)}">${esc(w.h)} <small class="muted">${esc(w.uk)}</small></span>`).join("")}</div>
      <textarea class="input" rows="7" data-xin="input" placeholder="写一个小故事……" ${e.res || e.busy ? "disabled" : ""}>${esc(e.input || "")}</textarea>${err}
      ${e.res ? aiRes(e.res) + `<div class="row"><button class="btn primary" data-act="exFinishBtn">Завершити</button></div>` : `<div class="row"><button class="btn primary" data-act="aiCheck" ${e.busy ? "disabled" : ""}>${e.busy ? "Перевіряю…" : "Перевірити"}</button></div>`}${note}</div>`;
  }
  const w = e.items[e.i];
  let task = "";
  if (e.type === "wia") task = `<div class="hanzi">${esc(w.h)}</div><div class="py">${esc(w.p || "")}</div><span class="muted">${esc(w.uk)}</span><span class="small muted">Складіть власне речення ${LNAME()}ою з цим словом</span>`;
  if (e.type === "tr") task = `<span class="small muted">Перекладіть ${LNAME()}ою</span><div class="sent" style="font-family:var(--f-ui);font-size:1.3rem">«${esc(e.sent?.uk)}»</div><span class="small muted">Підказка: використайте слово <b class="zh">${esc(w.h)}</b> (${esc(w.uk)})</span>`;
  if (e.type === "desc") task = `<div class="hanzi">${esc(w.h)}</div><span class="muted">${esc(w.uk)}</span><span class="small muted">Опишіть це слово ${LNAME()}ою (1–3 речення), не називаючи його. ШІ спробує вгадати.</span>`;
  if (e.type === "rewrite") task = e.sent ? `<span class="small muted">Перепишіть речення, використавши слово <b class="zh">${esc(w.h)}</b> (${esc(w.uk)}), не змінюючи змісту</span><div class="sent">${esc(e.sent.zh)}</div><span class="small muted pyx">${esc(e.sent.py)}</span><span class="muted">«${esc(e.sent.uk)}»</span>`
    : `<span class="muted">${e.busy ? "ШІ готує речення…" : ""}</span>`;
  return `<div class="quiz"><div class="spread">${back}<span class="small muted num">${e.i + 1} з ${e.items.length}</span></div><div class="qbar"><i style="width:${100 * e.i / e.items.length}%"></i></div>${title}
    <div class="qprompt">${task}</div>
    ${e.type === "rewrite" && !e.sent ? err + (e.err ? `<button class="btn" data-act="aiPrep">Спробувати ще раз</button>` : "") : `
    <div class="row"><input class="input" style="flex:1;min-width:220px;font-size:1.15rem" data-xin="input" data-xenter="aiCheck" value="${esc(e.input || "")}" placeholder="Напишіть ${LNAME()}ою…" autocomplete="off" aria-label="Ваша відповідь" ${e.res || e.busy ? "disabled" : ""}>${e.res ? "" : `<button class="btn primary" data-act="aiCheck" ${e.busy ? "disabled" : ""}>${e.busy ? "Перевіряю…" : "Перевірити"}</button>`}</div>${err}
    ${e.res ? aiRes(e.res) + `<div class="row"><button class="btn primary" data-act="aiNext">${e.i + 1 < e.items.length ? "Далі →" : "Завершити"}</button></div>` : ""}`}${note}</div>`;
}
function aiRes(r){
  return `<div class="panel airesp"><span class="pill ${r.ok ? "ok" : "bad"}" style="align-self:flex-start">${r.ok ? "Добре!" : "Є що виправити"}${r.score != null ? ` · ${r.score}/10` : ""}</span>
    ${r.guess ? `<div>ШІ думає, що це: <b class="zh">${esc(r.guess)}</b></div>` : ""}
    ${r.fix ? `<div><span class="small muted">Варіант:</span><div class="zh" style="font-size:1.2rem">${esc(r.fix)} ${speakBtn(r.fix)}</div>${r.py ? `<div class="small muted pyx">${esc(r.py)}</div>` : ""}${r.uk ? `<div class="small muted">«${esc(r.uk)}»</div>` : ""}</div>` : ""}
    ${r.ref ? `<div class="small muted">Еталон: <span class="zh">${esc(r.ref)}</span></div>` : ""}
    ${r.comment ? `<div>${esc(r.comment)}</div>` : ""}</div>`;
}
const AI_STR = x => String(x ?? "").trim();
async function aiCall(prompt){ if (!S.sample) throw {code: "nosample"}; return S.sample.json(prompt, {cache: false}); }
async function aiPrep(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.type !== "rewrite") return; const w = e.items[e.i];
  e.busy = true; e.err = ""; render();
  try {
    const r = await aiCall(`Ти допомагаєш україномовному студенту вчити ${LNAME()}у (рівень ${exLevel(ctx)}). Цільове слово: «${w.h}» (${w.p || ""} — ${w.uk}).
Склади одне коротке природне ${LNAME()}е речення рівня ${exLevel(ctx)}, зміст якого можна передати з цим словом, але сам НЕ вживай слово «${coreH(w.h)}» — використай синонім, інший вираз або опис. Відповідай лише JSON: {"zh":"речення","py":"піньїнь із тонами","uk":"переклад українською"}.`);
    if (S.ex !== e) return;
    if (!r || !AI_STR(r.zh)) throw {code: "invalid_json"};
    e.sent = {zh: AI_STR(r.zh).slice(0, 120), py: AI_STR(r.py).slice(0, 240), uk: AI_STR(r.uk).slice(0, 240)};
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}
async function aiCheck(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.busy || e.res) return;
  const inp = AI_STR(e.input); if (!inp){ toast("Спочатку напишіть відповідь"); return; }
  if (!TGT().test(inp)){ toast(koFix("Напишіть відповідь ієрогліфами")); return; }
  const lvl = exLevel(ctx), w = e.items ? e.items[e.i] : null;
  const fmt = `Відповідай лише JSON: {"ok":true або false,"fix":"виправлений або покращений варіант ${LNAME()}ою (якщо відповідь бездоганна — повтори її)","py":"піньїнь цього варіанта з тонами","uk":"переклад цього варіанта українською","comment":"1–2 короткі речення українською: що вдалося і що виправити, доброзичливо"}`;
  let prompt = "", local = null;
  if (e.type === "wia"){
    if (!inp.includes(coreH(w.h))){ toast("У реченні має бути слово " + coreH(w.h)); return; }
    prompt = `Ти доброзичливий викладач ${LNAME()}ої для україномовних студентів (рівень ${lvl}). Студент склав речення зі словом «${w.h}» (${w.p || ""} — ${w.uk}): «${inp}». Перевір, чи правильно й природно вжито слово, граматику та порядок слів. ok = true, якщо слово вжито правильно й серйозних помилок немає. ${fmt}`;
  } else if (e.type === "tr"){
    if (stripP(inp) === stripP(e.sent.zh)) local = {ok: true, fix: e.sent.zh, py: e.sent.py, comment: "Точно як в еталоні!"};
    else prompt = `Ти викладач ${LNAME()}ої для україномовних студентів (рівень ${lvl}). Студент перекладав ${LNAME()}ою речення «${e.sent.uk}». Еталонний переклад: «${e.sent.zh}». Переклад студента: «${inp}». Інші правильні формулювання теж зараховуй. Перевір зміст, граматику й написання ієрогліфів. ${fmt}`;
  } else if (e.type === "desc"){
    if (inp.includes(coreH(w.h))){ toast("Не можна називати саме слово — опишіть його іншими словами"); return; }
    prompt = `Гра «Опиши, не називаючи». Студент (рівень ${lvl}) описав ${LNAME()}ою загадане слово: «${inp}». Спершу чесно спробуй вгадати слово лише за описом. Потім порівняй із загаданим: «${w.h}» (${w.uk}). ok = true, якщо опис справді вказує на це слово (близький синонім теж рахується). Відповідай лише JSON: {"guess":"твоя здогадка ієрогліфами","ok":true або false,"fix":"виправлений варіант опису ${LNAME()}ою, якщо були мовні помилки, інакше повтори опис","py":"піньїнь","uk":"переклад опису українською","comment":"1–2 речення українською"}`;
  } else if (e.type === "rewrite"){
    if (!inp.includes(coreH(w.h))){ toast("Використайте слово " + coreH(w.h)); return; }
    prompt = `Ти викладач ${LNAME()}ої (рівень ${lvl}). Вихідне речення: «${e.sent.zh}» (${e.sent.uk}). Студент мав переписати його, використавши слово «${w.h}» (${w.uk}) і не змінивши змісту. Варіант студента: «${inp}». ok = true, якщо зміст збережено, слово вжито правильно і серйозних помилок немає. ${fmt}`;
  } else if (e.type === "essay"){
    prompt = `Ти доброзичливий викладач ${LNAME()}ої для україномовних студентів (рівень ${lvl}). Студент написав короткий текст на тему «${e.topic}», де мав ужити слова: ${e.words.map(x => x.h + " (" + x.uk + ")").join(", ")}. Текст: «${inp}».
Оціни: чи вжито слова правильно, граматику, зв'язність. Відповідай лише JSON: {"ok":true якщо текст загалом вдалий,"score":оцінка від 0 до 10,"fix":"виправлена версія тексту китайською","py":"","uk":"переклад виправленої версії українською","comment":"2–3 речення українською: що вдалося, які помилки, порада"}`;
  }
  e.busy = true; e.err = ""; render();
  try {
    const r = local || await aiCall(prompt);
    if (S.ex !== e) return;
    if (!r || typeof r !== "object") throw {code: "invalid_json"};
    e.res = {ok: !!r.ok, fix: AI_STR(r.fix).slice(0, 600), py: AI_STR(r.py).slice(0, 800), uk: AI_STR(r.uk).slice(0, 800), comment: AI_STR(r.comment).slice(0, 500), guess: AI_STR(r.guess).slice(0, 20),
      score: r.score != null && !isNaN(Number(r.score)) ? Math.max(0, Math.min(10, Math.round(Number(r.score)))) : null, ref: e.type === "tr" && !local ? e.sent.zh : ""};
    e.total++; if (e.res.ok) e.ok++;
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}

// ---- AI: Build the Story
function storyView(e, back, title){
  const err = e.err ? `<div class="note" style="border:1px solid var(--bad)"><span>⚠️</span><span>${esc(e.err)}</span></div>` : "";
  if (!e.story){
    return `<div class="quiz"><div class="spread">${back}<span class="small muted">Обрано ${e.sel.length}</span></div>${title}
      <h2>Оберіть 3–8 слів для історії</h2><p class="small muted">Помічник складе коротку історію з ними. Її можна прослухати, читати з піньїнем і перекладом, а наприкінці — відповісти на питання.</p>
      <div class="chips">${e.cand.map(w => `<button class="wchip ${e.sel.includes(w.id) ? "on" : ""}" data-act="stTog" data-arg="${esc(w.id)}" ${e.busy ? "disabled" : ""}>${esc(w.h)} <small class="muted">${esc(w.uk)}</small></button>`).join("")}</div>${err}
      <div class="row"><button class="btn primary" data-act="stGo" ${e.sel.length < 3 || e.busy ? "disabled" : ""}>${e.busy ? "Пишу історію…" : "Скласти історію"}</button><button class="btn ghost" data-act="stShuffle" ${e.busy ? "disabled" : ""}>Інші слова</button></div><p class="small muted">${EX_AI_NOTE}</p></div>`;
  }
  const s = e.story, hl = t => { let h = esc(t); for (const w of e.words) { const c = esc(coreH(w.h)); if (c) h = h.split(c).join(`<mark>${c}</mark>`); } return h; };
  const answered = Object.keys(e.ans).length;
  return `<div class="quiz"><div class="spread">${back}<span class="small muted">${s.lines.length} речень</span></div>${title}
    <h2>${esc(s.title)}</h2>
    <div class="row"><button class="btn sm primary" data-act="stAll">▶ Прослухати всю історію</button><button class="btn sm ${e.py ? "gold" : ""}" data-act="stPy">Піньїнь</button><button class="btn sm ${e.uk ? "gold" : ""}" data-act="stUk">Переклад</button></div>
    <div class="panel story">${s.lines.map((l, i) => `<div class="sline"><button class="iconbtn" data-act="speak" data-say="${esc(l.zh)}" aria-label="Озвучити речення">${ICON_SPEAK}</button><div><div class="zh">${hl(l.zh)}</div>${e.py ? `<div class="small muted pyx">${esc(l.py)}</div>` : ""}${e.uk ? `<div class="small muted">${esc(l.uk)}</div>` : ""}</div></div>`).join("")}</div>
    ${s.qs.length ? `<h3>Перевірте розуміння</h3>${s.qs.map((q, i) => { const a = e.ans[i]; return `<div class="gq"><span class="qt">${esc(q.q)}</span><div class="opts">${q.opts.map((o, k) => `<button class="opt ${a == null ? "" : k === q.a ? "right" : k === a ? "wrong" : ""}" data-act="stAns" data-arg="${i}:${k}" ${a != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div></div>`; }).join("")}` : ""}
    <div class="row"><button class="btn ${answered === s.qs.length ? "primary" : ""}" data-act="exFinishBtn">Завершити</button><button class="btn ghost" data-act="stNew">Нова історія</button></div><p class="small muted">${EX_AI_NOTE}</p></div>`;
}
async function storyGo(){
  const e = S.ex, ctx = currentCtx(); if (!e || e.busy) return;
  const ws = e.sel.map(id => e.cand.find(w => w.id === id)).filter(Boolean); e.words = ws;
  e.busy = true; e.err = ""; render();
  try {
    const r = await aiCall(`Склади коротку цікаву історію ${LNAME()}ою (5–7 речень, спрощені ієрогліфи) для україномовного студента рівня ${exLevel(ctx)}. Обов'язково вживи ВСІ ці слова, кожне хоча б раз і саме в такому написанні: ${ws.map(w => coreH(w.h) + " (" + w.uk + ")").join(", ")}. Решта лексики — простіша за рівень ${exLevel(ctx)}.
Відповідай лише JSON: {"title":"коротка назва українською","lines":[{"zh":"речення","py":"піньїнь із тонами","uk":"переклад українською"}],"qs":[рівно 3 питання на розуміння: {"q":"питання українською","opts":["4 варіанти українською"],"a":індекс правильного з 0}]}`);
    if (S.ex !== e) return;
    const lines = (Array.isArray(r?.lines) ? r.lines : []).filter(l => l && AI_STR(l.zh)).slice(0, 10).map(l => ({zh: AI_STR(l.zh).slice(0, 160), py: AI_STR(l.py).slice(0, 320), uk: AI_STR(l.uk).slice(0, 320)}));
    if (!lines.length) throw {code: "invalid_json"};
    const qs = (Array.isArray(r.qs) ? r.qs : []).filter(q => q && Array.isArray(q.opts) && q.opts.length >= 2 && Number.isInteger(Number(q.a)) && Number(q.a) < q.opts.length).slice(0, 4).map(q => ({q: AI_STR(q.q).slice(0, 200), opts: q.opts.slice(0, 4).map(o => AI_STR(o).slice(0, 120)), a: Number(q.a)}));
    e.story = {title: AI_STR(r.title).slice(0, 80) || "Історія", lines, qs}; e.ans = {};
  } catch(err){ if (S.ex === e) e.err = aiErr(err); }
  if (S.ex === e){ e.busy = false; render(); }
}

function exAnswer(ok){
  const e = S.ex, q = e.qs[e.i]; if (e.done) return; e.done = true; e.lastOk = ok;
  if (e.type === "duel"){ if (ok) e.score[e.i % 2]++; render(); return; }
  exRecord(q.wid, ok);
  if (e.type === "auction") e.coins += ok ? e.stake : -e.stake;
  if (e.type === "boss" && !ok) e.lives--;
  if (e.type === "escape"){ const r = e.rooms[e.room]; r.n++; if (ok) r.ok++; }
  render();
}
function exAdvance(){
  const e = S.ex;
  if (e.type === "boss" && e.lives <= 0) return exFinish();
  if (e.type === "auction" && e.coins <= 0) return exFinish();
  if (e.type === "escape"){
    const r = e.rooms[e.room];
    if (r.ok >= 3 || r.n >= 9){ r.open = r.ok >= 3; e.room++; if (e.room >= e.rooms.length) return exFinish(); e.roomIntro = true; }
    e.qs.push(mixQ(e.rooms[e.room].types, e.words, e.pool));
  } else if (e.i + 1 >= e.qs.length) return exFinish();
  e.i++; e.pick = null; e.done = false; e.built = []; e.fixTap = null; e.hint = 1; e.typed = ""; e.stake = null; e.showUk = false;
  const q = e.qs[e.i]; if (q.auto && !e.roomIntro && e.type !== "auction") speak(q.say || q.han);
  render();
}
function exRecord(wid, ok){

  const me = S.me, d = today(); ensureDay(me); me.words = me.words || {};
  me.exTotal = (me.exTotal || 0) + 1; logAdd(me, "a", 1); dailyCheck(me);

    me.exOk = (me.exOk || 0) + 1; w.ok = (w.ok || 0) + 1;
    if (!isOwn(wid) && onceToday(me, e.type + ":" + wid)){ me.cor = (me.cor || 0) + 1; addPoints(me, PTS.correct, "e"); logAdd(me, "c", 1); e.pts += PTS.correct; }

}

      <div class="row"><button class="btn primary" type="submit">${t ? "Зберегти" : "Додати"}</button><button class="btn ghost" type="button" data-act="closeModal">Скасувати</button>${t ? `<span style="flex:1"></span><button class="btn danger" type="button" data-act="askDelTeacher">Видалити</button>` : ""}</div>

    m.innerHTML = `<div class="mbox"><h2>${esc(md.title)}</h2><p class="muted">${esc(md.text)}</p><div class="row"><button class="btn danger" data-act="confirmYes">${esc(md.yes)}</button><button class="btn ghost" data-act="closeModal">Скасувати</button></div></div>`;
  }
}

function gedInput(el){
  const e = S.gedit; if (!e) return;
  const k = el.dataset.gf;
  if (el.dataset.gi != null){
    const q = e.ex[Number(el.dataset.gi)]; if (!q) return;
    if (el.dataset.go != null) q.opts[Number(el.dataset.go)] = el.value;
    else if (k === "a" && el.type === "radio"){ if (el.checked) q.a = Number(el.value); }
    else q[k] = el.value;
    return;
  }
  if (k === "hidden") e.hidden = el.checked;
  else if (k) e[k] = el.value;
}

  else if (c === "momonth"){ if (S.medit){ moOpen(S.medit.sid, el.value); render(); } }
  else if (c === "pomopreset"){ const p = pomoLoad(); p.preset = el.value; p.run = false; p.left = pomoLen(p.phase) * 60; p.end = 0; pomoSave(); const w = document.getElementById("pomo"); if (w) w.outerHTML = pomoHtml(); pomoTick(); }
  else if (c === "hwccls"){ (S.hwc ||= {}).cls = el.value; render(); }
  else if (c === "hwctid"){ (S.hwc ||= {}).tid = el.value; render(); }
  else if (c === "labcls"){ const prev = S.ex?.src || "level"; S.exlab = {cls: el.value}; S.ex = {key: currentCtx().key, src: srcGroup(prev) === "cv" ? "cv" : prev, running: false}; render(); }
  else if (c === "exsrc"){ const ctx = currentCtx(); S.ex = {key: ctx.key, src: el.value, running: false}; }
  else if (c === "hwkind"){ const f = el.closest("form"); if (f && S.hwEdit){ S.hwEdit = hwRead(f); S.hwEdit.addKind = el.value; render(); } }
  else if (c === "hwcls"){ const f = el.closest("form"); if (f && S.hwEdit){ S.hwEdit = hwRead(f); render(); } }
  else if (c === "rankscope"){ S.rank.scope = el.value; render(); }
  else if (c === "rankteacher"){ S.rank.tid = el.value; S.rank.scope = "all"; render(); }
  else if (c === "photo" && el.files && el.files[0]) aiPhoto(el.files[0]);
});

render();
window.ASIANISH_READY.then(boot).catch(() => { S.phase = "offline"; render(); });
})();
</script>
